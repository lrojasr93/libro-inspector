  {"id":"c38","m":"com","n":2,"titulo":"Un apoderado fuera de control","intro":"A la salida, un apoderado entra al hall gritando que su hija fue sancionada injustamente. Insulta a la inspectora de turno y se acerca de forma amenazante. Hay estudiantes mirando.","pasos":[{"q":"¿Qué haces primero?","o":[{"t":"Mantienes la calma, hablas con voz baja y firme, pides apoyo a otro adulto y alejas a los estudiantes.","p":2,"f":"Correcto: calma, seguridad de los niños y no quedarse solo/a."},{"t":"Le respondes los insultos para que te respete.","p":0,"f":"Escala el conflicto y expone a los estudiantes."},{"t":"Le dices que se calme o llamas a Carabineros, sin alejar a los estudiantes.","p":1,"f":"Pones un límite, pero olvidas proteger a los niños que miran."}]},{"q":"El apoderado baja un poco el tono. ¿Cómo sigues?","o":[{"t":"Le dices que vuelva mañana.","p":1,"f":"Pospones, pero sin orientarlo hacia el conducto formal."},{"t":"Reconoces su molestia, le explicas su derecho a presentar descargos y pedir reconsideración, y le indicas cómo hacerlo.","p":2,"f":"Bien: canalizas su reclamo por la vía formal que la ley le garantiza."},{"t":"Le dices que la sanción no se puede cambiar.","p":0,"f":"Desconoces su derecho a ser oído y a pedir reconsideración."}]},{"q":"Terminado el episodio, ¿qué corresponde?","o":[{"t":"Olvidarlo, porque ya se calmó.","p":0,"f":"La agresión a funcionarios debe abordarse por protocolo."},{"t":"Contarlo solo a tus colegas.","p":1,"f":"Buscar apoyo es válido, pero el hecho debe llegar por la vía formal."},{"t":"Registrar los hechos y reportarlos a dirección, porque es violencia en el trabajo y puede activar las medidas del reglamento.","p":2,"f":"Correcto: el colegio debe aplicar sus protocolos y puede suspender su ingreso si el reglamento lo regula."}]}],"claves":["Calma y seguridad de los estudiantes primero","Nunca enfrentar solo/a a un adulto agresivo","Canalizar el reclamo: descargos y reconsideración","Registrar y reportar: es violencia en el trabajo"],"s":[["com_crit","p. 18"],["l21809","arts. 16 B y 16 E LGE"],["l21827","art. 7"]]},
  {"id":"c39","m":"lid","n":1,"titulo":"Un turno sin cubrir","intro":"Eres coordinador/a del equipo de inspectoría. Un lunes, dos inspectores avisan que no llegarán. El recreo largo empieza en 20 minutos y hay tres sectores que cubrir.","pasos":[{"q":"¿Qué haces primero?","o":[{"t":"Activas a los subrogantes ya definidos para esos sectores.","p":2,"f":"Correcto: tener roles con subrogantes evita improvisar."},{"t":"Dejas sin cubrir el sector más alejado.","p":0,"f":"Deja a estudiantes sin supervisión."},{"t":"Cubres tú solo/a dos sectores a la vez.","p":1,"f":"Muestra compromiso, pero no es una cobertura real."}]},{"q":"No hay subrogantes suficientes. ¿Qué sigue?","o":[{"t":"Acortas el recreo sin avisar a nadie.","p":1,"f":"Reduce el riesgo, pero sin coordinación ni autorización."},{"t":"Informas a dirección y pides apoyo de otros funcionarios según la organización del colegio.","p":2,"f":"Bien: la jefatura debe saberlo para decidir apoyos."},{"t":"Pides a un estudiante de 4° medio que vigile.","p":0,"f":"La supervisión es tarea de adultos del establecimiento."}]},{"q":"Al terminar el día, ¿qué haces?","o":[{"t":"Nada, ya pasó.","p":0,"f":"Se pierde la oportunidad de mejorar."},{"t":"Reclamas en el grupo de WhatsApp por los ausentes.","p":1,"f":"Expresa un problema, pero no por el canal ni de la forma adecuada."},{"t":"Registras lo ocurrido y propones ajustar el plan de turnos y subrogancias.","p":2,"f":"Correcto: documentar y ajustar es mejora continua."}]}],"claves":["Roles definidos con subrogantes","Informar a la jefatura","La supervisión es tarea de adultos","Registrar y ajustar el plan"],"s":[["lid_crit","p. 11 y p. 27"]]},
  {"id":"c40","m":"lid","n":2,"titulo":"Conflicto dentro del equipo","intro":"Una inspectora te cuenta, llorando, que un colega del equipo la descalifica a gritos frente a estudiantes y que esta semana la empujó en la bodega. Tú coordinas el equipo de inspectoría.","pasos":[{"q":"¿Qué haces primero?","o":[{"t":"La escuchas en privado y le informas que puede denunciar por Ley Karin ante el colegio o la Inspección del Trabajo.","p":2,"f":"Correcto: la orientas sobre su derecho a denunciar por escrito o verbalmente."},{"t":"Juntas a ambos para que se den la mano.","p":0,"f":"Una posible agresión no se resuelve con una conciliación improvisada."},{"t":"Le dices que lo hablarás con él a solas.","p":1,"f":"Buscas actuar, pero sin el procedimiento ni la reserva que exige la ley."}]},{"q":"Ella presenta la denuncia. ¿Qué medidas corresponden?","o":[{"t":"Cambiarla a ella de turno sin consultarle.","p":1,"f":"Separar ayuda, pero la medida no debe perjudicar a quien denuncia."},{"t":"Que el empleador adopte de inmediato medidas de resguardo, como separar espacios o redistribuir turnos.","p":2,"f":"Bien: la ley exige medidas de resguardo inmediatas."},{"t":"Esperar el resultado de la investigación para cambiar algo.","p":0,"f":"Las medidas de resguardo no esperan el final de la investigación."}]},{"q":"¿Cómo actúas durante la investigación?","o":[{"t":"Cuentas al equipo lo que pasó para que tengan cuidado.","p":0,"f":"Rompe la reserva y puede afectar a ambas partes."},{"t":"Te mantienes al margen y no colaboras.","p":1,"f":"Respetas la reserva, pero debes colaborar con la investigación."},{"t":"Guardas reserva, entregas la información que te pidan y no comentas el caso con el equipo.","p":2,"f":"Correcto: la investigación es reservada y debe oír a ambas partes."}]}],"claves":["Orientar a denunciar por Ley Karin","Medidas de resguardo inmediatas","Investigación reservada que oye a ambas partes","No improvisar conciliaciones ante agresiones"],"s":[["l21643","arts. 211-B, 211-B bis y 211-C Código del Trabajo"]]},
  {"id":"c41","m":"div","n":1,"titulo":"Llega Jean","intro":"La mamá de Jean, de 10 años, llega a portería. Vienen de Haití, Jean habla poco español y no tienen documentos chilenos. Ella pregunta si su hijo puede estudiar en el colegio.","pasos":[{"q":"¿Qué le respondes?","o":[{"t":"Le das el número 101 y le dices que vuelva cuando tenga todo resuelto.","p":1,"f":"Das un dato útil, pero no la orientas ni la acoges."},{"t":"La recibes con respeto, la llevas con quien gestiona la matrícula y le informas que Jean puede estudiar y solicitar el IPE en línea o en Ayuda Mineduc.","p":2,"f":"Correcto: el acceso no depende de la situación migratoria."},{"t":"Le dices que sin RUT no se puede matricular.","p":0,"f":"Es falso y niega un derecho garantizado por la ley."}]},{"q":"En sus primeros días, Jean pasa los recreos solo. ¿Qué haces?","o":[{"t":"Lo observas de lejos sin intervenir.","p":1,"f":"Observar ayuda, pero la acogida requiere acciones."},{"t":"Le dices que debe aprender español rápido si quiere tener amigos.","p":0,"f":"Desvaloriza su lengua materna y lo responsabiliza de su aislamiento."},{"t":"Lo saludas, le das la bienvenida y coordinas con el profesor jefe un acompañamiento entre pares.","p":2,"f":"Bien: saludar, acoger y la tutoría entre pares favorecen la pertenencia."}]},{"q":"Escuchas que unos compañeros le ponen apodos por su color de piel. ¿Qué haces?","o":[{"t":"Detienes la situación, registras el hecho y lo informas al coordinador/a de convivencia educativa para aplicar el reglamento y acciones formativas.","p":2,"f":"Correcto: es discriminación por raza o etnia y debe gestionarse."},{"t":"Les pides que no lo hagan más, sin registrar nada.","p":1,"f":"Detenerlo está bien, pero sin registro no hay seguimiento."},{"t":"Le dices a Jean que no se lo tome tan en serio.","p":0,"f":"Minimiza la discriminación y deja solo al afectado."}]}],"claves":["El acceso a la educación no depende de la situación migratoria","Orientar sobre el IPE","Acoger y favorecer la pertenencia","Detener, registrar e informar la discriminación"],"s":[["l21325","art. 17"],["div_ipe"],["div_claves"],["l20609","art. 2"],["c482"]]},
  {"id":"c42","m":"div","n":2,"titulo":"«Me llamo Camila»","intro":"Camila, de 15 años, es una estudiante trans de 1° medio. Te cuenta que un adulto la sigue llamando por su nombre legal frente al curso y que, desde entonces, algunos compañeros se burlan de ella en el patio.","pasos":[{"q":"¿Qué le respondes?","o":[{"t":"La escuchas con respeto, la llamas por su nombre social y le explicas que puede pedir una entrevista con la dirección para el reconocimiento de su identidad de género.","p":2,"f":"Bien: acoges y orientas hacia el procedimiento formal."},{"t":"La escuchas, pero le dices que tú no puedes hacer nada.","p":1,"f":"Escuchar ayuda, pero puedes orientarla sobre cómo pedir el reconocimiento."},{"t":"Le dices que mientras no cambie su nombre legal se usará ese.","p":0,"f":"La Circular 812 pide usar el nombre social en los espacios educativos."}]},{"q":"Ves a los compañeros burlándose de ella en el patio. ¿Qué haces?","o":[{"t":"Le sugieres a Camila que evite el patio.","p":0,"f":"La aísla a ella en vez de detener la conducta."},{"t":"Detienes la burla, registras el hecho e informas al coordinador/a de convivencia educativa.","p":2,"f":"Correcto: la identidad de género es un motivo de discriminación arbitraria."},{"t":"Hablas con los compañeros, pero no lo registras.","p":1,"f":"Sin registro no se puede dar seguimiento si se repite."}]},{"q":"La dirección firmó un acta con medidas de apoyo para Camila. ¿Cuál es tu rol?","o":[{"t":"Esperas una instrucción escrita para cada situación antes de usar su nombre social.","p":1,"f":"El acta ya fija las medidas; aplícalas y consulta solo las dudas."},{"t":"Comentas el caso con otros apoderados para que «entiendan».","p":0,"f":"Expone a la estudiante y puede afectar su bienestar."},{"t":"Aplicas los acuerdos en tu trabajo diario, como usar su nombre social, y consultas a la dirección ante dudas.","p":2,"f":"Bien: los acuerdos se cumplen en la práctica cotidiana."}]}],"claves":["Escuchar y usar el nombre social","Orientar sobre la entrevista con la dirección","Detener y registrar la discriminación","Aplicar las medidas del acta"],"s":[["div_c812"],["div_lgtbi"],["l20609","art. 2"],["l21809"]]},
  {"id":"c43","m":"etica","n":1,"titulo":"El tercer atraso","intro":"Un estudiante de 8° básico llega atrasado por tercera vez en la semana y te responde de mala forma. Un colega, delante de él, hace una broma sobre su nacionalidad.","pasos":[{"q":"¿Cómo respondes al atraso y a la mala respuesta?","o":[{"t":"Mantienes la calma, pones un límite con respeto, registras el atraso y aplicas lo que indica el reglamento.","p":2,"f":"Firmeza y respeto no se oponen; la medida debe estar en el reglamento y ser proporcional."},{"t":"Le gritas frente a los demás para que no se repita.","p":0,"f":"Humillar a un estudiante es un trato degradante y contrario a la dignidad."},{"t":"Lo dejas pasar sin registrar nada para evitar problemas.","p":1,"f":"Evitas el conflicto, pero no cumples tu función ni das seguimiento."}]},{"q":"¿Qué haces ante la broma de tu colega?","o":[{"t":"Le pides que no siga, en un tono respetuoso, e informas a la coordinación de convivencia si se repite.","p":2,"f":"Las bromas basadas en el origen son discriminatorias; los adultos son garantes de derechos."},{"t":"Te ríes para no incomodar.","p":0,"f":"Reírse valida la discriminación frente al estudiante."},{"t":"No dices nada y luego lo comentas solo con el colega.","p":1,"f":"Conversarlo está bien, pero el estudiante quedó expuesto sin que un adulto lo protegiera."}]},{"q":"Más tarde, la apoderada de otro estudiante te pregunta por los atrasos y problemas de este alumno. ¿Qué haces?","o":[{"t":"Le explicas que no puedes entregar información de otro estudiante y le ofreces hablar de lo que afecte a su hijo.","p":2,"f":"Resguardas la vida privada y los datos del estudiante."},{"t":"Le cuentas todo porque es apoderada del curso.","p":0,"f":"Revelar antecedentes de un estudiante vulnera su vida privada y honra."},{"t":"Te niegas a hablar con ella sobre cualquier tema.","p":1,"f":"Proteges la información, pero ella tiene derecho a ser escuchada sobre su propio hijo."}]}],"claves":["Poner límites sin humillar","Las medidas salen del reglamento y son proporcionales","Intervenir ante comentarios discriminatorios","No entregar información de un estudiante a terceros"],"s":[["lge","art. 10 letras a, b y d"],["l20609","art. 2"],["viol_cart7"],["l21430","arts. 33 y 34"]]},
  {"id":"c44","m":"etica","n":2,"titulo":"¿Revisar la mochila?","intro":"Un profesor sospecha que un estudiante de 2° medio trae algo peligroso y te pide que le revises la mochila de inmediato, en el pasillo, frente a sus compañeros. El reglamento interno incluye la revisión de mochilas.","pasos":[{"q":"¿Qué haces?","o":[{"t":"Verificas que eres personal autorizado y capacitado, llevas al estudiante a un lugar designado y aseguras la presencia de dos adultos.","p":2,"f":"La revisión excepcional exige personal autorizado, un lugar designado, dos adultos y evitar la exposición pública."},{"t":"Lo llevas a inspectoría y revisas tú solo la mochila.","p":1,"f":"Evitas la exposición, pero falta el segundo adulto que exige la ley."},{"t":"Revisas la mochila ahí mismo para no perder tiempo.","p":0,"f":"Revisar en público vulnera la dignidad e intimidad del estudiante."}]},{"q":"El estudiante se niega a mostrar sus cosas. ¿Qué haces?","o":[{"t":"No lo fuerzas ni lo tocas, e informas a la dirección para seguir el procedimiento del reglamento.","p":2,"f":"La ley prohíbe la revisión forzosa y exige no tener contacto físico con el estudiante."},{"t":"Lo retienes hasta que acceda.","p":0,"f":"Forzar la revisión está prohibido y no respeta su dignidad."},{"t":"Lo dejas volver a clases sin avisar a nadie.","p":1,"f":"No lo fuerzas, pero si hay una sospecha fundada la dirección debe saberlo."}]},{"q":"Finalmente se hace la revisión y no se encuentra nada. ¿Qué haces?","o":[{"t":"Levantas un registro escrito y firmado con motivos, adultos presentes, resultado y horario, y se entrega copia al estudiante y su apoderado.","p":2,"f":"El registro es obligatorio aunque no se encuentre nada."},{"t":"Como no había nada, no registras.","p":1,"f":"El registro se exige siempre: da transparencia y protege a todos."},{"t":"Cuentas en la sala de profesores lo que traía en la mochila.","p":0,"f":"Debes resguardar la vida privada y la honra del estudiante."}]}],"claves":["Solo personal autorizado y capacitado, según el reglamento","Lugar designado, dos adultos y sin exposición pública","Nunca forzar, tocar ni pedir que se desnude","Registro escrito y firmado con copia al estudiante y su apoderado"],"s":[["l21827","art. 1, art. 16 J LGE"],["l21430","arts. 33 y 34"]]}
];
const REFUERZO = [
  {"id":"r1","m":"ig","tipo":"vf","a":"Desde la Ley 21.809, los apoderados deben canalizar sus inquietudes por los conductos formales del establecimiento.","v":true,"e":"El nuevo art. 16 A de la LGE lo establece junto con el deber de buen trato.","s":[["l21809","art. 16 A LGE"]]},
  {"id":"r2","m":"ig","tipo":"vf","a":"El deber de reportar hechos de acoso o violencia es solo de los profesores jefes.","v":false,"e":"Recae en los funcionarios y en los adultos de la comunidad educativa.","s":[["l21809","art. 16 E letra f) LGE"]]},
  {"id":"r3","m":"ig","tipo":"vf","a":"En una revisión de mochilas se puede pedir al estudiante que se saque la ropa si hay sospecha fundada.","v":false,"e":"La ley lo prohíbe estrictamente y no permite revisar la ropa puesta.","s":[["l21827","art. 16 J LGE"]]},
  {"id":"r4","m":"ig","tipo":"vf","a":"Una revisión excepcional en privado requiere al menos dos adultos, uno del equipo de convivencia, y un acta escrita y firmada.","v":true,"e":"Además, se entrega copia del acta al estudiante y a su apoderado.","s":[["l21827","art. 16 J LGE"]]},
  {"id":"r5","m":"ig","tipo":"vf","a":"Las medidas de revisión de mochilas de la Ley 21.827 se aplican aunque el reglamento interno no las haya incorporado.","v":false,"e":"Rigen una vez incorporadas al reglamento interno y comunicadas a la comunidad.","s":[["l21827","art. transitorio"]]},
  {"id":"r6","m":"ig","tipo":"vf","a":"Toda medida disciplinaria o reparatoria debe ir acompañada de medidas formativas.","v":true,"e":"Así lo exige la Ley 21.809.","s":[["l21809","art. 16 E LGE"]]},
  {"id":"r7","m":"ig","tipo":"vf","a":"La investigación de una falta de un estudiante puede durar el tiempo que el colegio estime, sin límite.","v":false,"e":"Las etapas y plazos deben estar en el reglamento, con un máximo de dos meses para estudiantes.","s":[["l21809","art. 16 E letra g) LGE"]]},
  {"id":"r8","m":"ig","tipo":"vf","a":"El reglamento interno debe actualizarse al menos cada cuatro años, con participación de todos los estamentos.","v":true,"e":"Lo establece el nuevo art. 16 H de la LGE.","s":[["l21809","art. 16 H LGE"]]},
  {"id":"r9","m":"ig","tipo":"orden","t":"Ordena los pasos ante una pelea entre estudiantes en el patio.","pasos":["Contener la situación y separar a los involucrados con apoyo de otro adulto","Atender al herido y alejar a los espectadores","Reportar al equipo directivo o a quien indique el reglamento interno","Registrar los hechos observados, sin opiniones","Apoyar el procedimiento del reglamento, que incluye medidas formativas"],"e":"Primero la seguridad, luego el aviso a quien corresponde y el registro que sostiene un procedimiento justo.","s":[["lge","art. 10"],["l21809","art. 16 E LGE"]]},
  {"id":"r10","m":"ig","tipo":"orden","t":"Ordena los pasos ante un estudiante que se niega a la revisión de su mochila.","pasos":["No forzar la revisión ni tener contacto físico","Avisar de inmediato a la familia","Mantener al estudiante supervisado en un espacio distinto a la sala","Si el apoderado llega y la negativa sigue, el apoderado retira las pertenencias","El establecimiento informa a la Oficina Local de la Niñez"],"e":"Es la secuencia que fija la Ley 21.827 para resguardar la seguridad y los derechos del estudiante.","s":[["l21827","art. 16 J LGE"]]},
  {"id":"r11","m":"conv","tipo":"vf","a":"La mediación busca establecer quién es el culpable y qué sanción le corresponde.","v":false,"e":"La mediación no establece sanciones ni culpables: busca un acuerdo para restablecer la relación.","s":[["conv_orient2011"]]},
  {"id":"r12","m":"conv","tipo":"vf","a":"La mediación no es aplicable cuando ha existido un uso ilegítimo de la fuerza o el poder.","v":true,"e":"Las orientaciones Mineduc indican que la mediación no está pensada para abordar conductas de abuso.","s":[["conv_orient2011"]]},
  {"id":"r13","m":"conv","tipo":"vf","a":"La gestión colaborativa de conflictos del reglamento interno se rige, entre otros, por el principio de voluntariedad.","v":true,"e":"La Ley 21.809 incluye la voluntariedad entre sus principios, junto a confidencialidad, igualdad, imparcialidad y neutralidad.","s":[["l21809","art. 16 E letra k LGE"]]},
  {"id":"r14","m":"conv","tipo":"vf","a":"Para que una acción reparatoria sea efectiva, el inspector puede imponerla aunque el estudiante no quiera.","v":false,"e":"La acción reparatoria debe ser voluntaria y proporcional al daño.","s":[["conv_orient2011"]]},
  {"id":"r15","m":"conv","tipo":"vf","a":"Antes de aplicar una sanción o medida, es necesario conocer la versión de todos los involucrados.","v":true,"e":"También se consideran el contexto, la edad y el rol de cada persona.","s":[["conv_orient2011"]]},
  {"id":"r16","m":"conv","tipo":"vf","a":"Basta con que una de las partes quiera para que se haga una mediación.","v":false,"e":"La mediación es voluntaria para las partes; además requiere que estén calmadas y que exista confianza.","s":[["l21809","art. 16 E letra k LGE"],["conv_cart6","p. 14"]]},
  {"id":"r17","m":"conv","tipo":"vf","a":"Los apoderados tienen el deber de respetar la normativa interna y brindar un trato respetuoso a la comunidad educativa.","v":true,"e":"Así lo establece el art. 10 letra b de la LGE.","s":[["lge","art. 10 letra b"]]},
  {"id":"r18","m":"conv","tipo":"vf","a":"En educación parvularia se pueden aplicar medidas disciplinarias por faltas a la convivencia.","v":false,"e":"En parvularia no se incorporan medidas disciplinarias; se usan medidas pedagógicas, por ejemplo para desarrollar la empatía.","s":[["conv_ori21809","p. 9"]]},
  {"id":"r19","m":"conv","tipo":"orden","t":"Ordena las etapas de una mediación según la Política Nacional de Convivencia Educativa.","pasos":["Premediación","Presentación y reglas del encuentro","Escuchar a cada parte («Cuéntame y te escucho»)","Aclarar el problema","Proponer soluciones","Llegar a un acuerdo"],"e":"Primero se prepara y se fijan reglas; luego cada parte se siente escuchada, se entiende el problema y recién ahí se buscan soluciones y acuerdos.","s":[["conv_cart6","p. 14"]]},
  {"id":"r20","m":"conv","tipo":"orden","t":"Ordena los pasos ante un apoderado molesto que llega a reclamar por un conflicto entre estudiantes.","pasos":["Mantener la calma y llevarlo a un espacio aparte, lejos de las salas","Escuchar su reclamo sin prometer sanciones","Registrar por escrito y en forma objetiva lo que relata","Informar a la coordinación de convivencia para activar el protocolo","Explicarle cómo y cuándo será informado del procedimiento"],"e":"Se resguarda a los estudiantes, se respeta el derecho del apoderado a ser escuchado e informado, y el caso se canaliza por el protocolo del reglamento.","s":[["lge","art. 10 letra b"],["l21809","arts. 16 A y 16 E LGE"],["conv_cart2"]]},
  {"id":"r21","m":"tea","tipo":"vf","a":"Las orientaciones técnicas de Minsal de 2025 usan la expresión «persona autista» en lugar de «persona con TEA».","v":true,"e":"El documento usa «persona autista» y no recomienda «persona con autismo» ni «persona con TEA», por su baja representatividad en la comunidad autista.","s":[["tea_ot","cap. 1, pp. 8 y 28"]]},
  {"id":"r22","m":"tea","tipo":"vf","a":"Todos los estudiantes autistas necesitan los mismos apoyos.","v":false,"e":"Minsal describe a las personas autistas como un grupo muy heterogéneo, con distintas necesidades de apoyo.","s":[["tea_ot","cap. 1, p. 8"]]},
  {"id":"r23","m":"tea","tipo":"vf","a":"Los apoyos visuales pueden ser objetos reales, fotos, dibujos o pictogramas.","v":true,"e":"Los lineamientos Mineduc mencionan esos formatos y piden adaptarlos a cada estudiante.","s":[["tea_paec","pp. 51 y 52"]]},
  {"id":"r24","m":"tea","tipo":"vf","a":"Si un estudiante autista no responde de inmediato, conviene repetirle la pregunta varias veces y más rápido.","v":false,"e":"La guía Mineduc recomienda esperar a que el niño o niña se comunique y no llenar el silencio.","s":[["tea_guia08","p. 39"]]},
  {"id":"r25","m":"tea","tipo":"vf","a":"Una persona autista puede ser muy sensible o poco sensible a estímulos como ruidos o luces.","v":true,"e":"Minsal describe la hiper o hiporreactividad a los estímulos sensoriales.","s":[["tea_ot","cap. 1, p. 38"],["tea_paec","p. 53"]]},
  {"id":"r26","m":"tea","tipo":"vf","a":"En un momento de angustia, conviene usar un lenguaje más elaborado para explicarle bien lo que pasa.","v":false,"e":"Los lineamientos Mineduc piden simplificar el lenguaje en momentos de desafío.","s":[["tea_paec","p. 33"]]},
  {"id":"r27","m":"tea","tipo":"vf","a":"Para apoyar la relación con compañeros se sugiere empezar con actividades en parejas o grupos pequeños.","v":true,"e":"La guía Mineduc propone actividades con pocos niños y niñas y un acercamiento gradual.","s":[["tea_guia08","p. 37"]]},
  {"id":"r28","m":"tea","tipo":"vf","a":"Un estudiante autista siempre entenderá una frase como «estás en las nubes» como una metáfora.","v":false,"e":"Algunos niños y niñas autistas interpretan literalmente el lenguaje figurado, como las metáforas.","s":[["tea_guia08","p. 14"]]},
  {"id":"r29","m":"tea","tipo":"orden","t":"Ordena los pasos para anticipar un cambio de rutina a un estudiante autista.","pasos":["Enterarte con tiempo del cambio de horario, sala o actividad","Avisar al equipo que apoya al estudiante (profesor jefe o PIE)","Anticiparle el cambio con el apoyo que usa, por ejemplo su agenda visual","Acompañar la transición en el momento del cambio","Comentar con el equipo cómo resultó para ajustar los apoyos"],"e":"La anticipación debe ocurrir antes del cambio y con el medio que el estudiante comprende; luego el PAEC se revisa y ajusta.","s":[["tea_paec","pp. 23, 30 y 31"]]},
  {"id":"r30","m":"tea","tipo":"orden","t":"Ordena cómo dar una instrucción a un estudiante autista.","pasos":["Acercarte con calma, sin invadir su espacio","Decir una frase corta y concreta","Mostrar el apoyo visual que usa, si lo tiene","Esperar su respuesta sin llenar el silencio"],"e":"Primero se crea un clima tranquilo, luego se da un mensaje breve apoyado en lo visual y se da tiempo para responder.","s":[["tea_guia08","pp. 28, 31 y 39"]]},
  {"id":"r31","m":"tutor","tipo":"vf","a":"La figura del tutor sombra está regulada en detalle en el Decreto 170.","v":false,"e":"Según el fallo de Copiapó, la normativa no la prohíbe y la deja al acuerdo entre el colegio y los apoderados.","s":[["copiapo","considerando 7"]]},
  {"id":"r32","m":"tutor","tipo":"vf","a":"Entre los requisitos citados en el fallo de Copiapó está que el tutor sombra cumpla el reglamento interno del colegio.","v":true,"e":"La Seremi incluyó el cumplimiento del reglamento interno entre los requisitos.","s":[["copiapo","considerando 7"]]},
  {"id":"r33","m":"tutor","tipo":"vf","a":"El PIE solo puede entregar apoyos fuera de la sala de clases.","v":false,"e":"El manual PIE sitúa los apoyos en el contexto del aula común, con trabajo colaborativo.","s":[["pie"]]},
  {"id":"r34","m":"tutor","tipo":"vf","a":"El Decreto 83 busca que el entorno y el tiempo se organicen para que el estudiante acceda de forma autónoma.","v":true,"e":"Las adecuaciones de acceso sobre entorno y tiempo apuntan al acceso autónomo.","s":[["d83","pp. 9 y 10"]]},
  {"id":"r35","m":"tutor","tipo":"vf","a":"El PAEC es un documento fijo que no se modifica durante el año.","v":false,"e":"Los lineamientos lo definen como un recurso dinámico en permanente revisión y ajuste.","s":[["tea_paec","p. 23"]]},
  {"id":"r36","m":"tutor","tipo":"vf","a":"El personal que trabaja directamente con el estudiante debe ser informado de los cambios del PAEC.","v":true,"e":"Los lineamientos y la Circular 586 piden informar al personal cada vez que el plan cambia.","s":[["tea_paec","p. 24"],["c586"]]},
  {"id":"r37","m":"tutor","tipo":"vf","a":"El sueldo del tutor sombra lo paga el establecimiento con la subvención del PIE.","v":false,"e":"En el caso de Copiapó, la remuneración la pagaba el apoderado; el colegio sostuvo que la figura no estaba contemplada en la subvención.","s":[["copiapo","considerandos 7 y 10"]]},
  {"id":"r38","m":"tutor","tipo":"vf","a":"Las transiciones mal anticipadas pueden ser una fuente de estrés para estudiantes autistas.","v":true,"e":"Los lineamientos Mineduc las incluyen entre los estresores.","s":[["tea_paec","pp. 29 y 30"]]},
  {"id":"r39","m":"tutor","tipo":"orden","t":"Ordena los pasos ante la llegada de un tutor sombra nuevo.","pasos":["Recibirlo en portería y registrar su ingreso como adulto externo","Consultar a dirección si existe autorización escrita firmada para esa persona","Conocer los acuerdos: horario, espacios y funciones","Informar al profesor y al equipo PIE o de convivencia","Canalizar dudas o problemas posteriores al equipo correspondiente"],"e":"Primero se resguarda el control de acceso, luego se confirma la autorización y los acuerdos, y finalmente se coordina con el equipo.","s":[["copiapo","considerando 7"],["c482","reglamento interno"]]},
  {"id":"r40","m":"tutor","tipo":"orden","t":"Ordena el ciclo de un apoyo individual a un estudiante con necesidades educativas especiales.","pasos":["Conocer el plan del estudiante (PACI o PAEC) y tu rol en él","Aplicar los apoyos acordados en la rutina diaria","Observar cómo responde el estudiante","Compartir lo observado con el equipo en las instancias acordadas","Ajustar los apoyos según la evaluación del equipo y la familia"],"e":"Los apoyos se planifican, se aplican, se observan y se evalúan en equipo para ajustarlos.","s":[["d83","p. 8"],["tea_paec","pp. 26 y 27"]]},
  {"id":"r41","m":"crisis","tipo":"vf","a":"Un estudiante que se queda callado y retraído no puede estar en crisis.","v":false,"e":"El shutdown es una crisis hacia adentro: el estudiante se retira o deja de hablar.","s":[["tea_paec","pp. 35 y 36"]]},
  {"id":"r42","m":"crisis","tipo":"vf","a":"El adulto que acompaña una crisis debe primero mantener su propia calma.","v":true,"e":"Los lineamientos piden que el adulto se regule y modele autorregulación.","s":[["tea_paec","p. 32"]]},
  {"id":"r43","m":"crisis","tipo":"vf","a":"Durante la crisis conviene negociar con el estudiante para que se calme.","v":false,"e":"Negociar durante la crisis está entre lo que se recomienda evitar.","s":[["tea_paec","pp. 32 a 34"]]},
  {"id":"r44","m":"crisis","tipo":"vf","a":"A mediano plazo se enseñan habilidades alternativas que cumplan la misma función que la conducta de desregulación.","v":true,"e":"El protocolo de la Seremi de Valparaíso lo plantea como parte del seguimiento.","s":[["dec","seguimiento"]]},
  {"id":"r45","m":"crisis","tipo":"vf","a":"La reparación hacia terceros debe hacerse de inmediato, aunque el estudiante siga alterado.","v":false,"e":"La reparación se hace cuando el estudiante ha vuelto a la calma, sin apresurar el proceso.","s":[["dec","reparación"]]},
  {"id":"r46","m":"crisis","tipo":"vf","a":"Corregir las groserías involuntarias (coprolalia) en plena crisis ayuda a que el estudiante se calme.","v":false,"e":"Los lineamientos Mineduc indican no corregir la coprolalia durante la crisis.","s":[["tea_paec","pp. 32 a 34"]]},
  {"id":"r47","m":"crisis","tipo":"vf","a":"El contacto físico se ofrece solo según el perfil sensorial del estudiante o si lo pide.","v":true,"e":"Los lineamientos piden evitar el contacto físico salvo que sea solicitado o acorde a su perfil sensorial.","s":[["tea_paec","pp. 32 a 34"]]},
  {"id":"r48","m":"crisis","tipo":"vf","a":"El registro de un episodio sirve como recurso para aprender y mejorar las respuestas.","v":true,"e":"El seguimiento del episodio se plantea como una oportunidad de aprendizaje y mejora.","s":[["tea_paec","p. 39"]]},
  {"id":"r49","m":"crisis","tipo":"orden","t":"Ordena estos pasos del protocolo de desregulación según los lineamientos Mineduc.","pasos":["Respuesta inicial del adulto más cercano","Evaluar la situación y si corresponde activar el protocolo","Activar el protocolo","Acompañar y proteger al estudiante y a los demás","Recuperar la calma del estudiante y del entorno","Evaluar las respuestas usadas y registrar el episodio"],"e":"Primero se actúa y se evalúa, luego se protege a todos; la evaluación y el registro vienen cuando hay calma.","s":[["tea_paec","pp. 38 y 39"]]},
  {"id":"r50","m":"crisis","tipo":"orden","t":"Ordena el seguimiento posterior a una crisis.","pasos":["Esperar a que el estudiante haya vuelto a la calma","Mostrarle afecto y comprensión","Conversar lo ocurrido y acordar cómo reparar, sin apresurar","Registrar la intervención en la bitácora","Revisar con el equipo y la familia qué la gatilló y ajustar el plan"],"e":"La conversación y la reparación requieren calma; el registro permite revisar el episodio y mejorar el plan.","s":[["dec","reparación y bitácora"],["tea_paec","p. 39"]]},
  {"id":"r51","m":"tdah","tipo":"vf","a":"El déficit atencional sin hiperactividad puede pasar inadvertido, porque el estudiante suele ser tranquilo.","v":true,"e":"La guía Mineduc describe a estos estudiantes como tranquilos, que parecen «estar en la luna».","s":[["tdah_guia"]]},
  {"id":"r52","m":"tdah","tipo":"vf","a":"El déficit atencional es solo un problema de mala conducta o de desafío a la autoridad.","v":false,"e":"Las conductas responden a dificultades para controlar impulsos, no a mala voluntad.","s":[["tdah_guia"]]},
  {"id":"r53","m":"tdah","tipo":"vf","a":"Basta con pedirle al estudiante que se esfuerce más para que cambie su conducta.","v":false,"e":"La guía indica que solo pedirle que se esfuerce no asegura el cambio.","s":[["tdah_guia"]]},
  {"id":"r54","m":"tdah","tipo":"vf","a":"El medicamento es la única vía de solución para el déficit atencional.","v":false,"e":"La guía señala que no es en ningún caso la única vía; se combinan apoyos educativos y psicosociales.","s":[["tdah_guia"],["tdah_minsal"]]},
  {"id":"r55","m":"tdah","tipo":"vf","a":"Para el Decreto 170, las conductas del déficit atencional deben presentarse en más de un contexto.","v":true,"e":"El decreto exige que aparezcan en más de un contexto, como el hogar y la escuela.","s":[["d170","art. 40"]]},
  {"id":"r56","m":"tdah","tipo":"vf","a":"La causa principal del déficit atencional es la dieta y los aditivos alimentarios.","v":false,"e":"Las causas principales son neurobiológicas, con un factor genético predominante.","s":[["tdah_guia"]]},
  {"id":"r57","m":"tdah","tipo":"vf","a":"La Guía Clínica del Minsal recomienda que la intervención se coordine entre el equipo de salud, la escuela y el hogar.","v":true,"e":"La guía pide coordinar las intervenciones con el establecimiento y vincularlas con la familia.","s":[["tdah_minsal"]]},
  {"id":"r58","m":"tdah","tipo":"vf","a":"Avisar con anticipación los cambios de rutina ayuda a los estudiantes con dificultades de atención.","v":true,"e":"La guía recomienda una rutina diaria y avisar con tiempo los cambios.","s":[["tdah_parv"]]},
  {"id":"r59","m":"tdah","tipo":"orden","t":"Ordena los pasos para dar una instrucción a un estudiante con déficit atencional.","pasos":["Acercarte y llamar su atención hacia la tarea","Dar la primera parte de la instrucción, breve y clara","Comprobar que entendió","Esperar que la cumpla y reconocer el logro","Dar el siguiente paso"],"e":"Primero se asegura la atención, luego se entrega la instrucción por partes, se comprueba la comprensión y se refuerza cada logro.","s":[["tdah_guia"],["tdah_parv"]]},
  {"id":"r60","m":"tdah","tipo":"orden","t":"Ordena los pasos para resolver un conflicto entre estudiantes, según la guía Mineduc.","pasos":["Reunir a los involucrados","Escuchar a cada uno por turnos","Describir los hechos sin juicios","Buscar puntos en común y evaluar los errores","Acordar cómo actuar en el futuro","Cerrar el conflicto y partir de cero"],"e":"Escuchar y describir hechos permite llegar a acuerdos; cerrar el conflicto evita que el estudiante quede marcado.","s":[["tdah_guia"]]},
  {"id":"r61","m":"di","tipo":"vf","a":"Para el Decreto 170, la discapacidad intelectual se inicia antes de los 18 años.","v":true,"e":"La edad de aparición anterior a los 18 años es uno de los tres requisitos.","s":[["d170","art. 57"]]},
  {"id":"r62","m":"di","tipo":"vf","a":"La conducta adaptativa se mide por lo que la persona podría hacer en teoría, no por lo que hace habitualmente.","v":false,"e":"La guía Mineduc señala que se define por la ejecución habitual y no por la capacidad.","s":[["di_guia"]]},
  {"id":"r63","m":"di","tipo":"vf","a":"El DSM-5 y la CIE-11 dejaron de usar el término «retraso mental».","v":true,"e":"Ambos sistemas abandonaron ese concepto.","s":[["di_mesa"]]},
  {"id":"r64","m":"di","tipo":"vf","a":"La discapacidad intelectual es un estado fijo que no cambia aunque el estudiante reciba apoyos.","v":false,"e":"Es un estado de funcionamiento que puede variar según los apoyos.","s":[["di_mesa"]]},
  {"id":"r65","m":"di","tipo":"vf","a":"Las adecuaciones curriculares de acceso disminuyen las expectativas de aprendizaje del estudiante.","v":false,"e":"Facilitan el progreso sin disminuir las expectativas de aprendizaje.","s":[["d83"]]},
  {"id":"r66","m":"di","tipo":"vf","a":"En lectura fácil se recomienda una sola idea por frase.","v":true,"e":"Es una de las pautas básicas de redacción.","s":[["di_lf"]]},
  {"id":"r67","m":"di","tipo":"vf","a":"Hacerle todo al estudiante para que no se frustre es la mejor forma de apoyar su autonomía.","v":false,"e":"Se recomienda el apoyo estrictamente necesario y evitar la sobreprotección.","s":[["di_guia"]]},
  {"id":"r68","m":"di","tipo":"vf","a":"El PACI organiza las adecuaciones curriculares de un estudiante y puede acompañarlo durante su trayectoria escolar.","v":true,"e":"El Decreto 83 lo considera un documento oficial con ese propósito.","s":[["d83"]]},
  {"id":"r69","m":"di","tipo":"orden","t":"Ordena los pasos para enseñar una rutina nueva, como guardar sus materiales, a un estudiante con discapacidad intelectual.","pasos":["Captar su atención y nombrar la tarea con una frase corta","Mostrar el primer paso con apoyo visual","Pedirle que lo haga él o ella","Reconocer el logro y pasar al siguiente paso pequeño","Reducir la ayuda hasta que lo haga solo"],"e":"Las tareas complejas se aprenden en pasos pequeños, con apoyo visual y solo la ayuda necesaria.","s":[["di_guia"]]},
  {"id":"r70","m":"di","tipo":"orden","t":"Ordena los pasos para escribir un aviso en lectura fácil.","pasos":["Definir el mensaje principal","Escribir frases cortas, con una idea por frase","Cambiar palabras difíciles por palabras de uso frecuente","Agregar imágenes de apoyo y usar letra grande","Probar el texto con otros lectores antes de publicarlo"],"e":"Primero se define qué decir, luego cómo decirlo de forma sencilla y, al final, se comprueba que se entiende.","s":[["di_lf"]]},
  {"id":"r71","m":"fis","tipo":"vf","a":"Las personas sordas son necesariamente mudas; por eso se dice «sordomudo».","v":false,"e":"Senadis aclara que no son necesariamente mudas y recomienda «persona sorda».","s":[["fis_lenguaje"]]},
  {"id":"r72","m":"fis","tipo":"vf","a":"Para el Decreto 170, la discapacidad auditiva incluye la hipoacusia y la sordera.","v":true,"e":"El decreto distingue pérdida parcial (hipoacusia) y severa o total (sordera).","s":[["d170","art. 77"]]},
  {"id":"r73","m":"fis","tipo":"vf","a":"La Ley 21.303 reconoce la lengua de señas chilena como lengua oficial de las personas sordas.","v":true,"e":"La ley reemplazó el artículo 26 de la Ley 20.422 con ese reconocimiento.","s":[["l21303"]]},
  {"id":"r74","m":"fis","tipo":"vf","a":"Se puede mover la silla de ruedas de un estudiante sin preguntarle si se nota apurado.","v":false,"e":"No se mueve la silla sin permiso; primero se pregunta si necesita ayuda y cómo.","s":[["fis_senadis"]]},
  {"id":"r75","m":"fis","tipo":"vf","a":"Para guiar a una persona ciega conviene tomarla firmemente del brazo.","v":false,"e":"Se ofrece el brazo propio; tomar el suyo le quita estabilidad.","s":[["fis_senadis"]]},
  {"id":"r76","m":"fis","tipo":"vf","a":"Mantener estables los muebles de la sala da seguridad a un estudiante ciego.","v":true,"e":"La guía Mineduc lo recomienda y pide avisar cualquier cambio.","s":[["fis_visual"]]},
  {"id":"r77","m":"fis","tipo":"vf","a":"Los edificios de uso público deben ser accesibles y utilizables sin dificultad, en especial por personas con movilidad reducida.","v":true,"e":"Así lo establece el artículo 28 de la Ley 20.422.","s":[["l20422","art. 28"]]},
  {"id":"r78","m":"fis","tipo":"vf","a":"En una emergencia se puede separar a una persona con discapacidad de su perro de asistencia para evacuar más rápido.","v":false,"e":"Senadis indica que no se debe separar a la persona de su cuidador ni de su perro de asistencia.","s":[["fis_emerg"]]},
  {"id":"r79","m":"fis","tipo":"orden","t":"Ordena los pasos para guiar a un estudiante ciego a otro lugar del colegio.","pasos":["Identificarte con tu nombre y función","Preguntarle si necesita ayuda","Ofrecerle tu brazo, sin tomar el suyo","Avanzar describiendo el recorrido y los obstáculos","Al llegar, describirle los elementos del lugar"],"e":"La persona debe saber quién la ayuda y aceptar la ayuda antes del contacto; la descripción le da seguridad.","s":[["fis_senadis"],["fis_emerg"],["fis_visual"]]},
  {"id":"r80","m":"fis","tipo":"orden","t":"Ordena los pasos para avisar una evacuación a un estudiante sordo.","pasos":["Llamar su atención con un toque suave","Ubicarte frente a él, con tu rostro visible","Dar el mensaje con señas, nota escrita o intérprete de LSCh","Comprobar que entendió","Acompañarlo a la zona de seguridad"],"e":"Primero se capta su atención por un canal visual o táctil; luego se entrega y verifica el mensaje.","s":[["fis_emerg"],["fis_senadis"]]},
  {"id":"r81","m":"der","tipo":"vf","a":"La Convención sobre los Derechos del Niño define como niño a todo ser humano menor de 18 años.","v":true,"e":"Así lo dice su art. 1, salvo que la ley aplicable fije antes la mayoría de edad.","s":[["d830","art. 1"]]},
  {"id":"r82","m":"der","tipo":"vf","a":"Toda vulneración de derechos de un niño es un delito.","v":false,"e":"Toda vulneración es grave, pero solo algunas son delito según la ley.","s":[["der_parvprot"]]},
  {"id":"r83","m":"der","tipo":"vf","a":"Las señales físicas aparecen solo en una parte pequeña de los casos confirmados, por eso importa que haya varios indicadores juntos.","v":true,"e":"Las orientaciones advierten que un solo indicador no basta y que se deben considerar en conjunto.","s":[["der_parvprot"]]},
  {"id":"r84","m":"der","tipo":"vf","a":"Ante la sospecha de abuso, el colegio debe investigar y reunir pruebas antes de denunciar.","v":false,"e":"Investigar corresponde al fiscal; el colegio no recaba pruebas.","s":[["der_parvprot"]]},
  {"id":"r85","m":"der","tipo":"vf","a":"Se puede hacer un careo entre el niño y el presunto agresor para aclarar los hechos.","v":false,"e":"No se hacen careos ni enfrentamientos: generan victimización secundaria.","s":[["der_parvprot"],["l21057","art. 3 letra d"]]},
  {"id":"r86","m":"der","tipo":"vf","a":"La mayoría de los abusos sexuales contra niños son cometidos por personas conocidas.","v":true,"e":"El material oficial señala que el 80% de los casos los cometen conocidos del niño, como familiares, vecinos o docentes.","s":[["der_folleto"]]},
  {"id":"r87","m":"der","tipo":"vf","a":"Ante una vulneración en un colegio, lo primero es acudir a la Defensoría de la Niñez, antes que a la institución competente.","v":false,"e":"Primero se acude a la institucionalidad competente, como la Superintendencia de Educación; la Defensoría actúa si no responden.","s":[["der_defeduc"]]},
  {"id":"r88","m":"der","tipo":"vf","a":"La Ley 21.430 reconoce el derecho de niños, niñas y adolescentes a que sus opiniones sean oídas y debidamente consideradas.","v":true,"e":"Su art. 28 lo establece, según su edad, madurez y desarrollo.","s":[["l21430","art. 28"]]},
  {"id":"r89","m":"der","tipo":"orden","t":"Ordena los pasos del protocolo ante una sospecha de vulneración de derechos.","pasos":["Detectar las señales de alerta","Acoger al niño sin interrogarlo ni pedirle que repita su relato","Informar a la dirección en un plazo de hasta 24 horas","Resguardar su identidad y procurar que esté acompañado por un adulto responsable","La dirección o el sostenedor informa al Tribunal de Familia u oficina de protección, o denuncia si hay delito"],"e":"Primero se detecta y acoge; luego se activa la dirección, se protege al niño y se comunica a la red que corresponde.","s":[["der_parvprot"],["der_defvuln"]]},
  {"id":"r90","m":"der","tipo":"orden","t":"Ordena qué hacer cuando un estudiante te revela un posible abuso.","pasos":["Escuchar con calma, sin interrogar ni dudar del relato","Explicarle que no puedes guardar el secreto y que pedirás ayuda para protegerlo","Registrar por escrito sus palabras textuales","Informar de inmediato a la dirección","La dirección denuncia ante Fiscalía, Carabineros o PDI dentro de 24 horas"],"e":"La acogida va primero; el registro fiel evita que deba repetir su relato, y la denuncia oportuna cumple la obligación legal.","s":[["cpp","arts. 175 y 176"],["l21057","art. 4"],["der_parvprot"]]},
  {"id":"r91","m":"viol","tipo":"vf","a":"El ciberacoso solo cuenta como acoso escolar si ocurre durante el horario de clases.","v":false,"e":"La ley considera acoso el que ocurre dentro o fuera del establecimiento y por medios tecnológicos.","s":[["l21809","art. 16 B LGE"]]},
  {"id":"r92","m":"viol","tipo":"vf","a":"La agresividad se transforma en violencia cuando es desproporcionada o se vuelve un modo permanente de relación.","v":true,"e":"La agresividad es una reacción defensiva natural; la violencia implica uso ilegítimo de la fuerza o el poder.","s":[["viol_cart10"]]},
  {"id":"r93","m":"viol","tipo":"vf","a":"El establecimiento debe hacer procesos terapéuticos reparatorios con la víctima.","v":false,"e":"El colegio no realiza procesos terapéuticos: deriva a los organismos competentes.","s":[["viol_cart10"]]},
  {"id":"r94","m":"viol","tipo":"vf","a":"Ante un hecho de violencia, se informa a los apoderados de cada parte por separado, sin ocultar ni minimizar los hechos.","v":true,"e":"Así lo recomienda la Cartilla 10 de la Política Nacional de Convivencia Educativa.","s":[["viol_cart10"]]},
  {"id":"r95","m":"viol","tipo":"vf","a":"La suspensión de un estudiante como medida de protección puede durar todo lo que dure la investigación.","v":false,"e":"No puede pasar de 15 días hábiles; si vence el plazo, se adoptan otras medidas.","s":[["l21809","art. 16 E letra j LGE"]]},
  {"id":"r96","m":"viol","tipo":"vf","a":"Si una agresión tiene motivación discriminatoria, deben aplicarse medidas formativas de igualdad y no discriminación.","v":true,"e":"Lo exige el art. 16 B de la LGE incorporado por la Ley 21.809.","s":[["l21809","art. 16 B LGE"]]},
  {"id":"r97","m":"viol","tipo":"vf","a":"En el acoso escolar los testigos no tienen ningún papel.","v":false,"e":"Los testigos pueden reforzar al agresor, no intervenir o ayudar a la víctima.","s":[["viol_cart10"],["viol_ciber"]]},
  {"id":"r98","m":"viol","tipo":"vf","a":"La Ley 20.609 incluye la apariencia personal entre los motivos de discriminación arbitraria.","v":true,"e":"Su art. 2 menciona, entre otros, la apariencia personal, la nacionalidad y la discapacidad.","s":[["l20609","art. 2"]]},
  {"id":"r99","m":"viol","tipo":"orden","t":"Ordena los pasos ante un episodio de violencia entre estudiantes.","pasos":["Detener la situación de forma directa, con apoyo de otros adultos","Proteger a las personas afectadas","Acoger a la víctima y explicarle el procedimiento","Informar a los apoderados de cada parte por separado","Registrar por escrito lo conversado con cada involucrado","Derivar y denunciar según corresponda"],"e":"Primero se detiene y protege; luego se acoge, se informa, se registra y se activa la red que corresponda.","s":[["viol_cart10"]]},
  {"id":"r100","m":"viol","tipo":"orden","t":"Ordena la respuesta ante un posible acoso por redes sociales.","pasos":["Escuchar y acoger al estudiante afectado","Registrar por escrito los hechos y dónde ocurren, sin reenviar contenido","Reportar al equipo directivo o a quien indique el reglamento","Activar el protocolo de acoso escolar","Aplicar medidas de protección y formativas","Hacer seguimiento del caso con el equipo de convivencia"],"e":"El deber de reportar y el protocolo vienen después de acoger y registrar; el seguimiento cierra el ciclo.","s":[["l21809","arts. 16 B y 16 E LGE"],["viol_cart10"]]},
  {"id":"r101","m":"seg","tipo":"vf","a":"Según el manual PISE, en un sismo la alarma es el propio movimiento.","v":true,"e":"El manual dice que en un sismo «la alarma será el mismo evento».","s":[["seg_pise25","p. 34"]]},
  {"id":"r102","m":"seg","tipo":"vf","a":"El simulacro es un ejercicio de escritorio que se hace en una sala con situaciones ficticias.","v":false,"e":"Eso es la simulación. El simulacro se hace en terreno y representa todos los pasos reales.","s":[["seg_pise25","p. 38"]]},
  {"id":"r103","m":"seg","tipo":"vf","a":"Al evacuar un edificio después de un sismo, conviene usar el ascensor para salir más rápido.","v":false,"e":"SENAPRED indica evacuar por la escalera de emergencia y no usar ascensores.","s":[["seg_senapred_sismo"]]},
  {"id":"r104","m":"seg","tipo":"vf","a":"El manual PISE recomienda una alarma audible que no dependa de la electricidad, como campanas, silbatos o megáfonos.","v":true,"e":"Así la alarma funciona aunque se corte la luz.","s":[["seg_pise25","p. 35"]]},
  {"id":"r105","m":"seg","tipo":"vf","a":"El jefe del establecimiento debe denunciar el accidente escolar tan pronto como sepa que ocurrió.","v":true,"e":"Lo exige el art. 11 del DS 313. Si no lo hace en 24 horas, puede hacerlo el accidentado o su representante.","s":[["ds313","art. 11"]]},
  {"id":"r106","m":"seg","tipo":"vf","a":"El PISE no necesita considerar a estudiantes con discapacidad o TEA, porque siguen el mismo protocolo que todos.","v":false,"e":"El PISE debe identificarlos y contemplar protocolos inclusivos, alarma accesible y anticipación.","s":[["seg_pise25","pp. 17, 20 y 37"]]},
  {"id":"r107","m":"seg","tipo":"vf","a":"En el ejercicio de incendio del manual PISE, si hay humo se avanza a gatas por las vías de escape señaladas.","v":true,"e":"El manual lo indica en su ejemplo de simulacro dentro del aula.","s":[["seg_pise25","p. 38"]]},
  {"id":"r108","m":"seg","tipo":"vf","a":"AIDEP se usa para responder durante la emergencia y ACCEDER para diagnosticar los riesgos.","v":false,"e":"Es al revés: AIDEP sirve para el diagnóstico y el mapa de riesgos, y ACCEDER para la respuesta.","s":[["seg_pise25","pp. 23 y 33"]]},
  {"id":"r109","m":"seg","tipo":"orden","t":"Ordena las etapas de la metodología AIDEP.","pasos":["Análisis histórico de emergencias pasadas","Investigación en terreno","Discusión de prioridades","Elaboración del mapa de riesgos","Planificación del programa y los protocolos de respuesta"],"e":"Primero se mira lo ocurrido antes y se recorre el lugar. Luego se prioriza, se dibuja el mapa y al final se planifica.","s":[["seg_pise25","pp. 23-30"]]},
  {"id":"r110","m":"seg","tipo":"orden","t":"Ordena la respuesta ante un posible incendio en la sala, según el ejercicio del manual PISE.","pasos":["Atender la alerta, por ejemplo un olor a quemado, y verificar su origen","Dar la alarma según el protocolo","Comprobar si la puerta está caliente y buscar una salida alterna si hace falta","Salir en orden por la vía de escape, a gatas si hay humo","Llegar a la zona segura establecida"],"e":"La alerta se verifica y, si se confirma, la alarma activa la respuesta. Luego se sale con seguridad hasta la zona segura.","s":[["seg_pise25","pp. 34 y 38"]]},
  {"id":"r111","m":"aux","tipo":"vf","a":"En primeros auxilios no se deben administrar medicamentos.","v":true,"e":"La guía lo dice expresamente: «No administre medicamentos».","s":[["aux_cruzroja"]]},
  {"id":"r112","m":"aux","tipo":"vf","a":"Si un estudiante inconsciente recupera el conocimiento, ya no es necesario llamar al 131.","v":false,"e":"Chile Crece Contigo indica pedir la ambulancia aunque recobre el conocimiento.","s":[["aux_chcc_urg"]]},
  {"id":"r113","m":"aux","tipo":"vf","a":"Ante una convulsión hay que sujetar firmemente a la persona para que no se mueva.","v":false,"e":"No se inmoviliza a la fuerza: se protege la cabeza y se retiran objetos.","s":[["aux_cruzroja"]]},
  {"id":"r114","m":"aux","tipo":"vf","a":"Una quemadura se enfría con agua a temperatura ambiente, sin hielo directo ni cremas.","v":true,"e":"Se riega con agua 10 a 20 minutos y se cubre con apósito limpio.","s":[["aux_cruzroja"]]},
  {"id":"r115","m":"aux","tipo":"vf","a":"Si hay un objeto incrustado en una herida, conviene sacarlo para limpiar bien.","v":false,"e":"No se retira: se inmoviliza con un vendaje y se busca atención.","s":[["aux_cruzroja"]]},
  {"id":"r116","m":"aux","tipo":"vf","a":"Al llamar al 131 conviene no cortar, porque el profesional que atiende puede guiar lo que debes hacer.","v":true,"e":"Minsal recomienda mantener la llamada y seguir sus indicaciones.","s":[["aux_samu131"]]},
  {"id":"r117","m":"aux","tipo":"vf","a":"Carabineros responde al número 132.","v":false,"e":"Carabineros es el 133; el 132 es Bomberos.","s":[["aux_cruzroja"]]},
  {"id":"r118","m":"aux","tipo":"vf","a":"Si un estudiante atragantado tose con fuerza, se le anima a seguir tosiendo y se pide ayuda.","v":true,"e":"Si tose o emite sonidos, la obstrucción es parcial.","s":[["aux_cruzroja"]]},
  {"id":"r119","m":"aux","tipo":"orden","t":"Ordena los pasos ante un estudiante que no responde.","pasos":["Revisar que la escena sea segura","Comprobar si responde, moviéndolo suavemente y hablándole","Observar 3 a 5 segundos si respira","Pedir que alguien llame al 131 y traiga el DEA","Si respira, ponerlo de lado y vigilarlo sin dejarlo solo"],"e":"Primero tu seguridad, luego conciencia y respiración, después la ayuda y la vigilancia.","s":[["aux_cruzroja"],["aux_chcc_urg"]]},
  {"id":"r120","m":"aux","tipo":"orden","t":"Ordena la actuación ante una crisis convulsiva.","pasos":["Pedir que alguien llame al 131 y fijarse en la hora de inicio","Retirar objetos cercanos y proteger la cabeza","Poner a la persona de costado cuando sea posible","Alejar a los curiosos y cuidar su dignidad","Quedarse a su lado hasta que llegue la ayuda"],"e":"Se activa la ayuda y se cuenta la duración, se evita que se golpee y se le acompaña sin sujetarla.","s":[["aux_cruzroja"]]},
  {"id":"r121","m":"sm","tipo":"vf","a":"Preguntar a alguien si piensa en suicidarse puede darle la idea.","v":false,"e":"Minsal lo describe como un mito: preguntar no induce una idea que la persona no haya pensado.","s":[["sm_suic","p. 15"]]},
  {"id":"r122","m":"sm","tipo":"vf","a":"La mayoría de las personas que mueren por suicidio había advertido de alguna forma su intención.","v":true,"e":"Minsal desmiente el mito de que «quien realmente se quiere suicidar no lo dice».","s":[["sm_suic","p. 15"]]},
  {"id":"r123","m":"sm","tipo":"vf","a":"El inspector/a puede diagnosticar una depresión si conoce bien al estudiante.","v":false,"e":"El personal educativo detecta, acoge y deriva; el diagnóstico lo hace la red de salud.","s":[["sm_c3"],["sm_c1"]]},
  {"id":"r124","m":"sm","tipo":"vf","a":"La línea *4141 atiende las 24 horas, todos los días, y es gratuita.","v":true,"e":"Así lo informa Minsal; la atienden psicólogos y se marca desde celulares de cualquier compañía.","s":[["sm_4141"]]},
  {"id":"r125","m":"sm","tipo":"vf","a":"Quejarse seguido de dolor de estómago o de cabeza sin causa médica puede ser una señal de alerta en niños pequeños.","v":true,"e":"Figura en la tabla de señales de alerta de la Cartilla 3.","s":[["sm_c3","tabla 1, p. 9"]]},
  {"id":"r126","m":"sm","tipo":"vf","a":"Si un estudiante pide reserva, la confidencialidad se mantiene incluso si hay riesgo vital.","v":false,"e":"La confidencialidad tiene límites ante riesgo vital o de daño para sí mismo o para terceros.","s":[["sm_c3"]]},
  {"id":"r127","m":"sm","tipo":"vf","a":"Ante un niño en plena pataleta, Chile Crece Contigo recomienda dejarlo solo en «tiempo fuera».","v":false,"e":"Dejarlo solo con esa intensidad emocional no ayuda; necesita un adulto calmado que lo acompañe.","s":[["sm_ccpat"],["sm_ccrabia"]]},
  {"id":"r128","m":"sm","tipo":"vf","a":"En la red pública, la derivación a salud mental comienza cuando el apoderado pide hora en el CESFAM que le corresponde por domicilio.","v":true,"e":"La Cartilla 3 indica pedir hora en el SOME del CESFAM correspondiente.","s":[["sm_c3","p. 12"]]},
  {"id":"r129","m":"sm","tipo":"orden","t":"Ordena los pasos que propone Minsal ante señales de alerta de riesgo suicida.","pasos":["Mostrar interés y apoyo en un espacio privado","Hacer las preguntas adecuadas y evaluar el riesgo","Apoyar, contactar y derivar","Hacer seguimiento"],"e":"Primero se crea confianza, luego se evalúa el riesgo para decidir a quién contactar, y al final se verifica que el estudiante recibió atención. Si no estás capacitado para evaluar, acoge e informa de inmediato al equipo responsable.","s":[["sm_suic","pp. 34 a 40"]]},
  {"id":"r130","m":"sm","tipo":"orden","t":"Ordena el proceso de derivación a salud mental según la Cartilla 3.","pasos":["Pasada la crisis, el equipo decide la derivación con la familia y, si corresponde, con el estudiante","Se entrega la ficha de derivación al apoderado, idealmente en una reunión","El apoderado pide hora en el SOME del CESFAM de su domicilio","El equipo de salud evalúa si se necesita confirmación diagnóstica o atención de especialidad","Un referente de salud mantiene la comunicación con el colegio"],"e":"La derivación se decide en conjunto, la familia la activa en la red de salud y luego salud y colegio coordinan el seguimiento.","s":[["sm_c3","pp. 12 y 13"]]},
  {"id":"r131","m":"parv","tipo":"vf","a":"Las pataletas entre los 2 y 4 años son frecuentes y esperables.","v":true,"e":"Chile Crece Contigo las describe como normales y esperables en esa etapa.","s":[["parv_chcc_pat"]]},
  {"id":"r132","m":"parv","tipo":"vf","a":"En educación parvularia se puede aplicar una medida disciplinaria a un párvulo que muerde.","v":false,"e":"La convivencia entre párvulos no da lugar a medidas disciplinarias.","s":[["parv_ori_ri","p. 22"]]},
  {"id":"r133","m":"parv","tipo":"vf","a":"Los niveles de las Bases Curriculares son plazos rígidos que cada niño debe cumplir.","v":false,"e":"Son una referencia que orienta y se aplica con flexibilidad.","s":[["parv_bcep","p. 43"]]},
  {"id":"r134","m":"parv","tipo":"vf","a":"El «tiempo fuera» y dejar al niño solo a pensar le ayudan a manejar sus emociones.","v":false,"e":"Chile Crece Contigo recomienda evitarlos y acompañar.","s":[["parv_chcc_pat"]]},
  {"id":"r135","m":"parv","tipo":"vf","a":"Un objeto de apego puede dar seguridad a un niño o niña en sus primeros días de jardín.","v":true,"e":"Subsecretaría de Educación Parvularia y JUNJI lo recomiendan.","s":[["parv_famil26"],["parv_junji_ing"]]},
  {"id":"r136","m":"parv","tipo":"vf","a":"El reglamento interno de un jardín debe incluir un protocolo de actuación ante accidentes de niños y niñas.","v":true,"e":"Es contenido mínimo, dentro del plan de seguridad.","s":[["parv_ori_ri","p. 19"]]},
  {"id":"r137","m":"parv","tipo":"vf","a":"El paso de educación parvularia a 1° básico no requiere acompañamiento.","v":false,"e":"Es una transición clave; el nivel Transición busca favorecer el paso a la educación básica.","s":[["parv_trans","p. 4"],["parv_bcep","p. 42"]]},
  {"id":"r138","m":"parv","tipo":"vf","a":"Según las Bases Curriculares, el juego es un concepto central en educación parvularia.","v":true,"e":"Es actividad natural y estrategia pedagógica.","s":[["parv_bcep","p. 32"]]},
  {"id":"r139","m":"parv","tipo":"orden","t":"Ordena la respuesta ante la pataleta de un niño de 3 años.","pasos":["Cuidar que no se haga daño y mantener la calma","Acompañarlo con cercanía, con un abrazo o una distracción","Nombrar la emoción y ofrecerle una alternativa","Reconocer su esfuerzo cuando logra calmarse","Conversar después sobre lo ocurrido y otras formas de reaccionar"],"e":"Primero seguridad y calma; las explicaciones largas se dejan para cuando ya pasó.","s":[["parv_chcc_pat"],["parv_chcc_2a3"]]},
  {"id":"r140","m":"parv","tipo":"orden","t":"Ordena la actuación ante un accidente de un párvulo.","pasos":["Atender al niño o niña sin moverlo si hay riesgo de lesión","Avisar a la educadora responsable","Decidir la derivación a un centro asistencial según el protocolo","Avisar a la familia con los contactos de emergencia","Registrar lo ocurrido"],"e":"Primero la atención; luego el protocolo define derivación y aviso a la familia, y se deja registro.","s":[["parv_ori_ri","pp. 19-20"],["parv_chcc_pa"]]},
  {"id":"r141","m":"asis","tipo":"vf","a":"Ausentismo crónico es faltar el 10% o más de los días del año.","v":true,"e":"Así lo define la ficha IDPS de asistencia.","s":[["asis_idps_gestion","p. 2"]]},
  {"id":"r142","m":"asis","tipo":"vf","a":"Las ausencias con certificado médico no cuentan como inasistencia.","v":false,"e":"Toda ausencia cuenta, justificada o no.","s":[["asis_idps_gestion","p. 4"]]},
  {"id":"r143","m":"asis","tipo":"vf","a":"La deserción escolar suele ser el final de un proceso gradual de desvinculación.","v":true,"e":"Por eso importa detectar las señales temprano.","s":[["asis_cdc"]]},
  {"id":"r144","m":"asis","tipo":"vf","a":"Las suspensiones y las normas rígidas pueden aumentar la probabilidad de abandono escolar.","v":true,"e":"Son factores de riesgo del establecimiento.","s":[["asis_ret20","pp. 15-16"]]},
  {"id":"r145","m":"asis","tipo":"vf","a":"Los Equipos Territoriales de Revinculación solo trabajan con colegios particulares pagados.","v":false,"e":"Trabajan con establecimientos municipales, SLEP, particulares subvencionados y de administración delegada.","s":[["asis_equipos23"]]},
  {"id":"r146","m":"asis","tipo":"vf","a":"La nómina de estudiantes con ausentismo crónico se publica en el diario mural para motivar al curso.","v":false,"e":"Es una nómina confidencial para los profesores jefes.","s":[["asis_idps_gestion","p. 6"]]},
  {"id":"r147","m":"asis","tipo":"vf","a":"Se recomienda repetir cada mes el análisis de asistencia.","v":true,"e":"Así se ven las variaciones y se ajustan las estrategias.","s":[["asis_idps_gestion","p. 5"]]},
  {"id":"r148","m":"asis","tipo":"vf","a":"Con los apoderados conviene presentar la asistencia como una norma que se cumple sin más explicación.","v":false,"e":"La ficha IDPS pide mostrar su relevancia y no presentarla como norma arbitraria.","s":[["asis_idps_consejo"]]},
  {"id":"r149","m":"asis","tipo":"orden","t":"Ordena el seguimiento de un estudiante con inasistencia reiterada.","pasos":["Detectar la inasistencia en el registro y calcular su asistencia acumulada","Informar al profesor jefe y al equipo","Contactar al apoderado para conocer las causas","Derivar las barreras detectadas al equipo de apoyo o dirección","Hacer seguimiento mensual y ajustar el plan"],"e":"Primero se detecta con datos, luego se comparte, se buscan causas, se deriva y se monitorea.","s":[["asis_idps_gestion"],["asis_ret20","pp. 32 y 46"]]},
  {"id":"r150","m":"asis","tipo":"orden","t":"Ordena las etapas que propone Mineduc para promover la retención escolar.","pasos":["Organización y preparación","Análisis de la comunidad y definición de lineamientos","Diseño o actualización de iniciativas","Implementación y monitoreo","Evaluación"],"e":"Se arma el equipo, se analiza, se diseña, se ejecuta con monitoreo y al cierre se evalúa.","s":[["asis_ret20","pp. 24-25"]]},
  {"id":"r151","m":"adm","tipo":"vf","a":"El software del libro de clases digital debe registrar también las eliminaciones de datos.","v":true,"e":"Debe generar registros de todas las acciones, incluidas modificaciones y eliminaciones.","s":[["adm_ede"]]},
  {"id":"r152","m":"adm","tipo":"vf","a":"En el libro de clases digital los docentes firman escaneando su firma manuscrita.","v":false,"e":"Se usa un verificador de identidad con un código dinámico personal.","s":[["adm_ede"]]},
  {"id":"r153","m":"adm","tipo":"vf","a":"Mineduc lleva un registro oficial de libros digitales aprobados y recomienda marcas.","v":false,"e":"Cada colegio elige su software; Mineduc no lleva un registro ni respalda productos.","s":[["adm_ede"]]},
  {"id":"r154","m":"adm","tipo":"vf","a":"Las anotaciones de convivencia por estudiante son parte del contenido mínimo del libro de clases.","v":true,"e":"Se incluyen entre los registros exigidos, igual que en el libro de papel.","s":[["adm_ede"]]},
  {"id":"r155","m":"adm","tipo":"vf","a":"En octubre de 2026 la Ley 21.719 ya está plenamente vigente.","v":false,"e":"Rige desde el 1 de diciembre de 2026; antes de esa fecha se aplica la Ley 19.628 sin esas modificaciones.","s":[["l21719","art. 1° transitorio"]]},
  {"id":"r156","m":"adm","tipo":"vf","a":"La obligación de guardar secreto sobre datos personales alcanza a quienes trabajan en organismos públicos y privados.","v":true,"e":"La Ley 19.628 obliga a ambos.","s":[["l19628","art. 7"]]},
  {"id":"r157","m":"adm","tipo":"vf","a":"Al recibir el reglamento interno en la matrícula, debe quedar constancia de su recepción.","v":true,"e":"Lo exige el nuevo art. 16 G de la LGE.","s":[["l21809","art. 16 G LGE"]]},
  {"id":"r158","m":"adm","tipo":"vf","a":"Una revisión excepcional de pertenencias en privado puede hacerse sin acta si no se encontró nada.","v":false,"e":"Siempre se levanta un acta escrita y firmada, con copia al estudiante y al apoderado.","s":[["l21827","art. 16 J LGE"]]},
  {"id":"r159","m":"adm","tipo":"orden","t":"Ordena los pasos para dejar constancia de un incidente.","pasos":["Atender primero la seguridad de las personas","Anotar fecha, hora y lugar","Identificar a las personas involucradas y testigos","Describir lo observado y lo dicho con sus palabras, sin opiniones","Entregar el registro por la vía formal a quien indique el reglamento interno"],"e":"Primero se protege; luego se registra con hechos y se canaliza formalmente para el procedimiento.","s":[["l21809","art. 16 E LGE"],["adm_crit","p. 27"]]},
  {"id":"r160","m":"adm","tipo":"orden","t":"Ordena los pasos ante una solicitud de información sobre un estudiante.","pasos":["Verificar quién pide la información y para qué","Confirmar si es el apoderado de ese estudiante o tiene derecho a recibirla","Entregar solo lo necesario para ese fin, por canal formal","Si no corresponde, explicar la negativa con respeto y orientar al conducto formal"],"e":"Los datos se usan solo para su finalidad y quien los maneja debe guardar secreto.","s":[["l19628","arts. 7 y 9"]]},
  {"id":"r161","m":"com","tipo":"vf","a":"Los apoderados tienen derecho a ser escuchados y a participar en el proceso educativo de sus hijos.","v":true,"e":"Lo reconoce el art. 10 letra b) de la LGE.","s":[["lge","art. 10 letra b)"]]},
  {"id":"r162","m":"com","tipo":"vf","a":"Escuchar activamente significa preparar tu respuesta mientras el otro habla.","v":false,"e":"Es poner atención a lo que el otro quiere comunicar, parafrasear y reflejar su emoción.","s":[["com_crit","p. 10"]]},
  {"id":"r163","m":"com","tipo":"vf","a":"La Ley 21.827 permite suspender el ingreso de apoderados que agredan de forma digital a un funcionario.","v":true,"e":"Incluye agresiones físicas, verbales o digitales, según el procedimiento del reglamento interno.","s":[["l21827","art. 7"]]},
  {"id":"r164","m":"com","tipo":"vf","a":"Suspender el ingreso de un apoderado agresor implica que su hijo deja de asistir a clases.","v":false,"e":"La medida debe resguardar el derecho a la educación del estudiante.","s":[["l21827","art. 7"]]},
  {"id":"r165","m":"com","tipo":"vf","a":"Con un apoderado se puede comentar la situación disciplinaria de otros estudiantes si ayuda a aclarar los hechos.","v":false,"e":"Es información reservada: quien trabaja con datos personales debe guardar secreto.","s":[["l19628","art. 7"]]},
  {"id":"r166","m":"com","tipo":"vf","a":"Las políticas del colegio deben aspirar a convocar e incluir a todas las familias por igual.","v":true,"e":"Es una de las ideas centrales de la Agencia de Calidad.","s":[["com_agencia"]]},
  {"id":"r167","m":"com","tipo":"vf","a":"Un apoderado puede excusarse de una citación formal solo por causa justificada y acreditada.","v":true,"e":"Así lo establece el art. 8 bis del Estatuto Docente.","s":[["estatuto","art. 8 bis"]]},
  {"id":"r168","m":"com","tipo":"vf","a":"La política Mineduc de participación de las familias considera a la familia como única responsable de la formación.","v":false,"e":"Uno de sus principios es la corresponsabilidad entre familia y escuela.","s":[["com_polfam"]]},
  {"id":"r169","m":"com","tipo":"orden","t":"Ordena los pasos de una entrevista con un apoderado.","pasos":["Recibirlo en un lugar reservado y presentarte","Escucharlo sin interrumpir","Parafrasear y confirmar lo que entendiste","Explicar qué harás y por qué vía formal seguirá el caso","Registrar la entrevista y los acuerdos"],"e":"Primero se escucha y comprende; luego se orienta y se deja constancia para el seguimiento.","s":[["com_crit","p. 10"],["com_agencia"]]},
  {"id":"r170","m":"com","tipo":"orden","t":"Ordena los pasos ante un apoderado que agrede verbalmente a un funcionario.","pasos":["Mantener la calma y pedir apoyo a otro adulto","Alejar a los estudiantes del lugar","Ofrecer el conducto formal para su reclamo","Registrar los hechos con precisión","Reportar a dirección para aplicar el protocolo del reglamento interno"],"e":"Primero se protege a las personas; luego se canaliza el reclamo y se activa el protocolo por violencia en el trabajo.","s":[["com_crit","p. 18"],["l21809","arts. 16 A y 16 B LGE"]]},
  {"id":"r171","m":"lid","tipo":"vf","a":"En la educación municipal, el director tiene la atribución de designar y remover al inspector general.","v":true,"e":"Lo establece el art. 7 bis del Estatuto Docente.","s":[["estatuto","art. 7 bis"]]},
  {"id":"r172","m":"lid","tipo":"vf","a":"La Ley 21.109 rige a los asistentes de la educación de colegios particulares subvencionados.","v":false,"e":"Regula a los asistentes de los establecimientos de los Servicios Locales de Educación Pública.","s":[["l21109","art. 1"]]},
  {"id":"r173","m":"lid","tipo":"vf","a":"El Plan de gestión de convivencia lo elabora el equipo o el coordinador de convivencia y lo aprueba el director.","v":true,"e":"Así lo dispone el nuevo art. 16 D de la LGE.","s":[["l21809","art. 16 D LGE"]]},
  {"id":"r174","m":"lid","tipo":"vf","a":"Una denuncia verbal por Ley Karin no tiene validez.","v":false,"e":"Se puede denunciar verbalmente; se levanta un acta firmada y se entrega copia.","s":[["l21643","art. 211-B bis Código del Trabajo"]]},
  {"id":"r175","m":"lid","tipo":"vf","a":"La investigación interna por Ley Karin debe concluir en un plazo de 30 días.","v":true,"e":"La ley fija ese plazo.","s":[["l21643","art. 211-C Código del Trabajo"]]},
  {"id":"r176","m":"lid","tipo":"vf","a":"Los asistentes de la educación pública no tienen derecho a capacitación.","v":false,"e":"La Ley 21.109 establece que participan en actividades formativas.","s":[["l21109","art. 13"]]},
  {"id":"r177","m":"lid","tipo":"vf","a":"Los equipos directivos deben promover el desarrollo profesional de los docentes.","v":true,"e":"Es un deber del art. 10 letra e) de la LGE.","s":[["lge","art. 10 letra e)"]]},
  {"id":"r178","m":"lid","tipo":"vf","a":"La Ley 21.827 exige reportar cada semestre el número de revisiones de mochilas realizadas.","v":true,"e":"Es un dato de gestión que luego permite evaluar la efectividad de la medida.","s":[["l21827","art. 16 J LGE"]]},
  {"id":"r179","m":"lid","tipo":"orden","t":"Ordena los pasos ante una denuncia de acoso laboral en el equipo.","pasos":["Escuchar a la persona en privado y orientarla sobre la denuncia","Recibir la denuncia escrita o verbal, con acta firmada","Adoptar de inmediato medidas de resguardo","Investigar con reserva, oyendo a ambas partes, en 30 días","Aplicar medidas y comunicar el resultado dentro de 15 días"],"e":"Es la secuencia que fija la Ley Karin: proteger primero, investigar con debido proceso y resolver en plazo.","s":[["l21643","arts. 211-B a 211-E Código del Trabajo"]]},
  {"id":"r180","m":"lid","tipo":"orden","t":"Ordena los pasos para mejorar la gestión de inspectoría tras un incidente complejo.","pasos":["Documentar todos los antecedentes del incidente","Revisar qué funcionó y qué falló en los roles y turnos","Ajustar el protocolo y la asignación de roles con subrogantes","Dar seguimiento a las personas afectadas","Comunicar los cambios al equipo"],"e":"Documentar y revisar permite ajustar el protocolo y cuidar a los afectados, en una lógica de mejora continua.","s":[["lid_crit","pp. 11, 26-27"]]},
  {"id":"r181","m":"div","tipo":"vf","a":"Un niño extranjero puede matricularse aunque su familia esté en situación migratoria irregular.","v":true,"e":"La Ley 21.325 prohíbe negar o limitar ese derecho por la condición migratoria.","s":[["l21325","art. 17"]]},
  {"id":"r182","m":"div","tipo":"vf","a":"El IPE solo puede pedirse si el niño tiene pasaporte vigente.","v":false,"e":"ChileAtiende indica que, si el menor no tiene documento, igual puede solicitar el IPE.","s":[["div_ipe"]]},
  {"id":"r183","m":"div","tipo":"vf","a":"La Ley 20.609 incluye la nacionalidad y el idioma entre los motivos de discriminación arbitraria.","v":true,"e":"Ambos aparecen en la lista del artículo 2.","s":[["l20609","art. 2"]]},
  {"id":"r184","m":"div","tipo":"vf","a":"Ignorar deliberadamente y de forma reiterada a un estudiante nunca es acoso escolar.","v":false,"e":"La LGE lo incluye expresamente como forma de acoso escolar.","s":[["lge","art. 16 B"]]},
  {"id":"r185","m":"div","tipo":"vf","a":"La Ley 19.253 reconoce al pueblo Selk'nam entre los pueblos indígenas de Chile.","v":true,"e":"El artículo 1 lo menciona en su texto vigente.","s":[["l19253","art. 1"]]},

<script>
