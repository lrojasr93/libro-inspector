<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Libro del Inspector</title>
<meta name="theme-color" content="#2346A0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inspector">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: app de una columna pensada para celular (máx. 560px), barra superior con racha y puntos, navegación inferior fija */
:root {
  --bg: #F3F5FA;
  --surface: #FFFFFF;
  --surface-2: #E9EDF6;
  --ink: #141B2E;
  --muted: #5A6480;
  --line: #D6DCEA;
  --primary: #2346A0;
  --primary-press: #172F70;
  --on-primary: #FFFFFF;
  --copper: #B4531C;
  --copper-soft: #FBE6D6;
  --gold: #E3A21A;
  --gold-soft: #FDF1D2;
  --good: #1E8A4C;
  --good-press: #146536;
  --good-soft: #DCF3E5;
  --bad: #C73A3A;
  --bad-soft: #FBE1E1;
  --mid: #9A6A00;
  --mid-soft: #FBF0D4;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1322; --surface: #172036; --surface-2: #212C47; --ink: #EAF0FF; --muted: #A2AEC9; --line: #2D3A5A;
    --primary: #7FA2FF; --primary-press: #5579D9; --on-primary: #0B1430; --copper: #F09A62; --copper-soft: #3D2516;
    --gold: #F5C04F; --gold-soft: #3A2E10; --good: #5BD58F; --good-press: #2FA864; --good-soft: #143326;
    --bad: #FF8C8C; --bad-soft: #3E1A1F; --mid: #F2C14E; --mid-soft: #3A2E12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1322; --surface: #172036; --surface-2: #212C47; --ink: #EAF0FF; --muted: #A2AEC9; --line: #2D3A5A;
  --primary: #7FA2FF; --primary-press: #5579D9; --on-primary: #0B1430; --copper: #F09A62; --copper-soft: #3D2516;
  --gold: #F5C04F; --gold-soft: #3A2E10; --good: #5BD58F; --good-press: #2FA864; --good-soft: #143326;
  --bad: #FF8C8C; --bad-soft: #3E1A1F; --mid: #F2C14E; --mid-soft: #3A2E12;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--primary); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 560px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; color: var(--primary); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-weight: 800; font-variant-numeric: tabular-nums; font-size: 0.95rem; padding: 4px 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); }
.pill svg { width: 18px; height: 18px; }
.pill.fire { color: var(--copper); }
.pill.fire.off { color: var(--muted); }
.pill.xp { color: var(--gold); }
.pill.xp b { color: var(--ink); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-weight: 800; border: 0; flex: none; }

main { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 18px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.nav button { border: 0; background: none; padding: 8px 2px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.72rem; font-weight: 800; color: var(--muted); }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--primary); }

.eyebrow { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 800; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }

/* botones con relieve, al estilo de apps de microaprendizaje */
.btn { border: 0; border-radius: 14px; padding: 13px 18px; font-weight: 800; font-size: 1rem; background: var(--surface); color: var(--ink); box-shadow: 0 3px 0 var(--line), inset 0 0 0 2px var(--line); transition: transform .08s; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line), inset 0 0 0 2px var(--line); }
.btn.primary { background: var(--primary); color: var(--on-primary); box-shadow: 0 4px 0 var(--primary-press); }
.btn.primary:active { box-shadow: 0 2px 0 var(--primary-press); }
.btn.good { background: var(--good); color: var(--surface); box-shadow: 0 4px 0 var(--good-press); }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: default; transform: none; }
.link { background: none; border: 0; padding: 0; color: var(--primary); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }

/* hero del día */
.hero { background: var(--primary); color: var(--on-primary); border-radius: 22px; padding: 18px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.hero h2 { font-size: 1.45rem; }
.hero p { opacity: 0.9; font-size: 0.95rem; }
.ring { width: 84px; height: 84px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .lbl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-weight: 800; font-size: 0.85rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.72rem; font-weight: 800; color: var(--muted); }
.day i { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-style: normal; color: var(--muted); }
.day.done i { background: var(--copper); color: var(--surface); }
.day.today b { color: var(--ink); }

.challenge { background: var(--gold-soft); border: 2px solid var(--gold); border-radius: var(--r); padding: 16px; display: flex; gap: 14px; align-items: center; }
.challenge .medal { width: 54px; height: 54px; flex: none; border-radius: 50%; background: var(--gold); display: grid; place-items: center; color: var(--surface); }
.challenge .medal svg { width: 30px; height: 30px; }
.challenge h3 { font-size: 1.1rem; }
.challenge > div:nth-child(2) { flex: 1; min-width: 0; }

.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile { text-align: left; border: 0; background: var(--surface); border-radius: var(--r); padding: 14px; box-shadow: 0 3px 0 var(--line), inset 0 0 0 2px var(--line); display: flex; flex-direction: column; gap: 4px; }
.tile:active { transform: translateY(2px); }
.tile .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 4px; }
.tile .ic svg { width: 24px; height: 24px; }
.tile h3 { font-size: 1.02rem; }
.tile p { font-size: 0.82rem; color: var(--muted); }

.modules { display: flex; flex-direction: column; gap: 8px; }
.mod { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; text-align: left; }
.mod .mi { width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2); color: var(--primary); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; }
.mod h3 { font-family: var(--font-body); font-size: 0.98rem; font-weight: 800; }
.mod > div { min-width: 0; }
.mod .pct { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.9rem; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--good); border-radius: 99px; transition: width .4s; }
.bar.xpbar i { background: var(--gold); }

.mod .rk { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.mod .rk small { font-size: 0.7rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.seal { display: inline-flex; align-items: center; gap: 4px; background: var(--gold-soft); color: var(--ink); border: 1.5px solid var(--gold); border-radius: 99px; padding: 2px 8px; font-size: 0.72rem; font-weight: 800; }
.seal svg { width: 13px; height: 13px; color: var(--gold); }
.know { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.know .ring .lbl { color: var(--ink); font-size: 1rem; }
.ranks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 6px; }
.ranks span { font-size: 0.68rem; font-weight: 800; text-align: center; padding: 4px 0; border-radius: 8px; background: var(--surface-2); color: var(--muted); }
.ranks span.on { background: var(--good); color: var(--surface); }
.brk { display: grid; gap: 10px; }
.brk > div { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; font-size: 0.92rem; }
.brk .bar { grid-column: 1 / -1; margin-top: 0; }
.evo { display: flex; align-items: flex-end; gap: 6px; height: 90px; padding-top: 6px; }
.evo div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; font-size: 0.66rem; font-weight: 800; color: var(--muted); }
.evo i { display: block; width: 100%; max-width: 28px; background: var(--good); border-radius: 6px 6px 2px 2px; min-height: 3px; }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.chip { flex: none; border: 2px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 99px; font-size: 0.85rem; font-weight: 800; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }

/* fichas */
.flash-wrap { perspective: 1400px; }
.flash { position: relative; width: 100%; border: 0; padding: 0; background: none; text-align: left; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.2,.7,.2,1); display: grid; }
.flash.flipped { transform: rotateY(180deg); }
.face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 12px; min-height: 340px; }
.front { background: var(--surface); box-shadow: 0 4px 0 var(--line), inset 0 0 0 2px var(--line); }
.back { background: var(--primary); color: var(--on-primary); transform: rotateY(180deg); }
.front h2 { font-size: clamp(1.4rem, 6vw, 1.8rem); margin-block: auto; }
.back p.ans { font-size: 1.04rem; margin-block: auto; }
.face .hint { font-size: 0.82rem; opacity: 0.75; font-weight: 700; }
.box-dots { display: flex; gap: 4px; }
.box-dots i { width: 18px; height: 6px; border-radius: 4px; background: var(--surface-2); }
.box-dots i.on { background: var(--good); }
.src { font-size: 0.8rem; line-height: 1.35; display: flex; flex-direction: column; gap: 3px; }
.src a { font-weight: 700; word-break: break-word; }
.back .src a { color: var(--on-primary); }
.src .lab { font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.7rem; opacity: 0.8; }

/* preguntas y casos */
.runner-top { display: flex; align-items: center; gap: 12px; }
.x { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; flex: none; }
.x svg { width: 18px; height: 18px; }
.progress { flex: 1; height: 14px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--good); border-radius: 99px; transition: width .35s; }
.qtitle { font-size: 1.3rem; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; border: 0; background: var(--surface); border-radius: 14px; padding: 14px; display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; box-shadow: 0 3px 0 var(--line), inset 0 0 0 2px var(--line); }
.opt .k { width: 30px; height: 30px; border-radius: 9px; background: var(--surface-2); display: grid; place-items: center; font-weight: 800; font-size: 0.85rem; }
.opt span:last-child { min-width: 0; }
.opt:disabled { cursor: default; }
.opt.is-good { background: var(--good-soft); box-shadow: 0 3px 0 var(--good), inset 0 0 0 2px var(--good); }
.opt.is-good .k { background: var(--good); color: var(--surface); }
.opt.is-bad { background: var(--bad-soft); box-shadow: 0 3px 0 var(--bad), inset 0 0 0 2px var(--bad); }
.opt.is-bad .k { background: var(--bad); color: var(--surface); }
.opt.is-mid { background: var(--mid-soft); box-shadow: 0 3px 0 var(--mid), inset 0 0 0 2px var(--mid); }
.opt.is-mid .k { background: var(--mid); color: var(--surface); }
.opt.dim { opacity: 0.5; }
.sheet { border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.sheet.good { background: var(--good-soft); }
.sheet.bad { background: var(--bad-soft); }
.sheet.mid { background: var(--mid-soft); }
.sheet h3 { font-size: 1.15rem; }
.sheet.good h3 { color: var(--good); } .sheet.bad h3 { color: var(--bad); } .sheet.mid h3 { color: var(--mid); }
.combo { font-weight: 800; color: var(--copper); font-size: 0.9rem; }
.scenario { background: var(--copper-soft); border-radius: 14px; padding: 14px 16px; }
.steplog { display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; }
.steplog div { display: flex; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; flex: none; }
.dot.p2 { background: var(--good); } .dot.p1 { background: var(--mid); } .dot.p0 { background: var(--bad); }
.big { font-family: var(--font-display); font-size: 3.2rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.result { text-align: center; align-items: center; }
.gain { display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.gain span { background: var(--gold-soft); color: var(--ink); border-radius: 99px; padding: 6px 12px; font-weight: 800; font-size: 0.9rem; }
.level { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.level.adv { background: var(--copper-soft); color: var(--copper); }
.missed div { border-top: 1px solid var(--line); padding-top: 10px; font-size: 0.92rem; display: flex; flex-direction: column; gap: 2px; }
.missed .ans { color: var(--good); font-weight: 700; }
ul.keys { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }

.cases { display: flex; flex-direction: column; gap: 10px; }
.case { text-align: left; border: 0; background: var(--surface); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 3px 0 var(--line), inset 0 0 0 2px var(--line); }
.case h3 { font-size: 1.08rem; }
.case p { color: var(--muted); font-size: 0.88rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.stars { color: var(--gold); font-weight: 800; letter-spacing: 2px; }

/* perfil */
.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 0.75rem; font-weight: 800; padding: 10px 4px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.badge .b { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
.badge .b svg { width: 26px; height: 26px; }
.badge.on .b { background: var(--gold); color: var(--surface); }
.badge:not(.on) { color: var(--muted); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 8px 12px; border-radius: 10px; font-weight: 800; font-size: 0.88rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.15); }
.account { display: flex; gap: 12px; align-items: center; }
.account .avatar { width: 48px; height: 48px; font-size: 1.2rem; }
.status { font-size: 0.82rem; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status.ok { color: var(--good); } .status.ok::before { background: var(--good); }
.status.warn { color: var(--mid); } .status.warn::before { background: var(--mid); }
.srcitem { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 2px; font-size: 0.92rem; }
.srcitem:first-child { border-top: 0; padding-top: 0; }
.note { background: var(--copper-soft); border-radius: 14px; padding: 12px 14px; font-size: 0.88rem; }

.toast { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-weight: 800; font-size: 0.92rem; box-shadow: 0 6px 20px rgb(0 0 0 / 0.25); max-width: calc(100% - 32px); text-align: center; animation: pop .25s ease-out; }
@keyframes pop { from { transform: translate(-50%, -8px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
#login { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
.login-in { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.fld { display: flex; flex-direction: column; gap: 6px; font-weight: 800; font-size: 0.92rem; }
.fld input { font: inherit; font-weight: 600; padding: 13px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; }
.fld input:focus { border-color: var(--primary); outline: none; }
.lerr { color: var(--bad); font-weight: 700; font-size: 0.9rem; min-height: 1.2em; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 25; width: 100%; height: 100%; }
@media (prefers-reduced-motion: reduce) {
  .flash, .bar i, .progress i, .btn { transition: none; }
  .toast { animation: none; }
}
</style>

</head>
<body>
<header class="top">
  <div class="top-in">
    <span class="brand">Libro del Inspector</span>
    <span class="pill fire" id="pStreak" title="Racha de días"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 3.5-1.5 5-1.5 7.5 0 1.4 1 2.5 2.3 2.5 1.6 0 2.4-1.3 2.2-3.2C17.6 10.6 19 13 19 15.5 19 19.6 15.9 22 12 22s-7-2.4-7-6.3C5 10.4 10.8 7.7 12 2Z"/></svg><span>0</span></span>
    <span class="pill xp" id="pXp" title="Puntos de experiencia"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg><b>0</b></span>
    <button class="avatar" id="pAvatar" aria-label="Mi perfil">?</button>
  </div>
</header>
<main id="app"></main>
<nav class="nav" aria-label="Secciones">

  c586:    { n: "Circular sobre párvulos y estudiantes con TEA, aprobada por Res. Ex. 586 de 2023 de la Superintendencia de Educación (texto íntegro en supereduc.cl)", org: "Diario Oficial", u: "https://www.diariooficial.interior.gob.cl/publicaciones/2024/01/04/43741/01/2431212.pdf" },

const MODULOS = [
  { id: "rol", nombre: "Rol y funciones", icon: "R", desc: "Qué hace un inspector, cómo registra y qué piden al postular." },
  { id: "norma", nombre: "Marco normativo", icon: "N", desc: "Leyes, circulares e instituciones del sistema escolar chileno." },

// s: [[fuente, detalle], ...]
const FICHAS = [
  { id: "f1", m: "rol", t: "¿Qué hace un inspector educacional?", r: "Apoya la convivencia y el funcionamiento diario del colegio o liceo: controla asistencia, atrasos y retiros, supervisa recreos, entrada y salida, atiende apoderados y da la primera respuesta ante incidentes, siguiendo el reglamento interno.", s: [["c482", "reglamento interno y protocolos"]] },
  { id: "f2", m: "rol", t: "Inspector general e inspector de patio", r: "El inspector general es docente directivo según el Estatuto Docente. El inspector de patio o paradocente es asistente de la educación: la Ley 19.464 define la paradocencia como labor «de nivel técnico, complementaria a la labor educativa».", s: [["estatuto"], ["l19464", "art. 2"]] },
  { id: "f3", m: "rol", t: "Requisitos para trabajar como paradocente", r: "La Ley 19.464 exige licencia de enseñanza media para la función de paradocencia y, cuando corresponda, un título de nivel técnico. Revisa siempre las bases de cada concurso o aviso.", s: [["l19464", "art. 2"]] },
  { id: "f4", m: "rol", t: "Inhabilidades para trabajar con niños", r: "La Ley 20.594 crea inhabilidades para trabajar con menores de edad para personas condenadas por delitos sexuales contra ellos, y un registro que los empleadores pueden consultar.", s: [["l20594"]] },
  { id: "f5", m: "rol", t: "Regla de oro del registro", r: "Registra hechos, no opiniones: fecha, hora, lugar, personas, lo que viste y lo que te dijeron con sus palabras. Un buen registro sostiene el debido proceso y la protección de los estudiantes.", s: [["c482", "debido proceso"]] },
  { id: "f6", m: "rol", t: "Deber de reportar", r: "Con la Ley 21.809, el personal y los adultos de la comunidad tienen el deber de reportar al equipo directivo, o a quien indique el reglamento, los hechos que puedan ser acoso, violencia o discriminación.", s: [["l21809", "art. 16 E letra f LGE"]] },
  { id: "f7", m: "rol", t: "Ley Karin en el colegio", r: "La Ley 21.643 previene y sanciona el acoso laboral, el acoso sexual y la violencia en el trabajo. Protege y obliga a todos los funcionarios, incluidos los inspectores.", s: [["l21643"]] },

  { id: "f8", m: "norma", t: "Ley General de Educación (LGE)", r: "Su texto vigente está en el DFL 2 de 2009. Fija derechos y deberes de la comunidad educativa y, desde 2026, las reglas de convivencia educativa incorporadas por la Ley 21.809.", s: [["lge"], ["l21809"]] },
  { id: "f9", m: "norma", t: "Ley 21.809 de convivencia (2026)", r: "Publicada el 1 de abril de 2026 y vigente desde el 1 de julio de 2026. Habla de «convivencia educativa», crea la coordinación de convivencia educativa y exige protocolos contra acoso, violencia y discriminación.", s: [["l21809"]] },
  { id: "f10", m: "norma", t: "Ley 21.827 Escuelas Protegidas (2026)", r: "Publicada el 12 de agosto de 2026. Permite revisar mochilas si el reglamento interno lo contempla, prohíbe prendas que impidan identificar el rostro y permite restringir el ingreso de apoderados que agredan.", s: [["l21827"]] },
  { id: "f11", m: "norma", t: "Ley 20.845 de Inclusión", r: "No se puede expulsar, cancelar la matrícula ni suspender por razones socioeconómicas o de rendimiento académico. Antes de expulsar, el director debe advertir a la familia y aplicar medidas de apoyo, salvo conductas que atenten directamente contra la integridad de alguien.", s: [["l20845"], ["dfl2_98", "art. 6 d"]] },
  { id: "f12", m: "norma", t: "Ley 21.128 Aula Segura", r: "Permite al director suspender como medida cautelar durante un procedimiento sancionatorio por conductas graves o gravísimas. Hay 10 días hábiles para resolver y 5 días para pedir reconsideración.", s: [["l21128"], ["dfl2_98", "art. 6 d"]] },
  { id: "f13", m: "norma", t: "Superintendencia y Agencia de Calidad", r: "La Superintendencia de Educación fiscaliza el cumplimiento de la normativa. La Agencia de Calidad evalúa y orienta. Ambas forman parte del Sistema de Aseguramiento de la Calidad.", s: [["l20529"]] },
  { id: "f14", m: "norma", t: "Circular 482", r: "Instrucciones de la Superintendencia sobre reglamentos internos en básica y media. Sigue vigente: en abril de 2026 se derogaron las circulares 781 y 782 que iban a reemplazarla.", s: [["c482"]] },
  { id: "f15", m: "norma", t: "Oficinas Locales de la Niñez (OLN)", r: "Creadas en el sistema de la Ley 21.430. Niños, niñas y adolescentes pueden acudir a ellas para pedir información, orientación o ayuda.", s: [["l21430", "art. 11"]] },

  { id: "f16", m: "conv", t: "Buena convivencia educativa", r: "La coexistencia armónica de los miembros de la comunidad educativa, con relaciones inclusivas y participativas, que favorece el aprendizaje y el bienestar.", s: [["l21809", "art. 16 A LGE"]] },
  { id: "f17", m: "conv", t: "Acoso escolar", r: "Toda acción u omisión de agresión u hostigamiento reiterado, por estudiantes en forma individual o colectiva, que provoque maltrato, humillación o fundado temor, o un clima hostil. Puede ocurrir dentro o fuera del colegio y por medios tecnológicos.", s: [["l21809", "art. 16 B LGE"]] },
  { id: "f18", m: "conv", t: "Conflicto, violencia y acoso", r: "Un conflicto es un desacuerdo que se puede resolver dialogando. La violencia es una agresión. El acoso es una agresión u hostigamiento reiterado que genera temor o un clima hostil.", s: [["l21809", "art. 16 B LGE"]] },
  { id: "f19", m: "conv", t: "Coordinador/a de convivencia educativa", r: "Lidera el equipo de convivencia del establecimiento, implementa el Plan de Gestión de Convivencia Educativa y asesora a la dirección. Es el principal destino de tus derivaciones.", s: [["l21809", "art. 16 H LGE"]] },
  { id: "f20", m: "conv", t: "Reglamento interno", r: "Regula las relaciones dentro del establecimiento: normas, faltas, medidas, procedimientos y protocolos. Se entrega a las familias al matricular y sus cambios se informan durante el año.", s: [["dfl2_98", "art. 6 d"], ["l21809"]] },
  { id: "f21", m: "conv", t: "Evitar la revictimización", r: "Los procedimientos de convivencia deben ser racionales, justos, confidenciales y proporcionales, y evitar la revictimización. Por eso no se cita a una víctima de acoso a «arreglarse» frente a quien la agrede.", s: [["l21809"]] },
  { id: "f22", m: "conv", t: "Violencia de un adulto hacia un estudiante", r: "Es especialmente grave cuando la comete quien tiene una posición de autoridad, como directivos, docentes o asistentes de la educación.", s: [["l21809", "art. 16 B LGE"]] },
  { id: "f23", m: "conv", t: "Violencia contra trabajadores de la educación", r: "La Ley 21.809 considera violencia laboral la que terceros, como apoderados, ejercen contra trabajadores de la educación. La Ley 21.827 permite restringir el ingreso de apoderados que agredan.", s: [["l21809"], ["l21827", "art. 7"]] },

  { id: "f24", m: "prot", t: "Obligación de denunciar", r: "Directores, inspectores y profesores deben denunciar los delitos que afecten a estudiantes o que ocurran en el establecimiento. El plazo es de 24 horas desde que conocen el hecho, ante Carabineros, PDI o Fiscalía.", s: [["cpp", "arts. 175 letra e y 176"]] },
  { id: "f25", m: "prot", t: "Ante un relato de abuso", r: "Escucha con calma y no interrogues. No prometas guardar el secreto, porque tienes la obligación de informar y denunciar. Registra sus palabras textuales e informa de inmediato al equipo directivo.", s: [["cpp", "art. 175"], ["l21057", "art. 1"]] },
  { id: "f26", m: "prot", t: "¿Por qué no interrogar?", r: "La Ley 21.057 busca prevenir la victimización secundaria. Establece entrevistas videograbadas con especialistas para evitar que niños y niñas repitan su relato muchas veces.", s: [["l21057", "arts. 1 y 5"]] },
  { id: "f27", m: "prot", t: "Drogas: consumo y tráfico", r: "Entregar o vender pequeñas cantidades a otra persona es microtráfico, un delito que se denuncia. El consumo se aborda con apoyo y derivación a la red, por ejemplo SENDA Previene.", s: [["l20000", "art. 4"], ["senda"]] },
  { id: "f28", m: "prot", t: "Imágenes íntimas de menores", r: "Almacenar o difundir material sexual de menores es delito. Nunca lo reenvíes ni lo guardes como «evidencia»: resguarda el equipo e informa para denunciar.", s: [["cp", "art. 374 bis"], ["cpp", "art. 175"]] },
  { id: "f29", m: "prot", t: "Estudiantes embarazadas, madres y padres", r: "El embarazo y la maternidad no impiden ingresar ni permanecer en el establecimiento. El colegio debe dar facilidades académicas para que continúen sus estudios.", s: [["lge", "art. 11"]] },
  { id: "f30", m: "prot", t: "Protocolos que exige la Circular 482", r: "Vulneración de derechos; agresiones sexuales y hechos de connotación sexual; maltrato y acoso escolar; drogas y alcohol; accidentes escolares; estudiantes embarazadas, madres y padres; salidas pedagógicas.", s: [["c482"]] },

  { id: "f31", m: "proc", t: "Debido proceso", r: "Conocer los hechos imputados, ser escuchado y presentar descargos, presunción de inocencia, resolución fundada y derecho a pedir reconsideración.", s: [["dfl2_98", "art. 6 d"], ["c482"]] },
  { id: "f32", m: "proc", t: "Se privilegian las medidas formativas", r: "La Ley 21.809 pide preferir medidas formativas y pedagógicas, proporcionales a la falta. La expulsión es excepcional.", s: [["l21809"]] },
  { id: "f33", m: "proc", t: "Suspensión", r: "Máximo 5 días hábiles, prorrogable excepcionalmente una vez por igual período. Debe estar en el reglamento interno y aplicarse con debido proceso.", s: [["c482"]] },
  { id: "f34", m: "proc", t: "Expulsión: la comisión", r: "Desde la Ley 21.809, antes de expulsar o cancelar la matrícula se necesita un informe de una comisión: profesor jefe, coordinador/a de convivencia educativa y un integrante del equipo técnico pedagógico. Si el director decide contra su recomendación, debe fundamentarlo en detalle.", s: [["dfl2_98", "art. 6 d"], ["l21809"]] },
  { id: "f35", m: "proc", t: "Reconsideración de una expulsión", r: "Se pide dentro de 15 días desde la notificación. Resuelve el director, previa consulta al Consejo de Profesores. La medida se informa a la Superintendencia dentro de 5 días hábiles.", s: [["dfl2_98", "art. 6 d"]] },
  { id: "f36", m: "proc", t: "Conductas de Aula Segura", r: "Afectan gravemente la convivencia: agresiones de carácter sexual, agresiones físicas que produzcan lesiones, uso o porte de armas o artefactos incendiarios y actos contra la infraestructura esencial.", s: [["l21128"]] },
  { id: "f37", m: "proc", t: "Medida cautelar", r: "La suspensión durante un procedimiento sancionatorio no es una sanción: resguarda a la comunidad mientras se investiga y se notifica por escrito.", s: [["dfl2_98", "art. 6 d"]] },
  { id: "f38", m: "proc", t: "Revisión de mochilas (Ley 21.827)", r: "Solo si el reglamento interno la contempla, por personal autorizado, en un lugar privado y con al menos dos adultos, uno del equipo de convivencia. Prohibido pedir que se desnude o revisar su cuerpo o ropa.", s: [["l21827", "art. 16 J LGE"]] },
  { id: "f39", m: "proc", t: "Si el estudiante no deja revisar", r: "Se avisa de inmediato al apoderado, que debe venir a revisar con el personal autorizado. Mientras tanto el estudiante espera supervisado fuera de la sala. Si se encuentra un objeto peligroso, se avisa a la familia y a Carabineros o PDI.", s: [["l21827", "art. 16 J LGE"]] },
  { id: "f40", m: "proc", t: "Uniforme", r: "No usar uniforme no puede impedir que un estudiante entre a clases ni ser motivo para enviarlo a su casa (Decreto 215 de 2009).", s: [["d215"]] },

  { id: "f41", m: "seg", t: "Seguro escolar", r: "Protege a los estudiantes desde que se matriculan, por accidentes durante actividades escolares y en el trayecto directo entre la casa y el establecimiento. La atención en salud pública es gratuita.", s: [["ds313"], ["seguro"]] },
  { id: "f42", m: "seg", t: "Declaración de accidente escolar", r: "El establecimiento completa la Declaración Individual de Accidente Escolar para que el estudiante sea atendido con el seguro en un servicio de salud público.", s: [["seguro"]] },
  { id: "f43", m: "seg", t: "Asistencia y promoción", r: "Para ser promovido se exige al menos 85% de asistencia. El director puede autorizar la promoción con menos asistencia por razones fundadas.", s: [["d67", "art. 10"]] },
  { id: "f44", m: "seg", t: "Inasistencia grave", r: "Mineduc clasifica como inasistencia grave una asistencia de 85% o menos, y como inasistencia reiterada una entre 85% y 90%. Es una alerta temprana de deserción.", s: [["asist"]] },
  { id: "f45", m: "seg", t: "Plan Integral de Seguridad Escolar (PISE)", r: "Plan de prevención y respuesta ante emergencias del establecimiento: zonas de seguridad, roles definidos y simulacros periódicos.", s: [["pise"]] },
  { id: "f46", m: "seg", t: "Retiro de estudiantes", r: "Sigue el procedimiento del reglamento interno: entrega solo al apoderado o a un adulto autorizado, verifica identidad y deja registro de hora y motivo.", s: [["c482", "reglamento interno"]] },
  { id: "f47", m: "seg", t: "Salidas pedagógicas", r: "El reglamento interno debe tener un protocolo de salidas pedagógicas y giras de estudio, con autorización de las familias y adultos responsables.", s: [["c482"]] },
  { id: "f48", m: "tea", t: "¿Qué es el TEA según la ley chilena?", r: "La Ley 21.545 describe a las personas con trastorno del espectro autista como aquellas que presentan una diferencia o diversidad en el neurodesarrollo típico. Es una condición del neurodesarrollo y debe contar con un diagnóstico.", s: [["l21545", "art. 2"]] },
  { id: "f49", m: "tea", t: "La Ley TEA en el colegio", r: "Los establecimientos deben dar acceso sin discriminación arbitraria, velar por comunidades educativas inclusivas y ajustar sus reglamentos para abordar las desregulaciones emocionales y conductuales. También deben ofrecer espacios sin violencia y formar a su personal.", s: [["l21545", "arts. 18 y 20"]] },
  { id: "f50", m: "tea", t: "¿Qué es una desregulación emocional y conductual (DEC)?", r: "Una reacción motora y emocional ante uno o varios estímulos, en la que el estudiante no logra comprender ni expresar lo que siente y no puede calmarse sin ayuda. Más de un observador la percibe como «descontrol».", s: [["teamin"], ["dec"]] },
  { id: "f51", m: "tea", t: "Señales previas de una DEC", r: "Aumento de movimientos repetitivos, irritabilidad, respiración agitada o voz más fuerte. Reconocer estas señales y actuar a tiempo, por ejemplo con una pausa acordada, puede evitar que la crisis escale.", s: [["dec", "prevención"]] },
  { id: "f52", m: "tea", t: "La conducta también comunica", r: "Una desregulación puede ser la forma de comunicar una necesidad: atención, descanso, un estímulo sensorial o incluso dolor. Por eso conviene preguntar a la familia qué la desencadena, como falta de sueño o ruidos fuertes.", s: [["dec", "prevención"]] },
  { id: "f53", m: "tea", t: "DEC etapa 1: inicio, sin riesgo", r: "Cambia la actividad, el material o el lugar. Ofrece un espacio tranquilo y objetos conocidos, habla con voz calmada y da más de una alternativa para elegir.", s: [["dec", "etapa 1"]] },
  { id: "f54", m: "tea", t: "DEC etapa 2: aumento, con riesgo", r: "Acompaña sin invadir. Lleva al estudiante a un lugar seguro y tranquilo, retira objetos peligrosos y reduce el ruido, la luz y el número de personas mirando. Cuando baje la intensidad, permite que se exprese con un adulto de confianza.", s: [["dec", "etapa 2"]] },
  { id: "f55", m: "tea", t: "Contención física: solo como último recurso", r: "No es una estrategia recomendable en el contexto educativo. Solo procede en casos excepcionales de riesgo extremo, por personal capacitado y con autorización escrita de la familia. Después se informa a la familia para que evalúe apoyo de salud mental.", s: [["c586"], ["dec", "etapa 3"]] },
  { id: "f56", m: "tea", t: "Tres roles durante una crisis", r: "Encargado/a: acompaña al estudiante con voz baja y cálida. Acompañante interno: está en la sala, a distancia y atento. Acompañante externo: queda afuera, coordina y llama a la familia o a directivos. Si el encargado no logra calmar la situación, se cambia.", s: [["dec", "roles"]] },
  { id: "f57", m: "tea", t: "Lo que no se hace en una crisis", r: "No regañar, no amenazar con sanciones, no pedirle que «no se enoje» y no intentar razonar con el estudiante sobre su conducta en ese momento. La conversación viene después, cuando esté en calma.", s: [["dec", "qué evitar"]] },
  { id: "f58", m: "tea", t: "Después del episodio", r: "Cuando el estudiante esté tranquilo, se conversa lo ocurrido y se acuerdan pasos para evitarlo. Si hubo daño, se repara según las normas. También se apoya al curso que lo presenció y se deja registro en la bitácora.", s: [["dec", "después de la crisis"], ["c586"]] },
  { id: "f59", m: "tea", t: "PAEC: Plan de Acompañamiento Emocional y Conductual", r: "Plan individual que se elabora con la familia, con registro de citaciones y acuerdos. Se informa al personal al inicio del año y cada vez que cambia, su contenido es confidencial y considera el traslado privado del estudiante lejos de sus compañeros.", s: [["c586"]] },
  { id: "f60", m: "tea", t: "Avisar al apoderado ante una emergencia", r: "Se contacta por la vía más rápida y se registra la hora y la persona contactada. Cada episodio se informa al término de la jornada, y un directivo firma un certificado con las horas de llegada y salida del apoderado.", s: [["c586"]] },
  { id: "f61", m: "tea", t: "Permiso laboral para acudir al colegio", r: "Madres, padres o tutores de menores con TEA que trabajan con contrato pueden salir a atender emergencias en el establecimiento. Ese tiempo se considera trabajado y no puede tratarse como abandono del trabajo. El trabajador avisa a la Inspección del Trabajo.", s: [["l21545", "art. 25, art. 66 quinquies del Código del Trabajo"], ["teamin"]] },
  { id: "f62", m: "tea", t: "Medidas disciplinarias y TEA", r: "Ninguna medida disciplinaria puede fundarse, directa o indirectamente, en la condición del estudiante. Los estudiantes con TEA no están exentos de las normas, pero no se sanciona una falta cuyo origen está vinculado a su condición.", s: [["c586"]] },
  { id: "f63", m: "tea", t: "Lo que el colegio no puede exigir", r: "No se puede condicionar la matrícula a compromisos de los apoderados por los episodios de desregulación, ni condicionar la permanencia a que el estudiante tome medicamentos. El retiro anticipado solo es excepcional.", s: [["c586"]] },
  { id: "f64", m: "tea", t: "Si sospechas que un estudiante tiene TEA", r: "La ley dice que los establecimientos derivan a salud a niños y niñas con sospecha de TEA, según el protocolo del Ministerio de Salud. Como inspector/a no diagnosticas: comparte lo que observas con el equipo de convivencia o PIE.", s: [["l21545", "art. 12"]] },
  { id: "f65", m: "tea", t: "Trato digno a la vista de todos", r: "Los establecimientos deben exhibir carteles con un mensaje claro y simple: las personas con autismo deben ser tratadas con dignidad y respeto en todo momento y en cualquier circunstancia.", s: [["c586"]] },

  { id: "f66", m: "inc", t: "Ley 20.422 de inclusión de personas con discapacidad", r: "Busca asegurar la igualdad de oportunidades y la plena inclusión social de las personas con discapacidad. La discapacidad aparece cuando una deficiencia se encuentra con barreras del entorno que impiden participar plenamente.", s: [["l20422", "arts. 1 y 5"]] },
  { id: "f67", m: "inc", t: "Ajustes necesarios", r: "Medidas de adecuación del ambiente físico, social y de actitud que facilitan la accesibilidad de una persona con discapacidad, sin imponer una carga desproporcionada.", s: [["l20422", "art. 8"]] },
  { id: "f68", m: "inc", t: "Derecho a estudiar en la educación regular", r: "El Estado garantiza a las personas con discapacidad el acceso a establecimientos públicos y privados que reciben aportes del Estado. Los colegios regulares deben incorporar innovaciones, adecuaciones y recursos adicionales para que permanezcan y progresen.", s: [["l20422", "arts. 34 y 36"]] },
  { id: "f69", m: "inc", t: "Discriminación arbitraria", r: "Toda distinción, exclusión o restricción sin justificación razonable que prive, perturbe o amenace el ejercicio de derechos fundamentales. Entre los motivos que la ley nombra está la discapacidad.", s: [["l20609", "art. 2"]] },
  { id: "f70", m: "inc", t: "Dónde se reclama", r: "Ante la Superintendencia de Educación; ante el Juzgado de Policía Local por actos arbitrarios contra derechos de la Ley 20.422; o con la acción de no discriminación de la Ley 20.609 ante un juzgado de letras.", s: [["teamin"], ["l20609"]] },
  { id: "f71", m: "inc", t: "NEE permanentes y transitorias", r: "Las permanentes son barreras que duran toda la escolaridad por una discapacidad diagnosticada. Las transitorias requieren apoyos extraordinarios durante un período para acceder o progresar en el currículum.", s: [["d170", "art. 2"]] },
  { id: "f72", m: "inc", t: "Ejemplos de NEE", r: "Permanentes: autismo, discapacidad intelectual, auditiva o visual, disfasia y multidéficit. Transitorias: dificultades específicas del aprendizaje, trastorno específico del lenguaje, déficit atencional y rendimiento intelectual limítrofe.", s: [["pie"]] },
  { id: "f73", m: "inc", t: "Programa de Integración Escolar (PIE)", r: "Estrategia inclusiva que entrega apoyos adicionales a estudiantes con NEE, dentro de la sala regular. Los especialistas trabajan en colaboración con el profesor del curso, con co-enseñanza.", s: [["pie"]] },
  { id: "f74", m: "inc", t: "Evaluación diagnóstica de NEE", r: "Es integral e interdisciplinaria y la hacen profesionales idóneos inscritos en el registro del Ministerio. Requiere autorización de la familia y se reevalúa cada año.", s: [["d170", "arts. 4, 11 y 15"], ["pie"]] },
  { id: "f75", m: "inc", t: "¿Qué es un tutor sombra?", r: "Un acompañante que contrata la familia para apoyar a su hijo o hija en la sala. No es funcionario del colegio ni una figura regulada en detalle: la normativa lo deja al acuerdo entre el establecimiento y los apoderados.", s: [["copiapo"]] },
  { id: "f76", m: "inc", t: "¿Puede el colegio negar un tutor sombra?", r: "Debe dar razones fundadas. En 2024 la Corte de Copiapó ordenó permitir una tutora sombra porque el rechazo, sin justificación suficiente, fue arbitrario y discriminatorio para una estudiante con TEA. Ante una condición así se exige una justificación muy sólida.", s: [["copiapo"], ["l21545", "art. 18"], ["l20609", "art. 2"]] },
  { id: "f77", m: "inc", t: "Tutor sombra: tu rol como inspector/a", r: "Registra su ingreso como el de cualquier adulto externo, conoce por escrito los acuerdos con dirección (horario, espacios, funciones) y canaliza dudas al equipo PIE o de convivencia. El tutor apoya, pero el cuidado de los estudiantes sigue siendo responsabilidad del colegio.", s: [["c482", "reglamento interno"], ["copiapo"]] },
  { id: "f78", m: "inc", t: "Tutor sombra y PIE no son lo mismo", r: "El PIE es un apoyo del propio colegio, con profesionales especialistas. El tutor sombra lo financia la familia y no reemplaza los apoyos que el establecimiento debe entregar.", s: [["pie"], ["copiapo"]] },
  { id: "f79", m: "inc", t: "Formación del personal", r: "Los colegios deben capacitar a su personal para dar una atención adecuada, oportuna e inclusiva, responder ante desregulaciones y promover la autorregulación y autonomía de los estudiantes.", s: [["c586"], ["l21545", "art. 20"]] }
];

const PREGUNTAS = [
  { id: "p1", m: "rol", n: 1, q: "¿Cuál de estos registros de un incidente es el más adecuado?", o: ["«Juan es violento y siempre molesta a Pedro.»", "«10:15, patio central. Juan empujó a Pedro, quien cayó. Pedro dijo: “me empujó porque no le presté la pelota”.»", "«Hubo un problema en el recreo, ya se solucionó.»", "«Pedro provocó a Juan, así que Juan reaccionó.»"], c: 1, e: "Un buen registro describe hechos verificables, con hora, lugar y palabras textuales, sin juicios.", s: [["c482", "debido proceso"]] },
  { id: "p2", m: "rol", n: 1, q: "En la Ley 19.464, ¿cómo se llama la función técnica complementaria a la labor educativa?", o: ["Docencia directiva", "Paradocencia", "Servicios auxiliares", "Función profesional"], c: 1, e: "La ley distingue funciones profesionales, de paradocencia y de servicios auxiliares. Muchos inspectores de patio cumplen paradocencia.", s: [["l19464", "art. 2"]] },
  { id: "p3", m: "rol", n: 1, q: "¿Qué nivel de estudios exige la Ley 19.464 para la paradocencia?", o: ["Título universitario", "Licencia de enseñanza media y, si corresponde, título técnico", "Solo enseñanza básica", "No exige estudios"], c: 1, e: "Para paradocencia se exige licencia de enseñanza media y, cuando corresponda, un título de nivel técnico.", s: [["l19464", "art. 2"]] },
  { id: "p4", m: "rol", n: 1, q: "Ves que un estudiante es hostigado por compañeros. Según la Ley 21.809, tú:", o: ["Solo intervienes si lo pide el apoderado", "Tienes el deber de reportarlo al equipo directivo o a quien indique el reglamento", "Esperas a que ocurra tres veces", "Lo comentas con el curso"], c: 1, e: "El personal tiene el deber de reportar los hechos que puedan ser acoso, violencia o discriminación.", s: [["l21809", "art. 16 E letra f LGE"]] },
  { id: "p5", m: "rol", n: 2, q: "¿Qué crea la Ley 20.594?", o: ["El seguro escolar", "Inhabilidades para trabajar con menores para condenados por delitos sexuales contra ellos", "El cargo de inspector general", "La Superintendencia de Educación"], c: 1, e: "Crea inhabilidades y un registro que los empleadores pueden consultar antes de contratar a quien trabajará con niños.", s: [["l20594"]] },
  { id: "p6", m: "rol", n: 2, q: "La Ley Karin (21.643) se aplica en un colegio a:", o: ["Solo estudiantes", "Solo apoderados", "Los trabajadores del establecimiento", "Solo directivos"], c: 2, e: "Trata el acoso laboral, el acoso sexual y la violencia en el trabajo.", s: [["l21643"]] },

  { id: "p7", m: "norma", n: 1, q: "¿Desde cuándo rige la Ley 21.809 de convivencia educativa?", o: ["Desde 2011", "Desde el 1 de julio de 2026", "Desde 2018", "Aún no rige"], c: 1, e: "Se publicó el 1 de abril de 2026 y entró en vigencia el 1 de julio de 2026.", s: [["l21809"]] },
  { id: "p8", m: "norma", n: 1, q: "¿Qué institución fiscaliza el cumplimiento de la normativa educacional?", o: ["Agencia de Calidad de la Educación", "Superintendencia de Educación", "JUNAEB", "Consejo Nacional de Educación"], c: 1, e: "La Superintendencia fiscaliza; la Agencia de Calidad evalúa y orienta.", s: [["l20529"]] },
  { id: "p9", m: "norma", n: 1, q: "La Ley de Inclusión prohíbe expulsar a un estudiante por:", o: ["Agredir sexualmente a un compañero", "Su rendimiento académico", "Portar un arma", "Agredir a un docente con lesiones"], c: 1, e: "Ni el rendimiento ni la situación socioeconómica pueden fundar una expulsión.", s: [["l20845"], ["dfl2_98", "art. 6 d"]] },
  { id: "p10", m: "norma", n: 2, q: "¿Qué pasó con la Circular 482 de la Superintendencia en 2026?", o: ["Fue derogada en enero", "Sigue vigente, porque se derogaron las circulares 781 y 782 que la iban a reemplazar", "Se transformó en ley", "Solo rige para jardines infantiles"], c: 1, e: "La Resolución Exenta 324 de abril de 2026 derogó las circulares 781 y 782 y mantuvo vigente la Circular 482.", s: [["c482"]] },
  { id: "p11", m: "norma", n: 2, q: "¿Qué ley de 2026 permite revisar mochilas en los colegios?", o: ["Ley 21.128", "Ley 21.827 Escuelas Protegidas", "Ley 20.536", "Ley 21.430"], c: 1, e: "La Ley 21.827 lo permite si el reglamento interno lo contempla, con resguardos.", s: [["l21827"]] },
  { id: "p12", m: "norma", n: 2, q: "Con la Ley 21.430, ¿a qué oficinas pueden acudir niños y niñas por orientación o ayuda?", o: ["Oficinas Locales de la Niñez", "Departamentos Provinciales", "Oficinas de Convivencia Comunal", "Juzgados de Policía Local"], c: 0, e: "La Ley 21.430 menciona las Oficinas Locales de la Niñez como lugar al que niños, niñas y adolescentes pueden acudir.", s: [["l21430", "art. 11"]] },

  { id: "p13", m: "conv", n: 1, q: "¿Qué distingue al acoso escolar de un conflicto puntual?", o: ["Que ocurra en el patio", "Que la agresión u hostigamiento sea reiterado", "Que participen más de dos estudiantes", "Que haya garabatos"], c: 1, e: "La ley lo define como agresión u hostigamiento reiterado que provoca maltrato, humillación, temor o un clima hostil.", s: [["l21809", "art. 16 B LGE"]] },
  { id: "p14", m: "conv", n: 1, q: "Un estudiante es humillado en el grupo de WhatsApp del curso, fuera del horario escolar. ¿Corresponde actuar al colegio?", o: ["No, pasó fuera del colegio", "Sí, el acoso puede ocurrir fuera del establecimiento y por medios tecnológicos", "Solo si se usó el wifi del colegio", "Solo si el apoderado lo pide por escrito"], c: 1, e: "La definición legal incluye el acoso fuera del establecimiento y por medios tecnológicos.", s: [["l21809", "art. 16 B LGE"]] },
  { id: "p15", m: "conv", n: 1, q: "¿Quién lidera el equipo de convivencia según la Ley 21.809?", o: ["El inspector general", "El coordinador o coordinadora de convivencia educativa", "El presidente del centro de padres", "El sostenedor"], c: 1, e: "La ley crea la coordinación de convivencia educativa, que lidera el equipo.", s: [["l21809", "art. 16 H LGE"]] },
  { id: "p16", m: "conv", n: 1, q: "Una apoderada pide juntar a su hijo, víctima de acoso, con sus agresores para que «se arreglen». ¿Qué principio legal lo desaconseja?", o: ["Gratuidad", "Evitar la revictimización", "Libertad de enseñanza", "Autonomía del sostenedor"], c: 1, e: "La Ley 21.809 exige procedimientos que eviten la revictimización.", s: [["l21809"]] },
  { id: "p17", m: "conv", n: 2, q: "La violencia contra un estudiante es especialmente grave cuando la comete:", o: ["Un compañero de curso", "Quien tiene una posición de autoridad, como un docente o asistente", "Un estudiante mayor de 14 años", "Un exalumno"], c: 1, e: "La ley la considera especialmente grave si la comete quien detenta una posición de autoridad.", s: [["l21809", "art. 16 B LGE"]] },
  { id: "p18", m: "conv", n: 2, q: "Un apoderado insulta y empuja a un inspector en la entrada. Según la normativa de 2026:", o: ["Es un asunto privado entre ellos", "Es violencia laboral y el reglamento puede restringir el ingreso de ese apoderado", "Solo se anota en la hoja de vida del estudiante", "Se sanciona al estudiante"], c: 1, e: "La Ley 21.809 la trata como violencia laboral y la Ley 21.827 permite suspender el ingreso de apoderados agresores.", s: [["l21809"], ["l21827", "art. 7"]] },

  { id: "p19", m: "prot", n: 1, q: "Una estudiante te cuenta que un familiar la toca. ¿Qué haces primero?", o: ["Le pides todos los detalles para tener pruebas", "La escuchas con calma, sin interrogarla, y no le prometes guardar el secreto", "Llamas a su familia para confirmar", "Le pides que lo hablen otro día"], c: 1, e: "Se acoge sin interrogar, para no revictimizar, y sin prometer secreto, porque hay obligación de denunciar.", s: [["l21057", "art. 1"], ["cpp", "art. 175"]] },
  { id: "p20", m: "prot", n: 1, q: "¿En qué plazo deben denunciar los funcionarios obligados un delito que afecte a un estudiante?", o: ["48 horas", "24 horas", "5 días hábiles", "Cuando tengan pruebas"], c: 1, e: "El art. 176 del Código Procesal Penal fija 24 horas desde que se conoce el hecho.", s: [["cpp", "art. 176"]] },
  { id: "p21", m: "prot", n: 1, q: "¿Quiénes están obligados a denunciar según el art. 175 letra e del Código Procesal Penal?", o: ["Solo el director", "Directores, inspectores y profesores", "Solo el coordinador de convivencia", "Solo los apoderados"], c: 1, e: "La norma nombra a «los directores, inspectores y profesores de establecimientos educacionales de todo nivel».", s: [["cpp", "art. 175 letra e"]] },
  { id: "p22", m: "prot", n: 1, q: "Un estudiante muestra una imagen íntima de una compañera menor de edad. ¿Qué haces con el archivo?", o: ["Lo reenvías a tu celular como evidencia", "No lo copias ni reenvías; resguardas el equipo e informas para denunciar", "Lo borras y cierras el tema", "Lo muestras al curso para prevenir"], c: 1, e: "Almacenar o difundir ese material es delito. Se resguarda y se denuncia.", s: [["cp", "art. 374 bis"]] },
  { id: "p23", m: "prot", n: 2, q: "¿Cuál es el objetivo de la Ley 21.057?", o: ["Grabar las clases", "Prevenir la victimización secundaria de niños, niñas y adolescentes", "Fiscalizar docentes", "Registrar reuniones de apoderados"], c: 1, e: "Regula entrevistas videograbadas para evitar la exposición reiterada del niño o niña.", s: [["l21057", "art. 1"]] },
  { id: "p24", m: "prot", n: 2, q: "Un estudiante le vende marihuana a compañeros. Esto es:", o: ["Solo una falta leve", "Un posible delito de microtráfico que debe denunciarse, además de aplicar el reglamento", "Solo un tema de salud", "Algo para conversar solo con el apoderado"], c: 1, e: "Entregar pequeñas cantidades a otro para su consumo está sancionado en el art. 4 de la Ley 20.000.", s: [["l20000", "art. 4"], ["cpp", "art. 175"]] },
  { id: "p25", m: "prot", n: 1, q: "Una estudiante embarazada teme tener que irse del liceo. Le explicas que:", o: ["Deberá cambiarse de establecimiento", "El embarazo no impide permanecer en el establecimiento y debe recibir facilidades académicas", "Debe pasar a jornada vespertina", "Solo puede venir hasta el quinto mes"], c: 1, e: "La LGE establece que el embarazo y la maternidad no son impedimento para ingresar y permanecer.", s: [["lge", "art. 11"]] },

  { id: "p26", m: "proc", n: 1, q: "¿Cuál es la duración máxima de una suspensión?", o: ["3 días hábiles", "5 días hábiles, prorrogable excepcionalmente una vez", "10 días hábiles", "Un mes"], c: 1, e: "Así lo establece la Circular 482, vigente en 2026.", s: [["c482"]] },
  { id: "p27", m: "proc", n: 1, q: "¿Cuál de estos NO es parte del debido proceso?", o: ["Ser escuchado", "Presunción de inocencia", "Sancionar antes de escuchar para dar una señal", "Pedir reconsideración"], c: 2, e: "Se escucha antes de resolver y la decisión debe ser fundada.", s: [["dfl2_98", "art. 6 d"], ["c482"]] },
  { id: "p28", m: "proc", n: 1, q: "Un estudiante llega sin uniforme. ¿Qué no se puede hacer?", o: ["Registrar la situación", "Conversar con el apoderado", "Impedirle entrar a clases", "Recordarle la norma"], c: 2, e: "El Decreto 215 de 2009 no permite impedir el ingreso a clases por el uniforme.", s: [["d215"]] },
  { id: "p29", m: "proc", n: 2, q: "Con suspensión cautelar (Aula Segura), ¿en qué plazo debe resolver el director?", o: ["5 días hábiles", "10 días hábiles", "15 días hábiles", "30 días corridos"], c: 1, e: "Hay un plazo máximo de 10 días hábiles desde la notificación de la medida.", s: [["l21128"], ["dfl2_98", "art. 6 d"]] },
  { id: "p30", m: "proc", n: 2, q: "¿Quiénes integran la comisión que informa antes de una expulsión (Ley 21.809)?", o: ["Director, sostenedor y apoderado", "Profesor jefe, coordinador/a de convivencia educativa e integrante del equipo técnico pedagógico", "Centro de padres y centro de alumnos", "Superintendencia y Agencia"], c: 1, e: "El informe considera antecedentes conductuales, pedagógicos y psicosociales, proporcionalidad y alternativas formativas.", s: [["dfl2_98", "art. 6 d"], ["l21809"]] },
  { id: "p31", m: "proc", n: 2, q: "¿En qué plazo se pide la reconsideración de una expulsión?", o: ["5 días", "15 días desde la notificación", "30 días", "No hay reconsideración"], c: 1, e: "Se pide al director, que resuelve previa consulta al Consejo de Profesores.", s: [["dfl2_98", "art. 6 d"]] },
  { id: "p32", m: "proc", n: 2, q: "¿Cuál de estas conductas está en Aula Segura como afectación grave a la convivencia?", o: ["Usar el celular en clases", "Agresiones físicas que produzcan lesiones", "Atrasos reiterados", "No traer materiales"], c: 1, e: "También agresiones sexuales, armas o artefactos incendiarios y daños a la infraestructura esencial.", s: [["l21128"]] },
  { id: "p33", m: "proc", n: 1, q: "En una revisión de mochila (Ley 21.827), ¿cuántos adultos deben estar presentes?", o: ["Uno", "Al menos dos, uno del equipo de convivencia", "Todo el consejo de profesores", "Ninguno, la hace el estudiante solo"], c: 1, e: "Además debe hacerse en un lugar privado y por personal autorizado.", s: [["l21827", "art. 16 J LGE"]] },
  { id: "p34", m: "proc", n: 2, q: "Durante una revisión según la Ley 21.827, ¿qué está prohibido?", o: ["Pedir que muestre la mochila", "Pedir que vacíe sus bolsillos sin contacto físico", "Pedir que se desnude o revisar su cuerpo o ropa", "Informar al apoderado"], c: 2, e: "La ley prohíbe expresamente desnudar al estudiante y las revisiones corporales o de vestimenta.", s: [["l21827", "art. 16 J LGE"]] },

  { id: "p35", m: "seg", n: 1, q: "¿Desde cuándo protege el seguro escolar a un estudiante?", o: ["Desde los 6 años", "Desde que se matricula", "Desde que paga una cuota", "Solo en horas de clases"], c: 1, e: "El seguro escolar cubre desde la matrícula.", s: [["ds313"], ["seguro"]] },
  { id: "p36", m: "seg", n: 1, q: "Un estudiante se accidenta en su trayecto directo al colegio. ¿Lo cubre el seguro?", o: ["No, solo dentro del colegio", "Sí, cubre el trayecto directo de ida y regreso", "Solo en transporte escolar", "Solo si se declara en una hora"], c: 1, e: "El seguro incluye el trayecto directo entre la casa y el establecimiento.", s: [["ds313"], ["seguro"]] },
  { id: "p37", m: "seg", n: 1, q: "¿Qué documento se completa para usar el seguro escolar?", o: ["Certificado de alumno regular", "Declaración Individual de Accidente Escolar", "Ficha de matrícula", "Licencia médica"], c: 1, e: "Se presenta en el servicio de salud público donde se atiende al estudiante.", s: [["seguro"]] },
  { id: "p38", m: "seg", n: 1, q: "¿Qué asistencia mínima exige el Decreto 67 para la promoción?", o: ["75%", "80%", "85%", "90%"], c: 2, e: "El director puede autorizar excepciones por razones fundadas.", s: [["d67", "art. 10"]] },
  { id: "p39", m: "seg", n: 2, q: "Según Mineduc, ¿qué asistencia se considera inasistencia grave?", o: ["95% o menos", "90% o menos", "85% o menos", "50% o menos"], c: 2, e: "Entre 85% y 90% es inasistencia reiterada; 85% o menos es grave.", s: [["asist"]] },
  { id: "p40", m: "seg", n: 2, q: "¿Qué resolución de Mineduc regula el Plan Integral de Seguridad Escolar?", o: ["Res. Ex. 2515 de 2018", "Circular 482", "Decreto 67", "Ley 20.594"], c: 0, e: "El PISE organiza la prevención y la respuesta ante emergencias.", s: [["pise"]] },
  { id: "p41", m: "seg", n: 1, q: "Al revisar una mochila aparece un cuchillo. Según la Ley 21.827, se avisa de inmediato a:", o: ["Nadie, se guarda el cuchillo", "La familia y Carabineros o PDI", "Solo al profesor jefe", "Al centro de alumnos"], c: 1, e: "El personal autorizado debe comunicarlo de inmediato a la familia y a las policías.", s: [["l21827", "art. 16 J LGE"]] },
  { id: "p42", m: "rol", n: 1, q: "¿Qué datos debe tener un buen registro de un incidente?", o: ["Tu opinión sobre los involucrados", "Fecha, hora, lugar, personas y lo que dijeron con sus palabras", "Solo el nombre del estudiante culpable", "Un resumen general sin detalles"], c: 1, e: "Se registran hechos verificables, no opiniones.", s: [["c482", "debido proceso"]] },
  { id: "p43", m: "rol", n: 1, q: "Según el Estatuto Docente, el inspector general es:", o: ["Un asistente de la educación", "Un docente directivo", "Un apoderado elegido", "Un funcionario de la Superintendencia"], c: 1, e: "El inspector general es docente directivo. El inspector de patio suele ser asistente de la educación.", s: [["estatuto"]] },
  { id: "p44", m: "norma", n: 1, q: "¿Qué permite al director la Ley 21.128 Aula Segura?", o: ["Expulsar sin procedimiento", "Suspender como medida cautelar durante un procedimiento por faltas graves o gravísimas", "Cerrar el colegio un día", "Revisar celulares de los estudiantes"], c: 1, e: "La suspensión cautelar se aplica mientras dura el procedimiento sancionatorio.", s: [["l21128"]] },
  { id: "p45", m: "norma", n: 1, q: "¿Qué hace la Agencia de Calidad de la Educación?", o: ["Fiscaliza y multa", "Evalúa y orienta", "Contrata inspectores", "Entrega el seguro escolar"], c: 1, e: "La Superintendencia fiscaliza; la Agencia evalúa y orienta.", s: [["l20529"]] },
  { id: "p46", m: "conv", n: 1, q: "¿Cuándo se entrega el reglamento interno a las familias?", o: ["Solo si lo piden por escrito", "Al matricular, e informando sus cambios durante el año", "Cuando el estudiante comete una falta", "Al terminar el año"], c: 1, e: "Las familias deben conocer las normas antes de que se apliquen.", s: [["dfl2_98", "art. 6 d"]] },
  { id: "p47", m: "conv", n: 1, q: "La buena convivencia educativa se define como:", o: ["La ausencia total de conflictos", "La coexistencia armónica de la comunidad, con relaciones inclusivas y participativas", "El cumplimiento estricto de las sanciones", "Que los estudiantes no hablen en clases"], c: 1, e: "Los conflictos existen; la buena convivencia es cómo se convive y se resuelven.", s: [["l21809", "art. 16 A LGE"]] },
  { id: "p48", m: "prot", n: 1, q: "Detectas que un estudiante consume marihuana, sin vender. ¿Cómo se aborda?", o: ["Se le expulsa de inmediato", "Con apoyo y derivación a la red, por ejemplo SENDA Previene, según el protocolo", "Se ignora si es fuera del colegio", "Se le pide al curso que lo vigile"], c: 1, e: "El consumo se aborda con apoyo; el microtráfico es un delito que se denuncia.", s: [["senda"], ["c482"]] },
  { id: "p49", m: "seg", n: 1, q: "Un adulto que no conoces quiere retirar a un estudiante. ¿Qué haces?", o: ["Lo dejas ir si el estudiante lo conoce", "Verificas que sea apoderado o adulto autorizado, su identidad, y registras hora y motivo", "Le pides que vuelva mañana sin explicar", "Llamas a Carabineros siempre"], c: 1, e: "Solo se entrega al apoderado o a un adulto autorizado, según el reglamento.", s: [["c482", "reglamento interno"]] },

  { id: "p50", m: "tea", n: 1, q: "Según la Ley 21.545, el trastorno del espectro autista es:", o: ["Una enfermedad contagiosa", "Una diferencia o diversidad en el neurodesarrollo típico, que requiere diagnóstico", "Un problema de mala crianza", "Una falta disciplinaria"], c: 1, e: "La ley lo define como una condición del neurodesarrollo que debe contar con diagnóstico.", s: [["l21545", "art. 2"]] },
  { id: "p51", m: "tea", n: 1, q: "Un estudiante con TEA empieza a gritar y a mover las manos sin parar. Lo primero que NO debes hacer es:", o: ["Ofrecerle un lugar tranquilo", "Retarlo y amenazarlo con una anotación", "Hablarle con voz calmada", "Bajar el ruido alrededor"], c: 1, e: "Regañar o amenazar con sanciones escala la crisis. La conversación viene cuando esté en calma.", s: [["dec", "qué evitar"]] },
  { id: "p52", m: "tea", n: 1, q: "¿Cuál es una señal previa de desregulación?", o: ["Que pida ir al baño", "Aumento de movimientos repetitivos, irritabilidad o respiración agitada", "Que termine rápido su tarea", "Que salude a un compañero"], c: 1, e: "Reconocer las señales previas permite actuar antes de que la crisis escale.", s: [["dec", "prevención"]] },
  { id: "p53", m: "tea", n: 1, q: "En una desregulación con riesgo (etapa 2), ¿qué corresponde?", o: ["Dejar que el curso mire para que aprenda", "Llevarlo a un lugar seguro, retirar objetos peligrosos y reducir ruido y público", "Sujetarlo entre varios de inmediato", "Mandarlo solo a inspectoría"], c: 1, e: "Se acompaña sin invadir, en un lugar seguro y con pocos estímulos.", s: [["dec", "etapa 2"]] },
  { id: "p54", m: "tea", n: 1, q: "Ante una emergencia con un estudiante con TEA, ¿cómo se contacta al apoderado?", o: ["Por correo al día siguiente", "Por la vía más rápida, registrando la hora y quién fue contactado", "Solo si el estudiante lo pide", "Mediante la libreta de comunicaciones"], c: 1, e: "La Circular 586 pide contacto rápido y registro de hora y persona.", s: [["c586"]] },
  { id: "p55", m: "tea", n: 1, q: "¿Qué es el PAEC?", o: ["Un formulario de matrícula", "El Plan de Acompañamiento Emocional y Conductual, elaborado con la familia", "Una sanción por mala conducta", "Un examen médico"], c: 1, e: "Es un plan individual, confidencial, que se informa al personal al inicio del año.", s: [["c586"]] },
  { id: "p56", m: "tea", n: 1, q: "Si sospechas que un estudiante podría tener TEA, tú:", o: ["Le dices a la familia que tiene autismo", "Compartes lo que observas con el equipo de convivencia o PIE para que se derive según protocolo", "Lo cambias de curso", "No haces nada"], c: 1, e: "Los establecimientos derivan a salud según protocolo; el inspector no diagnostica.", s: [["l21545", "art. 12"]] },
  { id: "p57", m: "tea", n: 2, q: "Sobre la contención física de un estudiante en crisis, la Circular 586 indica que:", o: ["Es la primera medida recomendada", "No es recomendable y solo procede excepcionalmente ante riesgo de daño", "Puede hacerla cualquier adulto", "Reemplaza el aviso a la familia"], c: 1, e: "Es excepcional, por personal capacitado, con autorización escrita de la familia, y luego se informa.", s: [["c586"], ["dec", "etapa 3"]] },
  { id: "p58", m: "tea", n: 2, q: "Durante una desregulación, un estudiante con TEA bota una silla. El profesor pide suspenderlo. ¿Qué dice la normativa?", o: ["Debe suspenderse siempre", "No se aplican medidas que se funden en su condición; si la conducta se origina en ella, no se sanciona", "Debe cambiarse de colegio", "Se suspende solo si lo pide el curso"], c: 1, e: "Los estudiantes con TEA no están exentos de las normas, pero no se sanciona lo vinculado en su origen a su condición.", s: [["c586"]] },
  { id: "p59", m: "tea", n: 2, q: "El colegio quiere exigir que un estudiante tome medicamentos para seguir matriculado. Esto:", o: ["Está permitido si lo firma el apoderado", "Está prohibido por la Circular 586", "Lo decide el profesor jefe", "Solo es válido en enseñanza media"], c: 1, e: "No se puede condicionar la permanencia al consumo de medicamentos.", s: [["c586"]] },
  { id: "p60", m: "tea", n: 2, q: "Una madre trabajadora sale de su empleo para acudir a una crisis de su hijo con TEA. Según el Código del Trabajo:", o: ["Debe pedir vacaciones", "Ese tiempo se considera trabajado y no es abandono del trabajo", "Se descuenta de su sueldo", "Necesita permiso de la Superintendencia de Educación"], c: 1, e: "La Ley TEA agregó el art. 66 quinquies al Código del Trabajo.", s: [["l21545", "art. 25"], ["teamin"]] },
  { id: "p61", m: "tea", n: 2, q: "En una crisis con tres adultos, ¿qué hace el acompañante externo?", o: ["Sujeta al estudiante", "Queda afuera, coordina y llama a la familia o a directivos", "Explica la conducta al curso", "Graba el episodio"], c: 1, e: "El encargado acompaña, el acompañante interno observa a distancia y el externo coordina.", s: [["dec", "roles"]] },

  { id: "p62", m: "inc", n: 1, q: "¿Qué es un tutor sombra?", o: ["Un funcionario del Mineduc", "Un acompañante contratado por la familia que apoya al estudiante en la sala", "El profesor jefe del curso", "Un inspector de patio en práctica"], c: 1, e: "No es personal del colegio; su presencia se acuerda entre el establecimiento y los apoderados.", s: [["copiapo"]] },
  { id: "p63", m: "inc", n: 1, q: "¿Qué es el PIE?", o: ["Un plan de emergencias", "Una estrategia inclusiva que da apoyos adicionales a estudiantes con NEE dentro de la sala", "Un programa de alimentación", "Un sumario administrativo"], c: 1, e: "El Programa de Integración Escolar trabaja dentro del aula regular, con co-enseñanza.", s: [["pie"]] },
  { id: "p64", m: "inc", n: 1, q: "Las NEE permanentes son las que:", o: ["Duran un semestre", "Se presentan durante toda la escolaridad por una discapacidad diagnosticada", "Desaparecen con una sanción", "Solo existen en educación parvularia"], c: 1, e: "Las transitorias, en cambio, requieren apoyos por un período determinado.", s: [["d170", "art. 2"]] },
  { id: "p65", m: "inc", n: 1, q: "¿Cuál de estas es una NEE transitoria según Mineduc?", o: ["Discapacidad visual", "Trastorno específico del lenguaje", "Autismo", "Discapacidad auditiva"], c: 1, e: "El TEL, las dificultades específicas del aprendizaje y el déficit atencional son transitorias.", s: [["pie"]] },
  { id: "p66", m: "inc", n: 1, q: "Un apoderado dice que no quiere «niños con autismo» en el curso de su hijo. ¿Qué responde el colegio?", o: ["Que se evaluará cambiarlos", "Que todos tienen derecho a estudiar sin discriminación arbitraria", "Que tiene razón", "Que hable con los otros apoderados"], c: 1, e: "La Ley TEA y la Ley 20.609 prohíben la discriminación arbitraria por discapacidad.", s: [["l21545", "art. 18"], ["l20609", "art. 2"]] },
  { id: "p67", m: "inc", n: 2, q: "¿Qué son los «ajustes necesarios» en la Ley 20.422?", o: ["Cambios en el sueldo de los docentes", "Adecuaciones del ambiente físico, social y de actitud que facilitan la accesibilidad, sin carga desproporcionada", "Sanciones más suaves", "Exámenes especiales de ingreso"], c: 1, e: "Por ejemplo, anticipar cambios de rutina o adaptar un espacio.", s: [["l20422", "art. 8"]] },
  { id: "p68", m: "inc", n: 2, q: "En 2024, la Corte de Copiapó revisó el rechazo de un colegio a una tutora sombra. ¿Qué resolvió?", o: ["Que el colegio debe pagar la tutora", "Que el rechazo sin justificación suficiente fue arbitrario y discriminatorio, y ordenó permitirla", "Que los tutores sombra están prohibidos", "Que solo la Superintendencia puede autorizarlos"], c: 1, e: "La tutora la pagaba la familia; la corte exigió al colegio razones sólidas para negarla.", s: [["copiapo"]] },
  { id: "p69", m: "inc", n: 2, q: "¿Ante quién se puede denunciar un acto arbitrario contra derechos de la Ley 20.422?", o: ["Ante el Juzgado de Policía Local", "Ante el Servicio de Impuestos Internos", "Ante el centro de padres", "Ante el Registro Civil"], c: 0, e: "También se puede reclamar en la Superintendencia o con la acción de la Ley 20.609.", s: [["teamin"]] },
  { id: "p70", m: "inc", n: 2, q: "¿Quién realiza la evaluación diagnóstica de NEE según el Decreto 170?", o: ["El inspector general", "Profesionales idóneos inscritos en el registro, con un enfoque integral e interdisciplinario", "El profesor jefe por sí solo", "El centro de alumnos"], c: 1, e: "Además requiere autorización de la familia y se reevalúa cada año.", s: [["d170", "arts. 4 y 15"]] }
];

const CASOS = [
  { id: "c1", m: "seg", n: 1, titulo: "Pelea en el recreo",

  { id: "c2", m: "prot", n: 1, titulo: "Un relato en el patio",

  { id: "c3", m: "conv", n: 1, titulo: "Memes en el grupo del curso",

  { id: "c4", m: "seg", n: 1, titulo: "Un retiro que no cuadra",
    intro: "A las 11:00 llega un hombre que dice ser el papá de un estudiante de 2° básico y quiere retirarlo por una emergencia. No figura como adulto autorizado. El niño, al verlo, parece asustado.",

  // ---------- preguntas ----------

      if (good) {

  function quizEnd() {

      unlock("primer");
