  {"id":"f17","m":"viol","t":"Acoso escolar","r":"Toda acción u omisión de agresión u hostigamiento reiterado, por estudiantes en forma individual o colectiva, que provoque maltrato, humillación o fundado temor, o un clima hostil. Puede ocurrir dentro o fuera del colegio y por medios tecnológicos.","s":[["l21809","art. 16 B LGE"]]},
  {"id":"f18","m":"conv","t":"Conflicto, violencia y acoso","r":"Un conflicto es un desacuerdo que se puede resolver dialogando. La violencia es una agresión. El acoso es una agresión u hostigamiento reiterado que genera temor o un clima hostil.","s":[["l21809","art. 16 B LGE"]]},
  {"id":"f19","m":"conv","t":"Coordinador/a de convivencia educativa","r":"Lidera el equipo de convivencia del establecimiento, implementa el Plan de Gestión de Convivencia Educativa y asesora a la dirección. Es el principal destino de tus derivaciones.","s":[["l21809","art. 16 H LGE"]]},
  {"id":"f20","m":"ig","t":"Reglamento interno","r":"Regula las relaciones dentro del establecimiento: normas, faltas, medidas, procedimientos y protocolos. Se entrega a las familias al matricular y sus cambios se informan durante el año.","s":[["dfl2_98","art. 6 d"],["l21809"]]},
  {"id":"f21","m":"conv","t":"Evitar la revictimización","r":"Los procedimientos de convivencia deben ser racionales, justos, confidenciales y proporcionales, y evitar la revictimización. Por eso no se cita a una víctima de acoso a «arreglarse» frente a quien la agrede.","s":[["l21809"]]},
  {"id":"f22","m":"der","t":"Violencia de un adulto hacia un estudiante","r":"Es especialmente grave cuando la comete quien tiene una posición de autoridad, como directivos, docentes o asistentes de la educación.","s":[["l21809","art. 16 B LGE"]]},
  {"id":"f23","m":"viol","t":"Violencia contra trabajadores de la educación","r":"La Ley 21.809 considera violencia laboral la que terceros, como apoderados, ejercen contra trabajadores de la educación. La Ley 21.827 permite restringir el ingreso de apoderados que agredan.","s":[["l21809"],["l21827","art. 7"]]},
  {"id":"f24","m":"der","t":"Obligación de denunciar","r":"Directores, inspectores y profesores deben denunciar los delitos que afecten a estudiantes o que ocurran en el establecimiento. El plazo es de 24 horas desde que conocen el hecho, ante Carabineros, PDI o Fiscalía.","s":[["cpp","arts. 175 letra e y 176"]]},
  {"id":"f25","m":"der","t":"Ante un relato de abuso","r":"Escucha con calma y no interrogues. No prometas guardar el secreto, porque tienes la obligación de informar y denunciar. Registra sus palabras textuales e informa de inmediato al equipo directivo.","s":[["cpp","art. 175"],["l21057","art. 1"]]},
  {"id":"f26","m":"der","t":"¿Por qué no interrogar?","r":"La Ley 21.057 busca prevenir la victimización secundaria. Establece entrevistas videograbadas con especialistas para evitar que niños y niñas repitan su relato muchas veces.","s":[["l21057","arts. 1 y 5"]]},
  {"id":"f27","m":"sm","t":"Drogas: consumo y tráfico","r":"Entregar o vender pequeñas cantidades a otra persona es microtráfico, un delito que se denuncia. El consumo se aborda con apoyo y derivación a la red, por ejemplo SENDA Previene.","s":[["l20000","art. 4"],["senda"]]},
  {"id":"f28","m":"der","t":"Imágenes íntimas de menores","r":"Almacenar o difundir material sexual de menores es delito. Nunca lo reenvíes ni lo guardes como «evidencia»: resguarda el equipo e informa para denunciar.","s":[["cp","art. 374 bis"],["cpp","art. 175"]]},
  {"id":"f29","m":"der","t":"Estudiantes embarazadas, madres y padres","r":"El embarazo y la maternidad no impiden ingresar ni permanecer en el establecimiento. El colegio debe dar facilidades académicas para que continúen sus estudios.","s":[["lge","art. 11"]]},
  {"id":"f30","m":"der","t":"Protocolos que exige la Circular 482","r":"Vulneración de derechos; agresiones sexuales y hechos de connotación sexual; maltrato y acoso escolar; drogas y alcohol; accidentes escolares; estudiantes embarazadas, madres y padres; salidas pedagógicas.","s":[["c482"]]},
  {"id":"f31","m":"conv","t":"Debido proceso","r":"Conocer los hechos imputados, ser escuchado y presentar descargos, presunción de inocencia, resolución fundada y derecho a pedir reconsideración.","s":[["dfl2_98","art. 6 d"],["c482"]]},
  {"id":"f32","m":"conv","t":"Se privilegian las medidas formativas","r":"La Ley 21.809 pide preferir medidas formativas y pedagógicas, proporcionales a la falta. La expulsión es excepcional.","s":[["l21809"]]},
  {"id":"f33","m":"conv","t":"Suspensión","r":"Máximo 5 días hábiles, prorrogable excepcionalmente una vez por igual período. Debe estar en el reglamento interno y aplicarse con debido proceso.","s":[["c482"]]},
  {"id":"f34","m":"conv","t":"Expulsión: la comisión","r":"Desde la Ley 21.809, antes de expulsar o cancelar la matrícula se necesita un informe de una comisión: profesor jefe, coordinador/a de convivencia educativa y un integrante del equipo técnico pedagógico. Si el director decide contra su recomendación, debe fundamentarlo en detalle.","s":[["dfl2_98","art. 6 d"],["l21809"]]},
  {"id":"f35","m":"conv","t":"Reconsideración de una expulsión","r":"Se pide dentro de 15 días desde la notificación. Resuelve el director, previa consulta al Consejo de Profesores. La medida se informa a la Superintendencia dentro de 5 días hábiles.","s":[["dfl2_98","art. 6 d"]]},
  {"id":"f36","m":"conv","t":"Conductas de Aula Segura","r":"Afectan gravemente la convivencia: agresiones de carácter sexual, agresiones físicas que produzcan lesiones, uso o porte de armas o artefactos incendiarios y actos contra la infraestructura esencial.","s":[["l21128"]]},
  {"id":"f37","m":"conv","t":"Medida cautelar","r":"La suspensión durante un procedimiento sancionatorio no es una sanción: resguarda a la comunidad mientras se investiga y se notifica por escrito.","s":[["dfl2_98","art. 6 d"]]},
  {"id":"f38","m":"seg","t":"Revisión de mochilas (Ley 21.827)","r":"Solo si el reglamento interno la contempla, por personal autorizado, en un lugar privado y con al menos dos adultos, uno del equipo de convivencia. Prohibido pedir que se desnude o revisar su cuerpo o ropa.","s":[["l21827","art. 16 J LGE"]]},
  {"id":"f39","m":"seg","t":"Si el estudiante no deja revisar","r":"Se avisa de inmediato al apoderado, que debe venir a revisar con el personal autorizado. Mientras tanto el estudiante espera supervisado fuera de la sala. Si se encuentra un objeto peligroso, se avisa a la familia y a Carabineros o PDI.","s":[["l21827","art. 16 J LGE"]]},
  {"id":"f40","m":"conv","t":"Uniforme","r":"No usar uniforme no puede impedir que un estudiante entre a clases ni ser motivo para enviarlo a su casa (Decreto 215 de 2009).","s":[["d215"]]},
  {"id":"f41","m":"seg","t":"Seguro escolar","r":"Protege a los estudiantes desde que se matriculan, por accidentes durante actividades escolares y en el trayecto directo entre la casa y el establecimiento. La atención en salud pública es gratuita.","s":[["ds313"],["seguro"]]},
  {"id":"f42","m":"seg","t":"Declaración de accidente escolar","r":"El establecimiento completa la Declaración Individual de Accidente Escolar para que el estudiante sea atendido con el seguro en un servicio de salud público.","s":[["seguro"]]},
  {"id":"f43","m":"asis","t":"Asistencia y promoción","r":"Para ser promovido se exige al menos 85% de asistencia. El director puede autorizar la promoción con menos asistencia por razones fundadas.","s":[["d67","art. 10"]]},
  {"id":"f44","m":"asis","t":"Inasistencia grave","r":"Mineduc clasifica como inasistencia grave una asistencia de 85% o menos, y como inasistencia reiterada una entre 85% y 90%. Es una alerta temprana de deserción.","s":[["asist"]]},
  {"id":"f45","m":"seg","t":"Plan Integral de Seguridad Escolar (PISE)","r":"Plan de prevención y respuesta ante emergencias del establecimiento: zonas de seguridad, roles definidos y simulacros periódicos.","s":[["pise"]]},
  {"id":"f46","m":"ig","t":"Retiro de estudiantes","r":"Sigue el procedimiento del reglamento interno: entrega solo al apoderado o a un adulto autorizado, verifica identidad y deja registro de hora y motivo.","s":[["c482","reglamento interno"]]},
  {"id":"f47","m":"seg","t":"Salidas pedagógicas","r":"El reglamento interno debe tener un protocolo de salidas pedagógicas y giras de estudio, con autorización de las familias y adultos responsables.","s":[["c482"]]},
  {"id":"f48","m":"tea","t":"¿Qué es el TEA según la ley chilena?","r":"La Ley 21.545 describe a las personas con trastorno del espectro autista como aquellas que presentan una diferencia o diversidad en el neurodesarrollo típico. Es una condición del neurodesarrollo y debe contar con un diagnóstico.","s":[["l21545","art. 2"]]},
  {"id":"f49","m":"tea","t":"La Ley TEA en el colegio","r":"Los establecimientos deben dar acceso sin discriminación arbitraria, velar por comunidades educativas inclusivas y ajustar sus reglamentos para abordar las desregulaciones emocionales y conductuales. También deben ofrecer espacios sin violencia y formar a su personal.","s":[["l21545","arts. 18 y 20"]]},
  {"id":"f50","m":"crisis","t":"¿Qué es una desregulación emocional y conductual (DEC)?","r":"Una reacción motora y emocional ante uno o varios estímulos, en la que el estudiante no logra comprender ni expresar lo que siente y no puede calmarse sin ayuda. Más de un observador la percibe como «descontrol».","s":[["teamin"],["dec"]]},
  {"id":"f51","m":"crisis","t":"Señales previas de una DEC","r":"Aumento de movimientos repetitivos, irritabilidad, respiración agitada o voz más fuerte. Reconocer estas señales y actuar a tiempo, por ejemplo con una pausa acordada, puede evitar que la crisis escale.","s":[["dec","prevención"]]},
  {"id":"f52","m":"tea","t":"La conducta también comunica","r":"Una desregulación puede ser la forma de comunicar una necesidad: atención, descanso, un estímulo sensorial o incluso dolor. Por eso conviene preguntar a la familia qué la desencadena, como falta de sueño o ruidos fuertes.","s":[["dec","prevención"]]},
  {"id":"f53","m":"crisis","t":"DEC etapa 1: inicio, sin riesgo","r":"Cambia la actividad, el material o el lugar. Ofrece un espacio tranquilo y objetos conocidos, habla con voz calmada y da más de una alternativa para elegir.","s":[["dec","etapa 1"]]},
  {"id":"f54","m":"crisis","t":"DEC etapa 2: aumento, con riesgo","r":"Acompaña sin invadir. Lleva al estudiante a un lugar seguro y tranquilo, retira objetos peligrosos y reduce el ruido, la luz y el número de personas mirando. Cuando baje la intensidad, permite que se exprese con un adulto de confianza.","s":[["dec","etapa 2"]]},
  {"id":"f55","m":"crisis","t":"Contención física: solo como último recurso","r":"No es una estrategia recomendable en el contexto educativo. Solo procede en casos excepcionales de riesgo extremo, por personal capacitado y con autorización escrita de la familia. Después se informa a la familia para que evalúe apoyo de salud mental.","s":[["c586"],["dec","etapa 3"]]},
  {"id":"f56","m":"crisis","t":"Tres roles durante una crisis","r":"Encargado/a: acompaña al estudiante con voz baja y cálida. Acompañante interno: está en la sala, a distancia y atento. Acompañante externo: queda afuera, coordina y llama a la familia o a directivos. Si el encargado no logra calmar la situación, se cambia.","s":[["dec","roles"]]},
  {"id":"f57","m":"crisis","t":"Lo que no se hace en una crisis","r":"No regañar, no amenazar con sanciones, no pedirle que «no se enoje» y no intentar razonar con el estudiante sobre su conducta en ese momento. La conversación viene después, cuando esté en calma.","s":[["dec","qué evitar"]]},
  {"id":"f58","m":"crisis","t":"Después del episodio","r":"Cuando el estudiante esté tranquilo, se conversa lo ocurrido y se acuerdan pasos para evitarlo. Si hubo daño, se repara según las normas. También se apoya al curso que lo presenció y se deja registro en la bitácora.","s":[["dec","después de la crisis"],["c586"]]},
  {"id":"f59","m":"tea","t":"PAEC: Plan de Acompañamiento Emocional y Conductual","r":"Plan individual que se elabora con la familia, con registro de citaciones y acuerdos. Se informa al personal al inicio del año y cada vez que cambia, su contenido es confidencial y considera el traslado privado del estudiante lejos de sus compañeros.","s":[["c586"]]},
  {"id":"f60","m":"tea","t":"Avisar al apoderado ante una emergencia","r":"Se contacta por la vía más rápida y se registra la hora y la persona contactada. Cada episodio se informa al término de la jornada, y un directivo firma un certificado con las horas de llegada y salida del apoderado.","s":[["c586"]]},
  {"id":"f61","m":"tea","t":"Permiso laboral para acudir al colegio","r":"Madres, padres o tutores de menores con TEA que trabajan con contrato pueden salir a atender emergencias en el establecimiento. Ese tiempo se considera trabajado y no puede tratarse como abandono del trabajo. El trabajador avisa a la Inspección del Trabajo.","s":[["l21545","art. 25, art. 66 quinquies del Código del Trabajo"],["teamin"]]},
  {"id":"f62","m":"tea","t":"Medidas disciplinarias y TEA","r":"Ninguna medida disciplinaria puede fundarse, directa o indirectamente, en la condición del estudiante. Los estudiantes con TEA no están exentos de las normas, pero no se sanciona una falta cuyo origen está vinculado a su condición.","s":[["c586"]]},
  {"id":"f63","m":"tea","t":"Lo que el colegio no puede exigir","r":"No se puede condicionar la matrícula a compromisos de los apoderados por los episodios de desregulación, ni condicionar la permanencia a que el estudiante tome medicamentos. El retiro anticipado solo es excepcional.","s":[["c586"]]},
  {"id":"f64","m":"tea","t":"Si sospechas que un estudiante tiene TEA","r":"La ley dice que los establecimientos derivan a salud a niños y niñas con sospecha de TEA, según el protocolo del Ministerio de Salud. Como inspector/a no diagnosticas: comparte lo que observas con el equipo de convivencia o PIE.","s":[["l21545","art. 12"]]},
  {"id":"f65","m":"tea","t":"Trato digno a la vista de todos","r":"Los establecimientos deben exhibir carteles con un mensaje claro y simple: las personas con autismo deben ser tratadas con dignidad y respeto en todo momento y en cualquier circunstancia.","s":[["c586"]]},
  {"id":"f66","m":"fis","t":"Ley 20.422 de inclusión de personas con discapacidad","r":"Busca asegurar la igualdad de oportunidades y la plena inclusión social de las personas con discapacidad. La discapacidad aparece cuando una deficiencia se encuentra con barreras del entorno que impiden participar plenamente.","s":[["l20422","arts. 1 y 5"]]},
  {"id":"f67","m":"fis","t":"Ajustes necesarios","r":"Medidas de adecuación del ambiente físico, social y de actitud que facilitan la accesibilidad de una persona con discapacidad, sin imponer una carga desproporcionada.","s":[["l20422","art. 8"]]},
  {"id":"f68","m":"fis","t":"Derecho a estudiar en la educación regular","r":"El Estado garantiza a las personas con discapacidad el acceso a establecimientos públicos y privados que reciben aportes del Estado. Los colegios regulares deben incorporar innovaciones, adecuaciones y recursos adicionales para que permanezcan y progresen.","s":[["l20422","arts. 34 y 36"]]},
  {"id":"f69","m":"div","t":"Discriminación arbitraria","r":"Toda distinción, exclusión o restricción sin justificación razonable que prive, perturbe o amenace el ejercicio de derechos fundamentales. Entre los motivos que la ley nombra está la discapacidad.","s":[["l20609","art. 2"]]},
  {"id":"f70","m":"div","t":"Dónde se reclama","r":"Ante la Superintendencia de Educación; ante el Juzgado de Policía Local por actos arbitrarios contra derechos de la Ley 20.422; o con la acción de no discriminación de la Ley 20.609 ante un juzgado de letras.","s":[["teamin"],["l20609"]]},
  {"id":"f71","m":"di","t":"NEE permanentes y transitorias","r":"Las permanentes son barreras que duran toda la escolaridad por una discapacidad diagnosticada. Las transitorias requieren apoyos extraordinarios durante un período para acceder o progresar en el currículum.","s":[["d170","art. 2"]]},
  {"id":"f72","m":"di","t":"Ejemplos de NEE","r":"Permanentes: autismo, discapacidad intelectual, auditiva o visual, disfasia y multidéficit. Transitorias: dificultades específicas del aprendizaje, trastorno específico del lenguaje, déficit atencional y rendimiento intelectual limítrofe.","s":[["pie"]]},
  {"id":"f73","m":"di","t":"Programa de Integración Escolar (PIE)","r":"Estrategia inclusiva que entrega apoyos adicionales a estudiantes con NEE, dentro de la sala regular. Los especialistas trabajan en colaboración con el profesor del curso, con co-enseñanza.","s":[["pie"]]},
  {"id":"f74","m":"di","t":"Evaluación diagnóstica de NEE","r":"Es integral e interdisciplinaria y la hacen profesionales idóneos inscritos en el registro del Ministerio. Requiere autorización de la familia y se reevalúa cada año.","s":[["d170","arts. 4, 11 y 15"],["pie"]]},
  {"id":"f75","m":"tutor","t":"¿Qué es un tutor sombra?","r":"Un acompañante que contrata la familia para apoyar a su hijo o hija en la sala. No es funcionario del colegio ni una figura regulada en detalle: la normativa lo deja al acuerdo entre el establecimiento y los apoderados.","s":[["copiapo"]]},
  {"id":"f76","m":"tutor","t":"¿Puede el colegio negar un tutor sombra?","r":"Debe dar razones fundadas. En 2024 la Corte de Copiapó ordenó permitir una tutora sombra porque el rechazo, sin justificación suficiente, fue arbitrario y discriminatorio para una estudiante con TEA. Ante una condición así se exige una justificación muy sólida.","s":[["copiapo"],["l21545","art. 18"],["l20609","art. 2"]]},
  {"id":"f77","m":"tutor","t":"Tutor sombra: tu rol como inspector/a","r":"Registra su ingreso como el de cualquier adulto externo, conoce por escrito los acuerdos con dirección (horario, espacios, funciones) y canaliza dudas al equipo PIE o de convivencia. El tutor apoya, pero el cuidado de los estudiantes sigue siendo responsabilidad del colegio.","s":[["c482","reglamento interno"],["copiapo"]]},
  {"id":"f78","m":"tutor","t":"Tutor sombra y PIE no son lo mismo","r":"El PIE es un apoyo del propio colegio, con profesionales especialistas. El tutor sombra lo financia la familia y no reemplaza los apoyos que el establecimiento debe entregar.","s":[["pie"],["copiapo"]]},
  {"id":"f79","m":"div","t":"Formación del personal","r":"Los colegios deben capacitar a su personal para dar una atención adecuada, oportuna e inclusiva, responder ante desregulaciones y promover la autorregulación y autonomía de los estudiantes.","s":[["c586"],["l21545","art. 20"]]},
  {"id":"f80","m":"ig","t":"Buen trato y conductos formales","r":"Desde la Ley 21.809, estudiantes y apoderados deben mantener siempre un buen trato con todo el personal y canalizar sus inquietudes por los conductos formales que fija el establecimiento. El/la inspector/a orienta al apoderado hacia ese conducto.","s":[["l21809","art. 1, nuevo art. 16 A LGE"]]},
  {"id":"f81","m":"ig","t":"Deber de reportar","r":"Funcionarios y adultos de la comunidad deben reportar al equipo directivo, o a quien defina el reglamento interno, toda información sobre hechos que puedan ser acoso, violencia o discriminación. Ver y callar no es una opción.","s":[["l21809","art. 16 E letra f) LGE"]]},
  {"id":"f82","m":"ig","t":"Revisión de mochilas","r":"La Ley 21.827 permite que el reglamento interno regule la revisión de mochilas y efectos personales. La hace personal autorizado y capacitado, sin contacto físico y nunca revisando la ropa puesta. Está prohibido pedir que el estudiante se desnude.","s":[["l21827","art. 1, nuevo art. 16 J LGE"]]},
  {"id":"f83","m":"tea","t":"Dos áreas centrales del autismo","r":"Minsal describe dos áreas: diferencias en la comunicación y la interacción social, y conductas e intereses restringidos y repetitivos. Las personas autistas son un grupo muy diverso: cada una necesita apoyos distintos, que van del nivel 1 al 3.","s":[["tea_ot","cap. 1, pp. 8, 16 y 17"]]},
  {"id":"f84","m":"tea","t":"Anticipar con apoyos visuales","r":"Los cambios no previstos y la falta de anticipación generan estrés. Agendas visuales, pictogramas, fotos u objetos reales ayudan a saber qué viene, dónde y en qué orden. Se adaptan a cada estudiante y se introducen de a poco.","s":[["tea_paec","pp. 29 a 31, 51 y 52"],["tea_guia08","pp. 25 y 28"]]},
  {"id":"f85","m":"tutor","t":"Requisitos citados en el fallo de Copiapó","r":"La Corte citó a la Seremi y al dictamen de Contraloría 2769 de 2019: autorización escrita firmada por las partes, idoneidad psicológica y moral, no estar inhabilitado para trabajar con menores, título técnico o profesional y cumplir el reglamento interno.","s":[["copiapo","considerando 7"],["l20594"]]},
  {"id":"f86","m":"tutor","t":"Apoyo dentro del aula común","r":"El PIE entrega sus apoyos en el contexto del aula común: los especialistas entran a la sala y hacen trabajo colaborativo con el profesor de curso. Todo acompañamiento individual se suma a ese trabajo y no lo reemplaza.","s":[["pie"],["copiapo"]]},
  {"id":"f87","m":"tutor","t":"Acompañar para la autonomía","r":"El Decreto 83 pide organizar el entorno y el tiempo para que el estudiante acceda de forma autónoma, y ofrecer opciones que promuevan su toma de decisiones. Acompañar no es hacer las cosas por el estudiante, sino ayudarle a participar.","s":[["d83","pp. 7 a 10"]]},
  {"id":"f88","m":"tutor","t":"Rutinas y transiciones","r":"Los cambios no previstos y las transiciones mal anticipadas generan estrés. Ayudan las agendas y secuencias visuales, los indicadores de tiempo y los protocolos para cambios de sala, pausas y recreos.","s":[["tea_paec","pp. 29 a 31"]]},
  {"id":"f89","m":"tutor","t":"Coordinación: cada adulto con su rol","r":"El PAEC puede incluir a docentes, asistentes de la educación y otros adultos con roles definidos. Quienes trabajan directamente con el estudiante deben conocer el plan y sus cambios, y la evaluación se hace junto a la familia.","s":[["tea_paec","pp. 24 a 26"],["c586"]]},
  {"id":"f90","m":"tutor","t":"Registro de avances y necesidades","r":"Las adecuaciones individuales se registran en el PACI, que también sigue su efectividad. El PAEC fija fechas de evaluación y revisión, y se sugieren entrevistas periódicas de seguimiento del estado emocional del estudiante.","s":[["d83","p. 8"],["tea_paec","pp. 27 y 31"]]},
  {"id":"f91","m":"crisis","t":"Conducta desafiante: ¿qué necesita?","r":"La conducta siempre comunica un mensaje. A veces no es desafío, sino que el estudiante no entendió lo que se le pidió. A mediano plazo se le enseñan habilidades alternativas que cumplan la misma función que esa conducta.","s":[["tea_paec","p. 35"],["tea_guia08","p. 44"],["dec","seguimiento"]]},
  {"id":"f92","m":"crisis","t":"Crisis hacia afuera y hacia adentro","r":"Mineduc distingue el meltdown (gritos, llanto, patadas) del shutdown (el estudiante se retira, puede dejar de hablar o buscar un lugar tranquilo). Ambos requieren atención: un estudiante callado también puede estar sobrepasado.","s":[["tea_paec","pp. 35 y 36"]]},
  {"id":"f93","m":"crisis","t":"Desescalar: primero el adulto se regula","r":"El adulto mantiene la calma y modela autorregulación. Usa lenguaje simple, valida lo que el estudiante siente, no debate ni negocia, evita el contacto físico no pedido y mantiene pocos adultos cerca.","s":[["tea_paec","pp. 32 a 34"]]},
  {"id":"f94","m":"crisis","t":"Seguimiento: aprender del episodio","r":"El protocolo define quién registra, cómo, y cómo y en qué plazo se informa a la familia. Luego se evalúan las respuestas usadas para mejorar, y se acuerda un tiempo y un encargado para la reparación.","s":[["tea_paec","p. 39"],["dec","reparación"]]},
  {"id":"f95","m":"tdah","t":"Qué es el déficit atencional","r":"Es un trastorno de inicio temprano, que surge en los primeros 7 años de vida. Se expresa en inatención, impulsividad y/o hiperactividad, en más de un contexto: hogar, escuela o actividades sociales.","s":[["d170","art. 40"],["tdah_guia"]]},
  {"id":"f96","m":"tdah","t":"Con y sin hiperactividad","r":"Con hiperactividad, se suma inquietud e impulsividad. Sin hiperactividad, el estudiante suele ser tranquilo y parece «estar en la luna», por lo que pasa inadvertido. En las niñas predomina la inatención y puede haber subdiagnóstico.","s":[["tdah_guia"]]},
  {"id":"f97","m":"tdah","t":"Funciones ejecutivas","r":"El Decreto 170 señala que el déficit atencional puede alterar el funcionamiento ejecutivo: planificación, organización y memoria de trabajo. Por eso cuesta iniciar, priorizar o «frenar» una respuesta ya activada.","s":[["d170","art. 41"],["tdah_guia"]]},
  {"id":"f98","m":"tdah","t":"Quién diagnostica","r":"La confirmación diagnóstica la hace el médico, con información de varias fuentes, incluido el informe escolar. El/la inspector/a puede aportar observaciones al equipo, pero no diagnostica ni etiqueta al estudiante.","s":[["tdah_minsal"],["d170","arts. 44 y 45"]]},
  {"id":"f99","m":"tdah","t":"Instrucciones por partes","r":"Entrega las instrucciones de forma parcelada y marca los pasos de la tarea. Antes de que empiece, comprueba que entendió lo que se le pidió.","s":[["tdah_guia"],["tdah_parv"]]},
  {"id":"f100","m":"tdah","t":"Rutinas claras y cambios avisados","r":"Las rutinas claras, reforzadas con juegos e imágenes, dan seguridad. Avisa con tiempo los cambios. Un cartel con las tareas y su duración ayuda a organizarse.","s":[["tdah_guia"],["tdah_parv"]]},
  {"id":"f101","m":"tdah","t":"Refuerzo antes que castigo","r":"La guía Mineduc pide priorizar los refuerzos por sobre los castigos y recriminaciones. Reconoce cada logro, por ejemplo, cuando logra mantenerse en su puesto. La crítica y la sobreexigencia no modifican la conducta.","s":[["tdah_guia"],["tdah_parv"]]},
  {"id":"f102","m":"tdah","t":"Nada de retos en público","r":"Evita los llamados de atención en público. Recupera primero el clima del grupo y conversa después a solas. No tomes los comentarios impulsivos como algo personal: pregunta con calma qué quiso decir.","s":[["tdah_guia"]]},
  {"id":"f103","m":"tdah","t":"Ubicación y movimiento","r":"Conviene sentarlo cerca del docente. Se le puede permitir levantarse o darle tareas con movimiento, como ayudar a repartir materiales. Las actividades con tiempo límite pueden aumentar su impulsividad y desorganización.","s":[["tdah_guia"],["tdah_parv"]]},
  {"id":"f104","m":"tdah","t":"Recreos y patio","r":"Los conflictos suelen concentrarse en recreos y momentos poco estructurados, y las acciones precipitadas aumentan el riesgo de accidentes. La guía sugiere un «contrato de convivencia de patio» trabajado con el Centro de Alumnos.","s":[["tdah_guia"]]},
  {"id":"f105","m":"tdah","t":"Familia, equipo y privacidad","r":"El apoyo funciona con la triada familia, profesor y especialista. La información de evaluaciones y medicación es privada: no se comenta ni se usa para etiquetar al estudiante.","s":[["tdah_guia"]]},
  {"id":"f106","m":"di","t":"Qué es la discapacidad intelectual","r":"Son limitaciones significativas en el funcionamiento intelectual y en la conducta adaptativa, que aparecen antes de los 18 años. Para el Decreto 170 deben darse los tres requisitos juntos.","s":[["d170","arts. 54 y 57"]]},
  {"id":"f107","m":"di","t":"Conducta adaptativa: tres áreas","r":"Conceptual: lenguaje, lectura, escritura y dinero. Social: relaciones, responsabilidad y normas. Práctica: comer, asearse, vestirse y desplazarse. Asistentes y docentes pueden aportar lo que observan en sala y recreos.","s":[["di_mesa"]]},
  {"id":"f108","m":"di","t":"Depende de los apoyos","r":"La discapacidad es un estado de funcionamiento que surge de la interacción del estudiante con su entorno. Puede variar según los apoyos que reciba, que pueden ser intermitentes, limitados, extensos o generalizados.","s":[["di_mesa"],["di_guia"]]},
  {"id":"f109","m":"di","t":"Instrucciones claras","r":"Da una orden a la vez y asegúrate de que la entendió. Usa frases cortas y claras. Refuerza lo que dices con apoyo visual, como imágenes o gestos.","s":[["di_guia"]]},
  {"id":"f110","m":"di","t":"Lectura fácil","r":"Frases cortas, una idea por frase y palabras de uso frecuente. Evita conceptos abstractos y metáforas. Acompaña con imágenes y usa letra grande. Antes de publicar, prueba el texto con otros lectores.","s":[["di_lf"]]},
  {"id":"f111","m":"di","t":"Autonomía sin sobreprotección","r":"Fomenta la autonomía con el apoyo estrictamente necesario. Divide las tareas complejas en pasos pequeños. La sobreprotección, la compasión y el rechazo son barreras de actitud.","s":[["di_guia"]]},
  {"id":"f112","m":"di","t":"DUA: tres principios","r":"El Diseño Universal para el Aprendizaje del Decreto 83 pide ofrecer múltiples medios de representación, de expresión y de participación, para que todos aprendan.","s":[["d83"]]},
  {"id":"f113","m":"di","t":"Participar en todo","r":"Los estudiantes con discapacidad intelectual deben sumarse a paseos, salidas pedagógicas y actividades dentro y fuera del colegio. La escuela es un espacio de participación para todos y todas.","s":[["di_guia"]]},
  {"id":"f114","m":"fis","t":"Baja visión y ceguera","r":"Para el Decreto 170, la baja visión permite una visión funcional con ayudas ópticas. La ceguera es una visión igual o menor a 0,05 en el mejor ojo, con la mejor corrección.","s":[["d170","art. 68"]]},
  {"id":"f115","m":"fis","t":"Hipoacusia y sordera","r":"La discapacidad auditiva incluye la hipoacusia (pérdida parcial) y la sordera (pérdida severa o total). La ley describe a la persona sorda como eminentemente visual, con derecho a la lengua de señas.","s":[["d170","art. 77"],["l20422","art. 6 letra h"]]},
  {"id":"f116","m":"fis","t":"Lengua de señas chilena (LSCh)","r":"La Ley 21.303 define la LSCh como lengua natural, originaria y patrimonio intangible de las personas sordas, y el Estado reconoce su carácter de lengua oficial de ellas. En su educación, la LSCh es la primera lengua y el español escrito la segunda.","s":[["l21303"],["l20422","arts. 26 y 34"]]},
  {"id":"f117","m":"fis","t":"Accesibilidad y diseño universal","r":"Accesibilidad universal: que entornos, productos y servicios puedan ser usados y comprendidos por todas las personas. Diseño universal: pensarlos desde el origen para que los use la mayor cantidad posible de personas.","s":[["l20422","art. 3"]]},
  {"id":"f118","m":"fis","t":"Guiar a una persona ciega","r":"Preséntate con tu nombre y función. Ofrécele tu brazo, sin tomar el suyo, porque pierde estabilidad. Háblale a ella, no a su acompañante. Ante un peligro, usa una orden clara: «alto, no siga».","s":[["fis_senadis"]]},
  {"id":"f119","m":"fis","t":"Hablar con una persona sorda","r":"Ubícate frente a ella, con tu rostro iluminado, y no subas el tono si no te lo pide. Para llamar su atención, usa un toque suave. Si usa LSCh, apóyate en un intérprete o en notas escritas.","s":[["fis_senadis"],["fis_emerg"]]},
  {"id":"f120","m":"fis","t":"Usuario/a de silla de ruedas","r":"Pregunta si necesita ayuda y cómo prefiere recibirla. No te apoyes en su silla ni la muevas sin su permiso. Para conversar, inclínate y quédate a su mismo nivel.","s":[["fis_senadis"]]},
  {"id":"f121","m":"fis","t":"Entorno ordenado y seguro","r":"Mantén estables los muebles y avisa antes cualquier cambio. Los espacios deben estar iluminados y señalizados, y las escaleras deben tener pasamanos y gomas antideslizantes. Retira los objetos peligrosos del suelo.","s":[["fis_visual"],["fis_motora"]]},
  {"id":"f122","m":"fis","t":"Palabras que sí y que no","r":"Di «persona sorda», no «sordomudo». Di «persona ciega», no «no vidente». Di «persona usuaria de silla de ruedas», no «confinada a una silla». Evita «minusválido», «sufre de» o «padece».","s":[["fis_lenguaje"]]},
  {"id":"f123","m":"der","t":"Formas de maltrato infantil","r":"Físico: acción no accidental que causa daño físico. Psicológico: humillaciones, hostigamiento verbal, rechazo o ser testigo de violencia familiar. Negligencia: no dar, pudiendo hacerlo, el cuidado y la protección necesarios. Abuso sexual: involucrar a un niño en actividades sexuales.","s":[["der_parvprot"]]},
  {"id":"f124","m":"der","t":"Indicadores de alerta","r":"Cambios de ánimo o conducta, retrocesos, alteraciones del sueño o la alimentación, higiene o alimentación deficientes, lesiones sin explicación o conductas sexuales no acordes a la edad. Las señales físicas aparecen en pocos casos: importa que haya varios indicadores juntos.","s":[["der_parvprot"],["der_folleto"]]},
  {"id":"f125","m":"der","t":"¿Delito o vulneración?","r":"Si los hechos pueden ser delito, se denuncia ante Fiscalía, Carabineros o PDI. Si es una vulneración que no es delito, se acude a los Tribunales de Familia o a la oficina local de protección de la comuna. En temas escolares, la Superintendencia de Educación recibe denuncias.","s":[["der_defvuln"],["der_defeduc"]]},
  {"id":"f126","m":"der","t":"Principios de la Convención y la Ley 21.430","r":"El interés superior del niño es un derecho, un principio y una norma de procedimiento. Niños, niñas y adolescentes tienen derecho a ser oídos y a que su opinión se considere según su edad y madurez (autonomía progresiva).","s":[["d830","arts. 3 y 12"],["l21430","arts. 7, 11 y 28"]]},
  {"id":"f127","m":"viol","t":"Tipos de violencia escolar","r":"Agresiones físicas; violencia psicológica (insultos, burlas, amenazas, también virtuales); violencia colectiva o social (rumores, aislamiento); violencia de género; violencia sexual; y discriminación, que también es un tipo de violencia.","s":[["viol_cart10"]]},
  {"id":"f128","m":"viol","t":"Agresividad no es lo mismo que violencia","r":"La agresividad es una reacción defensiva ante una amenaza. Se vuelve violencia cuando es desproporcionada o pasa a ser un modo permanente de relacionarse, con uso ilegítimo de la fuerza o el poder.","s":[["viol_cart10"]]},
  {"id":"f129","m":"viol","t":"Ciberacoso","r":"Intimidación, hostigamiento o humillación entre pares por medios digitales, sostenida en el tiempo y con una audiencia potencialmente ilimitada. La ley considera acoso el que ocurre por medios tecnológicos.","s":[["viol_cart10"],["l21809","art. 16 B LGE"]]},
  {"id":"f130","m":"viol","t":"Formas de violencia digital","r":"Grooming: un adulto gana la confianza de un menor por internet con fines sexuales. Sextorsión: chantaje con una imagen íntima. Happy slapping: grabar una agresión para difundirla. Doxing: divulgar datos privados de alguien.","s":[["viol_ciber"]]},
  {"id":"f131","m":"viol","t":"Los testigos importan","r":"En el acoso hay víctimas, agresores y testigos. Los testigos pueden reforzar al agresor, no intervenir o ayudar a la víctima. Los adultos deben evitar que se instale la «ley del silencio».","s":[["viol_cart10"],["viol_ciber"]]},
  {"id":"f132","m":"viol","t":"Proteger a la persona afectada","r":"Desde que el colegio conoce los hechos se aplican medidas de protección, como separar de aula a denunciante y denunciado. La suspensión de un estudiante como protección procede solo si no hay otra medida, por máximo 15 días hábiles y con monitoreo pedagógico.","s":[["l21809","art. 16 E letra j LGE"]]},
  {"id":"f133","m":"viol","t":"Discriminación arbitraria","r":"Toda distinción, exclusión o restricción sin justificación razonable que prive, perturbe o amenace derechos fundamentales, por motivos como nacionalidad, etnia, situación socioeconómica, orientación sexual, identidad de género, apariencia o discapacidad.","s":[["l20609","art. 2"]]},
  {"id":"f134","m":"viol","t":"Estereotipos y prejuicios","r":"Un estereotipo es una idea fija que generaliza; un prejuicio es un estereotipo con carga emocional negativa. Están en la base de la discriminación y del acoso. Si una agresión tiene motivación discriminatoria, se aplican medidas formativas de igualdad y no discriminación.","s":[["viol_cart7"],["l21809","art. 16 B LGE"]]},
  {"id":"f135","m":"viol","t":"Seguimiento del caso","r":"Tras derivar, el colegio monitorea el proceso y procura que la persona afectada siga su trayectoria educativa. La investigación con estudiantes dura como máximo dos meses y el equipo de convivencia evalúa si las medidas funcionaron.","s":[["viol_cart10"],["l21809","art. 16 E letra g LGE"]]},
  {"id":"f136","m":"seg","t":"PISE 2025: Seguridad Educativa","r":"En enero de 2025 Mineduc actualizó el manual, que ahora se llama Plan Integral de Seguridad Educativa. Es la herramienta de la comunidad para gestionar riesgos e integra programas preventivos y protocolos de respuesta.","s":[["seg_pise25","Presentación y p. 20"]]},
  {"id":"f137","m":"seg","t":"Metodología AIDEP","r":"Sirve para diagnosticar riesgos: Análisis histórico, Investigación en terreno, Discusión de prioridades, Elaboración del mapa de riesgos y Planificación del programa y los protocolos de respuesta.","s":[["seg_pise25","pp. 23-30"]]},
  {"id":"f138","m":"seg","t":"Metodología ACCEDER","r":"Ordena la respuesta a una emergencia: Alerta y alarma, Comunicación e información, Coordinación, Evaluación primaria, Decisiones, Evaluación secundaria y Readecuación del protocolo.","s":[["seg_pise25","pp. 33-37"]]},
  {"id":"f139","m":"seg","t":"Simulación y simulacro","r":"La simulación es un ejercicio de escritorio, en sala, con situaciones ficticias. El simulacro se hace en terreno y representa todos los pasos reales. El manual propone al menos uno al año por protocolo.","s":[["seg_pise25","pp. 32 y 38"],["seg_senapred_sim"]]},
  {"id":"f140","m":"seg","t":"Riesgos en patios y salas","r":"En la investigación en terreno se recorre el establecimiento buscando, por ejemplo, juegos de patio en mal estado, escaleras sin pasamanos ni goma antideslizante y pisos resbaladizos. Las vías de evacuación deben estar señalizadas y despejadas.","s":[["seg_pise25","pp. 16-17, 27 y 29"],["seg_listas"]]},
  {"id":"f141","m":"aux","t":"Primero, la escena segura","r":"Antes de acercarte, mira si hay peligros: cables, fuego, tránsito o derrumbes. Si tú te lesionas, no podrás ayudar. Mantén la calma y pide apoyo a otro adulto.","s":[["aux_cruzroja"],["aux_chcc_urg"]]},
  {"id":"f142","m":"aux","t":"¿Responde o no responde?","r":"Muévelo suavemente y pregúntale si está bien. Si no responde, no lo muevas, observa 3 a 5 segundos si su pecho sube y pide que alguien llame al 131.","s":[["aux_chcc_urg"]]},
  {"id":"f143","m":"aux","t":"Llamar al 131 SAMU","r":"Da la ubicación exacta, tu teléfono, cuántos afectados hay, su estado y edad aproximada. No cortes: quien atiende puede guiarte. Bomberos es el 132 y Carabineros el 133.","s":[["aux_cruzroja"],["aux_samu131"]]},
  {"id":"f144","m":"aux","t":"Heridas y caídas","r":"Lávate las manos, limpia la herida con agua y cúbrela con gasa o paño limpio. No retires un objeto incrustado ni un coágulo. No apliques cremas ni remedios caseros.","s":[["aux_cruzroja"],["aux_chcc_pa"]]},
  {"id":"f145","m":"aux","t":"Golpe en la cabeza","r":"No muevas al estudiante y revisa si está consciente. Si perdió el conocimiento, aunque sea breve, o vomita, necesita urgencia. Si no, aplica frío intermitente y obsérvalo.","s":[["aux_chcc_pa"]]},
  {"id":"f146","m":"aux","t":"Hemorragias","r":"Presiona la herida con gasa o paño limpio. Si se empapa, no lo retires: pon otro encima. En brazo o pierna, eleva la extremidad si no sospechas fractura. Pide ayuda urgente.","s":[["aux_chcc_urg"],["aux_cruzroja"]]},
  {"id":"f147","m":"aux","t":"Quemaduras","r":"Enfría con agua a temperatura ambiente 10 a 20 minutos y cubre con apósito limpio. No uses cremas, mantequilla ni hielo, y no rompas ampollas. Si es extensa o en cara, manos o genitales, va a urgencia.","s":[["aux_cruzroja"],["aux_chcc_pa"]]},
  {"id":"f148","m":"aux","t":"Convulsiones","r":"Pide el 131, protege la cabeza, retira objetos y ponlo de costado. No abras su boca ni metas nada entre los dientes, y no lo sujetes a la fuerza. Cuenta la duración: suele no pasar de 5 minutos.","s":[["aux_cruzroja"]]},
  {"id":"f149","m":"aux","t":"Atragantamiento","r":"Si tose o emite sonidos, anímalo a toser y pide ayuda. Si no puede respirar, hablar ni toser, se aplican golpes en la espalda y compresiones abdominales, técnica que requiere capacitación. Nunca busques a ciegas en la boca.","s":[["aux_cruzroja"],["aux_chcc_pa"]]},
  {"id":"f150","m":"aux","t":"RCP y desfibrilador (DEA)","r":"Si alguien no responde ni respira, llama al 131 y pide el DEA. La RCP la hace quien tiene capacitación certificada. La Ley 21.156 exige DEA en establecimientos de educación básica, media y superior.","s":[["aux_cruzroja"],["aux_samu_rcp"],["l21156"]]},
  {"id":"f151","m":"aux","t":"Sin medicamentos","r":"En primeros auxilios no se administran medicamentos, ni comida o líquidos a una persona inconsciente. Después se activa el protocolo de accidente escolar y se avisa a la familia.","s":[["aux_cruzroja"],["ds313","art. 11"]]},
  {"id":"f152","m":"sm","t":"¿Qué es la salud mental?","r":"Mineduc y Minsal, siguiendo el Plan Nacional de Salud Mental, la entienden como la capacidad de las personas para interactuar entre sí y con su entorno, e incluye el bienestar subjetivo y el desarrollo de sus potencialidades.","s":[["sm_c1"]]},
  {"id":"f153","m":"sm","t":"Rabia y frustración en la niñez","r":"La rabia es una emoción natural; se vuelve dañina cuando se expresa con agresión. Las pataletas son esperables entre los 2 y 4 años. El adulto se mantiene calmado, nombra la emoción y acompaña; dejar al niño solo en «tiempo fuera» no ayuda.","s":[["sm_ccrabia"],["sm_ccpat"]]},
  {"id":"f154","m":"sm","t":"Señales de alerta en niños y niñas","r":"Rabietas frecuentes o irritabilidad intensa, hablar seguido de miedos o preocupaciones, dolores de estómago o cabeza sin causa médica, problemas de sueño, poco interés en jugar con otros o una baja reciente en las notas.","s":[["sm_c3","tabla 1, p. 9"]]},
  {"id":"f155","m":"sm","t":"Señales de alerta en adolescentes","r":"Pérdida de interés en lo que disfrutaba, poca energía, cambios de sueño, pasar cada vez más tiempo solo, dietas o ejercicio excesivo, autolesiones, consumo de alcohol o drogas, conductas de riesgo o ideas suicidas.","s":[["sm_c3","tabla 1, p. 9"]]},
  {"id":"f156","m":"sm","t":"Primera respuesta: acoger y escuchar","r":"Acoger en un espacio seguro, dar apoyo emocional, escuchar activamente sin presionar a que hable, ayudar a calmarse, identificar a su adulto responsable y protegerlo de peligros. Es una ayuda no invasiva, no una terapia.","s":[["sm_c3","sección II, p. 10"]]},
  {"id":"f157","m":"sm","t":"Aislamiento: una señal que se previene","r":"Pasar cada vez más tiempo solo es una señal de alerta, y la falta de amistades positivas es un factor de riesgo. Mineduc propone escuchar, ofrecer talleres de artes y deporte y proteger activamente a quienes sufren exclusión.","s":[["sm_c3","p. 9"],["sm_c1"],["sm_c2","recomendaciones 8 y 10"]]},
  {"id":"f158","m":"sm","t":"Cuándo y cómo se deriva a salud","r":"Se deriva si las señales duran semanas o meses, o si la familia o el estudiante piden ayuda. Pasada la crisis, el equipo decide con la familia, entrega la ficha de derivación y el apoderado pide hora en el CESFAM de su domicilio.","s":[["sm_c3","pp. 12 y 13"]]},
  {"id":"f159","m":"sm","t":"Señales de alerta de riesgo suicida","r":"Minsal distingue señales directas, como buscar formas de morir o hacer actos de despedida, e indirectas, como bajar el rendimiento o aumentar el consumo de alcohol o drogas. Toda conducta autolesiva debe ser atendida.","s":[["sm_suic","pp. 12 y 16"]]},
  {"id":"f160","m":"sm","t":"Ante señales de riesgo suicida","r":"Minsal propone cuatro pasos: mostrar interés y apoyo en privado, preguntar y evaluar el riesgo, apoyar, contactar y derivar, y hacer seguimiento. Si el riesgo es inminente, se lleva al servicio de urgencia más cercano y se avisa a los padres.","s":[["sm_suic","pp. 34 a 40"]]},
  {"id":"f161","m":"sm","t":"Líneas de ayuda de Minsal","r":"*4141: línea de prevención del suicidio, gratuita, 24 horas, desde cualquier celular, atendida por psicólogos. Salud Responde 600 360 7777: atención 24 horas que incluye orientación y contención psicológica.","s":[["sm_4141"],["sm_sr"]]},
  {"id":"f162","m":"sm","t":"Límites del rol y confidencialidad","r":"El personal da una primera respuesta y conecta con ayuda; no diagnostica ni trata. La confidencialidad tiene límites ante riesgo vital o de daño. A la familia se le informan las señales observadas, sin entregar información sensible del estudiante.","s":[["sm_c3"],["sm_suic","pp. 38 y 39"]]},
  {"id":"f163","m":"parv","t":"Niveles de educación parvularia","r":"Las Bases Curriculares organizan tres niveles: Sala Cuna (hacia los 2 años), Medio (hacia los 4) y Transición (hacia los 6). Son referencias flexibles, no plazos rígidos.","s":[["parv_bcep","pp. 41-43"]]},
  {"id":"f164","m":"parv","t":"Cada niño, su ritmo","r":"El desarrollo abarca lo motor, el lenguaje, el juego y lo socioemocional. Cada niño o niña tiene un ritmo propio y la variación es normal. Los hitos por edad son guías generales.","s":[["parv_chcc_des"]]},
  {"id":"f165","m":"parv","t":"Ámbitos y juego","r":"Las Bases tienen tres ámbitos: Desarrollo Personal y Social, Comunicación Integral, e Interacción y Comprensión del Entorno. El juego es un concepto central y la actividad rectora en el jardín.","s":[["parv_bcep","pp. 26, 32 y 46-94"]]},
  {"id":"f166","m":"parv","t":"Pataletas de 2 a 4 años","r":"Son frecuentes, normales y esperables, y una forma de comunicar frustración, no de molestar. Ayuda mantener la calma, acompañar y nombrar la emoción. Los gritos y el «tiempo fuera» no ayudan.","s":[["parv_chcc_pat"]]},
  {"id":"f167","m":"parv","t":"Supervisión constante","r":"Los menores de 5 años deben estar vigilados todo el tiempo. Nunca se deja solo a un niño o niña pequeño, y en la muda o el baño se mantiene una mano sobre el bebé.","s":[["parv_chcc_seg"],["parv_chcc_les"]]},
  {"id":"f168","m":"parv","t":"Accidentes más comunes","r":"En los más pequeños son más comunes las caídas, las quemaduras y los envenenamientos. Revisa que los juegos sean sólidos, sin bordes filosos y con piso blando, y guarda los productos peligrosos fuera de su alcance.","s":[["parv_chcc_les"],["parv_chcc_seg"]]},
  {"id":"f169","m":"parv","t":"Rutinas de cuidado","r":"Alimentación, higiene, sueño y vigilia son oportunidades de aprendizaje y autonomía progresiva. El reglamento interno regula la higiene en la muda, el baño y la alimentación, con énfasis en el lavado de manos.","s":[["parv_bcep","pp. 50-52"],["parv_ori_ri","p. 18"]]},
  {"id":"f170","m":"parv","t":"Conflictos entre párvulos","r":"Los conflictos entre niños y niñas no dan lugar a medidas disciplinarias. Se usan medidas pedagógicas o formativas: empatía, resolución de conflictos y comprensión de normas. Las sanciones son solo para adultos.","s":[["parv_ori_ri","pp. 22-23"]]},
  {"id":"f171","m":"parv","t":"Familiarización al ingresar","r":"Cada niño o niña se adapta a su ritmo, con avances y retrocesos. Ayudan una despedida tranquila y breve, un objeto de apego y un breve perfil que la familia entrega al equipo.","s":[["parv_famil26"],["parv_junji_ing"]]},
  {"id":"f172","m":"parv","t":"Transiciones educativas","r":"Son hitos de la trayectoria: el ingreso al sistema, el paso entre niveles y el paso a 1° básico. Se acompañan anticipando el cambio, cuidando el vínculo y dialogando con las familias.","s":[["parv_trans","pp. 2-4 y 15-18"]]},
  {"id":"f173","m":"parv","t":"Accidentes y retiros en el reglamento","r":"El reglamento interno incluye un protocolo de accidentes: cuándo derivar a un centro asistencial y quién avisa a la familia, con contactos de emergencia al día. En retiros anticipados se registra horario, motivo y adulto a cargo.","s":[["parv_ori_ri","pp. 16 y 19-20"]]},
  {"id":"f174","m":"parv","t":"Circular 860 vigente","r":"La Circular 860 de 2018 de la Superintendencia regula los reglamentos internos de educación parvularia y sigue vigente. En 2026 se modificó su procedimiento de baja por ausencia injustificada.","s":[["parv_r324"],["parv_r651"]]},
  {"id":"f175","m":"asis","t":"Ausentismo crónico","r":"Es faltar el 10% o más de los días del año escolar. Toda ausencia cuenta, sea justificada o no.","s":[["asis_idps_gestion","pp. 2-4"]]},
  {"id":"f176","m":"asis","t":"La inasistencia avisa","r":"La inasistencia es el principal predictor del retiro escolar. La deserción es el final de un proceso gradual de desvinculación, por eso conviene actuar temprano.","s":[["asis_ret20","p. 19"],["asis_cdc"]]},
  {"id":"f177","m":"asis","t":"Barreras para asistir","r":"Hay factores familiares (cuidar hermanos, trabajar), escolares (normas rígidas, suspensiones, clima de convivencia) y del estudiante (salud física o mental, sobreedad, bajo desempeño).","s":[["asis_ret20","pp. 15-17"]]},
  {"id":"f178","m":"asis","t":"Señales de alerta","r":"Además de las faltas, conviene mirar atrasos, anotaciones, sanciones, retiros anticipados, notas bajas y dificultades en el cambio de ciclo.","s":[["asis_ret20","pp. 16 y 32"]]},
  {"id":"f179","m":"asis","t":"Registro de asistencia","r":"El libro de clases, físico o digital, debe tener el registro de control de asistencia. El libro digital deja constancia de cada ingreso, modificación o eliminación de datos.","s":[["asis_ede"]]},
  {"id":"f180","m":"asis","t":"Analizar los datos","r":"Calcula la asistencia acumulada de cada estudiante (registro interno o SIGE), sepárala por curso y ciclo, y repite el análisis cada mes. La nómina de ausentismo crónico es confidencial.","s":[["asis_idps_gestion","pp. 4-6"]]},
  {"id":"f181","m":"asis","t":"Hablar con las familias","r":"Muestra a los apoderados por qué importa asistir, sin presentarlo como una norma arbitraria. Pregunta qué dificulta la asistencia: puede haber razones válidas.","s":[["asis_idps_consejo"],["asis_ret20","p. 46"]]},
  {"id":"f182","m":"asis","t":"Acompañar y revincular","r":"Mineduc propone tutorías con apoyo afectivo y académico, seguimiento de casos con apoyo psicosocial, comunicación frecuente con las familias y apoyo con vestuario o materiales.","s":[["asis_ret20","p. 46"]]},
  {"id":"f183","m":"asis","t":"Plan de asistencia y permanencia","r":"En 2022 Mineduc lanzó un plan para promover la asistencia y revincular estudiantes: reportes a sostenedores, mesas provinciales, tutorías y campañas para familias.","s":[["asis_plan22"],["asis_subeduc22"]]},
  {"id":"f184","m":"asis","t":"Equipos de revinculación","r":"Desde 2023, Equipos Territoriales de Revinculación y Asistencia visitan hogares de estudiantes desmatriculados o con inasistencia grave, junto a municipios, SLEP y redes. Usan los registros de cada establecimiento.","s":[["asis_equipos23"]]},
  {"id":"f185","m":"adm","t":"Circular de registros de información","r":"La Superintendencia regula, mediante la Circular aprobada por la Res. Ex. 30 de 2021, los registros que deben llevar los establecimientos con reconocimiento oficial. Reemplazó las reglas antiguas sobre libro de clases, asistencia y registro de salida de estudiantes.","s":[["adm_rex30"]]},
  {"id":"f186","m":"adm","t":"Libro de clases digital","r":"Usarlo es opcional, pero Mineduc lo recomienda. Para la fiscalización el colegio debe elegir un formato, papel o digital, y no ambos. Se puede cambiar a digital durante el año, traspasando antes lo registrado en papel.","s":[["adm_ede"]]},
  {"id":"f187","m":"adm","t":"Qué debe tener el libro","r":"El libro digital contiene los mismos registros que el de papel: datos de los estudiantes, control de asignaturas, control de asistencia, evaluaciones y anotaciones de convivencia por estudiante, entre otros.","s":[["adm_ede"]]},
  {"id":"f188","m":"adm","t":"Trazabilidad","r":"El software del libro digital debe registrar todas las acciones que se hagan en él, incluidas modificaciones y eliminaciones, y respaldar la información por al menos cinco años para la fiscalización. Nada se borra sin dejar huella.","s":[["adm_ede"]]},
  {"id":"f189","m":"adm","t":"Firma digital del docente","r":"En el libro digital no se firma a mano: se usa un verificador de identidad que genera un código dinámico personal. Para obtenerlo se necesita Clave Única.","s":[["adm_ede"]]},
  {"id":"f190","m":"adm","t":"Datos personales y secreto","r":"Quienes trabajan con datos personales deben guardar secreto sobre ellos, y los datos solo se usan para los fines con que se recolectaron. Lo rige la Ley 19.628.","s":[["l19628","arts. 7 y 9"]]},
  {"id":"f191","m":"adm","t":"Datos sensibles","r":"Son los que se refieren a características físicas o morales de las personas, como estado de salud. Por regla general no pueden tratarse, salvo las excepciones que fija la ley. Por eso se manejan con máxima reserva.","s":[["l19628","arts. 2 g y 10"]]},
  {"id":"f192","m":"adm","t":"Nueva ley de datos: Ley 21.719","r":"Publicada en diciembre de 2024, rige desde el 1 de diciembre de 2026. Exige tratar datos de niños, niñas y adolescentes según su interés superior y autonomía progresiva, y mantener confidencialidad sobre los datos.","s":[["l21719","art. 1° transitorio; arts. 14 bis y 16 quáter"]]},
  {"id":"f193","m":"adm","t":"Canal confidencial de denuncias","r":"El reglamento interno debe incluir un canal seguro y confidencial para recibir denuncias con reserva de identidad, que evite la revictimización. Quien registra o recibe una denuncia cuida esa reserva.","s":[["l21809","art. 16 E letra e) LGE"]]},
  {"id":"f194","m":"adm","t":"Actas y constancia","r":"Las reuniones y acuerdos sobre seguridad deben quedar en actas formales. Tras un evento crítico se documentan todos los antecedentes para ajustar el protocolo.","s":[["adm_crit","pp. 11 y 27"]]},
  {"id":"f195","m":"com","t":"Derechos de los apoderados","r":"La LGE reconoce a padres, madres y apoderados el derecho a ser informados sobre el rendimiento, la convivencia y el proceso educativo de sus hijos, y a ser escuchados y participar en lo que les corresponde.","s":[["lge","art. 10 letra b)"]]},
  {"id":"f196","m":"com","t":"Deberes de los apoderados","r":"Entre otros: educar a sus hijos, informarse, respetar la normativa interna y dar un trato respetuoso a toda la comunidad educativa. También deben supervisar el uso de celulares de sus hijos.","s":[["lge","art. 10 letra b)"]]},
  {"id":"f197","m":"com","t":"Escucha activa","r":"Es poner atención a lo que la otra persona quiere comunicar. Se practica parafraseando lo que dice y reflejando cómo se siente: «Entiendo que está preocupada porque…».","s":[["com_crit","p. 10"]]},
  {"id":"f198","m":"com","t":"Comunicación respetuosa","r":"Un vínculo de respeto y buen trato es la base de una relación de reciprocidad con las familias. El colegio debe ofrecer canales expeditos de comunicación y participación para todas las familias por igual.","s":[["com_agencia"]]},
  {"id":"f199","m":"com","t":"Corresponsabilidad","r":"La política Mineduc de participación de las familias se basa, entre otros principios, en la corresponsabilidad en la tarea formativa y en la escuela como principal agente de involucramiento de las familias.","s":[["com_polfam"]]},
  {"id":"f200","m":"com","t":"Calma ante situaciones tensas","r":"Mineduc recalca que en situaciones críticas lo más importante es mantener la calma. Habla con voz tranquila, escucha sin interrumpir y no respondas a las provocaciones.","s":[["com_crit","p. 18"],["dec","p. 8"]]},
  {"id":"f201","m":"com","t":"Agresión de un apoderado","r":"Las agresiones de apoderados contra funcionarios son violencia en el trabajo ejercida por terceros, y el colegio debe aplicar los protocolos del reglamento interno. La Ley 21.827 permite además suspender su derecho de ingreso al establecimiento.","s":[["l21809","art. 16 B LGE"],["l21827","art. 7"]]},
  {"id":"f202","m":"com","t":"Citación formal obligatoria","r":"El apoderado debe comparecer a toda citación formal del colegio en el marco de medidas disciplinarias o protocolos de convivencia, en persona o por un medio remoto idóneo. Solo se excusa por causa justificada y acreditada.","s":[["estatuto","art. 8 bis"],["l21827","art. 3"]]},
  {"id":"f203","m":"com","t":"Derecho a ser oído","r":"Ante una medida disciplinaria, el estudiante y su apoderado tienen derecho a ser oídos, presentar descargos y pedir reconsideración. Comunicar un incidente incluye informarles cómo ejercer ese derecho.","s":[["l21809","art. 16 E letra i) LGE"]]},
  {"id":"f204","m":"com","t":"Límites y reserva","r":"Con un apoderado se habla solo de su propio hijo o hija. La información de otros estudiantes es reservada: quien trabaja con datos personales debe guardar secreto.","s":[["l19628","art. 7"]]},
  {"id":"f205","m":"lid","t":"Función docente-directiva","r":"El Estatuto Docente la define como la función profesional de nivel superior que se ocupa de la dirección, administración, supervisión y coordinación de la educación. En la educación municipal, el director designa y remueve al inspector general.","s":[["estatuto","arts. 7 y 7 bis"]]},
  {"id":"f206","m":"lid","t":"Deberes de los equipos directivos","r":"La LGE les exige liderar los establecimientos a su cargo y promover en los docentes el desarrollo profesional necesario para cumplir sus metas educativas.","s":[["lge","art. 10 letra e)"]]},
  {"id":"f207","m":"lid","t":"Categorías de asistentes","r":"La Ley 19.464 distingue funciones profesionales, de paradocencia y de servicios auxiliares. En la educación pública de los Servicios Locales, la Ley 21.109 usa cuatro categorías: profesional, técnica, administrativa y auxiliar.","s":[["l19464","art. 2"],["l21109","art. 5"]]},
  {"id":"f208","m":"lid","t":"Formación del equipo","r":"Los asistentes tienen derecho a participar en programas de perfeccionamiento. En la educación pública, la Ley 21.109 establece que participan en actividades formativas acordes a sus funciones.","s":[["l19464","art. 5"],["l21109","art. 13"]]},
  {"id":"f209","m":"lid","t":"Equipo de convivencia educativa","r":"Desde la Ley 21.809, el equipo de convivencia es liderado por un/a coordinador/a de convivencia educativa, profesional con jornada completa. El equipo elabora el Plan de gestión de convivencia, que aprueba el director.","s":[["l21809","arts. 15 y 16 D LGE"]]},
  {"id":"f210","m":"lid","t":"Roles con subrogantes","r":"Mineduc recomienda asignar claramente cada rol ante emergencias, con encargados y subrogantes. Así, si alguien falta en un turno, otra persona ya sabe qué hacer.","s":[["lid_crit","p. 11"]]},
  {"id":"f211","m":"lid","t":"Ley Karin: medidas de resguardo","r":"Recibida una denuncia de acoso o violencia, el empleador debe adoptar de inmediato medidas de resguardo, como separar espacios físicos, redistribuir la jornada o dar atención psicológica temprana.","s":[["l21643","art. 211-B bis Código del Trabajo"]]},
  {"id":"f212","m":"lid","t":"Ley Karin: investigación","r":"La investigación es reservada, debe oír a ambas partes y concluir en 30 días. Si el empleador no investiga internamente, deriva la denuncia a la Inspección del Trabajo en 3 días.","s":[["l21643","arts. 211-B y 211-C Código del Trabajo"]]},
  {"id":"f213","m":"lid","t":"Mejora continua","r":"Tras un evento crítico se documentan los antecedentes para ajustar el protocolo y se fija un periodo de seguimiento a las personas afectadas. Los Estándares Indicativos de Desempeño buscan apoyar la mejora continua.","s":[["lid_crit","pp. 26-27"],["lid_eid"]]},
  {"id":"f214","m":"lid","t":"Marco para la Buena Dirección","r":"Documento del CPEIP de Mineduc, actualizado en 2014, que agrupa las prácticas de liderazgo escolar en cinco dimensiones y describe los recursos personales necesarios para ejercerlas.","s":[["lid_mbdle"]]},
  {"id":"f215","m":"div","t":"Estudiantes migrantes: derecho a estudiar","r":"El Estado garantiza a los extranjeros menores de edad el acceso a la educación parvularia, básica y media. Ese derecho no puede negarse ni limitarse por su condición migratoria irregular.","s":[["l21325","art. 17"]]},
  {"id":"f216","m":"div","t":"IPE: identificador provisorio escolar","r":"Es un número único que entrega el Mineduc a estudiantes extranjeros sin RUN chileno. Se pide en línea o en una oficina Ayuda Mineduc, y se puede solicitar aunque el niño no tenga documento.","s":[["div_ipe"]]},
  {"id":"f217","m":"div","t":"Con IPE, los mismos derechos","r":"El estudiante con IPE tiene los mismos derechos que cualquier estudiante chileno en alimentación, textos, seguro y pase escolar. El IPE también permite certificar estudios y rendir exámenes de validación.","s":[["div_ipe_ayuda"]]},
  {"id":"f218","m":"div","t":"Interculturalidad","r":"La Ley General de Educación pide reconocer y valorar a cada estudiante en su especificidad cultural y de origen, considerando su lengua, cosmovisión e historia.","s":[["lge","art. 3 letra m"]]},
  {"id":"f219","m":"div","t":"Pueblos originarios","r":"La Ley 19.253 reconoce, entre otros, a los pueblos Mapuche, Aimara, Rapa Nui, Atacameño, Quechua, Colla, Diaguita, Chango, Kawashkar, Yagán y Selk'nam. La discriminación manifiesta e intencionada contra indígenas se sanciona con multa.","s":[["l19253","arts. 1 y 8"]]},
  {"id":"f220","m":"div","t":"Motivos de discriminación","r":"La Ley 20.609 nombra, entre otros: raza o etnia, nacionalidad, situación socioeconómica, idioma, religión, sexo, orientación sexual, identidad y expresión de género, apariencia personal, enfermedad o discapacidad.","s":[["l20609","art. 2"]]},
  {"id":"f221","m":"div","t":"Aislar también es acoso","r":"El acoso escolar es agresión u hostigamiento reiterado entre estudiantes que provoca maltrato, humillación o fundado temor. La ley incluye el aislamiento injustificado y el ignorar deliberadamente a un estudiante.","s":[["lge","art. 16 B"]]},
  {"id":"f222","m":"div","t":"Estudiantes trans: Circular 812","r":"Los adultos deben usar el nombre social del estudiante en los espacios educativos; el nombre legal se usa en documentos oficiales. Puede usar el uniforme que considere acorde a su identidad y se le dan facilidades para el uso de baños.","s":[["div_c812"]]},
  {"id":"f223","m":"div","t":"Reconocimiento de identidad de género","r":"Se solicita una entrevista con el director/a, que debe concretarse en un máximo de 5 días hábiles. Los acuerdos, medidas y plazos quedan en un acta simple firmada. El procedimiento debe estar en el reglamento interno.","s":[["div_lgtbi"]]},
  {"id":"f224","m":"etica","t":"Tus deberes como asistente","r":"La LGE pide a los asistentes de la educación ejercer su función en forma idónea y responsable, respetar las normas del establecimiento y brindar un trato respetuoso a todos los integrantes de la comunidad.","s":[["lge","art. 10 letra d"]]},
  {"id":"f225","m":"etica","t":"Tus derechos como asistente","r":"Trabajar en un ambiente tolerante y de respeto mutuo, que se respete tu integridad, no ser objeto de tratos vejatorios o degradantes y recibir un trato respetuoso.","s":[["lge","art. 10 letra d"]]},
  {"id":"f226","m":"etica","t":"Trato digno a estudiantes","r":"Los estudiantes tienen derecho a que se respete su integridad física y moral y a no ser objeto de tratos vejatorios o degradantes. La disciplina escolar debe ser compatible con la dignidad humana del niño.","s":[["lge","art. 10 letra a"],["d830","art. 28.2"]]},
  {"id":"f227","m":"etica","t":"El buen trato es la regla","r":"La Ley 21.809 dispone que las relaciones de los adultos con niños, niñas y adolescentes se rijan por el buen trato, con atención a los derechos de la Constitución y de la Ley 21.430, garantizando la dignidad de todas las personas.","s":[["l21809","art. 16 A LGE"]]},
  {"id":"f228","m":"etica","t":"Vida libre de violencia","r":"La Ley 21.430 prohíbe la violencia, los malos tratos físicos o psíquicos y los tratos negligentes hacia niños, niñas y adolescentes. Si quien agrede es un adulto con autoridad, como un asistente, la falta es de especial gravedad.","s":[["l21430","art. 36"],["l21809","art. 16 B LGE"]]},
  {"id":"f229","m":"etica","t":"Datos sensibles y secreto","r":"Son datos sensibles, entre otros, el estado de salud físico o psíquico, el origen racial y las creencias. Solo se tratan si la ley lo autoriza o hay consentimiento. Quien trabaja con datos debe guardar secreto, incluso después de dejar el cargo.","s":[["l19628","arts. 2 letra g, 7 y 10"]]},
  {"id":"f230","m":"etica","t":"Vida privada, honra e imagen","r":"Niños, niñas y adolescentes tienen derecho a su vida privada, honra, intimidad, propia imagen y protección de sus datos personales. Por eso no se exponen sus problemas ni se difunden sus fotos o antecedentes.","s":[["l21430","arts. 33 y 34"],["d830","art. 16"]]},
  {"id":"f231","m":"etica","t":"Medidas proporcionales","r":"Las medidas disciplinarias deben ser proporcionales, con procedimiento previo, derecho a descargos y reconsideración. Nunca pueden fundarse, directa o indirectamente, en la discapacidad o en necesidades educativas especiales.","s":[["l21809","art. 16 E letra i LGE"],["l21827","art. 3"]]},
  {"id":"f232","m":"etica","t":"Límites del rol","r":"No investigas delitos (lo hace la Fiscalía), no diagnosticas ni haces terapia: el colegio no realiza procesos terapéuticos reparatorios. Acoges, registras, informas y derivas según el reglamento interno.","s":[["viol_cart10"],["l21809","art. 16 E letra f LGE"]]},
  {"id":"f233","m":"etica","t":"Tu práctica nunca es neutra","r":"Los adultos son garantes de derechos: sus actitudes y su lenguaje influyen en la inclusión. Evita bromas o comentarios basados en estereotipos sobre origen, género, orientación sexual o discapacidad.","s":[["viol_cart7"],["l20609","art. 2"]]}
];

  {"id":"p3","m":"ig","n":1,"q":"¿Qué nivel de estudios exige la Ley 19.464 para la paradocencia?","o":["Título universitario","Licencia de enseñanza media y, si corresponde, título técnico","Solo enseñanza básica","No exige estudios"],"c":1,"e":"Para paradocencia se exige licencia de enseñanza media y, cuando corresponda, un título de nivel técnico.","s":[["l19464","art. 2"]]},
  {"id":"p4","m":"viol","n":1,"q":"Ves que un estudiante es hostigado por compañeros. Según la Ley 21.809, tú:","o":["Solo intervienes si lo pide el apoderado","Tienes el deber de reportarlo al equipo directivo o a quien indique el reglamento","Esperas a que ocurra tres veces","Lo comentas con el curso"],"c":1,"e":"El personal tiene el deber de reportar los hechos que puedan ser acoso, violencia o discriminación.","s":[["l21809","art. 16 E letra f LGE"]]},
  {"id":"p5","m":"etica","n":2,"q":"¿Qué crea la Ley 20.594?","o":["El seguro escolar","Inhabilidades para trabajar con menores para condenados por delitos sexuales contra ellos","El cargo de inspector general","La Superintendencia de Educación"],"c":1,"e":"Crea inhabilidades y un registro que los empleadores pueden consultar antes de contratar a quien trabajará con niños.","s":[["l20594"]]},
  {"id":"p6","m":"lid","n":2,"q":"La Ley Karin (21.643) se aplica en un colegio a:","o":["Solo estudiantes","Solo apoderados","Los trabajadores del establecimiento","Solo directivos"],"c":2,"e":"Trata el acoso laboral, el acoso sexual y la violencia en el trabajo.","s":[["l21643"]]},
  {"id":"p7","m":"conv","n":1,"q":"¿Desde cuándo rige la Ley 21.809 de convivencia educativa?","o":["Desde 2011","Desde el 1 de julio de 2026","Desde 2018","Aún no rige"],"c":1,"e":"Se publicó el 1 de abril de 2026 y entró en vigencia el 1 de julio de 2026.","s":[["l21809"]]},
  {"id":"p8","m":"ig","n":1,"q":"¿Qué institución fiscaliza el cumplimiento de la normativa educacional?","o":["Agencia de Calidad de la Educación","Superintendencia de Educación","JUNAEB","Consejo Nacional de Educación"],"c":1,"e":"La Superintendencia fiscaliza; la Agencia de Calidad evalúa y orienta.","s":[["l20529"]]},
  {"id":"p9","m":"conv","n":1,"q":"La Ley de Inclusión prohíbe expulsar a un estudiante por:","o":["Agredir sexualmente a un compañero","Su rendimiento académico","Portar un arma","Agredir a un docente con lesiones"],"c":1,"e":"Ni el rendimiento ni la situación socioeconómica pueden fundar una expulsión.","s":[["l20845"],["dfl2_98","art. 6 d"]]},
  {"id":"p10","m":"ig","n":2,"q":"¿Qué pasó con la Circular 482 de la Superintendencia en 2026?","o":["Fue derogada en enero","Sigue vigente, porque se derogaron las circulares 781 y 782 que la iban a reemplazar","Se transformó en ley","Solo rige para jardines infantiles"],"c":1,"e":"La Resolución Exenta 324 de abril de 2026 derogó las circulares 781 y 782 y mantuvo vigente la Circular 482.","s":[["c482"]]},
  {"id":"p11","m":"seg","n":2,"q":"¿Qué ley de 2026 permite revisar mochilas en los colegios?","o":["Ley 21.128","Ley 21.827 Escuelas Protegidas","Ley 20.536","Ley 21.430"],"c":1,"e":"La Ley 21.827 lo permite si el reglamento interno lo contempla, con resguardos.","s":[["l21827"]]},
  {"id":"p12","m":"der","n":2,"q":"Con la Ley 21.430, ¿a qué oficinas pueden acudir niños y niñas por orientación o ayuda?","o":["Oficinas Locales de la Niñez","Departamentos Provinciales","Oficinas de Convivencia Comunal","Juzgados de Policía Local"],"c":0,"e":"La Ley 21.430 menciona las Oficinas Locales de la Niñez como lugar al que niños, niñas y adolescentes pueden acudir.","s":[["l21430","art. 11"]]},
  {"id":"p13","m":"conv","n":1,"q":"¿Qué distingue al acoso escolar de un conflicto puntual?","o":["Que ocurra en el patio","Que la agresión u hostigamiento sea reiterado","Que participen más de dos estudiantes","Que haya garabatos"],"c":1,"e":"La ley lo define como agresión u hostigamiento reiterado que provoca maltrato, humillación, temor o un clima hostil.","s":[["l21809","art. 16 B LGE"]]},
  {"id":"p14","m":"viol","n":1,"q":"Un estudiante es humillado en el grupo de WhatsApp del curso, fuera del horario escolar. ¿Corresponde actuar al colegio?","o":["No, pasó fuera del colegio","Sí, el acoso puede ocurrir fuera del establecimiento y por medios tecnológicos","Solo si se usó el wifi del colegio","Solo si el apoderado lo pide por escrito"],"c":1,"e":"La definición legal incluye el acoso fuera del establecimiento y por medios tecnológicos.","s":[["l21809","art. 16 B LGE"]]},
  {"id":"p15","m":"conv","n":1,"q":"¿Quién lidera el equipo de convivencia según la Ley 21.809?","o":["El inspector general","El coordinador o coordinadora de convivencia educativa","El presidente del centro de padres","El sostenedor"],"c":1,"e":"La ley crea la coordinación de convivencia educativa, que lidera el equipo.","s":[["l21809","art. 16 H LGE"]]},
  {"id":"p16","m":"conv","n":1,"q":"Una apoderada pide juntar a su hijo, víctima de acoso, con sus agresores para que «se arreglen». ¿Qué principio legal lo desaconseja?","o":["Gratuidad","Evitar la revictimización","Libertad de enseñanza","Autonomía del sostenedor"],"c":1,"e":"La Ley 21.809 exige procedimientos que eviten la revictimización.","s":[["l21809"]]},
  {"id":"p17","m":"der","n":2,"q":"La violencia contra un estudiante es especialmente grave cuando la comete:","o":["Un compañero de curso","Quien tiene una posición de autoridad, como un docente o asistente","Un estudiante mayor de 14 años","Un exalumno"],"c":1,"e":"La ley la considera especialmente grave si la comete quien detenta una posición de autoridad.","s":[["l21809","art. 16 B LGE"]]},
  {"id":"p18","m":"viol","n":2,"q":"Un apoderado insulta y empuja a un inspector en la entrada. Según la normativa de 2026:","o":["Es un asunto privado entre ellos","Es violencia laboral y el reglamento puede restringir el ingreso de ese apoderado","Solo se anota en la hoja de vida del estudiante","Se sanciona al estudiante"],"c":1,"e":"La Ley 21.809 la trata como violencia laboral y la Ley 21.827 permite suspender el ingreso de apoderados agresores.","s":[["l21809"],["l21827","art. 7"]]},
  {"id":"p19","m":"der","n":1,"q":"Una estudiante te cuenta que un familiar la toca. ¿Qué haces primero?","o":["Le pides todos los detalles para tener pruebas","La escuchas con calma, sin interrogarla, y no le prometes guardar el secreto","Llamas a su familia para confirmar","Le pides que lo hablen otro día"],"c":1,"e":"Se acoge sin interrogar, para no revictimizar, y sin prometer secreto, porque hay obligación de denunciar.","s":[["l21057","art. 1"],["cpp","art. 175"]]},
  {"id":"p20","m":"der","n":1,"q":"¿En qué plazo deben denunciar los funcionarios obligados un delito que afecte a un estudiante?","o":["48 horas","24 horas","5 días hábiles","Cuando tengan pruebas"],"c":1,"e":"El art. 176 del Código Procesal Penal fija 24 horas desde que se conoce el hecho.","s":[["cpp","art. 176"]]},
  {"id":"p21","m":"der","n":1,"q":"¿Quiénes están obligados a denunciar según el art. 175 letra e del Código Procesal Penal?","o":["Solo el director","Directores, inspectores y profesores","Solo el coordinador de convivencia","Solo los apoderados"],"c":1,"e":"La norma nombra a «los directores, inspectores y profesores de establecimientos educacionales de todo nivel».","s":[["cpp","art. 175 letra e"]]},
  {"id":"p22","m":"der","n":1,"q":"Un estudiante muestra una imagen íntima de una compañera menor de edad. ¿Qué haces con el archivo?","o":["Lo reenvías a tu celular como evidencia","No lo copias ni reenvías; resguardas el equipo e informas para denunciar","Lo borras y cierras el tema","Lo muestras al curso para prevenir"],"c":1,"e":"Almacenar o difundir ese material es delito. Se resguarda y se denuncia.","s":[["cp","art. 374 bis"]]},
  {"id":"p23","m":"der","n":2,"q":"¿Cuál es el objetivo de la Ley 21.057?","o":["Grabar las clases","Prevenir la victimización secundaria de niños, niñas y adolescentes","Fiscalizar docentes","Registrar reuniones de apoderados"],"c":1,"e":"Regula entrevistas videograbadas para evitar la exposición reiterada del niño o niña.","s":[["l21057","art. 1"]]},
  {"id":"p24","m":"sm","n":2,"q":"Un estudiante le vende marihuana a compañeros. Esto es:","o":["Solo una falta leve","Un posible delito de microtráfico que debe denunciarse, además de aplicar el reglamento","Solo un tema de salud","Algo para conversar solo con el apoderado"],"c":1,"e":"Entregar pequeñas cantidades a otro para su consumo está sancionado en el art. 4 de la Ley 20.000.","s":[["l20000","art. 4"],["cpp","art. 175"]]},
  {"id":"p25","m":"der","n":1,"q":"Una estudiante embarazada teme tener que irse del liceo. Le explicas que:","o":["Deberá cambiarse de establecimiento","El embarazo no impide permanecer en el establecimiento y debe recibir facilidades académicas","Debe pasar a jornada vespertina","Solo puede venir hasta el quinto mes"],"c":1,"e":"La LGE establece que el embarazo y la maternidad no son impedimento para ingresar y permanecer.","s":[["lge","art. 11"]]},
  {"id":"p26","m":"conv","n":1,"q":"¿Cuál es la duración máxima de una suspensión?","o":["3 días hábiles","5 días hábiles, prorrogable excepcionalmente una vez","10 días hábiles","Un mes"],"c":1,"e":"Así lo establece la Circular 482, vigente en 2026.","s":[["c482"]]},
  {"id":"p27","m":"conv","n":1,"q":"¿Cuál de estos NO es parte del debido proceso?","o":["Ser escuchado","Presunción de inocencia","Sancionar antes de escuchar para dar una señal","Pedir reconsideración"],"c":2,"e":"Se escucha antes de resolver y la decisión debe ser fundada.","s":[["dfl2_98","art. 6 d"],["c482"]]},
  {"id":"p28","m":"conv","n":1,"q":"Un estudiante llega sin uniforme. ¿Qué no se puede hacer?","o":["Registrar la situación","Conversar con el apoderado","Impedirle entrar a clases","Recordarle la norma"],"c":2,"e":"El Decreto 215 de 2009 no permite impedir el ingreso a clases por el uniforme.","s":[["d215"]]},
  {"id":"p29","m":"conv","n":2,"q":"Con suspensión cautelar (Aula Segura), ¿en qué plazo debe resolver el director?","o":["5 días hábiles","10 días hábiles","15 días hábiles","30 días corridos"],"c":1,"e":"Hay un plazo máximo de 10 días hábiles desde la notificación de la medida.","s":[["l21128"],["dfl2_98","art. 6 d"]]},
  {"id":"p30","m":"conv","n":2,"q":"¿Quiénes integran la comisión que informa antes de una expulsión (Ley 21.809)?","o":["Director, sostenedor y apoderado","Profesor jefe, coordinador/a de convivencia educativa e integrante del equipo técnico pedagógico","Centro de padres y centro de alumnos","Superintendencia y Agencia"],"c":1,"e":"El informe considera antecedentes conductuales, pedagógicos y psicosociales, proporcionalidad y alternativas formativas.","s":[["dfl2_98","art. 6 d"],["l21809"]]},
  {"id":"p31","m":"conv","n":2,"q":"¿En qué plazo se pide la reconsideración de una expulsión?","o":["5 días","15 días desde la notificación","30 días","No hay reconsideración"],"c":1,"e":"Se pide al director, que resuelve previa consulta al Consejo de Profesores.","s":[["dfl2_98","art. 6 d"]]},
  {"id":"p32","m":"conv","n":2,"q":"¿Cuál de estas conductas está en Aula Segura como afectación grave a la convivencia?","o":["Usar el celular en clases","Agresiones físicas que produzcan lesiones","Atrasos reiterados","No traer materiales"],"c":1,"e":"También agresiones sexuales, armas o artefactos incendiarios y daños a la infraestructura esencial.","s":[["l21128"]]},
  {"id":"p33","m":"seg","n":1,"q":"En una revisión de mochila (Ley 21.827), ¿cuántos adultos deben estar presentes?","o":["Uno","Al menos dos, uno del equipo de convivencia","Todo el consejo de profesores","Ninguno, la hace el estudiante solo"],"c":1,"e":"Además debe hacerse en un lugar privado y por personal autorizado.","s":[["l21827","art. 16 J LGE"]]},
  {"id":"p34","m":"seg","n":2,"q":"Durante una revisión según la Ley 21.827, ¿qué está prohibido?","o":["Pedir que muestre la mochila","Pedir que vacíe sus bolsillos sin contacto físico","Pedir que se desnude o revisar su cuerpo o ropa","Informar al apoderado"],"c":2,"e":"La ley prohíbe expresamente desnudar al estudiante y las revisiones corporales o de vestimenta.","s":[["l21827","art. 16 J LGE"]]},
  {"id":"p35","m":"seg","n":1,"q":"¿Desde cuándo protege el seguro escolar a un estudiante?","o":["Desde los 6 años","Desde que se matricula","Desde que paga una cuota","Solo en horas de clases"],"c":1,"e":"El seguro escolar cubre desde la matrícula.","s":[["ds313"],["seguro"]]},
  {"id":"p36","m":"seg","n":1,"q":"Un estudiante se accidenta en su trayecto directo al colegio. ¿Lo cubre el seguro?","o":["No, solo dentro del colegio","Sí, cubre el trayecto directo de ida y regreso","Solo en transporte escolar","Solo si se declara en una hora"],"c":1,"e":"El seguro incluye el trayecto directo entre la casa y el establecimiento.","s":[["ds313"],["seguro"]]},
  {"id":"p37","m":"seg","n":1,"q":"¿Qué documento se completa para usar el seguro escolar?","o":["Certificado de alumno regular","Declaración Individual de Accidente Escolar","Ficha de matrícula","Licencia médica"],"c":1,"e":"Se presenta en el servicio de salud público donde se atiende al estudiante.","s":[["seguro"]]},
  {"id":"p38","m":"asis","n":1,"q":"¿Qué asistencia mínima exige el Decreto 67 para la promoción?","o":["75%","80%","85%","90%"],"c":2,"e":"El director puede autorizar excepciones por razones fundadas.","s":[["d67","art. 10"]]},
  {"id":"p39","m":"asis","n":2,"q":"Según Mineduc, ¿qué asistencia se considera inasistencia grave?","o":["95% o menos","90% o menos","85% o menos","50% o menos"],"c":2,"e":"Entre 85% y 90% es inasistencia reiterada; 85% o menos es grave.","s":[["asist"]]},
  {"id":"p40","m":"seg","n":2,"q":"¿Qué resolución de Mineduc regula el Plan Integral de Seguridad Escolar?","o":["Res. Ex. 2515 de 2018","Circular 482","Decreto 67","Ley 20.594"],"c":0,"e":"El PISE organiza la prevención y la respuesta ante emergencias.","s":[["pise"]]},
  {"id":"p41","m":"seg","n":1,"q":"Al revisar una mochila aparece un cuchillo. Según la Ley 21.827, se avisa de inmediato a:","o":["Nadie, se guarda el cuchillo","La familia y Carabineros o PDI","Solo al profesor jefe","Al centro de alumnos"],"c":1,"e":"El personal autorizado debe comunicarlo de inmediato a la familia y a las policías.","s":[["l21827","art. 16 J LGE"]]},
