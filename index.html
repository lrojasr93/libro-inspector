  {"id":"p232","m":"etica","n":1,"q":"Un colega te pide el diagnóstico médico de un estudiante para comentarlo en el grupo de WhatsApp de funcionarios. ¿Qué haces?","o":["No lo compartes: el estado de salud es un dato sensible y se resguarda","Lo envías porque son colegas","Lo compartes sin el nombre del estudiante pero con su foto","Lo publicas en el diario mural para que todos sepan"],"c":0,"e":"El estado de salud es un dato sensible y los niños tienen derecho a su vida privada y a la protección de sus datos.","s":[["l19628","arts. 2 letra g y 10"],["l21430","art. 33"]]},
  {"id":"p233","m":"etica","n":2,"q":"Según la Ley 21.809, ¿en qué no se puede fundar nunca una medida disciplinaria?","o":["En una falta grave descrita en el reglamento","En la discapacidad o necesidades educativas especiales del estudiante","En hechos acreditados con debido proceso","En la reiteración de una falta"],"c":1,"e":"El art. 16 E letra i de la LGE prohíbe medidas que se funden, directa o indirectamente, en discapacidad o NEE.","s":[["l21809","art. 16 E letra i LGE"]]},
  {"id":"p234","m":"etica","n":1,"q":"Un estudiante con angustia frecuente te pide que seas «su psicólogo». ¿Qué corresponde?","o":["Hacer sesiones semanales con él en inspectoría","Decirle que no es tu tema","Acogerlo con respeto e informar a convivencia o al equipo psicosocial para que lo deriven","Darle un diagnóstico para tranquilizarlo"],"c":2,"e":"El inspector acoge y deriva; el colegio no realiza procesos terapéuticos.","s":[["viol_cart10"]]},

const CASOS = [
  {"id":"c1","m":"seg","n":1,"titulo":"Pelea en el recreo","intro":"En el recreo largo, dos estudiantes de 8° básico se golpean en el patio. Un círculo de compañeros graba con el celular. Uno de ellos sangra de la nariz.","pasos":[{"q":"¿Qué haces primero?","o":[{"t":"Separo a los estudiantes, pido a otro adulto que disperse al grupo y atiendo al que sangra.","p":2,"f":"Primero se detiene la agresión y se protege la integridad de todos."},{"t":"Llevo a ambos a inspectoría y llamo a los apoderados para informarles la sanción.","p":1,"f":"Primero se atiende al lesionado. La sanción no se decide antes de escuchar a las partes."},{"t":"Tomo fotos de la escena como evidencia.","p":0,"f":"La evidencia no es la prioridad mientras sigue la agresión y hay un lesionado."}]},{"q":"El estudiante sigue sangrando. ¿Cómo procedes?","o":[{"t":"Aplico el protocolo de accidentes: aviso al apoderado, completo la Declaración Individual de Accidente Escolar y, si es necesario, lo trasladamos a un servicio de salud público.","p":2,"f":"Así se activa el seguro escolar."},{"t":"Lo envío caminando a su casa para que lo vea su familia.","p":0,"f":"Un estudiante lesionado no se envía solo: lo retira su apoderado o se traslada según protocolo."},{"t":"Lo devuelvo a clases cuando deje de sangrar.","p":0,"f":"Sin aviso al apoderado ni registro no se activa el protocolo de accidentes."}]},{"q":"Controlada la situación, ¿qué sigue?","o":[{"t":"Registro los hechos, reporto al equipo de convivencia y se escucha a ambos estudiantes antes de aplicar el reglamento.","p":2,"f":"Registro, reporte y debido proceso."},{"t":"Suspendo a ambos por 10 días para dar una señal.","p":0,"f":"La suspensión tiene un máximo de 5 días hábiles, prorrogable una vez, y requiere debido proceso."},{"t":"Pido a los compañeros que borren los videos y doy el tema por cerrado.","p":1,"f":"Frenar la difusión ayuda, pero el caso no se cierra sin registro ni reporte."}]}],"claves":["Primero detener la agresión y proteger.","Activar protocolo de accidente y seguro escolar.","Reportar al equipo de convivencia.","Debido proceso y proporcionalidad."],"s":[["ds313"],["seguro"],["c482"],["l21809","art. 16 E letra f LGE"]]},
  {"id":"c2","m":"der","n":1,"titulo":"Un relato en el patio","intro":"Una estudiante de 5° básico se te acerca nerviosa: «mi tío me toca cuando mi mamá no está, pero no le digas a nadie».","pasos":[{"q":"¿Cómo respondes?","o":[{"t":"La escucho con calma, le digo que hizo bien en contarlo y que debo avisar a personas que la pueden proteger.","p":2,"f":"Acoger, validar y no prometer secreto."},{"t":"Le pregunto desde cuándo pasa, dónde la toca y cuántas veces.","p":0,"f":"No se interroga: eso revictimiza y puede afectar la investigación."},{"t":"Le prometo que no se lo diré a nadie.","p":0,"f":"No puedes prometer secreto: tienes obligación de denunciar."}]},{"q":"¿Qué haces después?","o":[{"t":"Informo de inmediato al equipo directivo para activar el protocolo y denunciar dentro de 24 horas.","p":2,"f":"La denuncia es obligatoria y tiene plazo de 24 horas."},{"t":"Llamo a la mamá para que ella decida.","p":0,"f":"Avisar a la familia no reemplaza la denuncia, y el agresor puede ser cercano a ella."},{"t":"Espero unos días para ver si hay más señales.","p":0,"f":"No se espera a tener pruebas para activar el protocolo."}]},{"q":"¿Cómo dejas constancia?","o":[{"t":"Escribo sus palabras textuales, fecha, hora y contexto, sin interpretaciones.","p":2,"f":"El registro textual es la mejor base para la investigación."},{"t":"Escribo mi opinión sobre lo que pasa en esa casa.","p":0,"f":"El registro no lleva opiniones."},{"t":"No escribo nada para proteger su privacidad.","p":0,"f":"El registro es necesario y se resguarda con confidencialidad."}]}],"claves":["Escuchar sin interrogar.","No prometer secreto.","Informar de inmediato y denunciar en 24 horas.","Registrar sus palabras textuales."],"s":[["cpp","arts. 175 y 176"],["l21057","art. 1"]]},
  {"id":"c3","m":"viol","n":1,"titulo":"Memes en el grupo del curso","intro":"La apoderada de un estudiante de 7° básico cuenta que hace semanas circulan memes que se burlan de su hijo en el WhatsApp del curso. Ahora él no quiere venir al colegio.","pasos":[{"q":"¿Qué le respondes?","o":[{"t":"La escucho, registro su relato y lo reporto al equipo de convivencia para activar el protocolo de acoso.","p":2,"f":"El acoso por medios tecnológicos fuera del colegio también corresponde al establecimiento."},{"t":"Le explico que lo que pasa en WhatsApp fuera del horario no es responsabilidad del colegio.","p":0,"f":"La ley incluye el acoso fuera del establecimiento y por medios tecnológicos."},{"t":"Le sugiero que su hijo salga del grupo.","p":1,"f":"Puede ser un consejo de autocuidado, pero no reemplaza el protocolo."}]},{"q":"¿Cómo se reúne la evidencia?","o":[{"t":"Pido capturas a la apoderada y las adjunto al registro oficial del caso.","p":2,"f":"Correcto, siempre que no contengan material sexual de menores."},{"t":"Pido que me las reenvíen a mi celular personal.","p":1,"f":"La evidencia va por canales institucionales, no a tu teléfono."},{"t":"Reviso los celulares de todo el curso.","p":0,"f":"Una revisión masiva de celulares no corresponde."}]},{"q":"La apoderada pide juntar a su hijo con los autores para que se arreglen. ¿Qué le dices?","o":[{"t":"Le explico que en un caso de acoso no se enfrenta a la víctima con sus agresores; el protocolo contempla otras medidas.","p":2,"f":"La ley pide evitar la revictimización."},{"t":"Acepto y organizo la reunión para mañana.","p":0,"f":"Puede exponer más a la víctima."},{"t":"Le digo que eso lo decide el profesor jefe.","p":1,"f":"El profesor jefe participa, pero el protocolo lo lidera el equipo de convivencia."}]}],"claves":["El ciberacoso fuera del colegio también se aborda.","Evidencia por canales institucionales.","Evitar la revictimización.","Reportar al equipo de convivencia."],"s":[["l21809","arts. 16 B y 16 E LGE"]]},
  {"id":"c4","m":"ig","n":1,"titulo":"Un retiro que no cuadra","intro":"A las 11:00 llega un hombre que dice ser el papá de un estudiante de 2° básico y quiere retirarlo por una emergencia. No figura como adulto autorizado. El niño, al verlo, parece asustado.","pasos":[{"q":"¿Qué haces?","o":[{"t":"Le explico con amabilidad que no puedo entregarlo porque no está autorizado y llamo al apoderado registrado.","p":2,"f":"Se sigue el procedimiento de retiro del reglamento interno."},{"t":"Le pido el carnet y, si tiene el mismo apellido, lo entrego.","p":0,"f":"El apellido no acredita autorización. Puede haber medidas cautelares."},{"t":"Le pregunto al niño si se quiere ir con él.","p":0,"f":"La decisión no puede recaer en el niño, menos si está asustado."}]},{"q":"El hombre levanta la voz e intenta entrar al patio. ¿Cómo sigues?","o":[{"t":"Llevo al niño a un lugar seguro con otro adulto, aviso a dirección y, si hay riesgo, llamo a Carabineros.","p":2,"f":"Primero la protección del estudiante."},{"t":"Lo enfrento físicamente.","p":0,"f":"No te expongas: protege al niño y pide apoyo."},{"t":"Lo entrego para evitar un escándalo.","p":0,"f":"Nunca se entrega a un estudiante bajo presión."}]}],"claves":["Solo retiran adultos autorizados.","Verificar con el apoderado registrado.","Ante riesgo, proteger y pedir apoyo.","Registrar el incidente."],"s":[["c482","reglamento interno"]]},
  {"id":"c5","m":"ig","n":1,"titulo":"Atrasos de la semana","intro":"Un estudiante de 1° medio llega atrasado por tercera vez en la semana, a las 8:40. Se ve cansado.","pasos":[{"q":"¿Qué haces ahora?","o":[{"t":"Registro el atraso, lo dejo entrar a clases y converso brevemente con él.","p":2,"f":"Se registra sin dejarlo fuera y se indaga la causa."},{"t":"Lo dejo esperando fuera del colegio hasta el segundo bloque.","p":0,"f":"Un estudiante no puede quedar fuera ni sin supervisión."},{"t":"Lo mando a la biblioteca toda la mañana.","p":1,"f":"Queda supervisado, pero pierde clases y no se aborda la causa."}]},{"q":"Te cuenta que lleva a su hermana al jardín porque su mamá trabaja de noche. ¿Qué haces?","o":[{"t":"Contacto al apoderado para buscar acuerdos y reporto al equipo de convivencia u orientación por si necesita apoyo.","p":2,"f":"El atraso es síntoma de una situación familiar que requiere apoyo."},{"t":"Aplico la suspensión que toca al tercer atraso.","p":0,"f":"La ley privilegia medidas formativas y proporcionales."},{"t":"Le digo que se organice mejor.","p":0,"f":"Ignora el contexto y no ofrece apoyo."}]}],"claves":["Registrar sin dejar fuera.","Indagar la causa.","Atrasos e inasistencias son alertas tempranas.","Medidas formativas y proporcionales."],"s":[["l21809"],["asist"]]},
  {"id":"c6","m":"seg","n":2,"titulo":"Un cuchillo en la sala","intro":"Una docente avisa que un estudiante de 2° medio mostró un cuchillo en clases. Al llegar, lo tiene en la mochila y está agitado.","pasos":[{"q":"¿Cómo intervienes?","o":[{"t":"Mantengo la calma, saco al curso con la docente, le hablo sin confrontarlo y pido apoyo a dirección.","p":2,"f":"Primero la seguridad de todos y bajar la tensión."},{"t":"Le quito la mochila por la fuerza.","p":0,"f":"Forcejear con alguien armado pone a todos en riesgo."},{"t":"Espero a que termine la clase.","p":0,"f":"Un arma en la sala exige actuar de inmediato."}]},{"q":"El estudiante entrega el cuchillo. ¿A quién se avisa?","o":[{"t":"De inmediato a su familia y a Carabineros o PDI, como exige la Ley 21.827.","p":2,"f":"Ante objetos peligrosos se avisa a la familia y a las policías."},{"t":"Solo al profesor jefe.","p":0,"f":"La ley exige aviso inmediato a la familia y a las policías."},{"t":"A nadie; se le devuelve al final del día.","p":0,"f":"Nunca se devuelve un arma."}]},{"q":"¿Qué procedimiento disciplinario corresponde?","o":[{"t":"El director puede iniciar un procedimiento por Aula Segura y suspender como medida cautelar, notificando por escrito; tiene 10 días hábiles para resolver y hay 5 días para pedir reconsideración.","p":2,"f":"El porte de armas está en la Ley 21.128."},{"t":"Se le expulsa ese mismo día, sin más trámite.","p":0,"f":"Siempre hay procedimiento, notificación y reconsideración. Para expulsar se requiere además el informe de la comisión."},{"t":"Solo se conversa con el apoderado.","p":0,"f":"Es una conducta que afecta gravemente la convivencia."}]}],"claves":["Seguridad primero, sin confrontar.","Objeto peligroso: aviso a familia y policías.","Aula Segura: cautelar y 10 días hábiles.","Reconsideración en 5 días."],"s":[["l21128"],["l21827","art. 16 J LGE"],["dfl2_98","art. 6 d"]]},
  {"id":"c7","m":"der","n":2,"titulo":"Denuncia contra un colega","intro":"Un apoderado cuenta que un profesor insultó y le gritó a su hijo de 4° básico frente al curso. Conoces al profesor y te parece tranquilo.","pasos":[{"q":"¿Cómo reaccionas?","o":[{"t":"Acojo al apoderado, registro su relato y lo reporto al equipo directivo para activar el protocolo.","p":2,"f":"La violencia de quien tiene autoridad sobre un estudiante es especialmente grave."},{"t":"Le digo que seguro fue un malentendido.","p":0,"f":"Defender al colega de antemano invalida el relato."},{"t":"Le pido que lo hable con el profesor.","p":0,"f":"No se traslada al apoderado la responsabilidad del colegio."}]},{"q":"¿Qué pasa mientras se investiga?","o":[{"t":"Medidas de resguardo para el estudiante y un procedimiento con debido proceso para ambos.","p":2,"f":"Protección del niño y garantías para el funcionario."},{"t":"Se despide al profesor de inmediato.","p":0,"f":"Eso prejuzga sin investigación."},{"t":"Nada hasta que termine la investigación.","p":0,"f":"El estudiante necesita resguardo desde el inicio."}]}],"claves":["Recibir y registrar sin defender a nadie.","Violencia de adulto con autoridad: especialmente grave.","Resguardo inmediato.","Debido proceso para todos."],"s":[["l21809","arts. 16 B y 16 E LGE"]]},
  {"id":"c8","m":"sm","n":2,"titulo":"Humo en el baño","intro":"En el recreo encuentras a dos estudiantes de 3° medio fumando lo que parece marihuana en el baño.","pasos":[{"q":"¿Qué haces en el momento?","o":[{"t":"Les pido que entreguen la sustancia, la resguardo con otro adulto presente, los acompaño a inspectoría e informo a dirección.","p":2,"f":"Se resguarda con testigo y se informa."},{"t":"Les reviso los bolsillos y la ropa.","p":0,"f":"La Ley 21.827 prohíbe revisar el cuerpo o la ropa. Como máximo se puede pedir que muestren sus bolsillos, sin contacto."},{"t":"Los dejo ir con una advertencia.","p":0,"f":"Debe activarse el protocolo de drogas y alcohol."}]},{"q":"Uno dice que se la compró a otro estudiante. ¿Qué implica?","o":[{"t":"El consumo se aborda con apoyo y derivación, por ejemplo a SENDA Previene; la venta es un posible delito que dirección debe denunciar.","p":2,"f":"Consumo y microtráfico tienen respuestas distintas."},{"t":"Basta con una anotación negativa a todos.","p":0,"f":"La venta se denuncia y el consumo requiere apoyo."},{"t":"Interrogo al vendedor hasta que confiese.","p":0,"f":"La investigación penal no corresponde al inspector."}]}],"claves":["Resguardar la sustancia con testigo.","Sin revisiones corporales.","Consumo: apoyo y derivación.","Venta: denuncia."],"s":[["l20000","art. 4"],["l21827","art. 16 J LGE"],["senda"],["c482"]]},
  {"id":"c9","m":"seg","n":2,"titulo":"Revisión de mochilas","intro":"El reglamento interno de tu liceo ya incorpora la revisión de mochilas de la Ley 21.827. Llega un aviso de que un estudiante de 1° medio trae algo peligroso.","pasos":[{"q":"¿Cómo organizas la revisión?","o":[{"t":"En un lugar privado, con al menos dos adultos autorizados, uno del equipo de convivencia, pidiéndole que muestre la mochila.","p":2,"f":"Así lo exige la ley."},{"t":"En la sala, frente al curso, para que sirva de ejemplo.","p":0,"f":"Debe hacerse en un lugar privado, respetando su honra."},{"t":"La hago yo solo para ser discreto.","p":0,"f":"Se requieren al menos dos adultos."}]},{"q":"El estudiante se niega a mostrar la mochila. ¿Qué haces?","o":[{"t":"Aviso de inmediato al apoderado para que venga, y mientras tanto el estudiante espera supervisado fuera de la sala.","p":2,"f":"La revisión no se fuerza."},{"t":"Se la quito a la fuerza.","p":0,"f":"La ley no permite forzar la revisión."},{"t":"Lo mando de vuelta a clases con la mochila.","p":0,"f":"Debe esperar supervisado fuera de la sala hasta que llegue el apoderado."}]}],"claves":["Solo si el reglamento la contempla.","Lugar privado y dos adultos, uno de convivencia.","Nunca desnudar ni revisar el cuerpo.","Si se niega: apoderado y supervisión."],"s":[["l21827","art. 16 J LGE"]]},
  {"id":"c10","m":"crisis","n":1,"titulo":"Crisis después del timbre","intro":"En el recreo suena fuerte la alarma de un simulacro. Tomás, de 3° básico y con diagnóstico de TEA, se tapa los oídos, grita y empieza a golpear la pared con las manos. Un grupo de niños se acerca a mirar.","pasos":[{"q":"¿Qué haces primero?","o":[{"t":"Pido a otro adulto que aleje a los curiosos, le hablo con voz baja y lo acompaño a un lugar tranquilo y seguro.","p":2,"f":"Etapa 2: acompañar sin invadir, reducir estímulos y público, y llevarlo a un lugar seguro."},{"t":"Le digo firme que se calme o tendrá una anotación.","p":0,"f":"Amenazar con sanciones o pedirle que «no se enoje» escala la crisis."},{"t":"Lo sujeto de los brazos para que deje de golpear.","p":0,"f":"La contención física es excepcional, por personal capacitado y con autorización escrita de la familia."}]},{"q":"Tomás sigue alterado. ¿Cómo se organizan los adultos?","o":[{"t":"Una persona lo acompaña, otra observa a distancia y una tercera, afuera, avisa al equipo y a la familia según su PAEC.","p":2,"f":"Así se reparten los roles de encargado, acompañante interno y acompañante externo."},{"t":"Tres adultos le hablan a la vez para convencerlo.","p":0,"f":"Muchas voces aumentan los estímulos. Solo el encargado le habla."},{"t":"Lo dejamos solo en la sala hasta que se le pase.","p":0,"f":"Un estudiante en crisis no se deja solo: se acompaña a distancia."}]},{"q":"Ya está en calma. ¿Qué sigue?","o":[{"t":"Aviso al apoderado por la vía más rápida, registro la hora y la persona contactada, y anoto el episodio en la bitácora.","p":2,"f":"La Circular 586 pide registro del contacto e informar cada episodio; la bitácora ayuda a identificar desencadenantes."},{"t":"Le explico frente al curso por qué estuvo mal lo que hizo.","p":0,"f":"La conversación se hace en privado y cuando esté tranquilo, sin exponerlo."},{"t":"No aviso a nadie porque ya pasó.","p":1,"f":"Calmarlo fue lo principal, pero falta informar a la familia y registrar."}]}],"claves":["Reducir estímulos y público, y acompañar sin invadir.","No regañar ni amenazar durante la crisis.","Repartir roles entre adultos.","Avisar a la familia, registrar hora y anotar en la bitácora."],"s":[["dec"],["c586"]]},
  {"id":"c11","m":"tea","n":2,"titulo":"La apoderada que salió del trabajo","intro":"Sofía, de 7° básico con TEA, tuvo una desregulación fuerte y botó una mesa. Su PAEC dice que se llame a su madre. La madre llega desde su trabajo y pide un documento. Mientras tanto, un profesor exige suspender a Sofía «por romper el mobiliario».","pasos":[{"q":"La madre necesita justificar su salida del trabajo. ¿Qué haces?","o":[{"t":"Gestiono con dirección un certificado firmado por un directivo con las horas de llegada y salida.","p":2,"f":"La Circular 586 lo exige, y la Ley TEA protege ese permiso en el Código del Trabajo."},{"t":"Le digo que el colegio no entrega documentos.","p":0,"f":"El certificado es obligación del establecimiento."},{"t":"Le escribo una nota a mano con mi firma.","p":1,"f":"Tiene buena intención, pero lo firma un miembro del equipo directivo."}]},{"q":"El profesor insiste en suspenderla. ¿Qué respondes?","o":[{"t":"Que se revise con convivencia y el PAEC: no se aplican medidas que se funden en su condición, y si la conducta se originó en la crisis, no corresponde sancionar.","p":2,"f":"Sofía no está exenta de las normas, pero esta conducta surgió de la desregulación."},{"t":"Que la suspendan 5 días para que aprenda.","p":0,"f":"Sería una medida fundada en su condición, prohibida por la Circular 586."},{"t":"Que le pidan a la madre que la retire el resto de la semana.","p":0,"f":"El retiro anticipado es excepcional y no se usa como sanción."}]},{"q":"¿Cómo se cierra el episodio?","o":[{"t":"Cuando esté en calma, Sofía ayuda a ordenar la sala; se registra en la bitácora y se informa a la madre al final de la jornada.","p":2,"f":"Reparar cuando esté tranquila, registrar e informar cada episodio."},{"t":"Se le pide que se disculpe en ese mismo momento frente a todos.","p":1,"f":"La reparación es positiva, pero solo cuando está en calma y sin exponerla."},{"t":"Se comenta el caso en el grupo de apoderados para que entiendan.","p":0,"f":"El PAEC y la información de Sofía son confidenciales."}]}],"claves":["Certificado de asistencia firmado por un directivo.","No sancionar conductas originadas en su condición.","Reparación cuando esté en calma.","Confidencialidad del PAEC."],"s":[["c586"],["l21545","art. 25"],["dec","después de la crisis"]]},
  {"id":"c12","m":"tutor","n":1,"titulo":"Llega una tutora sombra","intro":"Un lunes, una mujer se presenta en portería: «soy la tutora sombra de Martina, de 2° básico, y vengo a entrar a la sala con ella». Tú no tienes información sobre esto.","pasos":[{"q":"¿Qué haces?","o":[{"t":"La recibo con amabilidad, registro su ingreso y confirmo con dirección o el equipo PIE si existe un acuerdo con la familia.","p":2,"f":"Su presencia depende de un acuerdo entre el colegio y los apoderados; un adulto externo siempre se registra."},{"t":"La dejo pasar a la sala porque dice que es tutora.","p":0,"f":"Ningún adulto externo ingresa sin verificar y registrar."},{"t":"Le digo que los tutores sombra están prohibidos.","p":0,"f":"No están prohibidos: se acuerdan con el colegio, que debe dar razones fundadas si los rechaza."}]},{"q":"Ya hay acuerdo. En el recreo, la tutora reta a otro niño que empujó a Martina. ¿Qué haces?","o":[{"t":"Me acerco, atiendo la situación como inspector/a y luego converso con el equipo PIE o convivencia sobre los límites de su función.","p":2,"f":"La tutora apoya a Martina, pero el cuidado de todos los estudiantes sigue siendo del colegio."},{"t":"La dejo, porque ella sabe más de Martina.","p":1,"f":"Conoce a Martina, pero la disciplina de otros estudiantes no es su función."},{"t":"Le prohíbo volver al colegio.","p":0,"f":"No te corresponde decidirlo; se canaliza con dirección según el acuerdo."}]},{"q":"Otro apoderado reclama: «¿por qué esa niña tiene una persona solo para ella?». ¿Qué respondes?","o":[{"t":"Le explico que el colegio entrega apoyos según las necesidades de cada estudiante, sin dar detalles de Martina.","p":2,"f":"Así se resguarda la confidencialidad y el trato no discriminatorio."},{"t":"Le cuento el diagnóstico de Martina para que entienda.","p":0,"f":"La información de un estudiante es confidencial."},{"t":"Le digo que tiene razón y que es injusto.","p":0,"f":"Los apoyos según necesidades no son privilegios: son ajustes para que pueda aprender."}]}],"claves":["Verificar el acuerdo y registrar al adulto externo.","El colegio mantiene el cuidado de todos los estudiantes.","Canalizar dudas con PIE o convivencia.","Confidencialidad y no discriminación."],"s":[["copiapo"],["c482","reglamento interno"],["l20422","art. 8"],["l20609","art. 2"]]},
  {"id":"c13","m":"ig","n":2,"titulo":"Pelea en el recreo largo","intro":"En el recreo, dos estudiantes de 8° básico se golpean cerca de la cancha. Un grupo graba con celulares. Uno de ellos sangra por la nariz. Tú eres el/la inspector/a de turno en ese sector.","pasos":[{"q":"¿Qué haces primero?","o":[{"t":"Separas a los estudiantes con apoyo de otro adulto, pides que el grupo se aleje y llevas al herido a primeros auxilios.","p":2,"f":"Correcto: la ley habilita medidas inmediatas y proporcionales para contener la violencia y lo primero es la seguridad."},{"t":"Gritas desde lejos que se detengan y esperas que paren solos.","p":1,"f":"Intentas intervenir, pero sin contener de verdad la situación ni atender al herido."},{"t":"Quitas los celulares a todos antes de ocuparte de la pelea.","p":0,"f":"Primero va la seguridad de las personas; los celulares pueden esperar."}]},{"q":"Ya separados y atendido el herido, ¿qué sigue?","o":[{"t":"Le cuentas al profesor jefe en el pasillo, sin dejar nada escrito.","p":1,"f":"Informar ayuda, pero debe llegar a quien corresponde y quedar registrado."},{"t":"Reportas lo ocurrido al equipo directivo o a quien indique el reglamento interno.","p":2,"f":"Bien: la ley exige reportar hechos de violencia al equipo directivo o a quien defina el reglamento."},{"t":"Conversas tú con ambos y das por cerrado el tema.","p":0,"f":"No basta tu gestión individual: los hechos de violencia deben reportarse."}]},{"q":"¿Cómo dejas constancia?","o":[{"t":"Escribes «se pelearon porque son conflictivos».","p":0,"f":"Es una opinión, no un hecho, y perjudica el debido proceso."},{"t":"Anotas solo «pelea en el patio».","p":1,"f":"Faltan datos clave: hora, personas involucradas y lo observado."},{"t":"Registras hora, lugar, personas y lo que viste y escuchaste, sin opinar.","p":2,"f":"Así el registro sirve al procedimiento con imparcialidad y debido proceso."}]}],"claves":["Primero contener y proteger, con medidas proporcionales","Reportar al equipo directivo o a quien defina el reglamento","Registrar hechos, no opiniones","El procedimiento sigue el reglamento interno"],"s":[["l21827","art. 1"],["lge","art. 10"],["l21809","art. 16 E LGE"]]},
  {"id":"c14","m":"conv","n":1,"titulo":"Discusión por la pelota","intro":"En el recreo, dos estudiantes de 6° básico discuten a gritos y se empujan por quién usa la pelota. No hay heridos. Ambos dicen que el otro empezó.","pasos":[{"q":"¿Qué haces en el momento?","o":[{"t":"Te acercas, los separas con calma, revisas que nadie esté herido y los llevas a un lugar tranquilo.","p":2,"f":"Primero se detiene la situación y se cuida a ambos; luego se conversa con calma."},{"t":"Los retas frente a todos y les quitas la pelota.","p":1,"f":"Detienes la discusión, pero la exposición pública no ayuda a resolver ni a aprender."},{"t":"Los dejas, porque es algo normal entre niños.","p":0,"f":"Los adultos deben intervenir cuando está en juego la seguridad; un conflicto mal resuelto puede escalar."}]},{"q":"Ya están calmados. ¿Cómo abordas el conflicto?","o":[{"t":"Escuchas la versión de cada uno y les ofreces una mediación, si ambos aceptan.","p":2,"f":"Antes de cualquier medida hay que conocer todas las versiones, y la mediación es voluntaria."},{"t":"Los obligas a darse la mano y pedirse perdón.","p":0,"f":"Una reparación impuesta no es formativa: la acción reparatoria debe ser voluntaria."},{"t":"Anotas a ambos en el libro de clases y los mandas a la sala.","p":1,"f":"Registrar es útil, pero se pierde la oportunidad de que ellos construyan una solución."}]},{"q":"Llegan a un acuerdo para turnarse la pelota. ¿Qué sigue?","o":[{"t":"Registras el acuerdo, informas al profesor jefe y en unos días verificas si se cumple.","p":2,"f":"El seguimiento de los acuerdos permite ajustar si algo no funciona."},{"t":"Das el tema por cerrado.","p":0,"f":"Sin seguimiento no sabes si el acuerdo resolvió el problema."},{"t":"Envías una nota a los apoderados y no vuelves a revisar el caso.","p":1,"f":"Informar está bien, pero falta acompañar el cumplimiento del acuerdo."}]}],"claves":["Detener y resguardar antes de conversar","Escuchar la versión de todos antes de aplicar una medida","La mediación y la reparación son voluntarias","Registrar y dar seguimiento a los acuerdos"],"s":[["conv_cart6","pp. 10-14"],["conv_orient2011"],["conv_gcc","puntos 2 y 9"]]},
  {"id":"c15","m":"conv","n":2,"titulo":"Un apoderado furioso en la entrada","intro":"Un apoderado llega a la portería gritando. Dice que un compañero golpeó a su hijo de 5° básico y exige entrar a la sala para «hablar» con ese niño.","pasos":[{"q":"¿Cuál es tu primera reacción?","o":[{"t":"Mantienes la calma, le explicas que no puede entrar a la sala y lo invitas a un espacio aparte para escucharlo.","p":2,"f":"Proteges a los estudiantes y, a la vez, respetas su derecho a ser escuchado."},{"t":"Lo acompañas a la sala para que todo se aclare rápido.","p":0,"f":"Exponer a un estudiante a un adulto alterado pone en riesgo su integridad."},{"t":"Le dices que se retire y vuelva con hora.","p":1,"f":"Mantienes la seguridad, pero no escuchas un reclamo que puede revelar una agresión."}]},{"q":"Mientras habla, te insulta y te amenaza. ¿Qué haces?","o":[{"t":"Pones un límite con tono firme, pides apoyo a un directivo, registras lo ocurrido e informas a la dirección.","p":2,"f":"La agresión de un apoderado a un trabajador es violencia en el trabajo ejercida por terceros y debe informarse."},{"t":"Le respondes con el mismo tono para que te respete.","p":0,"f":"Responder con agresión aumenta el conflicto y no corresponde a un trato respetuoso."},{"t":"Lo dejas desahogarse y no le cuentas a nadie.","p":1,"f":"Evitas escalar, pero la agresión debe informarse para activar el resguardo que corresponda."}]},{"q":"¿Cómo canalizas su denuncia sobre el golpe a su hijo?","o":[{"t":"Informas a la coordinación de convivencia para que active el protocolo y le explicas cómo será informado.","p":2,"f":"El reclamo se canaliza por el protocolo del reglamento interno y el apoderado tiene derecho a ser informado."},{"t":"Le prometes que el otro niño será expulsado.","p":0,"f":"No puedes anticipar sanciones: hay un procedimiento con debido proceso."},{"t":"Le sugieres juntarse con la otra familia para arreglarlo entre ellos.","p":1,"f":"Una mediación puede servir más adelante, pero la define el equipo de convivencia y siempre es voluntaria."}]}],"claves":["Resguardar a los estudiantes: un apoderado alterado no entra a la sala","La agresión de un apoderado a un funcionario es violencia en el trabajo por terceros","Canalizar el reclamo por el protocolo del reglamento interno","No prometer sanciones ni resultados"],"s":[["l21809","art. 16 B LGE"],["l21827","art. 7"],["lge","art. 10 letra b"],["conv_cart2"]]},
  {"id":"c16","m":"tea","n":1,"titulo":"Cambio de sala","intro":"Mateo, de 5° básico, es autista y su PAEC indica que se le anticipen los cambios con su agenda visual. Hoy su curso tendrá clases en el laboratorio porque están reparando su sala. El laboratorio tiene eco y un extractor ruidoso.","pasos":[{"q":"A primera hora sabes del cambio de sala. ¿Qué haces?","o":[{"t":"Avisas al profesor jefe o al equipo PIE para que le anticipen el cambio a Mateo con su agenda visual antes de llegar.","p":2,"f":"Bien: anticipar con el medio que el estudiante usa reduce la incertidumbre."},{"t":"Se lo dices tú de palabra cuando lo ves en el pasillo.","p":1,"f":"Avisar ayuda, pero sin el apoyo que él usa y sin coordinar con el equipo puede no bastar."},{"t":"No dices nada: ya se adaptará.","p":0,"f":"Los cambios no previstos son un estresor frecuente; la anticipación es una medida preventiva clave."}]},{"q":"Mateo llega a la puerta del laboratorio, se tapa los oídos y no quiere entrar. ¿Cómo actúas?","o":[{"t":"Le explicas con detalle por qué tiene que entrar igual que sus compañeros.","p":1,"f":"La intención es buena, pero las explicaciones largas son difíciles de procesar en un momento de angustia."},{"t":"Le hablas con frases cortas y calmadas, buscas reducir el ruido o un lugar más tranquilo cerca y le das tiempo.","p":2,"f":"Bien: lenguaje simple, control del estímulo sensorial y tiempo para responder."},{"t":"Lo tomas del brazo y lo haces entrar.","p":0,"f":"Forzarlo aumenta la angustia; el contacto físico no pedido debe evitarse."}]},{"q":"Mateo se calma y entra a clases. ¿Qué haces después?","o":[{"t":"Lo anotas como falta por no obedecer.","p":0,"f":"No se sanciona una conducta vinculada a su condición; corresponde ajustar los apoyos."},{"t":"Lo comentas de pasada en la sala de profesores.","p":1,"f":"Compartir es útil, pero debe llegar al equipo responsable del PAEC por la vía formal."},{"t":"Informas al profesor jefe o al equipo PIE lo ocurrido, para que se considere al revisar el PAEC.","p":2,"f":"Bien: el PAEC se revisa y ajusta según lo que vive el estudiante."}]}],"claves":["Anticipar los cambios con el apoyo visual que el estudiante usa.","Reducir estímulos sensoriales molestos, como ruido y eco.","Hablar con frases cortas y dar tiempo para responder.","Informar al equipo para ajustar el PAEC, sin sancionar."],"s":[["tea_paec","pp. 23, 29 a 34"],["tea_guia08","pp. 31 y 39"],["c586"]]},
  {"id":"c17","m":"tutor","n":2,"titulo":"La tutora de Diego","intro":"Diego, de 4° básico, es autista y tiene una tutora sombra autorizada por escrito por la dirección. Tú conoces los acuerdos: horario, espacios y funciones. Durante el mes surgen varias situaciones.","pasos":[{"q":"Un lunes llega una persona distinta: dice que reemplaza a la tutora habitual de Diego. ¿Qué haces?","o":[{"t":"Registras su llegada y consultas a dirección si hay autorización escrita para esta persona; mientras tanto no ingresa a la sala.","p":2,"f":"Bien: la autorización y los requisitos se verifican para cada persona que cumple el rol."},{"t":"La dejas pasar porque la apoderada te avisó por teléfono.","p":1,"f":"El aviso es útil, pero la autorización debe constar por escrito y los requisitos se revisan para cada persona."},{"t":"La dejas pasar sin registro: ya hay una tutora autorizada.","p":0,"f":"Todo adulto externo se registra y la autorización no se traspasa a otra persona."}]},{"q":"La tutora habitual te pide que Diego salga todos los días de música porque el ruido lo altera, y que tú lo cuides en inspectoría. ¿Qué respondes?","o":[{"t":"Aceptas como regla permanente desde hoy.","p":0,"f":"Un cambio así se decide en el equipo y en el PAEC, no entre dos adultos, y puede aislarlo del curso."},{"t":"Le pides que lo plantee al equipo PIE y al profesor para evaluar ajustes sensoriales en el PAEC sin apartarlo del curso.","p":2,"f":"Bien: los ajustes sensoriales se planifican con el equipo y la familia, con roles definidos."},{"t":"Aceptas por hoy y avisas al profesor después.","p":1,"f":"Resuelve el momento, pero sin coordinación previa y sin pasar por el equipo responsable."}]},{"q":"A fin de mes, la familia te pide un informe escrito sobre los avances de Diego. ¿Qué haces?","o":[{"t":"Escribes un informe con tu opinión sobre su diagnóstico.","p":0,"f":"El inspector/a no diagnostica ni evalúa avances pedagógicos."},{"t":"Entregas directamente a la familia tus anotaciones de portería y patio.","p":1,"f":"Tus observaciones sirven, pero deben canalizarse por el equipo para resguardar la confidencialidad y el plan."},{"t":"Derivas la solicitud al profesor jefe o al equipo PIE, que lleva el PACI y el PAEC, y aportas tus observaciones.","p":2,"f":"Bien: el seguimiento y la evaluación se hacen en equipo y con la familia."}]}],"claves":["La autorización es escrita y se verifica para cada persona que ingresa.","Los ajustes de rutina se acuerdan en el equipo y en el PAEC, sin aislar al estudiante.","El seguimiento de avances lo lleva el equipo (PACI y PAEC), con la familia.","El inspector/a observa y comunica, pero no diagnostica."],"s":[["copiapo","considerando 7"],["tea_paec","pp. 24 a 27"],["d83","pp. 8 y 9"],["c586"]]},
  {"id":"c18","m":"crisis","n":2,"titulo":"Golpe en el pasillo","intro":"Ignacio, de 8° básico, tiene un PAEC. Después de una prueba, un compañero se burla de él. Ignacio grita, patea un basurero y lanza su mochila. Un grupo de estudiantes se junta a mirar.","pasos":[{"q":"Eres el primer adulto en llegar. ¿Qué haces?","o":[{"t":"Le gritas que se detenga y lo tomas del brazo.","p":0,"f":"Gritar y tocarlo sin que lo pida aumenta la escalada."},{"t":"Pides con calma al grupo que se retire, apartas objetos peligrosos y te ubicas a una distancia segura hablando poco y con voz baja.","p":2,"f":"Bien: reduces público y riesgos, y acompañas sin invadir."},{"t":"Dispersas al grupo y lo dejas solo mientras vas a buscar ayuda.","p":1,"f":"Reducir el público está bien, pero el estudiante necesita un adulto que lo acompañe; pide apoyo sin dejarlo solo."}]},{"q":"Ignacio se sienta en el suelo y llora. Llega el adulto encargado según su PAEC. ¿Qué haces ahora?","o":[{"t":"Asumes el rol de acompañante externo: avisas a dirección y a la familia según el PAEC, registrando la hora.","p":2,"f":"Bien: un adulto acompaña, otro coordina, y se informa por la vía acordada."},{"t":"Te quedas al lado del encargado para ayudar a convencerlo.","p":1,"f":"Tu intención es apoyar, pero se recomienda mantener pocos adultos cerca."},{"t":"Le pides que explique ya por qué lo hizo.","p":0,"f":"No se razona con el estudiante sobre su conducta en plena crisis."}]},{"q":"Al día siguiente, ¿cómo cierras el episodio?","o":[{"t":"Registras solo «pateó un basurero».","p":1,"f":"Registrar es necesario, pero sin contexto (la burla, lo que funcionó) no sirve para aprender del episodio."},{"t":"Propones suspenderlo sin revisar su PAEC.","p":0,"f":"No se aplican medidas fundadas en su condición sin analizar el origen de la conducta."},{"t":"Registras en la bitácora qué lo gatilló, qué se hizo y qué funcionó, y lo revisas con el equipo, incluyendo la reparación y la burla del compañero.","p":2,"f":"Bien: el registro y la evaluación permiten ajustar el plan y abordar también la conducta del otro estudiante."}]}],"claves":["Reducir el público y los objetos de riesgo, y acompañar a distancia.","Mantener pocos adultos con roles claros: uno acompaña, otro coordina.","No razonar ni sancionar en plena crisis.","Registrar con contexto y evaluar en equipo para ajustar el PAEC."],"s":[["dec","etapas 1 y 2, roles"],["tea_paec","pp. 32 a 39"],["c586"]]},
  {"id":"c19","m":"tdah","n":1,"titulo":"Empujones en la fila del comedor","intro":"Mateo, de 3° básico, tiene diagnóstico de déficit atencional con hiperactividad. En la fila del almuerzo empuja y se cuela. Sus compañeros reclaman y tú estás de turno en el comedor.","pasos":[{"q":"¿Qué haces primero?","o":[{"t":"Te acercas con calma y le das una instrucción corta: «Mateo, vuelve a tu lugar en la fila».","p":2,"f":"Bien: una instrucción breve y cercana es la que mejor funciona."},{"t":"Le explicas una por una todas las normas del comedor.","p":1,"f":"La intención es buena, pero muchas instrucciones juntas le cuestan; mejor una a la vez."},{"t":"Lo retas frente a todos y lo mandas al final de la fila como castigo.","p":0,"f":"Los llamados de atención en público y el castigo no modifican la conducta."}]},{"q":"Mateo vuelve a su lugar y espera su turno. ¿Qué haces?","o":[{"t":"No dices nada: solo cumplió lo esperado.","p":1,"f":"Pierdes la ocasión de reforzar lo que hizo bien."},{"t":"Le dices que siempre se porta mal y que ojalá aprenda.","p":0,"f":"La crítica daña su autoestima y no mejora la conducta."},{"t":"Le reconoces en el momento que esperó su turno.","p":2,"f":"Correcto: el refuerzo inmediato del logro es la estrategia prioritaria."}]},{"q":"Esto se repite casi todos los días. ¿Qué propones?","o":[{"t":"Lo anotas cada día en el libro de clases y nada más.","p":1,"f":"Registrar sirve, pero sin un plan de apoyo la conducta seguirá igual."},{"t":"Informas al profesor jefe y al equipo de apoyo para acordar una rutina anticipada, por ejemplo, asignarle una tarea al llegar al comedor.","p":2,"f":"Bien: anticipar la rutina y coordinar con el equipo y la familia es lo recomendado."},{"t":"Pides que almuerce separado del curso.","p":0,"f":"Aislarlo es una medida excluyente y no le enseña a esperar su turno."}]}],"claves":["Instrucción corta, de cerca y con calma","Reforzar de inmediato el logro","Evitar retos y castigos en público","Coordinar con profesor jefe, equipo y familia"],"s":[["tdah_guia"],["tdah_parv"]]},
  {"id":"c20","m":"tdah","n":2,"titulo":"Pelotazo en el recreo","intro":"Sofía, de 7° básico, tiene diagnóstico de TDAH. Pierde un partido en el recreo, se enoja y lanza la pelota con fuerza contra un compañero. Está muy alterada y grita.","pasos":[{"q":"¿Qué haces primero?","o":[{"t":"Detienes la situación, verificas que nadie esté herido y acompañas a Sofía a un lugar más tranquilo.","p":2,"f":"Correcto: primero la seguridad y bajar la intensidad."},{"t":"Atiendes al compañero y dejas sola a Sofía en el patio.","p":1,"f":"Atender al afectado es necesario, pero Sofía también necesita un adulto que la acompañe."},{"t":"Le exiges a gritos que pida perdón de inmediato.","p":0,"f":"Exigir en plena crisis aumenta la tensión y la frustración."}]},{"q":"Ya están calmados. ¿Cómo abordas el conflicto?","o":[{"t":"Hablas solo con Sofía y le explicas lo que hizo mal.","p":1,"f":"Falta escuchar a ambas partes y llegar a acuerdos."},{"t":"Das el tema por cerrado sin conversar.","p":0,"f":"Sin reparación ni acuerdos, el conflicto puede repetirse."},{"t":"Reúnes a ambos, cada uno relata, describen los hechos, buscan puntos en común y acuerdan cómo actuar a futuro.","p":2,"f":"Bien: es el procedimiento de resolución de conflictos que propone la guía Mineduc."}]},{"q":"¿Qué haces después?","o":[{"t":"Registras y comunicas el hecho según el reglamento interno, y luego cierras el conflicto y partes de cero con Sofía.","p":2,"f":"Correcto: se aplica el reglamento y se evita cargar a la estudiante con el episodio."},{"t":"Registras el hecho, pero desde ahora vigilas solo a Sofía en cada recreo.","p":1,"f":"Registrar está bien, pero centrar la vigilancia en ella la etiqueta."},{"t":"Comentas el diagnóstico de Sofía con otros apoderados para que entiendan.","p":0,"f":"La información de diagnóstico y tratamiento es privada."}]}],"claves":["Seguridad primero y bajar la intensidad","Mediar con hechos, escuchando a ambas partes","Aplicar el reglamento interno","Cerrar el conflicto, partir de cero y resguardar la privacidad"],"s":[["tdah_guia"],["c482"]]},
  {"id":"c21","m":"di","n":1,"titulo":"Cambio de sala inesperado","intro":"Tomás, de 8° básico, tiene discapacidad intelectual y está en el PIE. Hoy su curso tiene clase en el laboratorio y no en su sala. Lo encuentras solo en el pasillo, confundido.","pasos":[{"q":"¿Qué haces primero?","o":[{"t":"Le das todas las indicaciones para llegar: dos pasillos, la escalera, la segunda puerta a la derecha.","p":1,"f":"Varias órdenes seguidas le cuestan; mejor una a la vez."},{"t":"Te acercas, lo saludas por su nombre y le dices con frase corta: «Hoy la clase es en el laboratorio. Vamos juntos».","p":2,"f":"Bien: mensaje corto, claro y con acompañamiento."},{"t":"Lo retas por estar fuera de la sala en horario de clases.","p":0,"f":"No había entendido el cambio; retarlo no lo ayuda."}]},{"q":"Llegan al laboratorio. ¿Qué haces?","o":[{"t":"Le pides que entre y busque su puesto, y lo apoyas solo si lo necesita.","p":2,"f":"Correcto: apoyo estrictamente necesario para fomentar su autonomía."},{"t":"Lo dejas en la puerta sin ver si sabe dónde sentarse.","p":1,"f":"Faltó comprobar que entendió qué hacer."},{"t":"Lo llevas de la mano y le ordenas tú todos sus materiales.","p":0,"f":"Es sobreprotección: le quita oportunidades de aprender a hacerlo solo."}]},{"q":"¿Qué haces después?","o":[{"t":"No lo informas: fue algo menor.","p":0,"f":"El equipo necesita esa información para prevenir que se repita."},{"t":"Lo comentas solo con un compañero de turno.","p":1,"f":"Compartir está bien, pero debe llegar a quienes planifican sus apoyos."},{"t":"Informas al profesor jefe y al equipo PIE para que anticipen los cambios de sala con apoyo visual, como un horario con imágenes.","p":2,"f":"Bien: trabajo en equipo y apoyo visual para anticipar."}]}],"claves":["Una instrucción a la vez, corta y clara","Apoyo estrictamente necesario","Evitar la sobreprotección","Informar al equipo PIE para anticipar cambios"],"s":[["di_guia"],["pie"]]},
  {"id":"c22","m":"di","n":2,"titulo":"No la dejan jugar","intro":"En el recreo, un grupo de 6° básico no deja jugar a Valentina, que tiene discapacidad intelectual. Se ríen de cómo habla y le dicen que «no entiende las reglas». Ocurre por tercera vez esta semana.","pasos":[{"q":"¿Qué haces primero?","o":[{"t":"Le dices a Valentina que juegue en otro lado.","p":1,"f":"La alejas del problema, pero no detienes las burlas."},{"t":"Intervienes de inmediato, detienes las burlas con calma y te aseguras de que Valentina esté bien.","p":2,"f":"Correcto: proteger y detener la conducta es lo primero."},{"t":"Lo dejas pasar: son cosas de niños.","p":0,"f":"El aislamiento y las burlas reiteradas pueden ser acoso escolar."}]},{"q":"¿Cómo sigues con el grupo?","o":[{"t":"Conversas con el grupo sobre el respeto y propones un juego con reglas simples donde todos participen.","p":2,"f":"Bien: promueve la participación real de Valentina."},{"t":"Obligas al grupo a incluirla, sin conversar.","p":1,"f":"La inclusión forzada sin reflexión suele no durar."},{"t":"Le pides a Valentina que pase los recreos contigo en inspectoría para protegerla.","p":0,"f":"Es sobreprotección y la deja aún más excluida."}]},{"q":"¿Qué haces después?","o":[{"t":"Avisas solo al apoderado de Valentina.","p":1,"f":"La familia debe saberlo, pero el colegio también debe actuar."},{"t":"Explicas el diagnóstico de Valentina al grupo para que «la entiendan».","p":0,"f":"Su información es privada; no se expone para justificarla."},{"t":"Registras los hechos y los informas al coordinador/a de convivencia educativa y al equipo PIE para acordar acciones.","p":2,"f":"Correcto: hechos reiterados se gestionan según el reglamento y con el equipo."}]}],"claves":["Detener las burlas y proteger a la estudiante","El aislamiento reiterado puede ser acoso escolar","Promover la participación, no la sobreprotección","Registrar e informar a convivencia y al PIE"],"s":[["lge","art. 16 B"],["di_guia"],["l21809"],["pie"]]},
  {"id":"c23","m":"fis","n":1,"titulo":"Primer día de Antonia","intro":"Antonia, de 5° básico, tiene baja visión y llega hoy al colegio. Para salir al patio hay que bajar una escalera. Te piden recibirla en inspectoría.","pasos":[{"q":"¿Cómo la recibes?","o":[{"t":"Te presentas con tu nombre y función, y le ofreces recorrer juntas los espacios que usará.","p":2,"f":"Bien: identificarte y recorrer el lugar le da seguridad para moverse."},{"t":"Le entregas un plano impreso del colegio.","p":1,"f":"Ayuda poco si no está en un formato accesible; mejor un recorrido guiado."},{"t":"Le pides a un compañero que la lleve de la mano todo el día.","p":0,"f":"Limita su autonomía sin preguntarle qué necesita."}]},{"q":"Llegan a la escalera. ¿Qué haces?","o":[{"t":"Le dices «por aquí» y señalas con la mano.","p":1,"f":"Las señas visuales no le sirven; describe con palabras."},{"t":"La tomas del brazo y bajas rápido.","p":0,"f":"Tomarla del brazo le quita estabilidad."},{"t":"Le ofreces tu brazo, sin tomar el suyo, y le describes la escalera y el pasamanos.","p":2,"f":"Correcto: así se guía de forma segura."}]},{"q":"Notas que la escalera no tiene gomas antideslizantes y hay mochilas en el suelo del pasillo. ¿Qué haces?","o":[{"t":"Informas a dirección y al encargado de seguridad para corregir esas barreras, y pides despejar el paso.","p":2,"f":"Bien: eliminar barreras del entorno previene accidentes para todos."},{"t":"Solo le dices a Antonia que tenga cuidado.","p":1,"f":"Advertirle está bien, pero la barrera sigue ahí."},{"t":"Le prohíbes salir al patio en los recreos.","p":0,"f":"La excluye en vez de quitar la barrera."}]}],"claves":["Presentarse y hacer un recorrido guiado","Ofrecer el brazo y describir con palabras","Eliminar barreras del entorno","Favorecer la autonomía, no la dependencia"],"s":[["fis_senadis"],["fis_visual"],["l20422","art. 28"]]},
  {"id":"c24","m":"fis","n":2,"titulo":"Simulacro en el segundo piso","intro":"Durante un simulacro del Plan Integral de Seguridad Escolar suena una alarma solo sonora. En el segundo piso están Benjamín, estudiante sordo usuario de LSCh, y Martina, que usa silla de ruedas y tiene una asistente.","pasos":[{"q":"Benjamín sigue trabajando, no escuchó la alarma. ¿Qué haces?","o":[{"t":"Le gritas desde la puerta que salga.","p":0,"f":"No puede oírte; el aviso debe ser visual."},{"t":"Te acercas, lo contactas con un toque suave, te pones frente a él y le indicas con señas o una nota que deben evacuar.","p":2,"f":"Correcto: contacto suave, de frente y por un canal visual."},{"t":"Le pides a un compañero que le avise y sigues con el resto.","p":1,"f":"Puede funcionar, pero no te aseguras de que entendió."}]},{"q":"Martina debe evacuar. ¿Qué haces?","o":[{"t":"Separas a Martina de su asistente para que todo sea más rápido.","p":0,"f":"Senadis indica no separar a la persona de quien la acompaña."},{"t":"Le pides que espere a que salgan todos para no interrumpir.","p":1,"f":"Debe tener atención preferente, no quedar al final."},{"t":"Sigues el plan acordado para ella, le preguntas cómo prefiere ser apoyada y no manipulas su silla sin su permiso.","p":2,"f":"Bien: plan previo, consulta a la persona y respeto por su ayuda técnica."}]},{"q":"Terminado el simulacro, ¿qué haces?","o":[{"t":"Reportas al encargado de seguridad que la alarma es solo sonora y propones alertas visuales e incluir a estos estudiantes en el plan con apoyos definidos.","p":2,"f":"Correcto: los simulacros sirven para medir si las alertas y la evacuación son accesibles."},{"t":"Lo comentas de pasada con un colega.","p":1,"f":"Si no se reporta, el plan no mejora."},{"t":"Propones que en los próximos simulacros ellos se queden en la sala.","p":0,"f":"Los excluye y los deja en riesgo en una emergencia real."}]}],"claves":["Avisos por varios canales, incluidos los visuales","Contacto suave y de frente con estudiantes sordos","Atención preferente y no separar a la persona de su apoyo","Reportar fallas para mejorar el plan de seguridad"],"s":[["fis_emerg"],["pise"],["fis_senadis"]]},
  {"id":"c25","m":"der","n":1,"titulo":"Siempre con hambre","intro":"Notas que un estudiante de 3° básico llega varios días sin colación, con ropa muy sucia y una herida en el brazo que nadie ha curado. Se ve cansado y retraído.","pasos":[{"q":"¿Qué haces primero?","o":[{"t":"Lo acoges con discreción, le preguntas cómo está sin interrogarlo y observas con atención.","p":2,"f":"La detección empieza por acoger y observar, sin exponerlo ni presionarlo."},{"t":"Comentas su higiene frente al curso para que la familia reaccione.","p":0,"f":"Exponerlo lo humilla y vulnera su derecho a la honra y la intimidad."},{"t":"Llamas a la mamá para retarla por descuidarlo.","p":1,"f":"Te preocupas, pero no te corresponde enfrentar a la familia: debes informar a la dirección."}]},{"q":"Las señales se repiten. ¿Qué haces con lo que observaste?","o":[{"t":"Registras por escrito hechos concretos (fechas, lo que viste) e informas a la dirección dentro de 24 horas.","p":2,"f":"Un registro objetivo, sin opiniones, y la comunicación oportuna a la dirección activan el protocolo."},{"t":"Lo comentas con colegas en la sala de profesores.","p":0,"f":"La información debe manejarse en forma restringida para no estigmatizar al niño."},{"t":"Esperas a juntar más señales durante el semestre.","p":1,"f":"Observar es útil, pero el protocolo pide informar a la dirección en un plazo de hasta 24 horas."}]},{"q":"La dirección evalúa que hay una posible vulneración que no es delito. ¿Qué corresponde?","o":[{"t":"La dirección o el sostenedor informa al Tribunal de Familia u oficina de protección, y el colegio acompaña al estudiante.","p":2,"f":"Las vulneraciones que no son delito se canalizan a Tribunales de Familia u oficinas locales de protección."},{"t":"Tú presentas una denuncia penal por tu cuenta.","p":1,"f":"La denuncia penal es para hechos que pueden ser delito, y la coordina la dirección."},{"t":"No se hace nada porque es un tema privado de la familia.","p":0,"f":"Toda vulneración de derechos es grave, aunque no sea delito."}]}],"claves":["Acoger y observar sin exponer al niño","Registrar hechos objetivos e informar a la dirección dentro de 24 horas","Vulneración no constitutiva de delito: Tribunal de Familia u oficina local de protección","Manejar la información en forma restringida"],"s":[["der_parvprot"],["der_defvuln"],["l21430","art. 34"]]},
  {"id":"c26","m":"viol","n":2,"titulo":"La pelea grabada","intro":"En el patio, un estudiante de 1° medio golpea a otro mientras dos compañeros graban con el celular. Minutos después, el video circula en redes. El estudiante agredido tiene un corte en la ceja.","pasos":[{"q":"¿Qué haces en el momento?","o":[{"t":"Detienes la agresión pidiendo apoyo a otro adulto, proteges al agredido y gestionas su atención por la lesión.","p":2,"f":"Primero se detiene, se protege y se atiende la lesión, que cubre el seguro escolar."},{"t":"Separas a los estudiantes y los mandas a todos a la sala.","p":1,"f":"Detienes la pelea, pero falta atender la lesión y proteger al afectado."},{"t":"Grabas tú también para tener tu propia evidencia.","p":0,"f":"Tu rol es detener y proteger; grabar aumenta la exposición de la víctima."}]},{"q":"El video sigue circulando. ¿Qué haces?","o":[{"t":"No lo reenvías, registras por escrito quién grabó y dónde circula, e informas a dirección y convivencia.","p":2,"f":"Difundir una agresión es otra forma de violencia digital; el registro objetivo permite activar el protocolo."},{"t":"Esperas a que deje de circular solo.","p":1,"f":"No lo difundes, pero el acoso por medios tecnológicos debe reportarse."},{"t":"Lo compartes en el grupo de apoderados para identificar a los responsables.","p":0,"f":"Reenviarlo multiplica el daño y expone al estudiante agredido."}]},{"q":"¿Cómo sigue el abordaje?","o":[{"t":"La dirección informa a cada familia por separado, evalúa denunciar dentro de 24 horas si hay delito y aplica medidas de protección y seguimiento.","p":2,"f":"Informar sin minimizar, denunciar cuando corresponde y acompañar a ambos son parte del protocolo."},{"t":"Citas a ambas familias juntas para que se pongan de acuerdo.","p":1,"f":"La información a los apoderados se entrega a cada parte por separado."},{"t":"Exiges la expulsión inmediata de quienes grabaron.","p":0,"f":"Las medidas se deciden con debido proceso y se privilegian las formativas; la expulsión es excepcional."}]}],"claves":["Detener, proteger y atender la lesión","Nunca reenviar ni difundir el video","Informar a cada familia por separado y denunciar en 24 horas si hay delito","Medidas de protección, formativas y seguimiento"],"s":[["viol_cart10"],["viol_ciber"],["l21809","arts. 16 B y 16 E LGE"],["seguro"],["cpp","art. 175"]]},
  {"id":"c27","m":"seg","n":1,"titulo":"Sismo en plena clase","intro":"Cubres un curso de 5° básico en el segundo piso cuando empieza un sismo fuerte. En el curso hay un estudiante con TEA.","pasos":[{"q":"El piso se mueve con fuerza. ¿Qué haces primero?","o":[{"t":"Mantienes la calma y pides que se protejan en el lugar acordado, lejos de ventanas, hasta que pase el movimiento.","p":2,"f":"SENAPRED indica mantener la calma y protegerse lejos de ventanas y objetos que puedan caer."},{"t":"Esperas el aviso por altoparlante antes de dar cualquier indicación.","p":1,"f":"En un sismo la alarma es el propio evento: no hay que esperar otra señal para protegerse."},{"t":"Pides que salgan corriendo al patio mientras todavía se mueve.","p":0,"f":"Correr durante el movimiento expone a caídas y golpes. La evacuación sigue el protocolo del PISE."}]},{"q":"Termina el movimiento y se indica evacuar. ¿Cómo lo haces?","o":[{"t":"Guías al curso por la vía de evacuación señalizada, por la escalera, hasta la zona de seguridad, anticipando cada paso al estudiante con TEA.","p":2,"f":"Se evacúa por vías señalizadas, sin ascensor, y con información accesible y anticipación para estudiantes con TEA."},{"t":"Salen en orden, pero por un pasillo más corto que no es la vía señalizada.","p":1,"f":"Las vías señalizadas son las evaluadas en el PISE. Un atajo puede tener riesgos no revisados."},{"t":"Te quedas en la sala con el curso hasta que llegue algún apoderado.","p":0,"f":"Si se activa la evacuación, el curso debe ir a la zona de seguridad según el protocolo."}]},{"q":"En la zona de seguridad llegan apoderados a retirar a sus hijos de forma desordenada. ¿Qué haces?","o":[{"t":"Te mantienes con tu curso y orientas a los apoderados hacia la persona encargada del vínculo con familias, según el protocolo.","p":2,"f":"El PISE define un rol de vínculo con las familias que informa las decisiones tomadas durante la emergencia."},{"t":"Atiendes tú a los apoderados mientras otro adulto mira tu curso, sin registrar quién se lleva a quién.","p":1,"f":"Ayudar está bien, pero el retiro debe ordenarse según el protocolo y con registro."},{"t":"Entregas a cada estudiante al primer adulto que lo pida.","p":0,"f":"El manual cita un sismo de 2022 en que los retiros desordenados se debieron a un protocolo mal comunicado."}]}],"claves":["En un sismo, la alarma es el propio movimiento: primero protegerse.","Evacuar por vías señalizadas, sin ascensor, hasta la zona de seguridad.","Información accesible y anticipación para estudiantes con discapacidad o TEA.","El retiro de estudiantes se ordena según el rol de vínculo con familias del PISE."],"s":[["seg_pise25","pp. 20, 25, 34-37"],["seg_senapred_sismo"]]},
  {"id":"c28","m":"aux","n":1,"titulo":"Caída en la escalera","intro":"En el recreo, una estudiante de 7° básico cae en la escalera. Tiene una herida que sangra en la rodilla y le duele mucho la muñeca, que se ve deformada.","pasos":[{"q":"Llegas al lugar. ¿Qué haces primero?","o":[{"t":"Revisas que la zona sea segura, mantienes la calma, le preguntas cómo está y pides a otro adulto que te acompañe.","p":2,"f":"Escena segura, calma y comprobar si responde son los primeros pasos."},{"t":"Llamas al apoderado antes de revisarla.","p":1,"f":"Avisar a la familia es necesario, pero primero se atiende y evalúa a la estudiante."},{"t":"La levantas rápido y la llevas caminando a inspectoría.","p":0,"f":"Ante sospecha de fractura se evitan los movimientos y no se intenta acomodar el hueso."}]},{"q":"La rodilla sangra y la muñeca está deformada. ¿Qué haces?","o":[{"t":"Presionas la herida con gasa limpia, no mueves la muñeca ni intentas acomodarla, y se pide atención de urgencia.","p":2,"f":"Presión directa en la herida y no manipular una posible fractura."},{"t":"Limpias la herida, pero le pides que mueva la muñeca para ver si duele.","p":1,"f":"Mover una posible fractura puede agravarla."},{"t":"Le pones crema antibiótica y vendas la muñeca bien apretada.","p":0,"f":"No se aplican cremas en heridas y un vendaje apretado puede cortar la circulación."}]},{"q":"La estudiante será trasladada. ¿Qué falta?","o":[{"t":"Se avisa a la familia, se completa la Declaración Individual de Accidente Escolar y se registra lo ocurrido según el protocolo.","p":2,"f":"El DS 313 obliga al jefe del establecimiento a denunciar el accidente apenas lo conoce, y la declaración permite usar el seguro."},{"t":"Se avisa a la familia, pero no se hace la declaración porque parece leve.","p":1,"f":"Sin la declaración, la estudiante puede no recibir la atención gratuita del seguro escolar."},{"t":"Se avisa a la familia por la agenda al día siguiente.","p":0,"f":"El aviso y la denuncia deben ser inmediatos."}]}],"claves":["Escena segura y calma antes de actuar.","Presión directa en heridas que sangran; no manipular una posible fractura.","Sin cremas ni remedios caseros.","Avisar a la familia y completar la Declaración Individual de Accidente Escolar."],"s":[["aux_cruzroja"],["aux_chcc_pa"],["ds313","art. 11"],["seguro"]]},
  {"id":"c29","m":"aux","n":2,"titulo":"Desmayo en el gimnasio","intro":"En educación física, un estudiante de 2° medio se desploma. No responde cuando le hablas. El liceo tiene un DEA en el pasillo.","pasos":[{"q":"¿Qué haces primero?","o":[{"t":"Revisas que la escena sea segura, compruebas si responde, observas 3 a 5 segundos si respira y pides que alguien llame al 131 y traiga el DEA.","p":2,"f":"Es la secuencia de evaluación inicial, delegando la llamada y el DEA."},{"t":"Lo dejas acostado y vas tú a la oficina a buscar ayuda.","p":1,"f":"No se le deja solo salvo que no haya otra forma: pide a otra persona que llame."},{"t":"Lo sientas y le das agua.","p":0,"f":"No se dan líquidos a una persona inconsciente."}]},{"q":"Respira, pero sigue sin responder. ¿Qué haces?","o":[{"t":"Lo pones de lado en posición de seguridad, sosteniendo cabeza y cuello, y vigilas su respiración sin dejarlo solo.","p":2,"f":"Si respira y no responde, se pone de lado y se vigila constantemente."},{"t":"Lo dejas boca arriba y lo vigilas.","p":1,"f":"Vigilar es correcto, pero la guía indica ponerlo de lado."},{"t":"Lo dejas solo y vas a la entrada a esperar la ambulancia.","p":0,"f":"Hay que vigilarlo de forma constante por si deja de respirar."}]},{"q":"Deja de respirar. ¿Qué haces?","o":[{"t":"Informas el cambio al 131 y quien tiene capacitación certificada inicia RCP y usa el DEA hasta que llegue el SAMU.","p":2,"f":"Ante un paro se inicia RCP y se usa el desfibrilador; los procedimientos requieren capacitación."},{"t":"Nadie está capacitado, así que solo esperan la ambulancia sin hablar con el 131.","p":1,"f":"Mantén la llamada: el profesional regulador del 131 puede guiar las maniobras."},{"t":"Le das un medicamento que encontraste en su mochila.","p":0,"f":"En primeros auxilios no se administran medicamentos."}]}],"claves":["Evaluar escena, respuesta y respiración.","Delegar la llamada al 131 y la búsqueda del DEA.","Si respira y no responde: posición de seguridad y vigilancia.","RCP solo con capacitación certificada; nunca administrar medicamentos."],"s":[["aux_cruzroja"],["aux_chcc_urg"],["aux_samu131"],["l21156"]]},
  {"id":"c30","m":"sm","n":1,"titulo":"Siempre solo en el recreo","intro":"Vicente, de 7° básico, pasa los recreos solo desde hace semanas. Se ve cansado y su profesor jefe comentó que bajaron sus notas. Hoy lo encuentras llorando en un pasillo durante la clase.","pasos":[{"q":"¿Cómo te acercas?","o":[{"t":"Le preguntas qué le pasa ahí mismo, mientras pasan otros estudiantes.","p":1,"f":"Mostrar interés está bien, pero la conversación debe ser en un espacio privado y seguro."},{"t":"Le dices que se apure en volver a la sala.","p":0,"f":"Ignora una señal de malestar que requiere acogida."},{"t":"Lo invitas a un lugar tranquilo y privado, y lo escuchas sin presionarlo a hablar.","p":2,"f":"Bien: acoger en un espacio seguro y escuchar activamente es la primera respuesta."}]},{"q":"Vicente te dice que nadie lo quiere y que a veces piensa que sería mejor no estar. ¿Qué haces?","o":[{"t":"Mantienes la calma, le agradeces que te lo cuente, le explicas que buscarás ayuda y lo acompañas mientras avisas al equipo responsable según el protocolo.","p":2,"f":"Bien: escuchas sin juzgar, lo proteges y activas de inmediato a quienes deben evaluar el riesgo."},{"t":"Lo escuchas y le prometes que no se lo contarás a nadie.","p":1,"f":"Escuchar es correcto, pero ante un posible riesgo la confidencialidad tiene límites."},{"t":"Le dices que no diga esas cosas, que tiene una buena vida.","p":0,"f":"Minimizar lo que siente lo aleja de pedir ayuda."}]},{"q":"Al día siguiente, ¿cuál es tu aporte?","o":[{"t":"Lo comentas con colegas en la sala de profesores.","p":0,"f":"Comentarlo fuera del equipo responsable vulnera su confidencialidad."},{"t":"Registras lo observado para el equipo y, en lo cotidiano, estás atento a su integración en los recreos y talleres, según lo que acuerde el equipo.","p":2,"f":"Bien: el equipo informa a la familia y hace seguimiento; tú aportas observación y apoyo a su inclusión."},{"t":"No haces nada más porque ya avisaste.","p":1,"f":"Avisar era clave, pero el seguimiento y el apoyo cotidiano también importan."}]}],"claves":["Acoger en un espacio privado y escuchar sin presionar.","No prometer secreto: la confidencialidad cede ante riesgo.","Avisar de inmediato al equipo responsable según protocolo.","Apoyar el seguimiento y la inclusión en el día a día."],"s":[["sm_c3","pp. 9 a 13"],["sm_suic","pp. 34 a 40"],["sm_c2","recomendación 10"]]},
  {"id":"c31","m":"parv","n":1,"titulo":"Disputa por un juguete","intro":"En el patio del nivel medio, dos niños de 3 años pelean por un camión. Uno empuja al otro, que cae, llora y tiene un chichón en la frente.","pasos":[{"q":"¿Qué haces primero?","o":[{"t":"Te acercas, separas con calma, revisas al niño que cayó y lo acompañas.","p":2,"f":"A esta edad el adulto supervisa para que no se hagan daño y atiende primero al lesionado."},{"t":"Les quitas el camión a ambos y sigues con lo que hacías.","p":1,"f":"Detienes la pelea, pero no revisas al niño que se golpeó."},{"t":"Retas fuerte al que empujó delante de todos.","p":0,"f":"Los gritos no ayudan: el adulto es modelo de cómo manejar las emociones."}]},{"q":"El niño tiene un chichón, pero está alerta. ¿Qué haces?","o":[{"t":"Aplicas frío intermitente, observas si sigue consciente y alerta, y avisas a la educadora para activar el protocolo de accidentes.","p":2,"f":"Frío intermitente, observación y protocolo, que indica quién avisa a la familia."},{"t":"Aplicas frío, pero no avisas a nadie porque parece leve.","p":1,"f":"Todo accidente se informa según el protocolo del reglamento interno."},{"t":"Le das un analgésico para el dolor.","p":0,"f":"Los medicamentos solo se dan con receta y según el reglamento; no lo decide el inspector/a."}]},{"q":"¿Qué haces con el niño que empujó?","o":[{"t":"Junto a la educadora, nombran lo que sintió, le explican que empujar hace daño y lo ayudan a pedir su turno.","p":2,"f":"Es una medida formativa: empatía, resolución de conflictos y comprensión de normas."},{"t":"Lo sientas solo en un rincón a pensar.","p":1,"f":"Chile Crece Contigo señala que el «tiempo fuera» no ayuda a manejar las emociones."},{"t":"Le registras una anotación disciplinaria.","p":0,"f":"Entre párvulos no se aplican medidas disciplinarias."}]}],"claves":["Supervisar para que no se hagan daño y atender primero al lesionado.","Golpe en la cabeza: frío intermitente, observar y activar el protocolo.","Nada de medicamentos sin receta ni protocolo.","Con párvulos, medidas formativas y no sanciones."],"s":[["parv_chcc_2a3"],["parv_chcc_pa"],["parv_chcc_pat"],["parv_ori_ri","pp. 18-23"]]},
  {"id":"c32","m":"parv","n":2,"titulo":"Marzo en el jardín","intro":"Es marzo en un jardín con nivel medio. Apoyas la recepción en la entrada y algunos retiros durante la jornada.","pasos":[{"q":"Una niña llora mucho al separarse de su madre en la entrada. ¿Qué haces?","o":[{"t":"La recibes con calma, apoyas una despedida tranquila y breve, y le permites quedarse con su peluche.","p":2,"f":"Calma, despedida sin extender y objeto de apego favorecen la familiarización."},{"t":"Le pides a la madre que se quede toda la mañana hasta que la niña deje de llorar.","p":1,"f":"Un ingreso gradual se acuerda con el equipo; la despedida no conviene alargarla sin necesidad."},{"t":"Le dices a la niña que los niños grandes no lloran.","p":0,"f":"El temor es esperable y se acoge con actitud tranquilizadora."}]},{"q":"A mediodía llega un tío que no conoces a retirar a un niño antes de la hora. ¿Qué haces?","o":[{"t":"No lo entregas de inmediato: aplicas el procedimiento de retiro del reglamento, consultas a la educadora y la familia, y registras horario, motivo y adulto a cargo.","p":2,"f":"El reglamento exige registrar horario, motivo y persona adulta a cargo en los retiros anticipados."},{"t":"Le pides que espere y llamas a la familia, pero no dejas registro del retiro.","p":1,"f":"Verificar está bien, pero el retiro debe quedar registrado."},{"t":"Se lo entregas porque dice ser familiar.","p":0,"f":"Entregar a un niño sin verificar pone en riesgo su seguridad."}]},{"q":"La educadora te cuenta que un niño falta hace semanas y la familia no responde. ¿Qué haces?","o":[{"t":"Informas a la dirección para que el equipo contacte a la familia y aplique el procedimiento del reglamento sobre inasistencias.","p":2,"f":"La baja por ausencia injustificada sigue un procedimiento regulado por la Circular 860 y el reglamento."},{"t":"Esperas a ver si vuelve.","p":1,"f":"No hacer nada retrasa el contacto con la familia."},{"t":"Le dices a un familiar en la puerta que el niño ya perdió su cupo.","p":0,"f":"No le corresponde al inspector/a decidir una baja: hay un procedimiento formal."}]}],"claves":["La familiarización es gradual y a ritmo de cada niño o niña.","Despedida tranquila y breve, con objeto de apego.","Retiros anticipados: verificar y registrar horario, motivo y adulto a cargo.","Las inasistencias prolongadas se derivan a dirección según el reglamento."],"s":[["parv_famil26"],["parv_ori_ri","pp. 16-17"],["parv_r651"]]},
  {"id":"c33","m":"asis","n":1,"titulo":"Los lunes vacíos","intro":"Revisando el registro notas que un estudiante de 4° básico faltó seis lunes en dos meses. Nadie lo ha comentado.","pasos":[{"q":"¿Qué haces primero?","o":[{"t":"Revisas su asistencia acumulada y el patrón de días, y lo compartes con el profesor jefe.","p":2,"f":"Analizar el registro y compartirlo con el profesor jefe permite actuar temprano."},{"t":"Lo anotas en tu cuaderno, sin informar a nadie.","p":1,"f":"Detectaste la señal, pero sin compartirla nadie puede actuar."},{"t":"Esperas a que termine el semestre para ver si mejora.","p":0,"f":"La desvinculación es gradual: esperar agrava el problema."}]},{"q":"¿Cómo contactas a la familia?","o":[{"t":"Llamas o citas al apoderado con respeto, explicas por qué importa asistir y preguntas qué dificulta venir.","p":2,"f":"Mostrar el sentido de la asistencia y buscar causas abre la colaboración."},{"t":"Le avisas que el niño falta, sin preguntar por las causas.","p":1,"f":"Informar está bien, pero sin conocer la causa no se puede ayudar."},{"t":"Le envías una nota advirtiendo que repetirá de curso.","p":0,"f":"Presentar la asistencia como amenaza o norma arbitraria no ayuda."}]},{"q":"La madre cuenta que los lunes trabaja de madrugada y no hay quien lo traiga. ¿Qué haces?","o":[{"t":"Registras la barrera, la derivas al equipo de apoyo o dirección para buscar alternativas y haces seguimiento mensual.","p":2,"f":"La barrera se aborda en equipo y el seguimiento muestra si el plan funciona."},{"t":"Le sugieres que pida ayuda a un vecino, sin informar al equipo.","p":1,"f":"Buena intención, pero el caso necesita registro y apoyo del equipo."},{"t":"Le dices que es su responsabilidad y cierras el tema.","p":0,"f":"Ignorar la barrera mantiene la inasistencia."}]}],"claves":["Mirar el registro y detectar patrones temprano.","Compartir la alerta con el profesor jefe y el equipo.","Hablar con la familia buscando causas, sin amenazas.","Derivar las barreras y hacer seguimiento mensual."],"s":[["asis_idps_gestion"],["asis_idps_consejo"],["asis_ret20","pp. 15-19 y 46"]]},
  {"id":"c34","m":"asis","n":2,"titulo":"Tres semanas sin venir","intro":"Una estudiante de 1° medio lleva tres semanas sin asistir. El teléfono registrado no contesta y sus compañeros dicen que «está trabajando».","pasos":[{"q":"¿Qué haces?","o":[{"t":"Informas a la dirección y al equipo, intentas todos los contactos registrados y dejas constancia de cada intento.","p":2,"f":"Los registros del establecimiento son la base para ubicar y apoyar a estudiantes con inasistencia grave."},{"t":"Sigues marcándola ausente sin avisar a nadie.","p":1,"f":"El registro es correcto, pero la alerta debe llegar al equipo."},{"t":"La sacas de la lista del curso.","p":0,"f":"Retirar a una estudiante no es atribución del inspector/a."}]},{"q":"Nadie responde. ¿Cuál es el siguiente paso?","o":[{"t":"La dirección coordina con el equipo psicosocial y, si corresponde, con el Equipo Territorial de Revinculación o la red comunal para una visita.","p":2,"f":"Estos equipos visitan hogares de estudiantes con inasistencia grave, en coordinación con el establecimiento."},{"t":"Envías una carta y esperas.","p":1,"f":"Ayuda, pero ante tres semanas de ausencia hay que coordinar acciones más activas."},{"t":"Preguntas por ella en el grupo de WhatsApp de apoderados.","p":0,"f":"La información de ausentismo es confidencial; exponerla daña el vínculo."}]},{"q":"La estudiante vuelve un mes después. ¿Cómo la recibes?","o":[{"t":"La acoges sin exponerla y se activa un acompañamiento: tutoría, apoyo psicosocial y seguimiento de su asistencia.","p":2,"f":"Tutorías, apoyo biopsicosocial y seguimiento son estrategias de retención."},{"t":"La reintegras a clases sin plan de seguimiento.","p":1,"f":"Volver es un logro, pero sin acompañamiento el riesgo de abandono sigue."},{"t":"La dejas toda la mañana en inspectoría hasta que traiga un justificativo.","p":0,"f":"Las normas rígidas aumentan la probabilidad de abandono."}]}],"claves":["Informar a dirección y registrar cada intento de contacto.","Coordinar con el equipo psicosocial y los equipos de revinculación.","Cuidar la confidencialidad.","Recibir con acogida y un plan de acompañamiento."],"s":[["asis_equipos23"],["asis_ret20","pp. 15-16 y 46"],["asis_idps_gestion","p. 6"]]},
  {"id":"c35","m":"adm","n":1,"titulo":"Un pedido por WhatsApp","intro":"Una apoderada te escribe por WhatsApp. Pide que le mandes una foto de la hoja de anotaciones del compañero que, según ella, molesta a su hija.","pasos":[{"q":"¿Qué respondes?","o":[{"t":"Le explicas con amabilidad que no puedes compartir información de otro estudiante.","p":2,"f":"Correcto: los datos personales solo se usan para su fin y se guardan en secreto."},{"t":"Le mandas la foto tapando el nombre.","p":0,"f":"Sigue siendo información personal de un niño, usada fuera de su finalidad."},{"t":"No respondes el mensaje.","p":1,"f":"No entregas datos, pero dejas a la apoderada sin orientación."}]},{"q":"Ella insiste en que su hija lo pasa mal. ¿Qué haces?","o":[{"t":"Le prometes que vas a retar al compañero.","p":1,"f":"Te comprometes a algo que no corresponde y saltas el procedimiento."},{"t":"Le indicas el conducto formal: pedir entrevista o usar el canal de denuncias del reglamento.","p":2,"f":"Bien: su preocupación se canaliza por la vía formal y confidencial."},{"t":"Le dices que no es tu tema.","p":0,"f":"Una posible situación de acoso debe reportarse y orientarse."}]},{"q":"¿Qué haces tú con lo que te contó?","o":[{"t":"Lo comentas en el grupo de WhatsApp de inspectores con nombres.","p":0,"f":"Expone datos de niños en un canal no formal."},{"t":"Lo anotas en tu cuaderno personal.","p":1,"f":"Dejar constancia ayuda, pero debe llegar a quien corresponde por la vía formal."},{"t":"Reportas la información al equipo directivo o a quien indique el reglamento interno.","p":2,"f":"Correcto: es un deber legal reportar posibles hechos de acoso."}]}],"claves":["No compartir datos de otros estudiantes","Orientar al conducto formal o al canal de denuncias","Reportar posibles hechos de acoso","Evitar canales informales con datos personales"],"s":[["l19628","arts. 7 y 9"],["l21809","art. 16 E LGE"]]},
  {"id":"c36","m":"adm","n":2,"titulo":"La anotación que hay que cambiar","intro":"Un docente te pide que borres del libro de clases digital una anotación que registró en el estudiante equivocado. Al día siguiente, un apoderado reclama porque su hijo aparece ausente un día que sí asistió.","pasos":[{"q":"¿Qué consideras antes de actuar?","o":[{"t":"Que el sistema registra toda modificación o eliminación, así que todo cambio debe ser formal y justificado.","p":2,"f":"Correcto: el libro digital exige trazabilidad de todas las acciones."},{"t":"Que se puede borrar sin problema porque nadie lo notará.","p":0,"f":"Falso: toda acción queda registrada y el libro es un documento fiscalizable."},{"t":"Que es mejor no tocar nada aunque haya un error.","p":1,"f":"Dejar un error a sabiendas tampoco protege la calidad del registro."}]},{"q":"¿Cómo abordas el error de asistencia?","o":[{"t":"Le pides al estudiante que confirme y cambias tú el dato.","p":1,"f":"Revisas el hecho, pero sin respaldo ni autorización."},{"t":"Reúnes los antecedentes y lo informas a quien el colegio designe para corregir registros.","p":2,"f":"Bien: la corrección debe quedar respaldada y hecha por quien corresponde."},{"t":"Le dices al apoderado que la asistencia nunca se corrige.","p":0,"f":"Cierra el reclamo sin revisar si hubo error."}]},{"q":"¿Cómo respondes al apoderado?","o":[{"t":"Le respondes por mensaje personal desde tu celular.","p":1,"f":"Respondes, pero fuera de los canales formales del establecimiento."},{"t":"Le dices que reclame a la Superintendencia.","p":0,"f":"Primero el colegio debe gestionar el reclamo por sus conductos formales."},{"t":"Le informas que su reclamo quedó registrado y cómo y cuándo recibirá respuesta.","p":2,"f":"Correcto: comunicación formal y seguimiento del caso."}]}],"claves":["El libro digital registra todas las acciones","Las correcciones se hacen por la vía formal y con respaldo","Registrar y dar seguimiento a los reclamos","Usar canales formales con las familias"],"s":[["adm_ede"],["adm_rex30"],["l21809","art. 16 A LGE"]]},
  {"id":"c37","m":"com","n":1,"titulo":"Entrevista con una mamá preocupada","intro":"Una mamá llega a inspectoría sin citación. Dice que su hijo de 5° básico llega triste a la casa y que cree que lo molestan en el recreo.","pasos":[{"q":"¿Cómo inicias la conversación?","o":[{"t":"La recibes en un lugar tranquilo, te presentas y la escuchas sin interrumpir.","p":2,"f":"Correcto: la escucha activa y el buen trato abren la comunicación."},{"t":"Le dices que vuelva otro día con hora.","p":1,"f":"Puede ser necesario agendar, pero sin escucharla pierdes información importante."},{"t":"La atiendes en el pasillo, frente a otros apoderados.","p":0,"f":"No resguardas la reserva de la conversación."}]},{"q":"Mientras habla, ¿qué haces?","o":[{"t":"Tomas nota en silencio sin decir nada.","p":1,"f":"Registrar ayuda, pero falta mostrar que la estás escuchando."},{"t":"Parafraseas lo que dice y reflejas su preocupación.","p":2,"f":"Bien: así ella siente que la entendiste y tú confirmas los datos."},{"t":"Le aseguras que en este colegio no hay acoso.","p":0,"f":"Niegas su relato sin conocer los hechos."}]},{"q":"¿Cómo cierras la entrevista?","o":[{"t":"Le prometes que el agresor será suspendido.","p":0,"f":"No puedes anticipar medidas: hay un procedimiento con debido proceso."},{"t":"Le dices que vas a vigilar el recreo y que te avise si se repite.","p":1,"f":"Vigilar sirve, pero debes reportar la situación por la vía formal."},{"t":"Le explicas que reportarás lo informado a quien indica el reglamento y que el colegio la contactará por la vía formal.","p":2,"f":"Correcto: un posible acoso se reporta y la familia queda informada del paso siguiente."}]}],"claves":["Escuchar en un lugar reservado","Parafrasear y reflejar emociones","No prometer sanciones","Reportar y explicar el siguiente paso formal"],"s":[["com_crit","p. 10"],["l21809","art. 16 E LGE"]]},
