  {"id":"p42","m":"ig","n":1,"q":"¿Qué datos debe tener un buen registro de un incidente?","o":["Tu opinión sobre los involucrados","Fecha, hora, lugar, personas y lo que dijeron con sus palabras","Solo el nombre del estudiante culpable","Un resumen general sin detalles"],"c":1,"e":"Se registran hechos verificables, no opiniones.","s":[["c482","debido proceso"]]},
  {"id":"p43","m":"ig","n":1,"q":"Según el Estatuto Docente, el inspector general es:","o":["Un asistente de la educación","Un docente directivo","Un apoderado elegido","Un funcionario de la Superintendencia"],"c":1,"e":"El inspector general es docente directivo. El inspector de patio suele ser asistente de la educación.","s":[["estatuto"]]},
  {"id":"p44","m":"conv","n":1,"q":"¿Qué permite al director la Ley 21.128 Aula Segura?","o":["Expulsar sin procedimiento","Suspender como medida cautelar durante un procedimiento por faltas graves o gravísimas","Cerrar el colegio un día","Revisar celulares de los estudiantes"],"c":1,"e":"La suspensión cautelar se aplica mientras dura el procedimiento sancionatorio.","s":[["l21128"]]},
  {"id":"p45","m":"ig","n":1,"q":"¿Qué hace la Agencia de Calidad de la Educación?","o":["Fiscaliza y multa","Evalúa y orienta","Contrata inspectores","Entrega el seguro escolar"],"c":1,"e":"La Superintendencia fiscaliza; la Agencia evalúa y orienta.","s":[["l20529"]]},
  {"id":"p46","m":"ig","n":1,"q":"¿Cuándo se entrega el reglamento interno a las familias?","o":["Solo si lo piden por escrito","Al matricular, e informando sus cambios durante el año","Cuando el estudiante comete una falta","Al terminar el año"],"c":1,"e":"Las familias deben conocer las normas antes de que se apliquen.","s":[["dfl2_98","art. 6 d"]]},
  {"id":"p47","m":"conv","n":1,"q":"La buena convivencia educativa se define como:","o":["La ausencia total de conflictos","La coexistencia armónica de la comunidad, con relaciones inclusivas y participativas","El cumplimiento estricto de las sanciones","Que los estudiantes no hablen en clases"],"c":1,"e":"Los conflictos existen; la buena convivencia es cómo se convive y se resuelven.","s":[["l21809","art. 16 A LGE"]]},
  {"id":"p48","m":"sm","n":1,"q":"Detectas que un estudiante consume marihuana, sin vender. ¿Cómo se aborda?","o":["Se le expulsa de inmediato","Con apoyo y derivación a la red, por ejemplo SENDA Previene, según el protocolo","Se ignora si es fuera del colegio","Se le pide al curso que lo vigile"],"c":1,"e":"El consumo se aborda con apoyo; el microtráfico es un delito que se denuncia.","s":[["senda"],["c482"]]},
  {"id":"p49","m":"ig","n":1,"q":"Un adulto que no conoces quiere retirar a un estudiante. ¿Qué haces?","o":["Lo dejas ir si el estudiante lo conoce","Verificas que sea apoderado o adulto autorizado, su identidad, y registras hora y motivo","Le pides que vuelva mañana sin explicar","Llamas a Carabineros siempre"],"c":1,"e":"Solo se entrega al apoderado o a un adulto autorizado, según el reglamento.","s":[["c482","reglamento interno"]]},
  {"id":"p50","m":"tea","n":1,"q":"Según la Ley 21.545, el trastorno del espectro autista es:","o":["Una enfermedad contagiosa","Una diferencia o diversidad en el neurodesarrollo típico, que requiere diagnóstico","Un problema de mala crianza","Una falta disciplinaria"],"c":1,"e":"La ley lo define como una condición del neurodesarrollo que debe contar con diagnóstico.","s":[["l21545","art. 2"]]},
  {"id":"p51","m":"crisis","n":1,"q":"Un estudiante con TEA empieza a gritar y a mover las manos sin parar. Lo primero que NO debes hacer es:","o":["Ofrecerle un lugar tranquilo","Retarlo y amenazarlo con una anotación","Hablarle con voz calmada","Bajar el ruido alrededor"],"c":1,"e":"Regañar o amenazar con sanciones escala la crisis. La conversación viene cuando esté en calma.","s":[["dec","qué evitar"]]},
  {"id":"p52","m":"crisis","n":1,"q":"¿Cuál es una señal previa de desregulación?","o":["Que pida ir al baño","Aumento de movimientos repetitivos, irritabilidad o respiración agitada","Que termine rápido su tarea","Que salude a un compañero"],"c":1,"e":"Reconocer las señales previas permite actuar antes de que la crisis escale.","s":[["dec","prevención"]]},
  {"id":"p53","m":"crisis","n":1,"q":"En una desregulación con riesgo (etapa 2), ¿qué corresponde?","o":["Dejar que el curso mire para que aprenda","Llevarlo a un lugar seguro, retirar objetos peligrosos y reducir ruido y público","Sujetarlo entre varios de inmediato","Mandarlo solo a inspectoría"],"c":1,"e":"Se acompaña sin invadir, en un lugar seguro y con pocos estímulos.","s":[["dec","etapa 2"]]},
  {"id":"p54","m":"tea","n":1,"q":"Ante una emergencia con un estudiante con TEA, ¿cómo se contacta al apoderado?","o":["Por correo al día siguiente","Por la vía más rápida, registrando la hora y quién fue contactado","Solo si el estudiante lo pide","Mediante la libreta de comunicaciones"],"c":1,"e":"La Circular 586 pide contacto rápido y registro de hora y persona.","s":[["c586"]]},
  {"id":"p55","m":"tea","n":1,"q":"¿Qué es el PAEC?","o":["Un formulario de matrícula","El Plan de Acompañamiento Emocional y Conductual, elaborado con la familia","Una sanción por mala conducta","Un examen médico"],"c":1,"e":"Es un plan individual, confidencial, que se informa al personal al inicio del año.","s":[["c586"]]},
  {"id":"p56","m":"tea","n":1,"q":"Si sospechas que un estudiante podría tener TEA, tú:","o":["Le dices a la familia que tiene autismo","Compartes lo que observas con el equipo de convivencia o PIE para que se derive según protocolo","Lo cambias de curso","No haces nada"],"c":1,"e":"Los establecimientos derivan a salud según protocolo; el inspector no diagnostica.","s":[["l21545","art. 12"]]},
  {"id":"p57","m":"crisis","n":2,"q":"Sobre la contención física de un estudiante en crisis, la Circular 586 indica que:","o":["Es la primera medida recomendada","No es recomendable y solo procede excepcionalmente ante riesgo de daño","Puede hacerla cualquier adulto","Reemplaza el aviso a la familia"],"c":1,"e":"Es excepcional, por personal capacitado, con autorización escrita de la familia, y luego se informa.","s":[["c586"],["dec","etapa 3"]]},
  {"id":"p58","m":"tea","n":2,"q":"Durante una desregulación, un estudiante con TEA bota una silla. El profesor pide suspenderlo. ¿Qué dice la normativa?","o":["Debe suspenderse siempre","No se aplican medidas que se funden en su condición; si la conducta se origina en ella, no se sanciona","Debe cambiarse de colegio","Se suspende solo si lo pide el curso"],"c":1,"e":"Los estudiantes con TEA no están exentos de las normas, pero no se sanciona lo vinculado en su origen a su condición.","s":[["c586"]]},
  {"id":"p59","m":"tea","n":2,"q":"El colegio quiere exigir que un estudiante tome medicamentos para seguir matriculado. Esto:","o":["Está permitido si lo firma el apoderado","Está prohibido por la Circular 586","Lo decide el profesor jefe","Solo es válido en enseñanza media"],"c":1,"e":"No se puede condicionar la permanencia al consumo de medicamentos.","s":[["c586"]]},
  {"id":"p60","m":"tea","n":2,"q":"Una madre trabajadora sale de su empleo para acudir a una crisis de su hijo con TEA. Según el Código del Trabajo:","o":["Debe pedir vacaciones","Ese tiempo se considera trabajado y no es abandono del trabajo","Se descuenta de su sueldo","Necesita permiso de la Superintendencia de Educación"],"c":1,"e":"La Ley TEA agregó el art. 66 quinquies al Código del Trabajo.","s":[["l21545","art. 25"],["teamin"]]},
  {"id":"p61","m":"crisis","n":2,"q":"En una crisis con tres adultos, ¿qué hace el acompañante externo?","o":["Sujeta al estudiante","Queda afuera, coordina y llama a la familia o a directivos","Explica la conducta al curso","Graba el episodio"],"c":1,"e":"El encargado acompaña, el acompañante interno observa a distancia y el externo coordina.","s":[["dec","roles"]]},
  {"id":"p62","m":"tutor","n":1,"q":"¿Qué es un tutor sombra?","o":["Un funcionario del Mineduc","Un acompañante contratado por la familia que apoya al estudiante en la sala","El profesor jefe del curso","Un inspector de patio en práctica"],"c":1,"e":"No es personal del colegio; su presencia se acuerda entre el establecimiento y los apoderados.","s":[["copiapo"]]},
  {"id":"p63","m":"di","n":1,"q":"¿Qué es el PIE?","o":["Un plan de emergencias","Una estrategia inclusiva que da apoyos adicionales a estudiantes con NEE dentro de la sala","Un programa de alimentación","Un sumario administrativo"],"c":1,"e":"El Programa de Integración Escolar trabaja dentro del aula regular, con co-enseñanza.","s":[["pie"]]},
  {"id":"p64","m":"di","n":1,"q":"Las NEE permanentes son las que:","o":["Duran un semestre","Se presentan durante toda la escolaridad por una discapacidad diagnosticada","Desaparecen con una sanción","Solo existen en educación parvularia"],"c":1,"e":"Las transitorias, en cambio, requieren apoyos por un período determinado.","s":[["d170","art. 2"]]},
  {"id":"p65","m":"di","n":1,"q":"¿Cuál de estas es una NEE transitoria según Mineduc?","o":["Discapacidad visual","Trastorno específico del lenguaje","Autismo","Discapacidad auditiva"],"c":1,"e":"El TEL, las dificultades específicas del aprendizaje y el déficit atencional son transitorias.","s":[["pie"]]},
  {"id":"p66","m":"div","n":1,"q":"Un apoderado dice que no quiere «niños con autismo» en el curso de su hijo. ¿Qué responde el colegio?","o":["Que se evaluará cambiarlos","Que todos tienen derecho a estudiar sin discriminación arbitraria","Que tiene razón","Que hable con los otros apoderados"],"c":1,"e":"La Ley TEA y la Ley 20.609 prohíben la discriminación arbitraria por discapacidad.","s":[["l21545","art. 18"],["l20609","art. 2"]]},
  {"id":"p67","m":"fis","n":2,"q":"¿Qué son los «ajustes necesarios» en la Ley 20.422?","o":["Cambios en el sueldo de los docentes","Adecuaciones del ambiente físico, social y de actitud que facilitan la accesibilidad, sin carga desproporcionada","Sanciones más suaves","Exámenes especiales de ingreso"],"c":1,"e":"Por ejemplo, anticipar cambios de rutina o adaptar un espacio.","s":[["l20422","art. 8"]]},
  {"id":"p68","m":"tutor","n":2,"q":"En 2024, la Corte de Copiapó revisó el rechazo de un colegio a una tutora sombra. ¿Qué resolvió?","o":["Que el colegio debe pagar la tutora","Que el rechazo sin justificación suficiente fue arbitrario y discriminatorio, y ordenó permitirla","Que los tutores sombra están prohibidos","Que solo la Superintendencia puede autorizarlos"],"c":1,"e":"La tutora la pagaba la familia; la corte exigió al colegio razones sólidas para negarla.","s":[["copiapo"]]},
  {"id":"p69","m":"fis","n":2,"q":"¿Ante quién se puede denunciar un acto arbitrario contra derechos de la Ley 20.422?","o":["Ante el Juzgado de Policía Local","Ante el Servicio de Impuestos Internos","Ante el centro de padres","Ante el Registro Civil"],"c":0,"e":"También se puede reclamar en la Superintendencia o con la acción de la Ley 20.609.","s":[["teamin"]]},
  {"id":"p70","m":"di","n":2,"q":"¿Quién realiza la evaluación diagnóstica de NEE según el Decreto 170?","o":["El inspector general","Profesionales idóneos inscritos en el registro, con un enfoque integral e interdisciplinario","El profesor jefe por sí solo","El centro de alumnos"],"c":1,"e":"Además requiere autorización de la familia y se reevalúa cada año.","s":[["d170","arts. 4 y 15"]]},
  {"id":"p71","m":"ig","n":1,"q":"Un apoderado molesto llega al patio exigiendo hablar con un profesor en plena clase. Según la Ley 21.809, ¿qué corresponde?","o":["Dejarlo pasar a la sala para evitar un problema mayor","Orientarlo a canalizar su inquietud por los conductos formales del establecimiento","Pedirle que se retire sin darle ninguna alternativa","Llamar de inmediato a Carabineros"],"c":1,"e":"La ley exige a los apoderados buen trato y canalizar inquietudes por los conductos formales establecidos.","s":[["l21809","art. 16 A LGE"]]},
  {"id":"p72","m":"ig","n":2,"q":"Durante una revisión de mochilas regulada por el reglamento interno, un estudiante se niega a mostrarla. ¿Qué indica la Ley 21.827?","o":["Revisarla por la fuerza, porque está autorizado","Dejarlo volver a la sala sin avisar a nadie","No forzarla, avisar de inmediato a la familia y mantenerlo supervisado fuera de la sala","Suspenderlo por tres días"],"c":2,"e":"La revisión no puede forzarse: se notifica de inmediato a los padres y el estudiante queda supervisado en un espacio distinto a la sala.","s":[["l21827","art. 16 J LGE"]]},
  {"id":"p73","m":"ig","n":2,"q":"Según la Ley 21.827, si en una revisión se encuentran objetos prohibidos, el establecimiento debe:","o":["Avisar de inmediato a los padres y a Carabineros o PDI","Guardar el objeto y devolverlo a fin de año","Solo anotarlo en el libro de clases","Esperar a la reunión de apoderados para informar"],"c":0,"e":"La ley ordena notificar de inmediato a los padres y a Carabineros o la PDI.","s":[["l21827","art. 16 J LGE"]]},
  {"id":"p74","m":"ig","n":2,"q":"La Ley 21.827 agregó al art. 10 de la LGE que la violencia contra docentes, asistentes o estudiantes:","o":["Solo se sanciona si ocurre dentro de la sala","Es una vulneración grave que habilita medidas inmediatas, proporcionales y fundadas para su contención","Debe resolverse siempre mediante mediación entre las partes","Solo puede ser abordada por la Superintendencia"],"c":1,"e":"El nuevo inciso la califica como vulneración grave y permite medidas inmediatas, proporcionales y fundadas, según el reglamento interno.","s":[["l21827","art. 1"],["lge","art. 10 inciso final"]]},
  {"id":"p75","m":"conv","n":1,"q":"¿Qué técnica de resolución pacífica de conflictos se da cuando las partes buscan por sí mismas una solución, sin un tercero?","o":["Arbitraje pedagógico","Mediación","Negociación","Conciliación ante la Superintendencia"],"c":2,"e":"En la negociación las partes en conflicto buscan por sí mismas una solución y llegan a un acuerdo en que ambas ceden algo.","s":[["conv_cart6","p. 13"],["conv_orient2011"]]},
  {"id":"p76","m":"conv","n":1,"q":"En el arbitraje pedagógico, el tercero neutral:","o":["Decide por las partes una solución justa y formativa","Solo ayuda a que conversen, sin proponer nada","Registra el conflicto y lo envía a tribunales","Representa a la parte más afectada"],"c":0,"e":"En el arbitraje un adulto con atribuciones en la escuela decide por las partes, buscando una solución justa y formativa.","s":[["conv_cart6","p. 13"],["conv_orient2011"]]},
  {"id":"p77","m":"conv","n":2,"q":"Según la Ley 21.809, la gestión colaborativa de conflictos del reglamento interno se rige por los principios de:","o":["Celeridad, sanción y publicidad","Obligatoriedad, gradualidad y reparación","Imparcialidad, proporcionalidad y celeridad","Voluntariedad, confidencialidad, igualdad, imparcialidad y neutralidad"],"c":3,"e":"El art. 16 E letra k de la LGE fija esos cinco principios para la gestión colaborativa de conflictos.","s":[["l21809","art. 16 E letra k LGE"]]},
  {"id":"p78","m":"conv","n":2,"q":"¿En qué casos la Ley 21.809 excluye la gestión colaborativa de conflictos (como la mediación)?","o":["Cuando los estudiantes son de distinto curso","Cuando se trata de hechos constitutivos de delito o de vulneración de derechos fundamentales","Cuando el conflicto ocurre fuera del establecimiento","Cuando uno de los apoderados no asiste a la reunión"],"c":1,"e":"La ley señala que estos mecanismos no se aplican a hechos que constituyen delito ni a vulneraciones de derechos fundamentales.","s":[["l21809","art. 16 E letra k LGE"],["conv_ori21809","p. 8"]]},
  {"id":"p79","m":"conv","n":1,"q":"Un apoderado reclama que nadie le explicó una anotación de convivencia de su hijo. Según la LGE, los apoderados tienen derecho a:","o":["Revisar el libro de clases de todo el curso","Anular la anotación si no están de acuerdo","Ser informados sobre el rendimiento y la convivencia de su hijo y ser escuchados","Elegir qué medida se aplica a su hijo"],"c":2,"e":"El art. 10 letra b de la LGE reconoce el derecho de los apoderados a ser informados sobre rendimiento y convivencia, y a ser escuchados.","s":[["lge","art. 10 letra b"]]},
  {"id":"p80","m":"conv","n":1,"q":"En la disciplina formativa, el «servicio pedagógico» consiste en:","o":["Una acción en el tiempo libre del estudiante, asesorado por un docente","Una suspensión de clases con tareas para la casa","Limpiar el colegio como castigo frente a otros","Una multa que paga el apoderado"],"c":0,"e":"Las orientaciones Mineduc lo describen como una acción en el tiempo libre del estudiante con asesoría de un docente.","s":[["conv_orient2011"]]},
  {"id":"p81","m":"conv","n":2,"q":"Según las orientaciones del Mineduc, una acción reparatoria debe ser:","o":["Impuesta por el inspector para que sea efectiva","Voluntaria y proporcional al daño causado","Pública, para que sirva de ejemplo al curso","Igual para todas las faltas, sin importar el daño"],"c":1,"e":"La reparación debe ser absolutamente voluntaria y proporcional al daño causado.","s":[["conv_orient2011"]]},
  {"id":"p82","m":"tea","n":1,"q":"Un estudiante autista se tapa los oídos cada vez que suena el timbre. ¿Qué puede explicar esa reacción?","o":["Falta de disciplina","Una mayor sensibilidad a ciertos sonidos, propia de su procesamiento sensorial","Que no le gusta la clase que sigue","Que busca llamar la atención de sus compañeros"],"c":1,"e":"Algunos niños y niñas autistas son muy sensibles al ruido, la luz o los olores; Minsal describe la hiper o hiporreactividad a estímulos sensoriales.","s":[["tea_ot","cap. 1, p. 38"],["tea_guia08","p. 9"]]},
  {"id":"p83","m":"tea","n":1,"q":"¿Qué forma de dar una instrucción es más adecuada para un estudiante autista?","o":["Una explicación larga con varios ejemplos","Una frase irónica para hacerla más amena","Una frase corta y concreta, con apoyo visual si lo usa, dándole tiempo para responder","Repetirla más fuerte si no responde de inmediato"],"c":2,"e":"La guía Mineduc recomienda lenguaje claro y breve, evitar frases largas o metáforas y esperar su respuesta sin apurarlo.","s":[["tea_guia08","pp. 14, 31 y 39"]]},
  {"id":"p84","m":"tea","n":2,"q":"El recreo cambia de patio sin aviso y Benjamín, estudiante autista, se angustia. ¿Qué medida preventiva recomiendan los lineamientos Mineduc?","o":["Anticipar los cambios por medios de comunicación efectivos, como una secuencia visual, y contar con protocolos para las transiciones","No decirle nada para que se acostumbre","Dejarlo en la sala durante todos los recreos","Pedir a la familia que lo retire cuando haya cambios"],"c":0,"e":"Los lineamientos señalan los cambios no previstos como estresores y proponen anticipación y protocolos de transición.","s":[["tea_paec","pp. 29 a 31"]]},
  {"id":"p85","m":"tea","n":2,"q":"Según los lineamientos Mineduc para el PAEC, los elementos sensoriales (por ejemplo, un objeto para apretar) se deben permitir:","o":["Solo cuando el estudiante ya está en crisis","Nunca, porque distraen al curso","Solo durante el recreo","De forma preventiva y no solo como reacción"],"c":3,"e":"El documento indica permitir juguetes o elementos sensoriales de forma preventiva y no reactiva.","s":[["tea_paec","p. 31"]]},
  {"id":"p86","m":"tutor","n":1,"q":"Según lo citado en el fallo de Copiapó, la autorización para que un tutor sombra ingrese al colegio debe:","o":["Ser verbal; basta con que la directora lo conozca","Constar por escrito, firmada por las partes","Darla el profesor jefe en la sala","Pedirse a Carabineros"],"c":1,"e":"La Seremi, citando el dictamen 2769 de 2019 de Contraloría, indicó que la autorización debe constar por escrito y firmada por las partes.","s":[["copiapo","considerando 7"]]},
  {"id":"p87","m":"tutor","n":1,"q":"¿Dónde entrega el PIE sus apoyos?","o":["Siempre en una sala aparte","En la casa del estudiante","En el contexto del aula común, en trabajo colaborativo con el profesor","Solo en horario de recreo"],"c":2,"e":"El manual PIE indica que los especialistas ingresan a la sala para entregar apoyos y trabajar con el profesor de curso.","s":[["pie"]]},
  {"id":"p88","m":"tutor","n":1,"q":"Un buen acompañamiento individual busca que el estudiante:","o":["Dependa del adulto para cada tarea","Trabaje siempre fuera de la sala","Haga menos actividades que sus compañeros","Participe y acceda a las actividades de forma cada vez más autónoma"],"c":3,"e":"El Decreto 83 orienta los apoyos a que el estudiante acceda de forma autónoma y tome decisiones.","s":[["d83","pp. 7 a 10"]]},
  {"id":"p89","m":"tutor","n":1,"q":"¿Qué ayuda a un estudiante con necesidades de apoyo en las transiciones, como un cambio de sala?","o":["Anticipar con una agenda o secuencia visual e indicadores de tiempo","Avisarle justo cuando suena el timbre","Que espere solo en la sala","Llevarlo siempre de la mano"],"c":0,"e":"Los lineamientos Mineduc proponen agendas visuales, indicadores de tiempo y protocolos de transición.","s":[["tea_paec","pp. 30 y 31"]]},
  {"id":"p90","m":"tutor","n":1,"q":"Entre los requisitos que la Seremi citó para un tutor sombra está:","o":["Ser familiar del estudiante","Vivir cerca del colegio","No estar inhabilitado para trabajar con menores de edad","Tener experiencia como inspector/a"],"c":2,"e":"Se debe verificar que no figure en el registro de inhabilidades para trabajar con menores de la Ley 20.594.","s":[["copiapo","considerando 7"],["l20594"]]},
  {"id":"p91","m":"tutor","n":1,"q":"¿Qué instrumento registra las adecuaciones curriculares individuales de un estudiante y su efectividad?","o":["El PISE","El PACI","El reglamento interno","La hoja de vida del inspector"],"c":1,"e":"El Decreto 83 establece el Plan de Adecuaciones Curriculares Individualizado (PACI) para organizar y seguir esas adecuaciones.","s":[["d83","p. 8"]]},
  {"id":"p92","m":"tutor","n":2,"q":"Una familia pide que el tutor sombra decida por sí solo las adecuaciones de las evaluaciones de su hijo. Según el Decreto 83, ¿quiénes elaboran el PACI?","o":["Solo el tutor contratado por la familia","El inspector general","El apoderado por sí solo","Profesionales del establecimiento (docentes, especialistas y profesionales de apoyo), con participación de la familia"],"c":3,"e":"El Decreto 83 asigna el proceso a los profesionales del establecimiento y fomenta la participación del estudiante y su familia.","s":[["d83","pp. 9 y 13"]]},
  {"id":"p93","m":"tutor","n":2,"q":"Un tutor externo nota que la estudiante que acompaña se angustia en cada cambio de sala. ¿Cómo se canaliza mejor?","o":["Cambia él solo la rutina de todo el curso","Lo comunica al equipo que elabora el PAEC para evaluar ajustes e informar al personal","No dice nada para no molestar","Pide al inspector que suspenda los cambios de sala del curso"],"c":1,"e":"El PAEC se revisa con roles definidos y sus cambios se informan a quienes trabajan con la estudiante.","s":[["tea_paec","pp. 24 a 26"]]},
  {"id":"p94","m":"tutor","n":2,"q":"Sobre la figura del tutor sombra, la Corte de Copiapó señaló que la normativa reglamentaria:","o":["La prohíbe expresamente","La regula en detalle en el Decreto 170","No la prohíbe y la deja al acuerdo entre el establecimiento y los apoderados, cumpliendo requisitos","La exige en todos los colegios"],"c":2,"e":"El fallo indica que la normativa existente no prohíbe la figura y que queda sujeta al acuerdo y a los requisitos citados.","s":[["copiapo","considerando 7"]]},
  {"id":"p95","m":"crisis","n":1,"q":"Tras una mañana ruidosa, un estudiante deja de hablar, se va a un rincón y no responde. ¿Cómo se interpreta?","o":["Puede ser un shutdown, una crisis hacia adentro que también necesita apoyo","Indica que ya está tranquilo y no necesita nada","Es una falta de respeto que se anota","Se resuelve exigiéndole que vuelva a su puesto"],"c":0,"e":"Los lineamientos Mineduc describen el shutdown como un bloqueo interno y piden atender las conductas internalizantes.","s":[["tea_paec","pp. 35 y 36"]]},
  {"id":"p96","m":"crisis","n":1,"q":"Durante una desescalada, ¿qué corresponde?","o":["Discutir con el estudiante hasta que reconozca su error","Ofrecerle premios a cambio de que se calme","Hablar con lenguaje simple, validar lo que siente y mantener pocos adultos cerca","Rodearlo con varios adultos para controlarlo"],"c":2,"e":"Mineduc recomienda calma, lenguaje simple, validar, no negociar y reducir el número de personas.","s":[["tea_paec","pp. 32 a 34"]]},
  {"id":"p97","m":"crisis","n":1,"q":"Un estudiante tira su estuche cada vez que le piden leer en voz alta. ¿Cuál es un enfoque adecuado?","o":["Castigarlo siempre igual hasta que pare","Ignorar la situación sin informar a nadie","Exponerlo ante el curso para que se avergüence","Pensar qué está comunicando y buscar con el equipo una forma alternativa de expresarlo"],"c":3,"e":"La conducta comunica; se busca su función y se enseñan habilidades alternativas que cumplan esa misma función.","s":[["tea_paec","p. 35"],["dec","seguimiento"]]},
  {"id":"p98","m":"crisis","n":2,"q":"Según los lineamientos Mineduc, ¿qué debe definir el protocolo respecto de lo que ocurre tras un episodio?","o":["Solo la sanción aplicable","Quién registra, cómo, y cómo y en qué plazo se informa a la familia","Que no se registre para proteger la privacidad","Que la familia firme una renuncia a reclamar"],"c":1,"e":"El protocolo asigna el registro y fija cómo y cuándo se informa a la familia.","s":[["tea_paec","p. 39"]]},
  {"id":"p99","m":"crisis","n":2,"q":"En plena crisis, un adulto quiere anunciarle al estudiante la medida disciplinaria que le aplicarán. Según los lineamientos Mineduc:","o":["Es lo mejor, para que entienda las consecuencias","Se debe hacer frente al curso","Se debe evitar iniciar medidas disciplinarias durante la crisis","Solo se permite si el estudiante es mayor de 14 años"],"c":2,"e":"Entre lo que se evita durante la crisis está iniciar medidas disciplinarias; la conversación viene cuando hay calma.","s":[["tea_paec","pp. 32 a 34"]]},
  {"id":"p100","m":"tdah","n":1,"q":"Según el Decreto 170, el déficit atencional es un trastorno que surge:","o":["En la adolescencia, con el cambio de ciclo","En los primeros 7 años de vida","Solo cuando el estudiante entra a la escuela","Después de una situación traumática"],"c":1,"e":"El Decreto 170 lo define como un trastorno de inicio temprano, en los primeros 7 años de vida.","s":[["d170","art. 40"]]},
  {"id":"p101","m":"tdah","n":1,"q":"¿Cuáles son las tres manifestaciones típicas del déficit atencional?","o":["Inatención, impulsividad e hiperactividad","Agresividad, aislamiento y tristeza","Dislexia, discalculia y disgrafía","Timidez, ansiedad y mutismo"],"c":0,"e":"Las guías Mineduc describen la triada inatención, impulsividad e hiperactividad.","s":[["tdah_parv"],["tdah_guia"]]},
  {"id":"p102","m":"tdah","n":1,"q":"¿Cómo conviene dar una instrucción a un estudiante con déficit atencional?","o":["Todas juntas al inicio, para que se organice solo","Escritas en la pizarra, sin explicarlas","Por partes, marcando los pasos y comprobando que entendió","En voz alta, desde el fondo de la sala"],"c":2,"e":"La guía recomienda instrucciones parceladas y comprobar la comprensión antes de empezar.","s":[["tdah_guia"]]},
  {"id":"p103","m":"tdah","n":1,"q":"Un estudiante con déficit atencional se levanta seguido de su puesto. ¿Qué sugiere la guía Mineduc?","o":["Dejarlo sin recreo","Anotarlo cada vez en el libro de clases","Enviarlo a inspectoría","Darle tareas con movimiento, como ayudar a repartir materiales"],"c":3,"e":"La guía propone permitir el movimiento o asignar tareas de movilidad en vez de castigar.","s":[["tdah_guia"]]},
  {"id":"p104","m":"tdah","n":1,"q":"¿Qué recomienda la guía Mineduc sobre los llamados de atención?","o":["Evitarlos en público y conversar después a solas","Hacerlos frente al curso para que sirvan de ejemplo","Hacerlos solo por escrito a la familia","Repetirlos varias veces hasta que obedezca"],"c":0,"e":"Se recomienda evitar los llamados de atención en público y hablar luego con el estudiante.","s":[["tdah_guia"]]},
  {"id":"p105","m":"tdah","n":1,"q":"Un estudiante con déficit atencional te responde de forma impulsiva. ¿Qué haces?","o":["Le respondes en el mismo tono","No lo tomas como algo personal y le preguntas con calma qué quiso decir","Lo ignoras el resto del día","Le aplicas de inmediato una suspensión"],"c":1,"e":"La guía aconseja no personalizar los comentarios impulsivos y señalarlos con calma.","s":[["tdah_guia"]]},
  {"id":"p106","m":"tdah","n":2,"q":"Según el Decreto 170, ¿qué funciones puede alterar el déficit atencional?","o":["La visión y la audición","La motricidad fina y gruesa","La planificación, la organización y la memoria de trabajo","Solo la lectura y la escritura"],"c":2,"e":"El artículo 41 menciona alteraciones del funcionamiento ejecutivo: planificación, organización y memoria de trabajo.","s":[["d170","art. 41"]]},
  {"id":"p107","m":"tdah","n":2,"q":"¿Qué requisito exige el Decreto 170 para el diagnóstico de déficit atencional?","o":["Que las conductas aparezcan solo en la sala de clases","Que lo informe el/la inspector/a","Que el estudiante tenga bajas notas en todas las asignaturas","Que las conductas se presenten en más de un contexto, como hogar y escuela"],"c":3,"e":"El decreto exige que las conductas se presenten en más de un contexto y afecten el desempeño.","s":[["d170","arts. 40 y 43"]]},
  {"id":"p108","m":"tdah","n":2,"q":"¿Por qué la guía Mineduc desaconseja las actividades con tiempo límite para estos estudiantes?","o":["Porque pueden aumentar su impulsividad y desorganización","Porque el reglamento interno las prohíbe","Porque el estudiante no sabe leer la hora","Porque bajan el promedio del curso"],"c":0,"e":"La presión de tiempo aumenta la impulsividad y la desorganización.","s":[["tdah_parv"],["tdah_guia"]]},
  {"id":"p109","m":"tdah","n":2,"q":"Un apoderado te pregunta si su hijo «tiene TDAH», porque lo ves inquieto en los recreos. ¿Qué respondes?","o":["Se lo confirmas según lo que has observado","Le dices que es solo mala conducta","No diagnosticas: compartes con cautela lo observado y lo orientas a conversar con el profesor jefe y el equipo","Le recomiendas un medicamento"],"c":2,"e":"El diagnóstico es médico; las sospechas se comunican con cautela y sin expresiones absolutas.","s":[["tdah_guia"],["tdah_minsal"]]},
  {"id":"p110","m":"di","n":1,"q":"¿Cuál es una buena forma de dar instrucciones a un estudiante con discapacidad intelectual?","o":["Varias órdenes seguidas, para ahorrar tiempo","Una orden a la vez, con frases cortas, comprobando que entendió","Hablarle más fuerte que al resto","Pedir siempre a un compañero que se las explique"],"c":1,"e":"La guía Mineduc recomienda una orden cada vez, con frases cortas, asegurando la comprensión.","s":[["di_guia"]]},
  {"id":"p111","m":"di","n":1,"q":"¿Cuál de estas es una pauta de lectura fácil?","o":["Usar metáforas para que el texto sea atractivo","Escribir frases largas con varias ideas","Una idea por frase y palabras de uso frecuente","Usar letra pequeña para que quepa todo"],"c":2,"e":"La lectura fácil usa frases cortas, una idea por frase y vocabulario sencillo.","s":[["di_lf"]]},
  {"id":"p112","m":"di","n":1,"q":"Una estudiante de 15 años con discapacidad intelectual llega a inspectoría con su acompañante. ¿Cómo la atiendes?","o":["Le hablas con diminutivos, como a una niña pequeña","Hablas solo con su acompañante","Respondes tú por ella para no demorar","Le hablas directamente, con información sencilla, trato acorde a su edad y tiempo para responder"],"c":3,"e":"Senadis recomienda información sencilla y lenta, dar tiempo y no tratar a la persona como si fuera un niño.","s":[["fis_senadis"]]},
  {"id":"p113","m":"di","n":1,"q":"¿Qué actitud advierte la guía Mineduc como una barrera para estos estudiantes?","o":["La sobreprotección y la compasión","Dar más tiempo para las actividades","Dividir las tareas en pasos pequeños","Usar apoyos visuales"],"c":0,"e":"La guía nombra la sobreprotección, la compasión y el rechazo como barreras actitudinales.","s":[["di_guia"]]},
  {"id":"p114","m":"di","n":2,"q":"El área práctica de la conducta adaptativa incluye:","o":["Lectura, escritura y conceptos de dinero","Relaciones interpersonales y normas de cortesía","Razonamiento matemático abstracto","Comer, asearse, vestirse y desplazarse"],"c":3,"e":"El área práctica abarca las actividades de la vida diaria; lo conceptual y lo social son otras áreas.","s":[["di_mesa"]]},
  {"id":"p115","m":"di","n":2,"q":"Según el Decreto 83, ¿qué es una adecuación curricular de acceso?","o":["Eliminar asignaturas al estudiante","Medidas que reducen o eliminan barreras a la participación, sin bajar las expectativas de aprendizaje","Bajar la nota mínima de aprobación","Cambiar al estudiante a una escuela especial"],"c":1,"e":"Las adecuaciones de acceso cambian cómo se presenta, responde o se organiza, no lo que se espera aprender.","s":[["d83"]]},
  {"id":"p116","m":"di","n":2,"q":"¿Cuáles son los tres principios del Diseño Universal para el Aprendizaje (DUA)?","o":["Múltiples medios de representación, de expresión y de participación","Evaluación, calificación y promoción","Diagnóstico, tratamiento y alta","Disciplina, orden y respeto"],"c":0,"e":"El Decreto 83 describe esos tres principios del DUA.","s":[["d83"]]},
  {"id":"p117","m":"di","n":2,"q":"¿Quiénes definen las adecuaciones curriculares que se registran en el PACI de un estudiante?","o":["El/la inspector/a general","Solo el apoderado","Los profesionales del establecimiento, como el docente de asignatura y el profesor especialista, junto con la familia y con participación del estudiante","El Ministerio de Educación por oficio"],"c":2,"e":"El Decreto 83 indica que las definen los profesionales con la familia, procurando la participación del estudiante.","s":[["d83"]]},
  {"id":"p118","m":"fis","n":1,"q":"¿Cómo se guía correctamente a un estudiante ciego?","o":["Tomándolo del brazo y llevándolo","Ofreciéndole tu brazo, sin tomar el suyo","Empujándolo suavemente por la espalda","Tomando su bastón para dirigirlo"],"c":1,"e":"Senadis indica ofrecer el brazo y no tomar el de la persona, porque pierde estabilidad.","s":[["fis_senadis"]]},
  {"id":"p119","m":"fis","n":1,"q":"Un estudiante sordo lee los labios. ¿Cómo le hablas?","o":["De espaldas, mientras escribes en la pizarra","Subiendo mucho el volumen de la voz","Cara a cara, con tu rostro iluminado","Solo a través de su compañero de banco"],"c":2,"e":"Necesita ver tus labios; subir la voz no ayuda si no lo pide.","s":[["fis_senadis"]]},
  {"id":"p120","m":"fis","n":1,"q":"Ves a un estudiante usuario de silla de ruedas detenido frente a una puerta pesada. ¿Qué haces?","o":["Empujas la silla de inmediato","Te apoyas en la silla mientras abres la puerta","Le hablas de pie a su acompañante","Le preguntas si necesita ayuda y cómo prefiere que lo ayudes"],"c":3,"e":"Siempre se pregunta antes de ayudar y no se mueve la silla sin permiso.","s":[["fis_senadis"]]},
  {"id":"p121","m":"fis","n":1,"q":"¿Qué término recomienda Senadis?","o":["Sordomudo","No vidente","Persona sorda","Minusválido"],"c":2,"e":"Las personas sordas no son necesariamente mudas; se recomienda «persona sorda».","s":[["fis_lenguaje"]]},
  {"id":"p122","m":"fis","n":1,"q":"Un estudiante ciego camina hacia un desnivel. ¿Cómo le avisas?","o":["Con una orden clara, como «alto, no siga»","Gritando «¡cuidado!»","Haciéndole señas con la mano","Tirándolo bruscamente del brazo"],"c":0,"e":"Senadis recomienda una orden clara en vez de exclamaciones que no indican qué hacer.","s":[["fis_senadis"]]},
  {"id":"p123","m":"fis","n":1,"q":"Se reorganizan los muebles de la sala de un estudiante ciego. ¿Qué corresponde?","o":["No decirle nada para que se acostumbre","Pedir que un compañero lo lleve siempre de la mano","Avisarle antes y hacer con él un recorrido por la sala","Pedirle que no se mueva de su puesto"],"c":2,"e":"La guía Mineduc pide mantener estables los muebles, avisar los cambios y guiar un recorrido.","s":[["fis_visual"]]},
  {"id":"p124","m":"fis","n":2,"q":"¿Qué establece la Ley 21.303?","o":["Crea el Programa de Integración Escolar","Reconoce la LSCh como lengua oficial de las personas sordas y la fija como primera lengua en su educación","Obliga a todos los estudiantes a aprender braille","Cierra las escuelas especiales"],"c":1,"e":"La ley modificó la Ley 20.422 para promover y reconocer la lengua de señas chilena.","s":[["l21303"]]},
  {"id":"p125","m":"fis","n":2,"q":"Según la Ley 20.422, la accesibilidad universal es:","o":["Que solo las personas con discapacidad usen los espacios adaptados","Que cada familia pague las adecuaciones de su hijo","Que el colegio tenga un baño exclusivo para personas con discapacidad","Que entornos, productos y servicios puedan ser usados y comprendidos por todas las personas"],"c":3,"e":"Es uno de los principios del artículo 3 de la ley.","s":[["l20422","art. 3"]]},
  {"id":"p126","m":"fis","n":2,"q":"En una evacuación, ¿qué recomienda Senadis respecto de un estudiante usuario de silla de ruedas?","o":["No manipular su silla sin autorización y asegurar el traslado de sus ayudas técnicas","Dejar su silla atrás siempre","Separarlo de su acompañante para avanzar más rápido","Esperar a que salgan todos antes de ocuparse de él"],"c":0,"e":"Senadis pide no mover ayudas técnicas sin autorización, no separar a la persona de quien la acompaña y darle atención preferente.","s":[["fis_emerg"]]},
  {"id":"p127","m":"der","n":1,"q":"Un niño llega seguido sin colación, con higiene muy deficiente y una herida sin curar. ¿Qué tipo de maltrato podría indicar?","o":["Maltrato psicológico","Acoso escolar","Negligencia","Ninguno, es un asunto privado de la familia"],"c":2,"e":"La negligencia es no brindar, pudiendo hacerlo, el cuidado y la protección que el niño necesita.","s":[["der_parvprot"]]},
  {"id":"p128","m":"der","n":2,"q":"¿Qué hace la Defensoría de la Niñez ante un caso individual?","o":["Investiga penalmente al agresor","Dicta medidas de protección como un tribunal","Reemplaza a la Superintendencia en temas escolares","Recibe peticiones, las deriva al órgano competente y hace seguimiento"],"c":3,"e":"La Defensoría, creada por la Ley 21.067, recibe peticiones, las deriva al órgano competente y puede actuar como facilitadora.","s":[["der_defque"],["der_defeduc"]]},
  {"id":"p129","m":"der","n":1,"q":"Hay señales de una vulneración que no parece delito. ¿A dónde se acude en el área de familia?","o":["Solo a la Fiscalía","A los Tribunales de Familia o a la oficina local de protección de derechos","A la Defensoría de la Niñez antes que a nadie","A ninguna parte, el colegio lo resuelve solo"],"c":1,"e":"La Defensoría orienta acudir a los Tribunales de Familia o a la oficina local de protección de la comuna.","s":[["der_defvuln"],["der_opd"]]},
  {"id":"p130","m":"der","n":2,"q":"Según la Ley 21.430, ¿quién es niño o niña y quién es adolescente?","o":["Niño hasta los 12 años; adolescente de 12 a 18","Niño hasta los 14 años; adolescente de 14 a menos de 18","Niño hasta los 10 años; adolescente de 10 a 21","No distingue: todos son menores de edad"],"c":1,"e":"El art. 1 de la Ley 21.430 considera niño o niña a quien tiene hasta 14 años y adolescente a quien tiene entre 14 y menos de 18.","s":[["l21430","art. 1"]]},
  {"id":"p131","m":"der","n":2,"q":"La Ley 21.057 indica que el funcionario que recibe la denuncia de un niño, niña o adolescente:","o":["Debe pedirle que repita el relato para confirmarlo","Debe confrontarlo con el presunto agresor","Puede hacerle preguntas para establecer qué pasó","Se limita a registrar íntegramente sus manifestaciones verbales y conductuales"],"c":3,"e":"La ley prohíbe exponerlo a preguntas que busquen establecer los hechos o sus partícipes.","s":[["l21057","art. 4"]]},
  {"id":"p132","m":"der","n":1,"q":"Ante una sospecha de maltrato por parte de un funcionario, ¿qué se hace con la identidad de las personas involucradas?","o":["Se informa al curso para prevenir","Se protege la identidad del niño y también la del adulto señalado hasta que se aclaren los hechos","Solo se protege la del niño","Se publica en el diario mural"],"c":1,"e":"La información se maneja en forma restringida para evitar estigmatización y victimización secundaria.","s":[["der_parvprot"]]},
  {"id":"p133","m":"viol","n":1,"q":"Un grupo graba una agresión a un compañero para subirla a redes. ¿Cómo se llama esta forma de violencia digital?","o":["Doxing","Happy slapping","Grooming","Funa"],"c":1,"e":"Happy slapping es grabar una agresión física para subirla a internet o compartirla.","s":[["viol_ciber"]]},
  {"id":"p134","m":"viol","n":1,"q":"¿Qué es el grooming?","o":["Que un adulto gane la confianza de un menor por internet con fines sexuales","Excluir a alguien de un grupo de chat","Publicar rumores falsos sobre un compañero","Hacerse pasar por otra persona en redes"],"c":0,"e":"El grooming es la conducta de un adulto que se gana la confianza de un menor en internet con fines sexuales.","s":[["viol_ciber"]]},
  {"id":"p135","m":"viol","n":1,"q":"Además de ser reiterado, ¿qué caracteriza al acoso escolar según el Mineduc?","o":["Que ocurra solo en la sala de clases","Que lo cometa un adulto","Que exista una asimetría o posición de superioridad del agresor","Que siempre haya agresión física"],"c":2,"e":"El acoso se distingue por ser reiterado en el tiempo y por la posición de superioridad del agresor.","s":[["viol_cart10"]]},
  {"id":"p136","m":"viol","n":2,"q":"Como medida de protección, ¿cuánto puede durar como máximo la suspensión de un estudiante denunciado según la Ley 21.809?","o":["5 días hábiles","15 días hábiles","Dos meses","Hasta que termine el año escolar"],"c":1,"e":"Solo procede si no hay otra forma de resguardar a la persona afectada y no puede pasar de 15 días hábiles.","s":[["l21809","art. 16 E letra j LGE"]]},
  {"id":"p137","m":"viol","n":2,"q":"¿Cuál es el plazo máximo de una investigación de convivencia cuando involucra a estudiantes?","o":["Dos meses","10 días hábiles","Un año","No tiene plazo"],"c":0,"e":"El art. 16 E letra g de la LGE fija dos meses como plazo máximo en el caso de estudiantes.","s":[["l21809","art. 16 E letra g LGE"]]},
  {"id":"p138","m":"viol","n":1,"q":"Según la Ley 20.609, una discriminación arbitraria es:","o":["Cualquier sanción aplicada por el reglamento interno","Una diferencia de notas entre estudiantes","Una distinción, exclusión o restricción sin justificación razonable que afecta derechos fundamentales","Solo las agresiones físicas por motivos raciales"],"c":2,"e":"La ley la define como una distinción sin justificación razonable que priva, perturba o amenaza derechos fundamentales.","s":[["l20609","art. 2"]]},
  {"id":"p139","m":"viol","n":2,"q":"¿En qué plazo se debe presentar la acción de no discriminación de la Ley 20.609?","o":["5 días hábiles","30 días corridos","Dos años","90 días corridos desde el acto o desde que se conoció"],"c":3,"e":"El plazo es de 90 días corridos y nunca después de un año desde el acto.","s":[["l20609","art. 5"]]},
  {"id":"p140","m":"viol","n":1,"q":"Ves una pelea en curso en el patio. Según el Mineduc, lo primero es:","o":["Grabarla para tener evidencia","Intervenir de manera directa e inmediata, según tus posibilidades, sin actuar solo ni en forma precipitada","Esperar a que termine y luego anotar a los involucrados","Llamar a los apoderados antes de hacer nada"],"c":1,"e":"El primer paso es detener la situación, pidiendo apoyo de otros adultos si hace falta.","s":[["viol_cart10"]]},
  {"id":"p141","m":"viol","n":1,"q":"¿Cómo considera el Mineduc a la discriminación en la comunidad educativa?","o":["Como un conflicto menor entre pares","Como un problema solo de las familias","Como un tipo de violencia que puede menoscabar la dignidad","Como algo que solo ocurre entre adultos"],"c":2,"e":"La Cartilla 10 reconoce la discriminación como un tipo de violencia.","s":[["viol_cart10"]]},
  {"id":"p142","m":"seg","n":1,"q":"En la metodología AIDEP del PISE, ¿qué significa la «I»?","o":["Inspección de mobiliario","Investigación en terreno","Información a las familias","Intervención de emergencia"],"c":1,"e":"La «I» es la investigación en terreno: recorrer el establecimiento para verificar riesgos, vulnerabilidades y capacidades.","s":[["seg_pise25","p. 26"]]},
  {"id":"p143","m":"seg","n":2,"q":"En la metodología ACCEDER, ¿qué etapa revisa y mejora el protocolo después de la emergencia?","o":["Alerta y alarma","Coordinación","Readecuación del protocolo","Decisiones"],"c":2,"e":"La «R» final es la readecuación: el protocolo se revisa y mejora a partir de lo ocurrido.","s":[["seg_pise25","p. 37"]]},
  {"id":"p144","m":"seg","n":1,"q":"Según SENAPRED, durante un sismo dentro de un edificio lo adecuado es:","o":["Correr hacia la salida mientras se mueve","Mantener la calma y protegerse en un Lugar de Protección Sísmica, lejos de ventanas","Usar el ascensor para bajar rápido","Encender un fósforo para ver mejor"],"c":1,"e":"SENAPRED indica mantener la calma, protegerse lejos de ventanas y objetos que caigan, y evacuar por escalera, nunca en ascensor.","s":[["seg_senapred_sismo"]]},
  {"id":"p145","m":"seg","n":1,"q":"Según el manual PISE, ¿cuál es la alarma en caso de sismo?","o":["El timbre eléctrico","Un aviso de dirección por altoparlante","Un mensaje al celular","El mismo sismo"],"c":3,"e":"El manual señala que en un sismo «la alarma será el mismo evento».","s":[["seg_pise25","p. 34"]]},
  {"id":"p146","m":"seg","n":2,"q":"Según el DS 313, si el establecimiento no denuncia un accidente escolar dentro de las 24 horas, ¿quién puede hacerlo?","o":["El propio estudiante accidentado o su representante","Solo el sostenedor","Nadie: se pierde el seguro","Solo Carabineros"],"c":0,"e":"El art. 11 permite que lo denuncie el accidentado o quien lo represente, y también cualquier persona que conozca los hechos.","s":[["ds313","art. 11"]]},
  {"id":"p147","m":"aux","n":1,"q":"¿Qué número corresponde al SAMU?","o":["133","131","132","149"],"c":1,"e":"El 131 es ambulancia (SAMU), el 132 Bomberos y el 133 Carabineros.","s":[["aux_cruzroja"]]},
  {"id":"p148","m":"aux","n":1,"q":"Un estudiante está caído junto a un enchufe dañado. ¿Qué haces primero?","o":["Darle agua","Llevarlo en brazos a la enfermería","Revisar que la escena sea segura antes de tocarlo","Llamar al apoderado"],"c":2,"e":"Primero se evalúa si la escena es segura; con electricidad, se corta la corriente antes de tocar.","s":[["aux_cruzroja"],["aux_chcc_pa"]]},
  {"id":"p149","m":"aux","n":1,"q":"Un estudiante convulsiona en el patio. ¿Qué NO debes hacer?","o":["Poner algo blando bajo su cabeza","Poner un objeto entre sus dientes","Retirar objetos cercanos","Contar cuánto dura"],"c":1,"e":"La guía indica no abrirle la boca ni poner ningún elemento entre los dientes.","s":[["aux_cruzroja"]]},
  {"id":"p150","m":"aux","n":2,"q":"Según la guía de primeros auxilios publicada por Mineduc, una convulsión normalmente no dura más de:","o":["30 segundos","15 minutos","30 minutos","5 minutos"],"c":3,"e":"Si se prolonga más de eso, requiere traslado inmediato a un centro médico.","s":[["aux_cruzroja"]]},
  {"id":"p151","m":"aux","n":1,"q":"Un estudiante se quema el brazo con agua caliente. ¿Qué corresponde?","o":["Enfriar con agua a temperatura ambiente","Poner pasta dental","Aplicar hielo directo","Reventar las ampollas"],"c":0,"e":"Se enfría con agua a temperatura ambiente 10 a 20 minutos y se cubre con apósito limpio.","s":[["aux_cruzroja"]]},
  {"id":"p152","m":"aux","n":2,"q":"Un estudiante se golpea la cabeza, pierde el conocimiento unos segundos y luego se recupera. ¿Qué corresponde?","o":["Que vuelva a clases si dice sentirse bien","Que lo evalúe un servicio de urgencia aunque se haya recuperado","Darle un analgésico","Esperar al final de la jornada"],"c":1,"e":"La pérdida de conocimiento, aunque sea breve, requiere urgencia; se pide la ambulancia aunque se recupere.","s":[["aux_chcc_pa"],["aux_chcc_urg"],["aux_saludresp"]]},
  {"id":"p153","m":"aux","n":1,"q":"Presionas una herida que sangra y el paño se empapa. ¿Qué haces?","o":["Lo retiras y pones uno limpio","Lavas con alcohol","Pones otro paño encima y mantienes la presión","Dejas de presionar"],"c":2,"e":"No se retira la compresa: se agrega otra encima y se mantiene la presión.","s":[["aux_chcc_urg"]]},
  {"id":"p154","m":"aux","n":2,"q":"¿Qué ley obliga a los establecimientos de educación básica y media a contar con desfibrilador (DEA)?","o":["Ley 21.156","Ley 20.845","Ley 21.430","Ley 20.594"],"c":0,"e":"La Ley 21.156 de 2019 incluye a los establecimientos educacionales entre los lugares obligados.","s":[["l21156"]]},
  {"id":"p155","m":"aux","n":1,"q":"Un estudiante se atora con comida pero tose con fuerza. ¿Qué haces?","o":["Le das golpes en la espalda de inmediato","Le sacas el alimento con los dedos","Le das agua","Lo animas a toser y pides ayuda"],"c":3,"e":"Si tose o emite sonidos, la obstrucción es parcial: se le anima a toser y se pide ayuda.","s":[["aux_cruzroja"]]},
  {"id":"p156","m":"aux","n":2,"q":"Un estudiante con dolor de cabeza pide un analgésico en inspectoría. ¿Qué corresponde?","o":["Dárselo si el apoderado lo autoriza por teléfono","Darle media pastilla","No darle medicamentos, seguir el protocolo del establecimiento y avisar a la familia","Pedirle a un compañero que le comparta el suyo"],"c":2,"e":"La guía es clara: no se administran medicamentos.","s":[["aux_cruzroja"]]},
  {"id":"p157","m":"aux","n":1,"q":"¿A qué número llamas para pedir a Bomberos?","o":["132","131","133","134"],"c":0,"e":"Bomberos es el 132.","s":[["aux_cruzroja"]]},
  {"id":"p158","m":"sm","n":1,"q":"Según Chile Crece Contigo, las pataletas entre los 2 y 4 años son:","o":["Una señal segura de un trastorno","Frecuentes, normales y esperables","Siempre una forma intencional de molestar","Algo que se corrige con tiempo fuera a solas"],"c":1,"e":"Son parte del desarrollo: los niños y niñas aún no tienen otras herramientas para expresar lo que sienten.","s":[["sm_ccpat"]]},
  {"id":"p159","m":"sm","n":1,"q":"¿Cuál de estas es una señal de alerta en salud mental en un adolescente, según Mineduc y Minsal?","o":["Cambiar una vez de grupo de amigos","Sacar una nota baja en una prueba","Tener un pasatiempo nuevo","Pasar cada vez más tiempo solo y evitar actividades con amigos o familia"],"c":3,"e":"El aislamiento progresivo figura en la tabla de señales de alerta de la Cartilla 3.","s":[["sm_c3","tabla 1, p. 9"]]},
  {"id":"p160","m":"sm","n":1,"q":"Un estudiante te cuenta que se siente muy angustiado. ¿Qué haces primero?","o":["Lo acoges en un espacio seguro y lo escuchas activamente, sin presionarlo a hablar","Le dices que no es para tanto","Le pides que lo cuente frente al curso","Le das un consejo rápido y vuelves a tus tareas"],"c":0,"e":"La primera respuesta es acoger, dar apoyo emocional y escuchar activamente sin presionar.","s":[["sm_c3","p. 10"]]},
  {"id":"p161","m":"sm","n":1,"q":"¿Cuál es la línea de prevención del suicidio del Ministerio de Salud?","o":["131","133","*4141, gratuita y disponible las 24 horas","149"],"c":2,"e":"El *4141 es gratuito, atiende las 24 horas y se marca desde celulares de cualquier compañía.","s":[["sm_4141"]]},
  {"id":"p162","m":"sm","n":1,"q":"Según la Cartilla 3, ¿cuándo corresponde derivar a un estudiante a salud mental?","o":["Ante cualquier mal día","Si las señales duran semanas o meses, o si la familia o el propio estudiante piden ayuda","Solo si ya tiene un diagnóstico","Nunca: es un tema exclusivo de la familia"],"c":1,"e":"La Cartilla 3 establece esos tres criterios para derivar a la red de salud.","s":[["sm_c3","p. 12"]]},
  {"id":"p163","m":"sm","n":1,"q":"¿Qué es el Programa Habilidades para la Vida?","o":["Un programa de JUNAEB que promueve el bienestar y detecta y previene riesgos psicosociales en escolares","Un seguro de salud escolar","Una beca de alimentación","Un protocolo de evacuación"],"c":0,"e":"HPV promueve habilidades de autocuidado y convivencia e incluye detección y prevención del riesgo psicosocial.","s":[["sm_hpv"]]},
  {"id":"p164","m":"sm","n":2,"q":"Sobre preguntar directamente a un estudiante si ha pensado en quitarse la vida, la guía Minsal indica que:","o":["Le da la idea y aumenta el riesgo","Está prohibido para el personal del colegio","No aumenta el riesgo y es parte de detectar a tiempo","Solo puede hacerlo su familia"],"c":2,"e":"Minsal señala como mito que preguntar induzca la idea; si no estás capacitado, acoge e informa de inmediato al equipo responsable.","s":[["sm_suic","pp. 15 y 30"]]},
  {"id":"p165","m":"sm","n":2,"q":"Se detecta riesgo suicida inminente en un estudiante. Según la guía Minsal, ¿qué corresponde?","o":["Informarlo en la próxima reunión de equipo","Llevarlo al servicio de urgencia más cercano y avisar a los padres al mismo tiempo","Pedirle que vuelva a clases y observarlo","Avisar en el grupo de apoderados del curso"],"c":1,"e":"Ante riesgo inminente, la guía indica traslado al servicio de urgencia más cercano e informar a los padres en paralelo.","s":[["sm_suic","p. 38"]]},
  {"id":"p166","m":"sm","n":2,"q":"Una estudiante te pide que no cuentes que se está autolesionando. ¿Qué corresponde?","o":["Guardar el secreto para mantener su confianza","Contarlo a sus compañeras para que la cuiden","Esperar a ver si vuelve a pasar","Explicarle con calma que, por su seguridad, debes informar al equipo responsable, y hacerlo de inmediato"],"c":3,"e":"La confidencialidad tiene límites ante riesgo de daño, y toda conducta autolesiva debe ser atendida.","s":[["sm_c3"],["sm_suic","p. 12"]]},
  {"id":"p167","m":"parv","n":1,"q":"¿Cuántos niveles curriculares tiene la educación parvularia según las Bases Curriculares?","o":["Dos","Cuatro","Tres","Seis"],"c":2,"e":"Sala Cuna, Medio y Transición.","s":[["parv_bcep","pp. 41-42"]]},
  {"id":"p168","m":"parv","n":1,"q":"Un niño de 3 años tiene una pataleta en el patio. ¿Qué es lo más adecuado?","o":["Gritarle para que se detenga","Mantener la calma, acompañarlo y nombrar su emoción","Dejarlo solo a pensar","Darle todo lo que pide"],"c":1,"e":"Una atmósfera tranquila y el acompañamiento le ayudan a recuperar el control.","s":[["parv_chcc_pat"]]},
  {"id":"p169","m":"parv","n":2,"q":"Un párvulo muerde a un compañero. Según las orientaciones para el reglamento interno en educación parvularia, ¿qué corresponde?","o":["Suspenderlo un día","Aplicarle una medida disciplinaria escrita","Cancelar su matrícula","Usar medidas pedagógicas o formativas, sin sanción"],"c":3,"e":"Entre párvulos no hay medidas disciplinarias; las sanciones son solo para adultos.","s":[["parv_ori_ri","pp. 22-23"]]},
  {"id":"p170","m":"parv","n":1,"q":"Según Chile Crece Contigo, ¿hasta qué edad los niños y niñas deben estar vigilados todo el tiempo?","o":["Menores de 5 años","Hasta los 2 años","Hasta los 8 años","Hasta los 10 años"],"c":0,"e":"La página indica que los menores de 5 años deben estar vigilados todo el tiempo.","s":[["parv_chcc_seg"]]},
  {"id":"p171","m":"parv","n":1,"q":"Durante la muda de un bebé, ¿qué recomienda Chile Crece Contigo?","o":["Dejarlo un momento para buscar pañales","Mantener una mano sobre el bebé en todo momento","Pedir a otro niño que lo mire","Cambiarlo de pie"],"c":1,"e":"En la muda, el vestido o el baño se mantiene una mano sobre el bebé.","s":[["parv_chcc_les"]]},
  {"id":"p172","m":"parv","n":2,"q":"Según las orientaciones para el reglamento interno en educación parvularia, ¿cómo se administra un medicamento a un párvulo?","o":["Con autorización verbal del apoderado","A criterio del equipo si hay fiebre","Con receta médica que señale los datos del niño o niña","Lo decide el inspector/a"],"c":2,"e":"Se requiere receta médica con los datos del niño o niña, según lo que regule el reglamento.","s":[["parv_ori_ri","pp. 18-19"]]},
  {"id":"p173","m":"parv","n":1,"q":"En los primeros días de jardín, ¿qué ayuda al niño o niña?","o":["Una despedida tranquila y breve, y un objeto de apego","Una despedida muy larga","Prohibir juguetes de la casa","Que no vaya hasta que deje de llorar"],"c":0,"e":"Se recomienda mostrar calma, no extender la despedida y permitir un objeto de apego.","s":[["parv_famil26"]]},
  {"id":"p174","m":"parv","n":2,"q":"¿Qué circular de la Superintendencia de Educación regula los reglamentos internos de educación parvularia?","o":["Circular 482","Circular 586","Circular 1","Circular 860"],"c":3,"e":"La Circular 860 de 2018 sigue vigente; la 482 es para establecimientos escolares.","s":[["parv_r324"],["parv_ori_ri","p. 16"]]},
  {"id":"p175","m":"parv","n":1,"q":"¿Qué lesiones son más comunes en los niños más pequeños?","o":["Choques en bicicleta","Lesiones por deporte competitivo","Caídas, quemaduras y envenenamientos","Accidentes laborales"],"c":2,"e":"Así lo señala Chile Crece Contigo.","s":[["parv_chcc_les"]]},
  {"id":"p176","m":"parv","n":1,"q":"¿A qué ámbito de las Bases Curriculares pertenece el núcleo Identidad y Autonomía?","o":["Desarrollo Personal y Social","Comunicación Integral","Interacción y Comprensión del Entorno","Pensamiento Matemático"],"c":0,"e":"Desarrollo Personal y Social incluye Identidad y Autonomía, Convivencia y Ciudadanía, y Corporalidad y Movimiento.","s":[["parv_bcep","pp. 46-59"]]},
  {"id":"p177","m":"parv","n":2,"q":"Un niño de 2 años y medio no presta sus juguetes. Según Chile Crece Contigo, esto es:","o":["Una falta que hay que sancionar","Señal segura de un trastorno","Motivo para separarlo del grupo","Esperable: aún no comparte; compartir se aprende con turnos y supervisión"],"c":3,"e":"A esa edad aún no comparte ni sigue reglas de juego; el adulto supervisa y enseña a esperar turnos.","s":[["parv_chcc_2a3"]]},
  {"id":"p178","m":"asis","n":1,"q":"¿Qué es el ausentismo crónico?","o":["Faltar tres días seguidos","Tener solo faltas injustificadas","Faltar el 10% o más de los días del año","Asistir menos de la mitad del año"],"c":2,"e":"Es faltar el 10% o más de los días, con o sin justificación.","s":[["asis_idps_gestion","p. 2"]]},
  {"id":"p179","m":"asis","n":2,"q":"Para medir ausentismo crónico, ¿cuentan las ausencias con certificado médico?","o":["No, nunca","Sí, toda ausencia cuenta","Solo si son más de tres días","Solo en enseñanza media"],"c":1,"e":"Toda ausencia cuenta como inasistencia, justificada o no.","s":[["asis_idps_gestion","p. 4"]]},
  {"id":"p180","m":"asis","n":1,"q":"Según Mineduc, ¿cuál es el principal predictor del retiro escolar?","o":["El uniforme","La edad del apoderado","El tamaño del curso","La inasistencia"],"c":3,"e":"Las orientaciones de retención señalan la inasistencia como principal predictor.","s":[["asis_ret20","p. 19"]]},
  {"id":"p181","m":"asis","n":1,"q":"¿Cuál es un ejemplo de barrera familiar para asistir?","o":["Cuidar a hermanos menores o trabajar","Normas rígidas del establecimiento","Bajo desempeño académico","Suspensiones reiteradas"],"c":0,"e":"Las responsabilidades tempranas de adulto son un factor familiar.","s":[["asis_ret20","p. 15"]]},
  {"id":"p182","m":"asis","n":2,"q":"¿Qué hacen los Equipos Territoriales de Revinculación y Asistencia?","o":["Sancionan a las familias","Visitan hogares de estudiantes desmatriculados o con inasistencia grave","Toman la asistencia en las salas","Reemplazan a docentes ausentes"],"c":1,"e":"Salen a terreno y se coordinan con municipios, SLEP, servicios y organizaciones.","s":[["asis_equipos23"]]},
  {"id":"p183","m":"asis","n":1,"q":"¿Cada cuánto sugiere la ficha IDPS repetir el análisis de asistencia?","o":["Una vez al año","Cada cinco años","Cada mes","Solo cuando hay fiscalización"],"c":2,"e":"Repetirlo mensualmente permite ver variaciones y ajustar estrategias.","s":[["asis_idps_gestion","p. 5"]]},
  {"id":"p184","m":"asis","n":1,"q":"Además de las faltas, ¿qué conviene monitorear como señal de alerta?","o":["Retiros anticipados reiterados","Una mochila nueva","Cambios de puesto en la sala","La preferencia por educación física"],"c":0,"e":"Atrasos, anotaciones, sanciones y retiros anticipados son señales que se monitorean.","s":[["asis_ret20","p. 32"]]},
  {"id":"p185","m":"asis","n":2,"q":"Un apoderado cuenta que su hija falta porque cuida a su hermano menor. Como inspector/a, ¿qué haces?","o":["Sancionas a la estudiante","Le dices que es un problema familiar","Le adviertes que perderá la matrícula","Registras la barrera, la conversas con respeto y la derivas al equipo de apoyo o dirección"],"c":3,"e":"Detectar barreras y derivarlas permite diseñar un acompañamiento; las medidas rígidas aumentan el riesgo de abandono.","s":[["asis_ret20","pp. 15-16 y 46"]]},
  {"id":"p186","m":"asis","n":1,"q":"En el libro de clases digital, ¿quedan registrados los cambios a los datos?","o":["No","Solo los cambios de notas","Sí: ingresos, modificaciones y eliminaciones","Solo si el director lo pide"],"c":2,"e":"El software debe registrar todas las acciones sobre los datos.","s":[["asis_ede"]]},
  {"id":"p187","m":"asis","n":2,"q":"Según Mineduc, ¿qué parte de la matrícula tuvo inasistencia grave en 2022?","o":["38%","5%","15%","70%"],"c":0,"e":"Fueron 1,2 millones de estudiantes, el 38% de la matrícula.","s":[["asis_equipos23"]]},
  {"id":"p188","m":"adm","n":1,"q":"¿Es obligatorio usar libro de clases digital?","o":["Sí, desde 2021 para todos los colegios","Solo en colegios particulares pagados","No, es opcional pero recomendado por Mineduc","Está prohibido mientras no lo apruebe la Superintendencia"],"c":2,"e":"Mineduc indica que su uso es opcional pero altamente recomendado.","s":[["adm_ede"]]},
  {"id":"p189","m":"adm","n":1,"q":"Un colegio quiere usar libro de papel y libro digital a la vez para fiscalizaciones. ¿Es posible?","o":["Sí, siempre que coincidan","No, debe elegir uno de los dos formatos","Sí, pero solo en enseñanza media","Solo con autorización del sostenedor"],"c":1,"e":"Para la fiscalización se debe escoger uno de los dos formatos, no ambos.","s":[["adm_ede"]]},
  {"id":"p190","m":"adm","n":1,"q":"¿Qué significa que el libro digital tenga trazabilidad?","o":["Que registra todas las acciones, incluidas modificaciones y eliminaciones","Que se puede imprimir en cualquier momento","Que los apoderados pueden editarlo","Que se borra solo cada año"],"c":0,"e":"El software debe generar registros de todas las acciones realizadas en él.","s":[["adm_ede"]]},
  {"id":"p191","m":"adm","n":1,"q":"¿Por cuánto tiempo debe respaldar la información el software del libro digital?","o":["Un año escolar","Dos años","Hasta que el estudiante egrese","Al menos cinco años"],"c":3,"e":"Debe asegurar el respaldo durante al menos cinco años para la fiscalización.","s":[["adm_ede"]]},
  {"id":"p192","m":"adm","n":1,"q":"Según la Ley 19.628, los datos personales de los estudiantes:","o":["Pueden compartirse con cualquier apoderado que los pida","Solo deben usarse para los fines con que fueron recolectados","Son públicos si el colegio es subvencionado","Pueden publicarse en redes sociales del colegio sin restricción"],"c":1,"e":"La ley limita el uso de los datos a la finalidad para la que se recolectaron.","s":[["l19628","art. 9"]]},
  {"id":"p193","m":"adm","n":1,"q":"Un diagnóstico de salud de un estudiante es, según la Ley 19.628:","o":["Un dato sensible","Un dato público","Un dato estadístico","Un dato sin protección legal"],"c":0,"e":"Los datos de salud son datos sensibles.","s":[["l19628","art. 2 g"]]},
  {"id":"p194","m":"adm","n":1,"q":"Quienes trabajan con datos personales en un colegio:","o":["Pueden comentarlos con su familia si no dan nombres completos","Solo guardan reserva durante el horario de trabajo","Están obligados a guardar secreto sobre ellos","Pueden compartirlos con otros apoderados si es para ayudar"],"c":2,"e":"La Ley 19.628 obliga a guardar secreto a quienes trabajan en el tratamiento de datos.","s":[["l19628","art. 7"]]},
  {"id":"p195","m":"adm","n":2,"q":"¿Desde cuándo rige la Ley 21.719 de protección de datos personales?","o":["Desde su publicación en diciembre de 2024","Desde el 1 de julio de 2026","Desde el 1 de diciembre de 2026","Desde marzo de 2027"],"c":2,"e":"Rige el primer día del mes 24 posterior a su publicación, es decir, el 1 de diciembre de 2026.","s":[["l21719","art. 1° transitorio"]]},
  {"id":"p196","m":"adm","n":2,"q":"La Ley 21.719 exige que el tratamiento de datos de niños, niñas y adolescentes atienda a:","o":["La conveniencia administrativa del colegio","Su interés superior y su autonomía progresiva","Solo la opinión del sostenedor","Lo que decida el Consejo Escolar"],"c":1,"e":"Así lo establece el art. 16 quáter.","s":[["l21719","art. 16 quáter"]]},
  {"id":"p197","m":"adm","n":2,"q":"La Res. Ex. 432 de 2023 de la Superintendencia permite dar de baja del Registro de Matrícula a un estudiante cuando:","o":["Tiene muchas anotaciones negativas","Su apoderado no paga la escolaridad","Falta a clases de forma continua y no es posible ubicar a sus responsables, según procedimiento del reglamento interno","Repite de curso"],"c":2,"e":"Creó esa causal, sujeta a un procedimiento administrativo fijado en el reglamento interno.","s":[["adm_rex432"]]},
  {"id":"p198","m":"com","n":1,"q":"Según la LGE, ¿sobre qué tienen derecho a ser informados los apoderados?","o":["Sobre las sanciones de otros estudiantes del curso","Sobre el rendimiento, la convivencia y el proceso educativo de sus hijos","Sobre la vida personal de los docentes","Solo sobre las notas finales"],"c":1,"e":"El art. 10 letra b) de la LGE reconoce ese derecho respecto de sus hijos.","s":[["lge","art. 10 letra b)"]]},
  {"id":"p199","m":"com","n":1,"q":"¿Cuál es un deber de los apoderados según la LGE?","o":["Revisar los registros de otros estudiantes","Elegir a los inspectores","Aprobar el reglamento interno","Respetar la normativa interna y tratar con respeto a la comunidad"],"c":3,"e":"La LGE les exige respetar la normativa interna y brindar un trato respetuoso.","s":[["lge","art. 10 letra b)"]]},
  {"id":"p200","m":"com","n":1,"q":"¿Qué frase refleja escucha activa?","o":["«Entiendo que usted está molesta porque a su hijo lo retaron frente al curso.»","«Eso no es así, usted está exagerando.»","«Ya, ya, después vemos.»","«Hable con otra persona, no es mi tema.»"],"c":0,"e":"Parafrasear y reflejar la emoción es la base de la escucha activa.","s":[["com_crit","p. 10"]]},
  {"id":"p201","m":"com","n":1,"q":"Un apoderado empieza a gritarte en la entrada. ¿Qué es lo primero?","o":["Gritarle más fuerte para que se calle","Darle la espalda e irte","Mantener la calma, hablar con voz tranquila y escucharlo","Grabarlo con tu celular y subirlo a redes"],"c":2,"e":"Mantener la calma es lo más importante en situaciones críticas.","s":[["com_crit","p. 18"]]},
  {"id":"p202","m":"com","n":1,"q":"Una apoderada pregunta qué castigo recibió el niño que empujó a su hija. ¿Qué respondes?","o":["Le cuentas todo para tranquilizarla","Le das el teléfono del otro apoderado","Le explicas que no puedes informar sobre otro estudiante, pero que el caso se está abordando según el reglamento","Le dices que no pasó nada"],"c":2,"e":"La información de otros estudiantes es reservada, pero puedes informarle cómo se aborda el caso de su hija.","s":[["l19628","art. 7"],["lge","art. 10 letra b)"]]},
  {"id":"p203","m":"com","n":1,"q":"¿Qué dice la Agencia de Calidad sobre los canales con las familias?","o":["El colegio debe establecer canales expeditos de participación e involucramiento","Deben limitarse a una reunión al año","Solo deben usarse con el centro de padres","Deben ser solo digitales"],"c":0,"e":"La Agencia espera canales expeditos e inclusivos para todas las familias.","s":[["com_agencia"]]},
  {"id":"p204","m":"com","n":1,"q":"La Ley 21.827 establece que los colegios deben realizar reuniones de apoderados:","o":["Solo cuando haya un problema","Periódicamente, según su reglamento interno","Una vez al año","Nunca, porque son voluntarias"],"c":1,"e":"El nuevo art. 16 K de la LGE exige realizarlas periódicamente.","s":[["l21827","art. 1, art. 16 K LGE"]]},
  {"id":"p205","m":"com","n":2,"q":"Según la Ley 21.809, la agresión de un apoderado a un inspector es:","o":["Un asunto privado entre ambos","Solo una falta leve del estudiante","Una materia exclusiva de Carabineros","Violencia en el trabajo ejercida por terceros, que activa los protocolos del reglamento interno"],"c":3,"e":"El art. 16 B de la LGE la califica así y obliga a aplicar los protocolos.","s":[["l21809","art. 16 B LGE"]]},
  {"id":"p206","m":"com","n":2,"q":"Sobre la suspensión del ingreso de un apoderado agresor (Ley 21.827), es correcto que:","o":["Puede aplicarse aunque el reglamento interno no la regule","Impide al estudiante seguir asistiendo a clases","Debe estar regulada en el reglamento interno y resguardar el derecho a la educación del estudiante","Solo procede si hubo agresión física"],"c":2,"e":"Se aplica según el procedimiento del reglamento y protege el derecho a la educación del hijo; incluye agresiones físicas, verbales o digitales.","s":[["l21827","art. 7 y art. transitorio"]]},
  {"id":"p207","m":"com","n":2,"q":"Un apoderado citado formalmente por un protocolo de convivencia dice que no irá porque «no tiene tiempo». ¿Qué establece la ley?","o":["Que puede no asistir si avisa","Que la comparecencia es obligatoria y solo se excusa por causa justificada y acreditada, pudiendo ser remota","Que el colegio debe cerrar el caso","Que basta con que el estudiante lleve un recado"],"c":1,"e":"El art. 8 bis del Estatuto Docente, modificado por la Ley 21.827, lo exige.","s":[["estatuto","art. 8 bis"],["l21827","art. 3"]]},
  {"id":"p208","m":"lid","n":1,"q":"Según el Estatuto Docente, la función docente-directiva se ocupa de:","o":["Solo hacer clases","La dirección, administración, supervisión y coordinación de la educación","El aseo y mantención","Solo la atención de apoderados"],"c":1,"e":"Así la define el art. 7 del Estatuto Docente.","s":[["estatuto","art. 7"]]},
  {"id":"p209","m":"lid","n":1,"q":"¿En qué categorías clasifica la Ley 21.109 a los asistentes de la educación pública?","o":["Docente, directiva y técnica","Paradocente y auxiliar","Inspector, portero y secretario","Profesional, técnica, administrativa y auxiliar"],"c":3,"e":"El art. 5 de la Ley 21.109 fija esas cuatro categorías.","s":[["l21109","art. 5"]]},
  {"id":"p210","m":"lid","n":1,"q":"¿Quién lidera el equipo de convivencia educativa según la Ley 21.809?","o":["El inspector general","El presidente del centro de padres","El/la coordinador/a de convivencia educativa","El sostenedor"],"c":2,"e":"La ley crea la coordinación de convivencia educativa para liderar el equipo.","s":[["l21809","art. 15 LGE"]]},
  {"id":"p211","m":"lid","n":1,"q":"Al organizar turnos de inspectoría para emergencias, Mineduc recomienda:","o":["Asignar cada rol con un encargado y un subrogante","Que una sola persona haga todo","Decidir los roles en el momento","Dejar los roles solo a los docentes"],"c":0,"e":"Asignar roles claros con encargados y subrogantes evita vacíos.","s":[["lid_crit","p. 11"]]},
  {"id":"p212","m":"lid","n":1,"q":"Según la Ley Karin, ¿dónde puede presentar una denuncia un inspector acosado?","o":["Solo ante Carabineros","Solo por escrito ante la Superintendencia","Solo ante el centro de padres","En el establecimiento o ante la Inspección del Trabajo, por escrito o verbalmente"],"c":3,"e":"La denuncia puede hacerse por escrito o de forma verbal ante el empleador o la Inspección del Trabajo.","s":[["l21643","art. 211-B bis Código del Trabajo"]]},
  {"id":"p213","m":"lid","n":1,"q":"¿Qué derecho reconoce la Ley 19.464 a los asistentes de la educación?","o":["Elegir a sus estudiantes","No registrar asistencia","Trabajar en un ambiente tolerante y de respeto mutuo","Aplicar sanciones sin procedimiento"],"c":2,"e":"Lo establece su art. 4 bis.","s":[["l19464","art. 4 bis"]]},
  {"id":"p214","m":"lid","n":2,"q":"Según la Ley Karin, una conducta de hostigamiento constituye acoso laboral:","o":["Solo si se repite al menos tres veces","Solo si la comete una jefatura","Aunque ocurra una sola vez, si causa menoscabo, maltrato o humillación","Solo si hay testigos"],"c":2,"e":"La ley considera acoso laboral la conducta ocurrida una sola vez o de manera reiterada.","s":[["l21643","art. 2 Código del Trabajo"]]},
  {"id":"p215","m":"lid","n":2,"q":"Una vez recibido el informe de investigación por Ley Karin, ¿en qué plazo deben aplicarse las medidas o sanciones?","o":["Dentro de los 15 días siguientes","Dentro de 6 meses","Al final del año escolar","No hay plazo"],"c":0,"e":"La ley fija 15 días y exige comunicar el resultado a ambas partes.","s":[["l21643","art. 211-E Código del Trabajo"]]},
  {"id":"p216","m":"lid","n":2,"q":"Antes de contratar a un asistente de la educación pública, la Ley 21.109 exige:","o":["Un examen de conocimientos generales","Un informe de idoneidad psicológica para trabajar con menores","Una carta de recomendación de un apoderado","Cinco años de experiencia"],"c":1,"e":"El art. 4 exige ese informe, limitado a la aptitud para trabajar con menores.","s":[["l21109","art. 4"]]},
  {"id":"p217","m":"div","n":1,"q":"Una familia extranjera sin documentos chilenos pide matricular a su hijo. ¿Qué corresponde?","o":["Rechazar la matrícula hasta que regularice su situación","Aceptarlo solo como alumno oyente","Orientarla: el niño tiene derecho a estudiar sin importar su situación migratoria y puede solicitar el IPE","Pedirle un certificado de residencia definitiva"],"c":2,"e":"La Ley 21.325 prohíbe negar o limitar el acceso a la educación por condición migratoria irregular.","s":[["l21325","art. 17"],["div_ipe"]]},
  {"id":"p218","m":"div","n":1,"q":"¿Qué es el IPE?","o":["Un permiso de residencia","Un número único que entrega el Mineduc a estudiantes extranjeros sin RUN","Un certificado de notas","Un beneficio de alimentación"],"c":1,"e":"El IPE permite incorporarse al sistema escolar mientras no se tiene RUN.","s":[["div_ipe"]]},
  {"id":"p219","m":"div","n":1,"q":"Un estudiante con IPE pregunta si puede recibir almuerzo escolar. ¿Qué le respondes?","o":["Sí: tiene los mismos derechos que cualquier estudiante chileno en alimentación, textos, seguro y pase escolar","No, hasta que tenga RUN","Solo si su familia paga","Solo recibe textos escolares"],"c":0,"e":"Ayuda Mineduc señala que los estudiantes con IPE tienen los mismos derechos en esos beneficios.","s":[["div_ipe_ayuda"]]},
  {"id":"p220","m":"div","n":1,"q":"Un grupo deja de hablarle a una compañera y la excluye a propósito de todo, desde hace semanas. ¿Cómo lo entiendes?","o":["Es normal: no hay agresión física","Solo sería acoso si pasara por redes sociales","Es un asunto solo de las familias","Puede ser acoso escolar: la ley incluye el aislamiento injustificado y el ignorar deliberadamente"],"c":3,"e":"El artículo 16 B de la LGE incluye esas conductas cuando son reiteradas.","s":[["lge","art. 16 B"]]},
  {"id":"p221","m":"div","n":1,"q":"Un estudiante se burla del acento de un compañero migrante. ¿Qué haces?","o":["Te ríes para bajar la tensión","Detienes la burla, recuerdas que nadie puede ser discriminado y registras según el reglamento interno","Le pides al estudiante migrante que hable menos","No intervienes porque es una broma"],"c":1,"e":"La nacionalidad y el idioma son motivos de discriminación arbitraria según la Ley 20.609.","s":[["l20609","art. 2"],["lge","art. 10 letra a"]]},
  {"id":"p222","m":"div","n":1,"q":"¿Qué principio de la LGE pide valorar a cada estudiante en su especificidad cultural y de origen?","o":["Calidad","Flexibilidad","Interculturalidad","Responsabilidad"],"c":2,"e":"Es el principio de interculturalidad del artículo 3.","s":[["lge","art. 3 letra m"]]},
  {"id":"p223","m":"div","n":2,"q":"¿En qué plazo se presenta la acción de no discriminación de la Ley 20.609?","o":["30 días hábiles desde el hecho","6 meses desde el hecho","No tiene plazo","90 días corridos desde el hecho o desde que se conoció, y nunca después de un año"],"c":3,"e":"El artículo 5 fija 90 días corridos, con un máximo de un año desde el acto.","s":[["l20609","art. 5"]]},
  {"id":"p224","m":"div","n":2,"q":"Según la Circular 812, ¿qué nombre se usa para un estudiante trans?","o":["El nombre social en los espacios educativos y el nombre legal en los documentos oficiales","Siempre el nombre legal","El que decida cada profesor","El nombre social solo si el apoderado firma ante notario"],"c":0,"e":"La circular pide a los adultos usar el nombre social y reservar el legal para documentos oficiales.","s":[["div_c812"]]},
  {"id":"p225","m":"div","n":2,"q":"Un estudiante trans pide una entrevista para el reconocimiento de su identidad de género. ¿En qué plazo debe facilitarla el establecimiento?","o":["30 días corridos","Un máximo de 5 días hábiles","Al final del semestre","No hay plazo"],"c":1,"e":"Ayuda Mineduc indica un plazo máximo de 5 días hábiles.","s":[["div_lgtbi"]]},
  {"id":"p226","m":"div","n":2,"q":"¿Cómo sanciona la Ley 19.253 la discriminación manifiesta e intencionada contra personas indígenas?","o":["No tiene sanción","Con amonestación verbal","Como falta, con multa de uno a cinco ingresos mínimos mensuales","Con expulsión del país"],"c":2,"e":"El artículo 8 la define como falta sancionada con multa.","s":[["l19253","art. 8"]]},
  {"id":"p227","m":"etica","n":1,"q":"Según la LGE, ¿cuál es un deber de los asistentes de la educación?","o":["Aplicar sanciones sin consultar el reglamento","Ejercer su función en forma idónea y responsable","Decidir las expulsiones","Diagnosticar dificultades de aprendizaje"],"c":1,"e":"El art. 10 letra d de la LGE les pide ejercer su función en forma idónea y responsable.","s":[["lge","art. 10 letra d"]]},
  {"id":"p228","m":"etica","n":1,"q":"Un inspector deja de pie en el patio, frente a todos, a un estudiante que llegó atrasado «para que aprenda». ¿Qué problema tiene esta medida?","o":["Ninguno, es una medida formativa","Solo que no quedó registrada","Es un trato vejatorio o degradante, contrario a su dignidad","Que debió durar más tiempo"],"c":2,"e":"Los estudiantes tienen derecho a no ser objeto de tratos vejatorios o degradantes, y la disciplina debe respetar su dignidad.","s":[["lge","art. 10 letra a"],["d830","art. 28.2"]]},
  {"id":"p229","m":"etica","n":1,"q":"Según la Ley 21.827, al revisar la mochila de un estudiante, ¿qué está estrictamente prohibido?","o":["Pedirle que se desnude","Hacerlo en un lugar designado","Dejar un registro escrito","Que estén presentes dos adultos"],"c":0,"e":"La ley excluye las vestimentas y prohíbe estrictamente pedir al estudiante que se desnude.","s":[["l21827","art. 1, art. 16 J LGE"]]},
  {"id":"p230","m":"etica","n":2,"q":"Una revisión excepcional e individual de pertenencias requiere:","o":["Solo la autorización verbal del profesor jefe","Que el estudiante quede solo con el inspector","La presencia permanente de al menos dos adultos del establecimiento y un registro escrito y firmado","Aviso previo a la Superintendencia"],"c":2,"e":"La Ley 21.827 exige al menos dos adultos del establecimiento y un registro con copia al estudiante y su apoderado.","s":[["l21827","art. 1, art. 16 J LGE"]]},
  {"id":"p231","m":"etica","n":2,"q":"Según la Ley 19.628, el deber de secreto de quien trabaja con datos personales:","o":["Termina cuando deja el cargo","Solo aplica a datos publicados en internet","Rige solo para funcionarios públicos","No cesa por haber terminado sus actividades en ese campo"],"c":3,"e":"El art. 7 dice que esta obligación no cesa por haber terminado las actividades.","s":[["l19628","art. 7"]]},
