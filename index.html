        <h2 class="qtitle">${esc(it.t)}</h2>
        <ol class="built">${(answered ? R.built : R.built).map((k, j) => answered
          ? `<li><div class="${k === j ? "ok" : "no"}"><span class="n">${j + 1}</span><span>${esc(it.pasos[k])}</span></div></li>`
          : `<li><button data-rm="${j}" aria-label="Quitar paso"><span class="n">${j + 1}</span><span>${esc(it.pasos[k])}</span></button></li>`).join("")}</ol>
        ${answered ? "" : `<div class="opts">${it.mix.filter(k => !R.built.includes(k)).map(k => `<button class="opt" data-add="${k}"><span class="k">+</span><span>${esc(it.pasos[k])}</span></button>`).join("")}</div>
        ${full ? `<button class="btn primary block" id="check">Comprobar</button>` : `<p class="small muted">Si te equivocas, toca un paso de arriba para quitarlo.</p>`}`}
        ${answered ? `<div class="sheet ${good ? "good" : "bad"}"><h3>${good ? "¡Orden correcto!" : "El orden correcto es:"}</h3>
          ${good ? "" : `<ol class="small" style="padding-left:20px;display:grid;gap:4px">${it.pasos.map(p => `<li>${esc(p)}</li>`).join("")}</ol>`}
          <p>${esc(it.e)}</p>${srcHtml(it.s)}<button class="btn ${good ? "good" : "primary"} block" id="nextR">${R.i + 1 === R.list.length ? "Ver resultado" : "Continuar"}</button></div>` : ""}`;
    }
    app.innerHTML = `
      <section class="runner-top">
        <button class="x" id="quitR" aria-label="Salir">${ICON.x}</button>
        <div class="progress"><i style="width:${100 * (R.i + (answered ? 1 : 0)) / R.list.length}%"></i></div>
        <span class="small muted" style="font-weight:800">${R.i + 1}/${R.list.length}</span>
      </section>
      <section class="stack" aria-live="polite">
        <p class="eyebrow">Reforzamiento · ${esc(modName(R.m))}</p>
        ${body}
      </section>`;
    $("#quitR").addEventListener("click", () => { const back = R.L; R.list = null; if (back) go("camino"); else { T.mod = R.m; go("tema"); } });
    app.querySelectorAll("[data-v]").forEach(b => b.addEventListener("click", () => { R.ans = b.dataset.v === "1"; refAnswer(R.ans === it.v, R.ans === it.v ? 5 : 0); render.refuerzo(); }));
    app.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", () => { R.built.push(+b.dataset.add); render.refuerzo(); }));
    app.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", () => { R.built.splice(+b.dataset.rm, 1); render.refuerzo(); }));
    const ck = $("#check"); if (ck) ck.addEventListener("click", () => {
      R.ans = R.built.slice(); const hits = R.built.filter((k, j) => k === j).length, ok = hits === it.pasos.length;
      refAnswer(ok, ok ? 15 : hits * 2 >= it.pasos.length ? 5 : 0); render.refuerzo();
    });
    const nx = $("#nextR"); if (nx) { nx.addEventListener("click", () => { R.i++; R.ans = null; R.built = []; render.refuerzo(); window.scrollTo(0, 0); }); nx.focus({ preventScroll: false }); }
  };
  function refEnd() {
    const t = R.list.length, L = R.L;
    const stars = R.right === t ? 3 : R.right >= t - 1 ? 2 : R.right >= Math.ceil(t / 2) ? 1 : 0;
    if (!R.saved) {
      R.saved = true; R.chest = false; R.levelUp = null;
      if (stars === 3) unlock("ref1");
      if (L) {
        const prev = S.path[L.id] || 0, lv = levelOfMod(L.m), wasDone = levelDone(lv);
        if (stars > prev) S.path[L.id] = stars;
        if (stars && !prev) { R.gained += 10; addXP(10); }
        if (stars && !S.chest[today()]) { S.chest[today()] = true; R.chest = true; R.gained += 20; addXP(20); }
        if (!wasDone && levelDone(lv)) { R.levelUp = lv; unlock("camino" + (lv + 1)); }
      }
      S.rounds.push({ d: Date.now(), k: "refuerzo", m: R.m, r: R.right, t }); S.rounds = S.rounds.slice(-30);
      unlock("primer"); save(); if (stars) confetti();
    }
    const nx = L ? nextLesson() : null;
    const msg = R.levelUp != null ? `¡Completaste el ${CAMINO[R.levelUp].n}!` : stars === 3 ? "¡Reforzamiento perfecto!" : stars ? "¡Bien reforzado!" : `Te faltó poco. Necesitas ${Math.ceil(t / 2)} de ${t} para avanzar.`;
    app.innerHTML = `
      <section class="card result">
        <p class="eyebrow">Reforzamiento · ${esc(modName(R.m))}</p>
        <span class="stars" style="font-size:2.4rem" aria-label="${stars} de 3 estrellas">${"★".repeat(stars)}<span style="color:var(--line)">${"★".repeat(3 - stars)}</span></span>
        <h2 style="font-size:1.25rem">${msg}</h2>
        <div class="gain"><span>${R.right} de ${t} correctas</span><span>+${R.gained} puntos</span>${R.chest ? "<span>Cofre del día +20</span>" : ""}</div>
        <div class="stack" style="width:100%">
          ${stars && nx ? `<button class="btn primary block" id="nextLesson">Siguiente lección</button>` : ""}
          <button class="btn ${stars ? "" : "primary"} block" id="againR">Otra ronda de reforzamiento</button>
          <button class="btn block" id="backR">${L ? "Volver al camino" : "Volver al tema"}</button>
        </div>
      </section>`;
    const n = $("#nextLesson"); if (n) n.addEventListener("click", () => startLesson(nx));
    $("#againR").addEventListener("click", () => startRef(R.m, L));
    $("#backR").addEventListener("click", () => { R.list = null; if (L) go("camino"); else { T.mod = R.m; go("tema"); } });
  }
  // ---------- tema: dominio y examen de certificación ----------
  const T = { mod: "rol" };
  render.tema = () => {
    if (Q.list) return runQuiz();
    const m = MODULOS.find(x => x.id === T.mod) || MODULOS[0], st = modStats(m.id), r = rango(st.pct);
    const next = RANGOS[r + 1], ex = examList(m.id), best = S.cert[m.id];
    const locked = !best && st.pct < 50 && !modLessonsDone(m.id);
    const circ = 2 * Math.PI * 34;
    const row = (lab, a, b, pct) => `<div><span>${lab}</span><b>${a} de ${b}</b><div class="bar"><i style="width:${pct}%"></i></div></div>`;
    app.innerHTML = `
      <section class="runner-top"><button class="x" id="back" aria-label="Volver al inicio">${ICON.x}</button><h2 style="font-size:1.3rem">${esc(m.nombre)}</h2></section>
      <p class="small muted">${esc(m.desc)}</p>
      <section class="card">
        <div class="know">
          <div class="ring" aria-label="Dominio ${st.pct}%"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" fill="none" stroke="var(--surface-2)" stroke-width="9"/><circle cx="40" cy="40" r="34" fill="none" stroke="var(--good)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ * (1 - st.pct / 100)}"/></svg><span class="lbl">${st.pct}%</span></div>
          <div class="stack" style="gap:4px">
            <p class="eyebrow">Tu dominio</p>
            <h2 style="font-size:1.3rem">${RANGOS[r][1]} ${certified(m.id) ? SEAL : ""}</h2>
            <p class="small muted">${next ? `Te faltan ${next[0] - st.pct} puntos de dominio para ${next[1]}.` : "Llegaste al rango más alto de este tema."}</p>
          </div>
        </div>
        <div class="ranks">${RANGOS.map((x, k) => `<span class="${k <= r ? "on" : ""}">${x[1]}</span>`).join("")}</div>
      </section>
      <section class="card brk">
        <p class="eyebrow">Qué cuenta para tu dominio</p>
        ${row("Preguntas respondidas bien", st.pk, st.p, 100 * st.pk / Math.max(1, st.p))}
        ${row("Fichas dominadas", st.fm, st.f, 100 * st.fm / Math.max(1, st.f))}
        ${st.c ? row("Puntaje en casos", Math.round(st.cs * 10) / 10, st.c, 100 * st.cs / st.c) : ""}
        ${st.r ? row("Reforzamiento correcto", st.rk, st.r, 100 * st.rk / st.r) : ""}
        <p class="small muted">Una pregunta cuenta si tu última respuesta fue correcta. Una ficha está dominada cuando la sabes varias veces seguidas en días distintos.</p>
        <div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <button class="btn" id="tF">Fichas</button><button class="btn" id="tP">Preguntas</button>
        </div>
        ${st.c ? `<button class="btn block" id="tC">Casos del tema</button>` : ""}
        ${st.r ? `<button class="btn block" id="tR">Reforzamiento: verdadero o falso y ordenar</button>` : ""}
      </section>
      <section class="challenge" style="flex-wrap:wrap">
        <div class="medal">${ICON.medal}</div>
        <div class="stack" style="gap:4px">
          <h3>Examen de certificación</h3>
          <p class="small">${ex.length} preguntas básicas y avanzadas. Apruebas con 80%${certified(m.id) ? "" : " y ganas 50 puntos"}.</p>
        </div>
        <p class="small" style="flex-basis:100%">${best ? `Tu mejor resultado: ${best.r} de ${best.t}.` : locked ? `Se desbloquea al terminar las lecciones de este tema en el Camino, o al llegar a Intermedio (te faltan ${50 - st.pct} puntos).` : "¡Desbloqueado! Ya tienes la base para rendirlo."}</p>
        <button class="btn block ${certified(m.id) || locked ? "" : "primary"}" id="tE" style="flex-basis:100%" ${locked ? "disabled" : ""}>${locked ? "Bloqueado por ahora" : best ? "Repetir examen" : "Rendir examen"}</button>
      </section>`;
    $("#back").addEventListener("click", () => go("inicio"));
    $("#tF").addEventListener("click", () => { F.mod = m.id; F.modo = "todas"; F.i = 0; go("fichas"); });
    $("#tP").addEventListener("click", () => { Q.mod = m.id; go("preguntas"); });
    const tc = $("#tC"); if (tc) tc.addEventListener("click", () => go("casos"));
    const tr = $("#tR"); if (tr) tr.addEventListener("click", () => startRef(m.id, null));
    $("#tE").addEventListener("click", () => { Q.exam = m.id; startQuiz(shuffle(ex), "examen"); });
  };
  // ---------- instalar como app ----------
  const install = { ev: null, ios: /iphone|ipad|ipod/i.test(navigator.userAgent), standalone: matchMedia("(display-mode: standalone)").matches || navigator.standalone === true };
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); install.ev = e; if (view === "perfil") render.perfil(); });
  addEventListener("appinstalled", () => { install.ev = null; install.standalone = true; toast("App instalada en tu teléfono"); if (view === "perfil") render.perfil(); });
  if ("serviceWorker" in navigator && isSecureContext) navigator.serviceWorker.register("sw.js").catch(() => {});
  function installCard() {
    if (install.standalone) return "";
    if (install.ev) return `<section class="card"><p class="eyebrow">App</p><h2 style="font-size:1.15rem">Instala el Libro del Inspector</h2><p class="small muted">Queda como app en tu teléfono, con su ícono, y se abre aunque no tengas internet.</p><button class="btn primary block" id="installBtn">Instalar app</button></section>`;
    if (install.ios) return `<section class="card"><p class="eyebrow">App</p><h2 style="font-size:1.15rem">Instálala en tu iPhone</h2><p class="small muted">En Safari, toca el botón Compartir y luego «Agregar a pantalla de inicio».</p></section>`;
    return "";
  }
  render.perfil = () => {
    const lv = levelOf(S.xp), st = streak();
    const prog = lv.to ? Math.round(100 * (S.xp - lv.from) / (lv.to - lv.from)) : 100;
    const accState = {
      synced: ["ok", "Tu avance se guarda en tu cuenta"],
      connecting: ["warn", "Conectando con tu cuenta…"],
      readonly: ["warn", "No se pudo guardar en tu cuenta"],
      error: ["warn", "No se pudo guardar en tu cuenta; se guarda en este equipo"],
      signedout: ["warn", "Sin sesión: tu avance se guarda solo en este equipo"],
      nohost: ["warn", "Sin sesión: tu avance se guarda solo en este equipo"],
      local: ["warn", "Tu avance se guarda en este equipo"]
    }[cloud.state];
    app.innerHTML = `
      <section class="card">
        <div class="account">
          <span class="avatar">${esc((cloud.name || cloud.email || "?").trim()[0].toUpperCase())}</span>
          <div style="min-width:0">
            <h2 style="font-size:1.2rem">${cloud.name ? esc(cloud.name) : "Mi perfil"}</h2>
            ${cloud.email ? `<p class="small muted" style="word-break:break-all">${esc(cloud.email)}</p>` : ""}
            <span class="status ${accState[0]}">${accState[1]}</span>
          </div>
        </div>
        
        ${cloud.state === "signedout" ? `<button class="btn primary block" id="login1">Iniciar sesión o crear cuenta</button>` : ""}
        ${cloud.state === "synced" ? `<button class="btn block" id="logout">Cerrar sesión</button>` : ""}
      </section>
      <section class="card">
        <div class="row between"><div><p class="eyebrow">Nivel ${lv.i + 1}</p><h2 style="font-size:1.25rem">${lv.name}</h2></div><span class="pill xp">${ICON.bolt.replace("<svg", '<svg width="18" height="18"')}<b>${S.xp}</b></span></div>
        <div class="bar xpbar" style="height:12px"><i style="width:${prog}%"></i></div>
        <p class="small muted">${lv.to ? `${lv.to - S.xp} puntos para ${NIVELES[lv.i + 1][1]}` : "¡Llegaste al nivel máximo!"}</p>
        <div class="row"><span class="pill fire">${ICON.fire.replace("<svg", '<svg width="18" height="18"')}${st} ${st === 1 ? "día" : "días"} de racha</span><span class="pill">${mastered()} fichas dominadas</span></div>
      </section>
      ${(() => { const ks = Object.keys(S.hist).sort(), pts = ks.slice(-7), first = ks.length ? S.hist[ks[0]] : 0, now = globalPct(); return `<section class="card">
        <div class="row between"><div><p class="eyebrow">Tu evolución</p><h2 style="font-size:1.2rem">Conocimiento total ${now}%</h2></div><span class="pill">${MODULOS.filter(m => certified(m.id)).length} de ${MODULOS.length} certificados</span></div>
        ${pts.length > 1 ? `<div class="evo">${pts.map(k => `<div><span>${S.hist[k]}%</span><i style="height:${Math.max(6, 100 * S.hist[k] / Math.max(1, ...pts.map(x => S.hist[x])))}%"></i><span>${k.slice(8)}/${k.slice(5, 7)}</span></div>`).join("")}</div>` : ""}
        <p class="small muted">${ks.length > 1 && now > first ? `Empezaste con ${first}% el ${ks[0].slice(8)}/${ks[0].slice(5, 7)}. Llevas +${now - first} puntos de dominio.` : "Cada día que estudies quedará marcado aquí, para que veas cómo avanza tu conocimiento."}</p>
      </section>`; })()}
      ${installCard()}
      <section class="card">
        <p class="eyebrow">Meta diaria</p>
        <div class="seg" role="group" aria-label="Meta diaria">${[[20, "Suave · 20"], [30, "Normal · 30"], [50, "Intensa · 50"]].map(([g, l]) => `<button data-goal="${g}" aria-pressed="${S.goal === g}">${l}</button>`).join("")}</div>
        <p class="small muted">Puntos por día para mantener la racha. Una ronda de 5 preguntas da unos 50.</p>
        <p class="eyebrow">Nivel de estudio</p>
        <div class="seg" role="group" aria-label="Nivel">
          <button data-mode="formacion" aria-pressed="${S.mode === "formacion"}">Estoy empezando</button>
          <button data-mode="profesional" aria-pressed="${S.mode === "profesional"}">Profesional</button>
        </div>
      </section>
      <section class="stack">
        <h2 style="font-size:1.15rem">Logros · ${Object.keys(S.badges).length} de ${LOGROS.length}</h2>
        <div class="badges">${LOGROS.map(l => `<div class="badge ${S.badges[l.id] ? "on" : ""}" title="${esc(l.d)}"><span class="b">${ICON[l.ic]}</span><span>${l.n}</span><span class="muted" style="font-weight:600;font-size:0.68rem">${l.d}</span></div>`).join("")}</div>
      </section>
      <section class="card">
        <h2 style="font-size:1.1rem">Fuentes oficiales</h2>
        <p class="small muted">Todo el contenido cita leyes y documentos de BCN (Ley Chile), Mineduc, Superintendencia de Educación, Diario Oficial, Poder Judicial, ChileAtiende y SENDA. Revisado con la normativa vigente a octubre de 2026.</p>
        <button class="btn block" id="fuentes">Ver las ${Object.keys(FUENTES).length} fuentes</button>
      </section>
      <div class="row small muted" style="justify-content:center"><button class="link" id="reset">Borrar mi avance</button><span id="resetConfirm" hidden>¿Seguro? <button class="link" id="resetYes">Sí, borrar</button> · <button class="link" id="resetNo">Cancelar</button></span></div>`;
    app.querySelectorAll("[data-goal]").forEach(b => b.addEventListener("click", () => { S.goal = +b.dataset.goal; save(); render.perfil(); paintTop(); }));
    app.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => { S.mode = b.dataset.mode; S.welcomed = true; save(); render.perfil(); }));
    $("#fuentes").addEventListener("click", () => go("fuentes"));
    const ib = $("#installBtn"); if (ib) ib.addEventListener("click", async () => { const e = install.ev; install.ev = null; e.prompt(); await e.userChoice.catch(() => {}); render.perfil(); });
    const li = $("#login1"); if (li) li.addEventListener("click", () => { L.mode = "entrar"; showLogin(); });
    const lo = $("#logout"); if (lo) lo.addEventListener("click", signOut);
    const rc = $("#resetConfirm");
    $("#reset").addEventListener("click", () => { rc.hidden = false; });
    $("#resetNo").addEventListener("click", () => { rc.hidden = true; });
    $("#resetYes").addEventListener("click", () => { const keep = { mode: S.mode, goal: S.goal, welcomed: true }; S = Object.assign(fresh(), keep); save(); paintTop(); render.perfil(); toast("Avance borrado"); });
  };
  render.fuentes = () => {
    unlock("fuentes"); save();
    const uses = k => [...FICHAS, ...PREGUNTAS, ...CASOS, ...REFUERZO].filter(x => (x.s || []).some(s => s[0] === k)).length;
    app.innerHTML = `
      <section class="runner-top"><button class="x" id="back" aria-label="Volver al perfil">${ICON.x}</button><h2 style="font-size:1.3rem">Fuentes oficiales</h2></section>
      <p class="small muted">Cada ficha, pregunta y caso muestra su fuente. Estos son los documentos usados, con enlace al texto oficial.</p>
      <section class="card">${Object.entries(FUENTES).map(([k, f]) => `<div class="srcitem"><a href="${f.u}" target="_blank" rel="noopener" style="font-weight:800">${esc(f.n)}</a><span class="small muted">${esc(f.org)} · citada en ${uses(k)} contenidos</span></div>`).join("")}</section>
      <p class="note">Las leyes cambian. Ante una duda concreta, manda el reglamento interno de tu establecimiento y lo que diga la Superintendencia de Educación.</p>`;
    $("#back").addEventListener("click", () => go("perfil"));
  };

  // ---------- inicio ----------
  paintTop();
  const start = (location.hash || "").replace("#", "");
  go(start || "inicio");
  initCloud();
})();
</script>

</body>
</html>
